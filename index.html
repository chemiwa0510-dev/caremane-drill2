険施設など"], "point": "新規は市町村が調査・6か月／更新は委託OK・12か月／効力は申請日から／審査会は市町村"}, {"id": "k10-30", "date": "10/30", "field": "保健医療", "topic": "認知症について", "opts": ["血管性認知症は、アルツハイマー型認知症に比べて症状が「まだら」に現れることが多い", "レビー小体型認知症では、幻視やパーキンソン症状がみられることがある", "前頭側頭型認知症は、初期から記憶障害が目立ち、人格は保たれやすい", "慢性硬膜下血腫による認知機能の低下は、治療しても改善しない", "徘徊や妄想などの行動・心理症状（BPSD）は、中核症状に含まれる"], "ans": [1, 2], "exp": ["脳梗塞などの場所によって、できること・できないことが分かれる「まだら認知症」になりやすい", "レビー小体型は幻視・パーキンソン症状・日による調子の変動が特徴", "前頭側頭型は初期は記憶障害が目立たない。人格の変化・脱抑制・常同行動が出やすい", "慢性硬膜下血腫は手術で改善が期待できる「治る認知症」（正常圧水頭症・甲状腺機能低下症も）", "BPSDは周辺症状。中核症状は記憶障害・見当識障害・判断力の低下など"], "point": "血管性＝まだら／レビー＝幻視＋パーキンソン症状／前頭側頭＝人格変化（記憶は初期に保たれる）／硬膜下血腫・水頭症は治る認知症／BPSDは周辺症状"}, {"id": "k10-31", "date": "10/31", "field": "福祉サービス", "topic": "訪問入浴介護について", "opts": ["通常、看護職員2人と介護職員1人の計3人で提供する", "利用者の身体の状況に支障がなく、主治医の意見を確認した場合は、介護職員3人で提供できる", "事業所には、訪問介護と同じようにサービス提供責任者を置かなければならない", "利用者の身体に直接ふれる浴槽などの器具は、サービスの提供ごとに消毒したものを使う", "全身入浴が難しく、清拭や部分浴に変えた場合も、所定単位数どおり算定する"], "ans": [2, 4], "exp": ["通常は看護職員1人＋介護職員2人の3人（うち1人が責任者）。介護予防訪問入浴介護は看護1人＋介護1人の2人", "身体の状況に支障がなく主治医の意見を確認すれば、介護職員3人で提供できる（介護予防なら介護職員2人）", "サービス提供責任者は訪問介護の職種。訪問入浴介護には置かない（管理者は常勤専従、兼務可）", "身体にふれる設備・器具はサービス提供ごとに消毒したものを使う", "清拭・部分浴に変えたときは所定単位数の90%で算定（10%減算）"], "point": "「看1介2（予防は看1介1）」「医師OKなら介護職員だけでも可」「サ責は訪問介護だけ」「清拭・部分浴は減算」"}, {"id": "k11-1", "date": "11/1", "field": "介護保険制度", "topic": "介護保険事業計画について", "opts": ["市町村介護保険事業計画は、市町村老人福祉計画と一体のものとして作成する", "市町村介護保険事業計画は、5年を1期として定める", "介護保険事業計画の基本指針は、都道府県知事が定める", "市町村は、市町村介護保険事業計画を定めたり変えたりするときは、あらかじめ都道府県の意見を聴かなければならない", "介護保険施設の種類ごとの必要入所定員総数は、市町村介護保険事業計画で定める"], "ans": [1, 4], "exp": ["市町村計画は市町村老人福祉計画と一体で作る", "3年を1期として定める（保険料の見直しと同じサイクル）", "基本指針は厚生労働大臣が定め、市町村・都道府県はそれに沿って計画を作る", "市町村は計画を作ったり変えたりするとき、あらかじめ都道府県の意見を聴く", "介護保険施設の必要入所定員総数は都道府県介護保険事業支援計画で定める。市町村計画で定めるのは地域密着型（認知症グループホームなど）の必要利用定員総数"], "point": "「3年1期」「指針は大臣」「施設は県、地域密着型は市町村」「老人福祉計画とは一体（地域福祉計画とは“調和”）」"}, {"id": "k11-5", "date": "11/5", "field": "保健医療", "topic": "高齢者のバイタルサインについて", "opts": ["高齢者の体温は、一般に成人に比べて低めの傾向がある", "脈拍が1分間に100回を超える状態を徐脈という", "起座呼吸は、左心不全の症状としてみられることがある", "チェーンストークス呼吸は、睡眠時無呼吸症候群だけにみられる呼吸である", "高齢者では、収縮期血圧が低下し、拡張期血圧が上昇する傾向がある"], "ans": [1, 3], "exp": ["高齢者は体温が低め。平熱が低い人の37℃台は要注意", "100回超は頻脈。徐脈は60回未満", "寝ると苦しく、座ると楽になるのが起座呼吸。左心不全のサイン", "チェーンストークス呼吸は重い心不全・脳血管障害・臨終が近いときなどにみられる", "逆。高齢者は動脈硬化で収縮期↑・拡張期↓"], "point": "頻脈100超／徐脈60未満、起座呼吸＝左心不全、高齢者の血圧は収縮期↑拡張期↓"}, {"id": "k11-6", "date": "11/6", "field": "福祉サービス", "topic": "認知症対応型共同生活介護（グループホーム）について", "opts": ["要支援1の人も利用できる", "居室は、原則として2人部屋とする", "共同生活住居（ユニット）の入居定員は5人以上9人以下である", "家賃や食材料費は、介護保険の給付対象になる", "食事などの家事は、利用者と介護従業者が共同で行うよう努める"], "ans": [3, 5], "exp": ["介護予防の対象は要支援2だけ。要支援1は使えない", "居室は原則個室（7.43㎡以上）", "1ユニット5〜9人、1事業所は1〜3ユニット", "家賃・食材料費・光熱水費などは自己負担（保険給付外）", "家事を一緒にするのも認知症ケアの一部"], "point": "要支援2から／5〜9人・1〜3ユニット／原則個室／家賃・食費は自己負担／地域密着型なので原則その市町村の住民だけ"}, {"id": "k11-7", "date": "11/7", "field": "介護保険制度", "topic": "住所地特例について", "opts": ["住所地特例の対象者は、入所した施設がある市町村の被保険者になる", "特定施設に該当する有料老人ホームは、住所地特例の対象施設に含まれる", "認知症対応型共同生活介護（グループホーム）は、住所地特例の対象施設である", "住所地特例の適用を受けている人は、施設がある市町村が行う地域支援事業を利用できる", "A市の自宅からB市の施設に入り、その後C市の施設に移った場合、住所地特例は適用されなくなる"], "ans": [2, 4], "exp": ["施設のある市町村ではなく、もとの住所地（入所前）の市町村の被保険者のまま", "対象施設＝介護保険施設・特定施設（有料老人ホーム、軽費老人ホーム、有料老人ホームに当たるサ高住）・養護老人ホーム", "グループホームなど地域密着型サービスの事業所は対象外（入居すると所在地の市町村の被保険者になる）", "2015年4月から、施設所在地の市町村の地域支援事業や地域密着型サービスを利用できる", "施設を移り続けても（連続入所）、最初の自宅があったA市が保険者のまま"], "point": "「保険者はもとの市町村」「地域密着型（グループホーム等）は対象外」「連続入所でも最初の市町村」「地域支援事業は所在地の市町村で使える」"}, {"id": "k11-8", "date": "11/8", "field": "保健医療", "topic": "高齢者の薬について", "opts": ["高齢者は体内の水分量が増えるため、水溶性の薬の血中濃度は低くなりやすい", "錠剤が飲みにくいときは、自己判断でつぶしたり粉にしたりしてよい", "高齢者は腎機能が低下しているため、薬の副作用が出やすい", "服薬後に気になる症状があっても、医師の指示がなければ報告する必要はない", "複数の医療機関から薬が出ている場合は、お薬手帳などで一元的に管理するのが望ましい"], "ans": [3, 5], "exp": ["高齢者は体内の水分量が減るので、水溶性の薬は血中濃度が上がりやすい（脂肪は増えるので、脂溶性の薬は体にたまりやすい）", "徐放剤や腸溶剤など、つぶすと効き方が変わる薬がある。医師・薬剤師に相談する", "腎機能・肝機能が低下して薬が体に残りやすく、副作用が出やすい", "ふらつき・食欲低下などに気づいたら、すぐ医師・薬剤師に報告する", "お薬手帳やかかりつけ薬局でまとめて管理し、重複や飲み合わせを防ぐ"], "point": "「水分↓→水溶性の薬の濃度↑」「腎・肝機能↓→副作用↑」「勝手につぶさない」"}, {"id": "k11-9", "date": "11/9", "field": "福祉サービス", "topic": "成年後見制度について", "opts": ["成年後見人には、本人の手術などの医療行為に同意する権限がある", "法定後見には、後見・保佐・補助の3つの類型がある", "任意後見契約は、公正証書でなくても書面で結べば有効である", "成年後見人が本人の居住用不動産を売却するには、家庭裁判所の許可が必要である", "市町村長は、後見開始の審判を申し立てることができない"], "ans": [2, 4], "exp": ["医療行為への同意権はない（後見人の仕事は財産管理と、介護契約などの身上保護。手術の同意は原則家族など）", "判断能力の程度で、後見（欠く）・保佐（著しく不十分）・補助（不十分）の3類型", "任意後見契約は公正証書で結ぶ必要がある。家庭裁判所が任意後見監督人を選任して効力が生じる", "居住用不動産の売却・賃貸・抵当権設定などは家庭裁判所の許可が必要（許可なしは無効）", "身寄りがない人などのため、市町村長も申立てできる（老人福祉法など）"], "point": "「医療同意はNG」「任意後見は公正証書」「居住用不動産は家裁の許可」「市町村長申立てOK」"}, {"id": "k11-10", "date": "11/10", "field": "介護保険制度", "topic": "介護保険審査会について", "opts": ["保険料に関する処分も審査請求の対象となる", "市町村に設置される", "審査請求は、処分があったことを知った日の翌日から60日以内にしなければならない", "審査請求をしなくても、処分の取消しの訴えを直接裁判所に起こせる", "要介護認定に関する処分の審査請求は、公益代表委員で構成される合議体で扱う"], "ans": [1, 5], "exp": ["保険給付に関する処分（要介護認定を含む）と、保険料などの徴収金に関する処分が審査請求の対象", "設置は都道府県。市町村の処分を外からチェックする立場", "60日ではなく3か月以内（処分を知った日の翌日から起算）", "審査請求の裁決を経た後でないと取消訴訟は起こせない（審査請求前置）", "要介護認定の審査請求は公益代表委員の合議体。それ以外の処分は被保険者・市町村・公益の3者代表の合議体"], "point": "「都道府県に設置・3か月以内・裁決が出てから訴訟」。委員は都道府県知事が任命、会長は公益代表委員から選挙。"}, {"id": "k11-11", "date": "11/11", "field": "保健医療", "topic": "訪問看護について", "opts": ["訪問看護事業所の管理者は、医師でなければならない", "訪問看護は、主治の医師が交付した訪問看護指示書に基づいて行われる", "急性増悪時に特別訪問看護指示書が出された場合の訪問看護は、介護保険から給付される", "理学療法士は、訪問看護を行うことはできない", "末期の悪性腫瘍の利用者に対する訪問看護は、医療保険から給付される"], "ans": [2, 5], "exp": ["管理者は原則として保健師か看護師", "主治医の訪問看護指示書が必要", "特別訪問看護指示書の期間は医療保険（原則月1回・14日間まで）", "訪問看護ステーションのPT・OT・STも訪問看護としてリハビリができる", "末期の悪性腫瘍など厚生労働大臣が定める疾病等は医療保険"], "point": "要介護者は介護保険が優先。ただし「末期がん等の厚労大臣が定める疾病等」と「特別指示書の期間」は医療保険。"}, {"id": "k11-12", "date": "11/12", "field": "福祉サービス", "topic": "高齢者虐待防止法について", "opts": ["養護者による虐待を受けたと思われる高齢者を発見した者は、その高齢者の生命・身体に重大な危険が生じている場合、市町村に通報しなければならない", "この法律でいう「高齢者」とは、70歳以上の者をいう", "養介護施設従事者等は、自分が働く施設で虐待を受けたと思われる高齢者を発見したときは、市町村に通報しなければならない", "高齢者虐待の種類は、身体的・心理的・性的・経済的虐待の4つである", "通報を受けた市町村は、必要があっても高齢者の住所に立入調査を行うことはできない"], "ans": [1, 3], "exp": ["養護者による虐待は、生命・身体に重大な危険があれば通報義務（それ以外は努力義務）", "高齢者は65歳以上", "施設職員が自分の施設で発見した場合は、重大な危険がなくても通報義務", "種類は5つ。身体的・心理的・性的・経済的＋介護等放棄（ネグレクト）", "市町村長は地域包括支援センター職員などに立入調査をさせられる（警察署長に援助を求めることもできる）"], "point": "虐待は「身・心・性・経・放棄」の5つ。施設職員の通報は常に義務、養護者による虐待の通報は重大な危険があれば義務。"}, {"id": "k11-13", "date": "11/13", "field": "福祉サービス", "topic": "短期入所生活介護について", "opts": ["短期入所生活介護計画は、利用期間にかかわらず介護支援専門員が作成しなければならない", "事業所には、単独型・併設型・空床利用型がある", "災害などやむを得ない事情があっても、利用定員を超えて受け入れることはできない", "短期入所生活介護では、利用者の送迎を行うことはできない", "連続して30日を超えて利用した場合、30日を超えた日以降は保険給付の対象にならない"], "ans": [2, 5], "exp": ["計画を作るのは事業所の管理者で、おおむね4日以上続けて利用する場合に作成。ケアマネ（居宅の介護支援専門員）ではない", "単独型・併設型・空床利用型（特養の空きベッドを使う）がある", "災害・虐待などやむを得ない事情があれば、定員を超えて受け入れられる", "送迎は行える（送迎加算あり）", "連続30日を超えた日以降は保険給付の対象外（全額自己負担）"], "point": "「計画は管理者（4日以上）」「連続30日まで」「やむを得なければ定員超えOK」「単独型・併設型・空床利用型」"}, {"id": "k11-14", "date": "11/14", "field": "保健医療", "topic": "高齢者の糖尿病について", "opts": ["高齢者の糖尿病では、口渇・多飲・多尿などの典型的な症状が出にくい", "高齢者の低血糖は、冷や汗や動悸などの典型的な症状が出にくく、意識障害やふらつきで気づかれることがある", "インスリン注射をしている人が、シックデイ（発熱・下痢などの体調不良）で食事がとれないときは、自己判断でインスリンを中止してよい", "高齢者の血糖コントロール目標（HbA1c）は、若い人より必ず厳しく設定する", "糖尿病の三大合併症は、網膜症・腎症・脳梗塞である"], "ans": [1, 2], "exp": ["のどの渇き・多飲・多尿が出にくく、気づかないうちに高血糖や脱水が進むことがある", "冷や汗・動悸が出にくく、元気がない・ふらつく・ぼーっとするで気づくことも。認知症とまちがわれやすい", "シックデイでも自己判断でインスリンをやめない。水分をとり、早めに主治医に相談する", "高齢者は低血糖を防ぐため、目標はゆるめに個別に設定する", "三大合併症は網膜症・腎症・神経障害。脳梗塞は大血管の合併症"], "point": "三大合併症は「しめじ」（神経・目・腎臓）。高齢者は高血糖も低血糖も症状が出にくい。シックデイは自己判断で中止しない。"}, {"id": "k11-15", "date": "11/15", "field": "介護保険制度", "topic": "区分支給限度基準額について", "opts": ["区分支給限度基準額は、都道府県知事が定める", "市町村は、条例で、厚生労働大臣が定める額を上回る額を区分支給限度基準額とすることができる", "居宅療養管理指導は、区分支給限度基準額の対象となる", "居宅介護福祉用具購入費の支給限度基準額は、同一年度で10万円である", "居宅介護住宅改修費の支給限度基準額は、要介護状態区分ごとに異なる"], "ans": [2, 4], "exp": ["定めるのは厚生労働大臣", "市町村は条例で上乗せできる（財源は第1号保険料）", "居宅療養管理指導は限度額の対象外", "福祉用具購入費は同一年度（4/1〜3/31）で10万円", "住宅改修費は要介護度に関係なく一律20万円。要介護度が3段階以上上がったときや転居したときは、もう一度20万円使える"], "point": "限度額は大臣が決めて、市町村は上乗せOK。枠の外は居宅療養管理指導、特定施設・グループホーム（短期利用を除く）など。購入費は年10万、住宅改修は一律20万（3段階アップか転居でリセット）。"}, {"id": "k11-17", "date": "11/17", "field": "福祉サービス", "topic": "通所介護について", "opts": ["利用定員が19人以上の事業所は、地域密着型通所介護に該当する", "既に居宅サービス計画が作成されている場合は、通所介護計画はその内容に沿って作成しなければならない", "食事の提供に要する費用は、保険給付の対象となる", "送迎時に行った居宅内での介助等は、一定の要件を満たせば、1日30分以内を限度に通所介護の所要時間に含めることができる", "通所介護計画は、生活相談員が作成しなければならない"], "ans": [2, 4], "exp": ["地域密着型通所介護は利用定員18人以下（市町村が指定）", "ケアプランが先。通所介護計画はその内容に沿って作る", "食費は保険給付の対象外（利用者負担）。おむつ代なども自己負担", "着替えやベッドへの移乗などの居宅内介助。介護福祉士などが行う場合、1日30分以内なら所要時間に含められる", "通所介護計画を作るのは管理者（生活相談員などに作らせることはできるが、責任は管理者）"], "point": "18人以下＝地域密着型。計画を作るのは管理者。食費・おむつ代は自己負担。送迎時の居宅内介助は30分以内なら時間に含められる。"}, {"id": "k11-18", "date": "11/18", "field": "保健医療", "topic": "ターミナルケア（看取り）について", "opts": ["臨終が近づくと、チェーン・ストークス呼吸や下顎呼吸がみられることがある", "聴覚は最期まで比較的保たれるとされるため、意識が低下していても声かけを続けることが大切である", "死亡診断書は、医師のほか看護師も作成することができる", "在宅で亡くなった場合、死亡前24時間以内に医師の診察を受けていなければ、必ず警察に届け出なければならない", "本人の意思が確認できない場合は、家族の希望だけで治療方針を決めてよい"], "ans": [1, 2], "exp": ["呼吸が浅い・深いをくり返すチェーン・ストークス呼吸や、あごだけで呼吸する下顎呼吸は臨終が近いサイン", "聴覚は最期まで残るとされる。家族にも話しかけてもらうよう伝える", "死亡診断書を作成できるのは医師だけ（ICTを使った看取りでも、看護師は情報を医師に伝えるだけ）", "24時間を過ぎていても、診察中の病気で亡くなったと医師が判断できれば死亡診断書を書ける。警察に届けるのは異状死のとき", "本人の推定意思を尊重し、家族や医療・ケアチームで話し合って決める（ACP＝人生会議）"], "point": "死亡診断書は医師だけ。「24時間たったら警察」は誤解。聴覚は最期まで残る。本人の意思（推定意思）が中心。"}, {"id": "k11-19", "date": "11/19", "field": "介護保険制度", "topic": "第1号被保険者の保険料について", "opts": ["保険料率は市町村が条例で定め、おおむね5年を通じて財政の均衡を保つように設定する。", "年額18万円以上の老齢・退職年金などを受けている人は、原則として特別徴収（年金から天引き）になる。", "普通徴収の場合、世帯主と配偶者は保険料を連帯して納付する義務がある。", "所得段階別の保険料は、国の標準では9段階となっている。", "第1号被保険者の保険料は、医療保険者が医療保険料と一体的に徴収する。"], "ans": [2, 3], "exp": ["5年ではなく3年。介護保険事業計画と同じ3年1期で見直す", "障害・遺族年金も対象。年額18万円未満は普通徴収", "普通徴収では世帯主・配偶者に連帯納付義務がある", "2024年度から標準13段階（以前は9段階）", "これは第2号被保険者の話。医療保険者が徴収して社会保険診療報酬支払基金に納付する"], "point": "第1号＝市町村が徴収（年金18万円以上は天引き）、第2号＝医療保険者が徴収→支払基金へ。保険料率は3年ごと、標準13段階"}, {"id": "k11-20", "date": "11/20", "field": "福祉サービス", "topic": "生活保護制度について", "opts": ["介護扶助は、原則として金銭給付によって行われる。", "65歳以上の被保護者の介護保険料は、生活扶助に加算されて支給される。", "生活保護は、個人を単位として保護の要否や程度を定めるのが原則である。", "40歳以上65歳未満で医療保険に加入していない被保護者の介護サービス費用は、全額が介護扶助から給付される。", "生活保護の扶助は、生活扶助・医療扶助・介護扶助など全部で7種類である。"], "ans": [2, 4], "exp": ["金銭給付ではなく現物給付（介護券で事業所に支払われる）", "「介護保険料加算」として生活扶助に上乗せされる", "個人ではなく世帯単位（世帯単位の原則。例外として世帯分離あり）", "医療保険未加入だと第2号被保険者にならないので、10割介護扶助", "7種類ではなく8種類（生活・教育・住宅・医療・介護・出産・生業・葬祭）"], "point": "介護扶助＝現物給付、単位は世帯、扶助は8種類。65歳以上の被保護者は介護保険9割＋介護扶助1割、40〜64歳で医療保険なしは全額介護扶助"}, {"id": "k11-21", "date": "11/21", "field": "保健医療", "topic": "高齢者の骨粗鬆症・骨折について", "opts": ["骨粗鬆症は、男性に多くみられる。", "脊椎圧迫骨折は、尻もちなどの軽い外力でも起こることがある。", "骨粗鬆症の予防のためには、日光浴を避けることが望ましい。", "骨粗鬆症は、骨折する前から強い痛みを伴うことが多い。", "大腿骨頸部骨折は転倒によって起こることが多く、寝たきりの原因となりやすい。"], "ans": [2, 5], "exp": ["男性ではなく女性（特に閉経後。エストロゲンの減少で骨がもろくなる）", "軽い外力でも起き、気づかないうちに背中が丸くなることも", "日光浴はビタミンDを作りカルシウムの吸収を助けるので、適度に行うのがよい", "骨折するまで自覚症状はほとんどない", "転倒が主な原因で寝たきりにつながりやすい。転倒予防が大事"], "point": "骨粗鬆症は閉経後の女性に多く、骨折するまで症状がない。予防はカルシウム・ビタミンD・日光浴・運動。高齢者に多い骨折は大腿骨頸部・脊椎圧迫・橈骨遠位端・上腕骨近位端。"}, {"id": "k11-22", "date": "11/22", "field": "介護保険制度", "topic": "介護保険の利用者負担について", "opts": ["第2号被保険者の利用者負担は、所得に応じて1割〜3割である。", "居宅介護支援（ケアプランの作成）には利用者負担がない。", "高額介護サービス費は、年単位で負担上限額を超えた分が支給される。", "特定入所者介護サービス費（補足給付）は、通所介護の食費も対象となる。", "福祉用具購入費や住宅改修費の自己負担は、高額介護サービス費の対象とならない。"], "ans": [2, 5], "exp": ["第2号被保険者は所得にかかわらず一律1割。2割・3割があるのは第1号被保険者だけ", "ケアマネジメントは10割給付で自己負担なし", "年単位ではなく月単位。年単位（8月〜翌7月）で医療と合算するのは高額医療合算介護サービス費", "補足給付の対象は施設サービスと短期入所の食費・居住費。通所介護の食費は対象外", "福祉用具購入費・住宅改修費の自己負担、食費・居住費・日常生活費は高額介護サービス費の対象外"], "point": "2割・3割は第1号だけ（第2号は一律1割）。高額介護サービス費は月単位、医療と合算は年単位。補足給付は施設＋ショートだけ"}, {"id": "k11-23", "date": "11/23", "field": "介護保険制度", "topic": "介護保険の財政について", "opts": ["財政安定化基金は、市町村に設置される。", "調整交付金は、国の負担分の中から市町村に交付される。", "第2号被保険者の保険料は、市町村が普通徴収で直接徴収する。", "施設等給付費における国の負担割合は25%である。", "介護給付費（利用者負担を除く）の財源は、公費50%・保険料50%である。"], "ans": [2, 5], "exp": ["市町村ではなく都道府県に設置。財源は国・都道府県・市町村で1/3ずつ", "国の負担25%のうち5%相当が調整交付金", "第2号の保険料は医療保険者が医療保険料と一緒に徴収し、社会保険診療報酬支払基金を通して市町村へ交付", "施設等給付費の国の負担は20%（都道府県17.5%・市町村12.5%）。居宅給付費は国25%・都道府県12.5%", "保険料50%の内訳は第1号23%・第2号27%（3年ごとに見直し）"], "point": "基金＝都道府県、第2号の保険料＝医療保険者、施設は国20%"}, {"id": "k11-24", "date": "11/24", "field": "福祉サービス", "topic": "定期巡回・随時対応型訪問介護看護について", "opts": ["要支援者も利用できる。", "介護・医療連携推進会議を、おおむね6か月に1回以上開催しなければならない。", "一体型の事業所では、訪問看護サービスも同じ事業所が提供する。", "夜間の時間帯だけ提供するサービスである。", "定期巡回・随時対応型訪問介護看護計画は、居宅サービス計画を作成した介護支援専門員が作成する。"], "ans": [2, 3], "exp": ["要介護者のみ（要支援者向けの予防給付はない）", "介護・医療連携推進会議はおおむね6か月に1回以上", "一体型は同じ事業所が訪問看護も提供。連携型は外部の訪問看護事業所と連携", "24時間（日中・夜間とも）提供する。夜間だけなのは夜間対応型訪問介護", "計画を作るのは計画作成責任者（看護師・介護福祉士など）。ケアプランの内容に沿って作る"], "point": "要介護のみ・24時間・一体型／連携型・会議は6か月に1回、計画は計画作成責任者"}, {"field": "介護保険制度", "topic": "介護保険の保険給付について", "opts": ["市町村特別給付の財源は、原則として第1号被保険者の保険料である。", "予防給付には、施設サービスが含まれる。", "居宅介護サービス費は、法定代理受領により現物給付化することができる。", "高額介護サービス費にあたる給付は、予防給付にはない。", "住宅改修費は、事業者に直接支払う現物給付が原則である。"], "ans": [1, 3], "exp": ["市町村が条例で独自に行う給付（配食・移送など）。財源は第1号保険料", "施設サービスは介護給付だけ。要支援者は施設に入所できない", "事業者が利用者の代わりに保険給付を受け取るので、利用者は自己負担分だけ払えばよい", "予防給付にも「高額介護予防サービス費」がある", "住宅改修費・福祉用具購入費は償還払い（いったん全額払って後から戻る）が原則。受領委任払いの市町村もある"], "point": "施設は介護給付のみ／特別給付は第1号保険料／住宅改修・福祉用具購入は償還払いが原則", "id": "n01", "date": "新作"}, {"field": "介護保険制度", "topic": "介護予防・日常生活支援総合事業について", "opts": ["介護予防・生活支援サービス事業の対象には、基本チェックリストで該当した事業対象者が含まれる。", "総合事業は、都道府県が実施する。", "一般介護予防事業は、要支援者だけが利用できる。", "介護予防ケアマネジメントは、地域包括支援センターが行う。", "訪問型サービスと通所型サービスは、全国一律の基準・単価で行われる。"], "ans": [1, 4], "exp": ["要支援1・2の人と、基本チェックリストで該当した「事業対象者」が対象", "実施するのは市町村", "一般介護予防事業は、すべての第1号被保険者とその支援のための活動にかかわる人が対象", "地域包括支援センターが行う（居宅介護支援事業者に一部委託もできる）", "基準や単価は市町村が地域の実情に合わせて決める"], "point": "総合事業は市町村／事業対象者＝基本チェックリスト該当者／一般介護予防は65歳以上みんな", "id": "n02", "date": "新作"}, {"field": "介護保険制度", "topic": "指定居宅介護支援の運営基準について", "opts": ["モニタリングの結果は、少なくとも1か月に1回記録しなければならない。", "作成した居宅サービス計画は、利用者と担当者に交付しなければならない。", "居宅サービス計画の原案は、利用者の同意を得なくても確定できる。", "居宅サービス計画に福祉用具貸与を位置づけるときは、必要な理由を書かなくてよい。", "サービス担当者会議には、利用者や家族は参加できない。"], "ans": [1, 2], "exp": ["モニタリングの結果は少なくとも月1回記録する", "利用者と、サービスを担当する事業者（担当者）の両方に交付する", "原案は利用者や家族に説明し、文書で同意を得てから確定する", "福祉用具貸与を位置づけるときは、必要な理由をケアプランに記載する", "利用者・家族も参加するのが原則"], "point": "同意は文書で／計画は利用者と担当者に交付／モニタリング記録は月1回以上", "id": "n03", "date": "新作"}, {"field": "介護保険制度", "topic": "介護サービス情報の公表について", "opts": ["介護サービス事業者は、介護サービス情報を都道府県知事に報告しなければならない。", "報告された情報の公表は、市町村長が行う。", "都道府県知事は、報告の内容について必要に応じて調査できる。", "公表の対象は、介護保険施設だけである。", "報告は任意なので、報告しなくても何も起こらない。"], "ans": [1, 3], "exp": ["サービス提供を始めるときなどに、都道府県知事へ報告する義務がある", "公表するのは都道府県知事", "報告の内容を確認するため、必要なら調査できる", "居宅サービス事業者なども含め、幅広い事業者が対象", "報告しないと都道府県知事が命令でき、従わないと指定の取消しなどもありうる"], "point": "報告も公表も都道府県知事／報告は義務", "id": "n04", "date": "新作"}, {"field": "保健医療", "topic": "脳卒中について", "opts": ["脳梗塞の再発予防には、高血圧の管理が大切である。", "左の大脳半球が障害されると、左半身にまひが出やすい。", "失語症は、多くの場合、右の大脳半球の障害で起こる。", "右の大脳半球の障害では、左側を見落とす半側空間無視が起こりやすい。", "くも膜下出血は、脳の細い血管が詰まって起こることが多い。"], "ans": [1, 4], "exp": ["高血圧は脳梗塞・脳出血どちらにも大きな危険因子", "まひは障害された側と反対側に出る。左半球なら右半身", "言葉の中枢は多くの人で左半球にあるので、失語症は左半球の障害で起こりやすい", "右半球の障害で左側の空間に気づかなくなることが多い", "くも膜下出血の多くは脳動脈瘤の破裂。血管が詰まるのは脳梗塞"], "point": "まひは反対側／失語は左半球／左の見落とし（半側空間無視）は右半球", "id": "n05", "date": "新作"}, {"field": "保健医療", "topic": "高齢者の脱水について", "opts": ["高齢者は体内の水分量が若い人より多いので、脱水になりにくい。", "高齢者はのどの渇きを感じにくい。", "脱水になると、皮膚や口の中が乾燥しやすい。", "利尿薬を飲んでいる人は、脱水になりにくい。", "脱水の予防には、のどが渇いてから一度にたくさん飲むのがよい。"], "ans": [2, 3], "exp": ["高齢者は体内の水分量が少なく、脱水になりやすい", "渇きを感じにくいので、時間を決めて飲むなどの工夫がいる", "皮膚や舌、わきの下の乾燥はサイン", "利尿薬で尿が増えるので、脱水になりやすい", "のどが渇く前に、こまめに少しずつ飲む"], "point": "水分量が少ない・渇きを感じにくい・利尿薬は要注意→こまめに水分補給", "id": "n06", "date": "新作"}, {"field": "保健医療", "topic": "在宅酸素療法について", "opts": ["酸素を吸っているときは、火気から2m以上離れる。", "息苦しいときは、本人の判断で酸素の流量を自由に上げてよい。", "在宅酸素療法を受けている人は、外出や旅行ができない。", "慢性閉塞性肺疾患（COPD）は、在宅酸素療法の主な対象となる病気のひとつである。", "酸素濃縮装置は、身体障害者手帳がないと使えない。"], "ans": [1, 4], "exp": ["酸素は燃焼を助けるので、火気から2m以上離れる", "流量は医師の指示どおり。勝手に上げるとCO2ナルコーシスを起こすことがある", "携帯用の酸素ボンベを使えば外出も旅行もできる", "COPDは在宅酸素療法の代表的な対象", "医療保険で利用できる。手帳は必要ない"], "point": "火気から2m／流量は医師の指示どおり／携帯ボンベで外出OK", "id": "n07", "date": "新作"}, {"field": "保健医療", "topic": "高齢者のうつ病について", "opts": ["高齢者のうつ病は、気分の落ち込みより、体の不調の訴えが目立つことが多い。", "うつ病が認知症とまちがえられることはない。", "うつ病の人は、励ますほど早く回復するので、積極的に励ますとよい。", "配偶者との死別や退職などの喪失体験が、きっかけになることがある。", "抗うつ薬は、飲み始めてすぐに効果が出る。"], "ans": [1, 4], "exp": ["頭痛・食欲不振・不眠など体の症状として出やすい", "もの忘れや反応の鈍さから認知症のように見えることがある（仮性認知症）", "励ましはかえって負担になる。休養をすすめ、気持ちを受けとめる", "死別・退職・病気などの喪失体験が引き金になりやすい", "効果が出るまで数週間かかることが多い。自己判断でやめない"], "point": "体の訴えが多い／仮性認知症／励まさない／喪失体験がきっかけ", "id": "n08", "date": "新作"}, {"field": "福祉サービス", "topic": "介護老人福祉施設（特別養護老人ホーム）について", "opts": ["新規入所は、原則として要介護3以上の人が対象である。", "入所定員が29人以下のものも、介護老人福祉施設として都道府県知事が指定する。", "医師は配置しなくてよい。", "要介護1・2でも、やむを得ない事情があれば特例的に入所できる。", "入所者の食費と居住費は、介護保険から全額給付される。"], "ans": [1, 4], "exp": ["2015年4月から、新規入所は原則要介護3以上", "29人以下は地域密着型介護老人福祉施設で、市町村長が指定する", "入所者の健康管理に必要な数の医師を置く（非常勤でもよい）", "認知症や虐待のおそれなど、やむを得ない事情があれば特例入所できる", "食費・居住費は自己負担。所得が低い人は補足給付（特定入所者介護サービス費）で軽くなる"], "point": "原則要介護3以上（特例あり）／29人以下は地域密着型／食費・居住費は自己負担", "id": "n09", "date": "新作"}, {"field": "福祉サービス", "topic": "夜間対応型訪問介護について", "opts": ["要支援者も利用できる。", "夜間の定期的な巡回訪問と、通報による随時訪問を組み合わせたサービスである。", "地域密着型サービスであり、市町村長が指定する。", "日中も含めて24時間提供しなければならない。", "オペレーションセンターは、どの事業所でも必ず設置しなければならない。"], "ans": [2, 3], "exp": ["要介護者のみ。予防給付はない", "定期巡回サービスと随時訪問サービスを組み合わせる", "地域密着型サービスなので市町村長が指定", "夜間（22時〜翌6時を必ず含む時間帯）に行うサービス。24時間は定期巡回・随時対応型訪問介護看護", "条件を満たせば、オペレーションセンターを置かない事業所もある"], "point": "要介護のみ・夜間・地域密着型。24時間なら定期巡回・随時対応型", "id": "n10", "date": "新作"}, {"field": "福祉サービス", "topic": "介護保険と障害福祉サービスの関係について", "opts": ["同じようなサービスがある場合、原則として介護保険のサービスが優先される。", "65歳になった障害者は、障害福祉サービスを一切利用できなくなる。", "障害福祉サービスを利用するには、介護保険の要介護認定が必要である。", "共生型サービスは、介護保険と障害福祉の両方の指定を受けやすくする仕組みである。", "障害者支援施設の入所者は、介護保険の被保険者になる。"], "ans": [1, 4], "exp": ["介護保険優先の原則。ただし一律ではなく個別に判断する", "介護保険にないサービス（同行援護・行動援護など）は引き続き使える", "障害福祉サービスで使うのは障害支援区分", "同じ事業所で高齢者と障害者がサービスを受けやすくするため、2018年度にできた", "障害者支援施設などの入所者は適用除外で、介護保険の被保険者にならない"], "point": "介護保険優先／障害福祉は障害支援区分／共生型サービス／障害者支援施設は適用除外", "id": "n11", "date": "新作"}, {"field": "福祉サービス", "topic": "介護保険の住宅改修について", "opts": ["手すりの取付けは、住宅改修費の支給対象である。", "支給限度基準額は、要介護度によって異なる。", "原則として、工事の前に市町村へ申請する必要がある。", "階段昇降機の設置は、住宅改修の対象になる。", "洋式便器から和式便器への取替えも対象になる。"], "ans": [1, 3], "exp": ["手すり・段差解消・滑り防止の床材変更・引き戸などへの扉の取替え・洋式便器への取替えが対象", "要介護度に関係なく一律20万円（要支援も同じ）", "事前申請が原則。必要な書類に住宅改修が必要な理由書がある", "昇降機やリフトなど動力で動くものは対象外", "対象は和式から洋式への取替え"], "point": "一律20万円／事前申請／動力のある設備は対象外", "id": "n12", "date": "新作"}, {"field": "福祉サービス", "topic": "介護老人保健施設について", "opts": ["在宅復帰をめざして、リハビリテーションなどを行う施設である。", "医師は配置しなくてよい。", "開設には、都道府県知事の許可が必要である。", "要支援者も入所できる。", "医療は一切行うことができない。"], "ans": [1, 3], "exp": ["看護・医学的管理のもとで介護や機能訓練を行い、在宅復帰をめざす", "常勤の医師を1人以上置く", "特養は「指定」、老健と介護医療院は都道府県知事の「許可」", "入所できるのは要介護者だけ", "医師がいて、必要な医療も行う"], "point": "在宅復帰／常勤医師あり／開設は都道府県知事の許可", "id": "n13", "date": "新作"}], "glossary": {"第1号被保険者": "65歳以上で、市町村に住所がある人。原因を問わず、要介護・要支援になれば介護保険を使える。", "第2号被保険者": "40〜64歳で医療保険に入っている人。特定疾病が原因のときだけ介護保険を使える。", "特定疾病": "第2号被保険者が介護保険を使える16の病気（末期がん・関節リウマチ・パーキンソン病関連疾患・脳血管疾患など）。", "特別徴収": "年金から保険料を天引きする方法。年額18万円以上の年金を受けている第1号被保険者が対象。", "普通徴収": "納付書や口座振替で、市町村に直接保険料を払う方法。世帯主と配偶者にも連帯して払う義務がある。", "要介護認定": "介護が必要かどうか・どのくらい必要かを市町村が決めるしくみ。認定調査と主治医意見書をもとに介護認定審査会が判定する。", "介護認定審査会": "要介護度を判定する市町村の審査会。保健・医療・福祉の学識経験者から市町村長が委員を任命する。", "介護保険審査会": "要介護認定や保険料などの市町村の処分に不服があるとき、審査請求をする先。都道府県に置かれる。", "審査請求": "行政の処分に不服があるとき、取消しなどを求めて申し立てること。介護保険では介護保険審査会に行う。", "区分支給限度基準額": "居宅サービスを1か月に保険で使える上限。要介護度ごとに厚生労働大臣が決める。", "住所地特例": "施設に入るために住所を移した人は、もとの市町村が保険者のままになるしくみ。施設のある市町村の負担が偏らないようにする。", "保険者": "介護保険を運営する市町村（特別区を含む）。保険料を集め、給付を行う。", "財政安定化基金": "市町村の介護保険財政が赤字になりそうなとき、貸付や交付をする基金。都道府県に置かれる。", "調整交付金": "市町村ごとの高齢者の割合や所得の差をならすため、国が交付するお金。国の負担25%のうち5%分。", "社会保険診療報酬支払基金": "医療保険者から第2号被保険者の保険料を集めて、市町村に交付する機関。", "地域包括支援センター": "高齢者の総合相談・権利擁護・介護予防ケアマネジメントなどを行う機関。保健師・社会福祉士・主任介護支援専門員を置く。", "包括的支援事業": "地域支援事業のひとつ。総合相談・権利擁護・介護予防ケアマネジメント・包括的継続的ケアマネジメント支援など。", "地域支援事業": "市町村が行う事業。総合事業・包括的支援事業・任意事業の3つがある。", "総合事業": "介護予防・日常生活支援総合事業のこと。市町村が行い、介護予防・生活支援サービス事業と一般介護予防事業がある。", "基本チェックリスト": "生活機能が落ちていないかを確かめる25項目の質問票。該当すると総合事業の「事業対象者」になる。", "介護予防ケアマネジメント": "総合事業のサービスを使う人のためのケアマネジメント。地域包括支援センターが行う。", "居宅サービス計画": "ケアプランのこと。在宅で使うサービスの計画で、介護支援専門員が作る。", "ケアプラン": "居宅サービス計画や施設サービス計画のこと。利用者の目標と、使うサービスをまとめた計画。", "サービス担当者会議": "ケアプランについて、利用者・家族とサービス担当者が集まって話し合う会議。介護支援専門員が開く。", "モニタリング": "ケアプランどおりにサービスが行われ、目標に近づいているかを確かめること。", "介護支援専門員": "ケアマネジャーのこと。都道府県知事の登録を受け、介護支援専門員証（有効期間5年）の交付を受ける。", "主任介護支援専門員": "経験を積んだ介護支援専門員が研修を受けてなる。地域包括支援センターの必置職種。", "サービス提供責任者": "訪問介護事業所に置く職種。訪問介護計画を作り、ヘルパーへの指示や調整を行う。", "計画作成責任者": "定期巡回・随時対応型訪問介護看護などで、そのサービスの計画を作る人。看護師・介護福祉士などから選ぶ。", "法定代理受領": "事業者が利用者の代わりに保険給付を受け取るしくみ。利用者は自己負担分だけ払えばよい（現物給付）。", "償還払い": "利用者がいったん全額を払い、あとで保険給付分が払い戻される方法。住宅改修費・福祉用具購入費が代表例。", "現物給付": "お金ではなく、サービスそのものを給付すること。", "高額介護サービス費": "1か月の自己負担が上限を超えたとき、超えた分が払い戻されるしくみ。", "高額医療合算介護サービス費": "1年間の医療と介護の自己負担を合計して、上限を超えた分が払い戻されるしくみ。", "補足給付": "特定入所者介護サービス費のこと。所得が低い人の施設・短期入所での食費・居住費を軽くする。", "市町村特別給付": "市町村が条例で独自に行う給付（配食・移送など）。財源は第1号被保険者の保険料。", "予防給付": "要支援1・2の人への保険給付。施設サービスは含まれない。", "介護給付": "要介護1〜5の人への保険給付。", "地域密着型サービス": "住み慣れた地域で暮らし続けるためのサービス。原則その市町村の住民だけが使え、市町村長が指定する。", "介護保険事業計画": "市町村が作る3年1期の計画。サービスの見込み量や保険料の基礎になる。都道府県は介護保険事業支援計画を作る。", "定期巡回・随時対応型訪問介護看護": "日中・夜間を通じて、定期的な巡回と通報による随時対応で、訪問介護と訪問看護を一体的に行う地域密着型サービス。", "夜間対応型訪問介護": "夜間に定期巡回と通報による随時訪問を行う地域密着型サービス。要介護者が対象。", "小規模多機能型居宅介護": "「通い」を中心に「訪問」「泊まり」を組み合わせる地域密着型サービス。登録定員29人以下。", "認知症対応型共同生活介護": "グループホームのこと。認知症の人が5〜9人のユニットで共同生活する地域密着型サービス。要支援2から使える。", "短期入所生活介護": "ショートステイのこと。特養などに短期間泊まって介護を受ける。連続30日まで。", "通所介護": "デイサービスのこと。利用定員19人以上。18人以下は地域密着型通所介護。", "訪問入浴介護": "浴槽を持ち込んで自宅で入浴させるサービス。原則、看護職員1人と介護職員2人で行う。", "介護老人福祉施設": "特別養護老人ホーム（特養）のこと。新規入所は原則要介護3以上。", "介護老人保健施設": "老健のこと。在宅復帰をめざしてリハビリなどを行う施設。開設には都道府県知事の許可がいる。", "介護医療院": "長期の療養が必要な人に、医療と生活の場を一体で提供する施設。開設には都道府県知事の許可がいる。", "特定施設": "有料老人ホーム・軽費老人ホーム（ケアハウス）・養護老人ホームのうち、介護サービスを提供する指定を受けたもの。", "共生型サービス": "介護保険と障害福祉の両方のサービスを、同じ事業所で提供しやすくするしくみ。", "障害支援区分": "障害福祉サービスを使うときの、支援の必要度を示す区分（区分1〜6）。", "成年後見制度": "判断能力が不十分な人を、後見人などが財産管理や契約で支える制度。法定後見（後見・保佐・補助）と任意後見がある。", "高齢者虐待防止法": "高齢者（65歳以上）への虐待を防ぐ法律。虐待は身体的・心理的・性的・経済的・介護等放棄の5種類。", "生活保護": "生活に困っている人に、最低限度の生活を保障する制度。扶助は8種類で、介護扶助もその一つ。", "介護扶助": "生活保護の扶助のひとつ。介護サービスを現物給付で受けられる。", "褥瘡": "床ずれのこと。圧迫が続いて皮膚や組織が傷つく。仰向けでは仙骨部・かかとにできやすい。", "誤嚥性肺炎": "食べ物や唾液が気管に入って起こる肺炎。寝ている間の気づかない誤嚥（不顕性誤嚥）でも起こる。", "不顕性誤嚥": "むせなどがないまま、気づかないうちに唾液などが気管に入ること。睡眠中に起こりやすい。", "パーキンソン病": "手足のふるえ（安静時振戦）・筋固縮・無動・姿勢反射障害が主な症状の病気。", "ウェアリング・オフ現象": "パーキンソン病の薬を長く飲むうちに、薬の効く時間が短くなる現象。", "BPSD": "認知症の行動・心理症状（周辺症状）。徘徊・妄想・暴言など。記憶障害などの中核症状とは別。", "中核症状": "認知症で脳の障害から直接起こる症状。記憶障害・見当識障害・判断力の低下など。", "レビー小体型認知症": "幻視やパーキンソン症状が特徴の認知症。", "仮性認知症": "うつ病などで、認知症のように見える状態。治療で良くなることがある。", "CO2ナルコーシス": "体に二酸化炭素がたまり、意識がもうろうとする状態。酸素を急に多く吸うと起こることがある。", "COPD": "慢性閉塞性肺疾患。たばこが主な原因で、息切れが続く肺の病気。在宅酸素療法の主な対象。", "半側空間無視": "脳の障害で、片側（多くは左側）にあるものに気づかなくなる症状。右半球の障害で起こりやすい。", "失語症": "脳の障害で、話す・聞く・読む・書くことが難しくなる症状。多くは左半球の障害で起こる。", "バイタルサイン": "体温・脈拍・血圧・呼吸などの生命の基本的なサイン。"}}</script>
<script>
(function(){
const DATA=JSON.parse(document.getElementById('data').textContent);
const Q=DATA.questions, GL=DATA.glossary;
const QBY={}; Q.forEach(q=>QBY[q.id]=q);
document.getElementById('qcount').textContent=Q.length;
const FIELDS=['介護保険制度','保健医療','福祉サービス'];

/* ---- 一日一問（チャット）でこれまでに解いた結果。最初の1回だけ記録に取り込む ---- */
const HISTORY={"10-15":0,"10-16":1,"10-17":1,"10-18":0,"10-19":1,"10-20":1,"10-21":0,"10-22":0,"10-23":1,"10-24":1,"10-25":0,"10-26":0,"10-27":1,"10-28":1,"10-29":1,"10-30":0,"10-31":0,"11-1":0,"11-5":1,"11-6":1,"11-7":0,"11-8":1,"11-9":1,"11-10":0,"11-11":1,"11-12":0,"11-13":1,"11-14":1,"11-15":0,"11-17":0,"11-18":1,"11-19":0,"11-20":0,"11-21":1,"11-22":0,"11-23":1,"11-24":0};

/* ---------- utils ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(c,n)=>n?Math.round(c/n*100):0;
const terms=Object.keys(GL).sort((a,b)=>b.length-a.length);
const termRe=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
function hl(s){return esc(s).replace(termRe,m=>'<button class="term" data-term="'+esc(m)+'">'+m+'</button>')}
const stemOf=q=>q.topic.replace(/について$/,'')+'について、<b>正しいものを'+q.ans.length+'つ</b>選べ。';
const oxStem=q=>q.topic.replace(/について$/,'')+'について';

/* ---------- state ---------- */
let S={v:1,mcq:{},ox:{},days:{},imported:false};
let OWNER=false;
let store=null, saving=false, dirty=false;
const LS='caremane-drill-v1';
function lsLoad(){try{const t=localStorage.getItem(LS);return t?JSON.parse(t):null}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function importHistory(){
  if(S.imported) return;
  for(const k in HISTORY){
    const id='k'+k, ok=!!HISTORY[k]; if(!QBY[id]) continue;
    const [m,d]=k.split('-'); const date='2026-'+pad(m)+'-'+pad(d);
    const r=S.mcq[id]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok; r.at=date; S.mcq[id]=r;
    const day=S.days[date]||{n:0,c:0}; day.n++; if(ok) day.c++; S.days[date]=day;
  }
  S.imported=true;
}
async function persist(){
  lsSave();
  if(!store) return;
  if(saving){dirty=true;return}
  saving=true;
  try{do{dirty=false;await store.set(JSON.parse(JSON.stringify(S)))}while(dirty);setSync('保存済み')}
  catch(e){setSync('この端末にだけ保存中')}
  saving=false;
}
function setSync(t){document.getElementById('sync').textContent=t}
function record(kind,id,ok){
  const map=kind==='mcq'?S.mcq:S.ox;
  const r=map[id]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok; r.at=today(); map[id]=r;
  const d=S.days[today()]||{n:0,c:0}; d.n++; if(ok) d.c++; S.days[today()]=d;
  persist(); updateBadge();
}
function totals(){
  let n=0,c=0; for(const k in S.days){n+=S.days[k].n;c+=S.days[k].c} return {n,c};
}
function kindTotals(map){let n=0,c=0;for(const k in map){n+=map[k].n;c+=map[k].c}return{n,c}}
function missList(){
  const out=[];
  for(const id in S.mcq) if(S.mcq[id].last===false && QBY[id]) out.push({kind:'mcq',id,at:S.mcq[id].at});
  for(const id in S.ox) if(S.ox[id].last===false){const [qid,i]=id.split('#'); if(QBY[qid]) out.push({kind:'ox',id,qid,i:+i,at:S.ox[id].at})}
  return out.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
}
function updateBadge(){const n=missList().length;document.getElementById('missBadge').innerHTML=n?' <span class="badge">'+n+'</span>':''}

/* ---------- settings (per-viewer convenience) ---------- */
let cfg={mode:'mcq',field:'all',order:'random',count:10};
try{const t=localStorage.getItem(LS+'-cfg');if(t)cfg=Object.assign(cfg,JSON.parse(t))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem(LS+'-cfg',JSON.stringify(cfg))}catch(e){}};

/* ---------- session ---------- */
let sess=null; // {items:[{kind,id,qid,i}], pos, answered, sel:[], score}
function buildItems(onlyMiss){
  let items=[];
  if(onlyMiss){items=missList().filter(m=>m.kind===cfg.mode).map(m=>m.kind==='mcq'?{kind:'mcq',id:m.id}:{kind:'ox',id:m.id,qid:m.qid,i:m.i})}
  else{
    const qs=Q.filter(q=>cfg.field==='all'||q.field===cfg.field);
    if(cfg.mode==='mcq') items=qs.map(q=>({kind:'mcq',id:q.id}));
    else qs.forEach(q=>q.opts.forEach((_,i)=>items.push({kind:'ox',id:q.id+'#'+i,qid:q.id,i})));
  }
  if(cfg.order==='random') items=shuffle(items);
  if(!onlyMiss && cfg.count) items=items.slice(0,cfg.count);
  return items;
}
function start(items,label){
  if(!items.length){return}
  sess={items,pos:0,answered:false,sel:[],score:0,label:label||''};
  go('quiz');
}

/* ---------- render ---------- */
let tab='home';
const view=document.getElementById('view');
function go(t){tab=t;render();window.scrollTo(0,0)}
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  ({home:renderHome,quiz:renderQuiz,miss:renderMiss,stats:renderStats,words:renderWords})[tab]();
}
function segBtns(key,opts){return opts.map(([v,l])=>'<button data-k="'+key+'" data-v="'+v+'" aria-pressed="'+(String(cfg[key])===String(v))+'">'+l+'</button>').join('')}

function renderHome(){
  const t=totals(), td=S.days[today()]||{n:0,c:0}, miss=missList();
  const mm=miss.filter(m=>m.kind===cfg.mode).length;
  view.innerHTML=`<div class="stack fade">
   <div class="hero">
    <div class="stat main"><div class="lab">今までの正解数</div><div class="num">${t.c}<small> 問 ／ ${t.n}問中（${pct(t.c,t.n)}%）</small></div></div>
    <div class="stat"><div class="lab">今日の正答率</div><div class="num">${td.n?pct(td.c,td.n)+'<small>%</small>':'—'}</div><div class="note">${td.c} / ${td.n}問</div></div>
    <div class="stat"><div class="lab">間違えた問題</div><div class="num">${miss.length}<small> 問</small></div><div class="note">解き直すと消えます</div></div>
   </div>
   <section class="panel stack">
    <div><p class="field-label">出題方式</p>
     <div class="mode">
      <button data-k="mode" data-v="mcq" aria-pressed="${cfg.mode==='mcq'}"><b>選択肢方式</b><span>本番と同じ5択から正しいものを2つ選ぶ</span></button>
      <button data-k="mode" data-v="ox" aria-pressed="${cfg.mode==='ox'}"><b>一問一答</b><span>選択肢1つずつを ○ か × で答える</span></button>
     </div></div>
    <div><p class="field-label">分野</p><div class="seg">${segBtns('field',[['all','すべて'],['介護保険制度','介護保険制度'],['保健医療','保健医療'],['福祉サービス','福祉サービス']])}</div></div>
    <div><p class="field-label">順番</p><div class="seg">${segBtns('order',[['random','ランダム'],['seq','出題日の順']])}</div></div>
    <div><p class="field-label">問題数</p><div class="seg">${segBtns('count',[[5,'5問'],[10,'10問'],[20,'20問'],[0,'全部']])}</div></div>
    <button class="btn" id="go">はじめる</button>
    <button class="btn ghost" id="goMiss" ${mm?'':'disabled'}>間違えた問題だけ解く（${mm}問）</button>
   </section>
   ${sess&&sess.pos<sess.items.length?'<button class="btn ghost" id="resume">続きから解く（'+(sess.pos+1)+' / '+sess.items.length+'）</button>':''}
  </div>`;
  view.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;let v=b.dataset.v;if(k==='count')v=+v;cfg[k]=v;saveCfg();renderHome()}));
  view.querySelector('#go').addEventListener('click',()=>start(buildItems(false)));
  view.querySelector('#goMiss').addEventListener('click',()=>start(buildItems(true),'間違えた問題'));
  const r=view.querySelector('#resume'); if(r) r.addEventListener('click',()=>go('quiz'));
}

function renderQuiz(){
  if(!sess){view.innerHTML='<div class="panel empty fade">ホームで方式と分野を選んで「はじめる」を押してね。<br><br><button class="btn" id="h">ホームへ</button></div>';view.querySelector('#h').addEventListener('click',()=>go('home'));return}
  if(sess.pos>=sess.items.length){return renderDone()}
  const it=sess.items[sess.pos];
  const q=QBY[it.kind==='mcq'?it.id:it.qid];
  const head=`<div class="qhead"><span>${sess.label?esc(sess.label)+' ・ ':''}${sess.pos+1} / ${sess.items.length}</span><span><span class="chip">${esc(q.field)}</span> ${OWNER&&q.date!=='新作'?'<span class="chip date">一日一問 '+esc(q.date)+'</span>':''}</span></div>
   <div class="progress"><i style="width:${sess.pos/sess.items.length*100}%"></i></div>`;
  if(it.kind==='mcq') renderMcq(q,head); else renderOx(q,it,head);
}
function nextBtns(){
  return `<div class="row"><button class="btn ghost" id="quit">やめる</button><button class="btn" id="next">${sess.pos+1<sess.items.length?'次の問題':'結果を見る'}</button></div>`;
}
function bindNext(){
  view.querySelector('#next').addEventListener('click',()=>{sess.pos++;sess.answered=false;sess.sel=[];renderQuiz();window.scrollTo(0,0)});
  view.querySelector('#quit').addEventListener('click',()=>{sess.pos=sess.items.length;renderQuiz()});
}
function renderMcq(q,head){
  const need=q.ans.length;
  if(!sess.answered){
    view.innerHTML=`<div class="stack fade">${head}
     <p class="stem">${hl(q.topic.replace(/について$/,''))}について、<b>正しいものを${need}つ</b>選べ。</p>
     <ul class="opts">${q.opts.map((o,i)=>`<li><div class="opt" role="button" tabindex="0" data-i="${i}" aria-pressed="${sess.sel.includes(i)}"><span class="n">${i+1}</span><span>${esc(o)}</span></div></li>`).join('')}</ul>
     <button class="btn" id="check" ${sess.sel.length===need?'':'disabled'}>答え合わせ（${sess.sel.length}/${need}つ選択中）</button>
    </div>`;
    view.querySelectorAll('.opt').forEach(b=>{
      const tog=e=>{if(e.target.closest('.term'))return;const i=+b.dataset.i;const k=sess.sel.indexOf(i);if(k>=0)sess.sel.splice(k,1);else{if(sess.sel.length>=need)sess.sel.shift();sess.sel.push(i)}renderQuiz()};
      b.addEventListener('click',tog);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog(e)}});
    });
    view.querySelector('#check').addEventListener('click',()=>{
      const you=sess.sel.map(i=>i+1).sort();const ok=you.join()===q.ans.slice().sort().join();
      sess.answered=true;sess.lastOk=ok;if(ok)sess.score++;record('mcq',q.id,ok);renderQuiz();window.scrollTo(0,0);
    });
    return;
  }
  const you=sess.sel.map(i=>i+1).sort((a,b)=>a-b);
  view.innerHTML=`<div class="stack fade">${head}
   <div class="verdict">あなた：${you.join('と')} → ${sess.lastOk?'<span class="v-ok">⭕ 正解</span>':'<span class="v-ng">❌ 不正解</span>'}　正解：${q.ans.join('と')}</div>
   <p class="stem" style="margin:0">${hl(q.topic.replace(/について$/,''))}について、正しいものを${need}つ選べ。</p>
   <div class="stack" style="gap:8px">${q.opts.map((o,i)=>{const right=q.ans.includes(i+1);const picked=you.includes(i+1);
     return `<div class="res ${right?'ok':'ng'}"><div class="line"><span>${right?'🟢':'🔴'}</span><span>${i+1}. ${hl(o)}</span>${picked?'<span class="you">あなたが選択</span>':''}</div>
     <div class="fix">${right?'→ このままで正しい'+(q.exp[i]?'（'+hl(q.exp[i])+'）':''):'→ <b>'+hl(q.exp[i]||'誤り')+'</b>'}</div></div>`}).join('')}</div>
   ${q.point?'<div class="point"><b>覚えるポイント</b><br>'+hl(q.point)+'</div>':''}
   <p class="note" style="margin:0">黄色いマーカーの言葉をタップすると解説が出ます。</p>
   ${nextBtns()}</div>`;
  bindNext();
}
function renderOx(q,it,head){
  const stmt=q.opts[it.i], truth=q.ans.includes(it.i+1);
  if(!sess.answered){
    view.innerHTML=`<div class="stack fade">${head}
     <p class="note" style="margin:0">${esc(oxStem(q))}</p>
     <div class="panel"><p class="stem" style="margin:0">${esc(stmt)}</p></div>
     <div class="ox"><button data-a="1">○<span>正しい</span></button><button data-a="0">×<span>まちがい</span></button></div>
    </div>`;
    view.querySelectorAll('.ox button').forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.a==='1';const ok=a===truth;sess.answered=true;sess.lastOk=ok;sess.lastA=a;if(ok)sess.score++;record('ox',it.id,ok);renderQuiz();
    }));
    return;
  }
  view.innerHTML=`<div class="stack fade">${head}
   <div class="verdict">あなた：${sess.lastA?'○':'×'} → ${sess.lastOk?'<span class="v-ok">⭕ 正解</span>':'<span class="v-ng">❌ 不正解</span>'}　正解：${truth?'○':'×'}</div>
   <div class="res ${truth?'ok':'ng'}"><div class="line"><span>${truth?'🟢':'🔴'}</span><span>${hl(stmt)}</span></div>
   <div class="fix">${truth?'→ このままで正しい'+(q.exp[it.i]?'（'+hl(q.exp[it.i])+'）':''):'→ <b>'+hl(q.exp[it.i]||'誤り')+'</b>'}</div></div>
   ${q.point?'<div class="point"><b>覚えるポイント</b><br>'+hl(q.point)+'</div>':''}
   ${nextBtns()}</div>`;
  bindNext();
}
function renderDone(){
  const n=sess.items.length, answered=Math.min(n, sess.items.length);
  const done=sess.score, tried=sess.answeredCount||null;
  view.innerHTML=`<div class="stack fade"><div class="panel stack">
    <h2>おつかれさま！</h2>
    <div class="stat main" style="margin:0"><div class="lab">今回の正解</div><div class="num">${sess.score}<small> 問</small></div></div>
    <p class="note" style="margin:0">間違えた問題は「間違えた」タブからすぐ解き直せます。</p>
    <div class="row"><button class="btn ghost" id="toMiss">間違えた問題へ</button><button class="btn" id="again">ホームへ</button></div>
  </div></div>`;
  view.querySelector('#toMiss').addEventListener('click',()=>{sess=null;go('miss')});
  view.querySelector('#again').addEventListener('click',()=>{sess=null;go('home')});
}

function renderMiss(){
  const miss=missList();
  const mcq=miss.filter(m=>m.kind==='mcq'), ox=miss.filter(m=>m.kind==='ox');
  const row=m=>{const q=QBY[m.kind==='mcq'?m.id:m.qid];
    return `<li><button class="item" data-kind="${m.kind}" data-id="${esc(m.id)}"><span class="meta"><span class="chip">${esc(q.field)}</span><span>${OWNER&&q.date!=='新作'?'一日一問 '+esc(q.date):''}</span><span style="margin-left:auto">${m.at?esc(m.at.slice(5).replace('-','/'))+' に不正解':''}</span></span>
      <span class="t">${m.kind==='mcq'?esc(q.topic):esc(q.opts[m.i])}</span></button></li>`};
  view.innerHTML=`<div class="stack fade">
   <h2>間違えた問題</h2>
   <p class="note" style="margin:0">タップするとその問題にすぐ飛びます。正解するとリストから消えます。</p>
   <section class="stack" style="gap:8px"><div class="row" style="align-items:center"><h3 style="font-size:1rem">選択肢方式（${mcq.length}）</h3><button class="btn ghost" style="flex:none;width:auto;padding:6px 12px;font-size:.85rem" data-all="mcq" ${mcq.length?'':'disabled'}>まとめて解く</button></div>
    ${mcq.length?'<ul class="list">'+mcq.map(row).join('')+'</ul>':'<div class="empty">ありません</div>'}</section>
   <section class="stack" style="gap:8px"><div class="row" style="align-items:center"><h3 style="font-size:1rem">一問一答（${ox.length}）</h3><button class="btn ghost" style="flex:none;width:auto;padding:6px 12px;font-size:.85rem" data-all="ox" ${ox.length?'':'disabled'}>まとめて解く</button></div>
    ${ox.length?'<ul class="list">'+ox.map(row).join('')+'</ul>':'<div class="empty">ありません</div>'}</section>
  </div>`;
  view.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>{
    const kind=b.dataset.kind,id=b.dataset.id;
    if(kind==='mcq') start([{kind:'mcq',id}],'解き直し');
    else{const [qid,i]=id.split('#');start([{kind:'ox',id,qid,i:+i}],'解き直し')}
  }));
  view.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.all;start(missList().filter(m=>m.kind===k).map(m=>m.kind==='mcq'?{kind:'mcq',id:m.id}:{kind:'ox',id:m.id,qid:m.qid,i:m.i}),'間違えた問題');
  }));
}

function chartSvg(days){
  const W=360,H=200,L=34,R=6,T=20,B=26; const n=days.length; const bw=(W-L-R)/Math.max(n,1);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="日ごとの正答率">`;
  [0,50,100].forEach(v=>{const y=T+(H-T-B)*(1-v/100);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-4}" y="${y+3}" text-anchor="end">${v}%</text>`});
  days.forEach((d,i)=>{const p=pct(d.c,d.n);const h=(H-T-B)*p/100;const x=L+i*bw+bw*.18;const w=bw*.64;const y=T+(H-T-B)-h;
    s+=`<rect class="b" x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" rx="3"/>`;
    if(n<=10) s+=`<text class="lbl" x="${x+w/2}" y="${y-4}" text-anchor="middle">${p}</text>`;
    if(n<=7||i%2===(n-1)%2) s+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle">${esc(d.k.slice(5).replace('-','/').replace(/^0/,''))}</text>`});
  return s+'</svg>';
}
function renderStats(){
  const t=totals(), m=kindTotals(S.mcq), o=kindTotals(S.ox);
  const keys=Object.keys(S.days).sort();
  const days=keys.map(k=>Object.assign({k},S.days[k]));
  const recent=days.slice(-14);
  const fs=FIELDS.map(f=>{let n=0,c=0;for(const id in S.mcq){if(QBY[id]&&QBY[id].field===f){n+=S.mcq[id].n;c+=S.mcq[id].c}}for(const id in S.ox){const q=QBY[id.split('#')[0]];if(q&&q.field===f){n+=S.ox[id].n;c+=S.ox[id].c}}return{f,n,c}});
  view.innerHTML=`<div class="stack fade">
   <div class="stat main"><div class="lab">今までの正解数</div><div class="num">${t.c}<small> 問 ／ ${t.n}問中（${pct(t.c,t.n)}%）</small></div></div>
   <div class="twocol">
    <div class="mini"><b>${m.c}/${m.n}</b><span>選択肢方式</span></div>
    <div class="mini"><b>${o.c}/${o.n}</b><span>一問一答</span></div>
    <div class="mini"><b>${keys.length}</b><span>勉強した日</span></div>
   </div>
   <section class="panel stack" style="gap:8px"><h2>日ごとの正答率</h2><p class="note" style="margin:0">直近${recent.length}日分（棒の上の数字は%）</p>${recent.length?chartSvg(recent):'<div class="empty">まだ記録がありません</div>'}</section>
   <section class="panel stack" style="gap:8px"><h2>分野別</h2>
    <div class="tw"><table><thead><tr><th>分野</th><th>正解/解いた</th><th>正答率</th></tr></thead><tbody>
    ${fs.map(x=>`<tr><td>${x.f}</td><td>${x.c} / ${x.n}</td><td>${x.n?pct(x.c,x.n)+'%':'—'}<span class="bar" style="width:${pct(x.c,x.n)*0.6}px"></span></td></tr>`).join('')}
    </tbody></table></div></section>
   <section class="panel stack" style="gap:8px"><h2>解いた日の記録</h2>
    <div class="tw"><table><thead><tr><th>日付</th><th>解いた</th><th>正解</th><th>正答率</th></tr></thead><tbody>
    ${days.slice().reverse().map(d=>`<tr><td>${esc(d.k.replace(/-/g,'/'))}</td><td>${d.n}</td><td>${d.c}</td><td>${pct(d.c,d.n)}%</td></tr>`).join('')||'<tr><td colspan="4">まだ記録がありません</td></tr>'}
    </tbody></table></div>
    ${S.imported&&OWNER?'<p class="note" style="margin:0">10/15〜11/24 はチャットの一日一問の結果です。</p>':''}</section>
  </div>`;
}
function renderWords(){
  view.innerHTML=`<div class="stack fade"><h2>用語集</h2>
   <input class="search" id="q" type="search" placeholder="言葉をさがす（例：住所地特例）" aria-label="用語をさがす">
   <dl class="gl" id="gl"></dl></div>`;
  const draw=f=>{document.getElementById('gl').innerHTML=Object.keys(GL).filter(k=>!f||k.includes(f)||GL[k].includes(f)).map(k=>`<div><dt>${esc(k)}</dt><dd>${esc(GL[k])}</dd></div>`).join('')||'<div class="empty">見つかりません</div>'};
  draw('');document.getElementById('q').addEventListener('input',e=>draw(e.target.value.trim()));
}

/* ---------- term sheet ---------- */
const sheet=document.getElementById('sheet');
document.addEventListener('click',e=>{
  const t=e.target.closest('.term'); if(!t) return;
  e.stopPropagation(); const k=t.dataset.term;
  sheet.innerHTML=`<div class="sheet-bg" id="sbg"></div><div class="sheet" role="dialog" aria-label="言葉の解説"><h3>${esc(k)}</h3><p>${esc(GL[k]||'')}</p><button class="btn" id="sclose">閉じる</button></div>`;
  sheet.hidden=false;
  const close=()=>{sheet.hidden=true;sheet.innerHTML=''};
  document.getElementById('sbg').addEventListener('click',close);document.getElementById('sclose').addEventListener('click',close);
  document.getElementById('sclose').focus();
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden){sheet.hidden=true;sheet.innerHTML=''}});

/* ---------- boot ---------- */
const local=lsLoad(); if(local) S=Object.assign(S,local);
updateBadge(); render(); setSync('この端末に保存');
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    OWNER=!!(await user.isOwner());
    const ref=db.doc('data/users/'+uid+'/progress');
    const snap=await ref.get();
    if(snap.exists){const d=snap.data();S=Object.assign({v:1,mcq:{},ox:{},days:{},imported:true},JSON.parse(JSON.stringify(d)));lsSave()}
    store=ref; setSync('保存済み');
    if(!snap.exists){ if(OWNER) importHistory(); persist(); }
    updateBadge(); if(tab!=='quiz'||!sess) render();
  }catch(e){setSync('この端末に保存')}
})();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
