<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ケアマネ合格ドリル</title>
<meta name="description" content="ケアマネ試験の問題を選択肢方式と一問一答で解ける問題集アプリ">
<meta name="theme-color" content="#1f6b58">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ケアマネドリル">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow study column, bottom tab bar on phones (top on wide screens) */
:root{
  --bg:#f4f5ef; --surface:#ffffff; --sunk:#eceee6; --ink:#1e2a27; --muted:#5d6a66; --line:#d9ddd3;
  --accent:#1f6b58; --accent-ink:#ffffff; --accent-soft:#dcebe4; --mark:#f3d27a;
  --ok:#2a8550; --ok-soft:#e1f1e6; --ng:#c2463a; --ng-soft:#f8e3df;
  --f-head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a2220; --sunk:#151c1a; --ink:#e5ebe8; --muted:#9aa8a3; --line:#2c3633;
  --accent:#5cc0a0; --accent-ink:#0d1a16; --accent-soft:#1f3a32; --mark:#8a6d1f;
  --ok:#6cce8e; --ok-soft:#1b3326; --ng:#f07c70; --ng-soft:#3a201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a2220; --sunk:#151c1a; --ink:#e5ebe8; --muted:#9aa8a3; --line:#2c3633;
  --accent:#5cc0a0; --accent-ink:#0d1a16; --accent-soft:#1f3a32; --mark:#8a6d1f;
  --ok:#6cce8e; --ok-soft:#1b3326; --ng:#f07c70; --ng-soft:#3a201d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(88px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:1.3rem}
h2{font-size:1.15rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.top small{color:var(--muted);font-size:.8rem}
.sync{font-size:.75rem;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:640px}
nav.tabs button{position:relative}nav.tabs .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}
.streak{display:flex;align-items:center;gap:12px}
.streak .fire{font-size:2.2rem;line-height:1}
.streak .big{font-family:var(--f-head);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.streak .sub{font-size:.8rem;color:var(--muted)}
.streak .bc{margin-left:auto;text-align:center;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:6px 10px;cursor:pointer;font:inherit;color:inherit}
.streak .bc b{display:block;font-family:var(--f-head);font-size:1.15rem}
.streak .bc span{font-size:.7rem;color:var(--muted);white-space:nowrap}
.wrap1 td:first-child{white-space:normal}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;line-height:1.35}
.bdg .e{font-size:1.9rem;display:block;line-height:1.2}
.bdg b{display:block;font-size:.78rem}
.bdg span{display:block;font-size:.66rem;color:var(--muted)}
.bdg.off .e{filter:grayscale(1);opacity:.35}
.bdg.off b{color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:700;text-align:center;max-width:92vw}
.toast .e{font-size:1.6rem;display:block}
.mockbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.mockbar .tm{font-family:var(--f-head);font-weight:700;font-size:1.1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.mockbar .tm.low{color:var(--ng)}
.qgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.qgrid button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 0;font-size:.72rem;cursor:pointer;font-variant-numeric:tabular-nums}
.qgrid button.done{background:var(--accent-soft);border-color:var(--accent)}
.qgrid button.cur{outline:2px solid var(--accent)}
.qgrid button.ok{background:var(--ok-soft);border-color:var(--ok)}
.qgrid button.ng{background:var(--ng-soft);border-color:var(--ng)}
.pass{font-family:var(--f-head);font-size:2rem;font-weight:700;text-align:center}
.pass.ok{color:var(--ok)}.pass.ng{color:var(--ng)}
details.rv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details.rv summary{cursor:pointer;font-size:.9rem;line-height:1.5}
details.rv[open] summary{margin-bottom:8px}
.rk .nm small{display:block;font-size:.72rem;color:var(--muted);font-weight:400}
.rk{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.rk li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.rk li.me{border:2px solid var(--accent);background:var(--accent-soft)}
.rk .no{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sunk);font-variant-numeric:tabular-nums}
.rk .no.g1{background:#e9c046;color:#3a2c00}.rk .no.g2{background:#c3c8cc;color:#1e2a27}.rk .no.g3{background:#d39a6a;color:#2f1a08}
.rk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rk .sc{text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.rk .sc b{font-family:var(--f-head);font-size:1.15rem}
.rk .sc span{display:block;font-size:.72rem;color:var(--muted)}

nav.tabs button{background:none;border:0;padding:6px 2px;border-radius:10px;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.badge{background:var(--ng);color:#fff;border-radius:999px;font-size:.65rem;padding:0 6px;margin-left:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .lab{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.stat .num{font-family:var(--f-head);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .num small{font-size:.9rem;color:var(--muted);font-weight:500}
.stat.main{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stat.main .lab,.stat.main .num small{color:inherit;opacity:.85}
.field-label{font-size:.8rem;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.mode button b{display:block;font-family:var(--f-head);font-size:1.02rem}
.mode button span{font-size:.78rem;color:var(--muted);line-height:1.4;display:block}
.mode button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:1rem;width:100%}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}
.row>*{flex:1}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.chip{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.75rem;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.chip.date{background:var(--sunk)}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.stem{font-size:1.05rem;font-weight:500}
.stem b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;line-height:1.6}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .n{background:var(--accent);color:var(--accent-ink)}
.res{border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--surface)}
.res.ok{background:var(--ok-soft);border-color:transparent}
.res.ng{background:var(--ng-soft);border-color:transparent}
.res .line{display:flex;gap:6px}
.res .fix{margin-top:4px;font-size:.92rem}
.res .fix b{color:var(--ng)}
.res.ok .fix{color:var(--muted)}
.res .you{font-size:.72rem;color:var(--muted);margin-left:auto;white-space:nowrap}
.verdict{font-family:var(--f-head);font-size:1.15rem;font-weight:700}
.verdict .v-ok{color:var(--ok)} .verdict .v-ng{color:var(--ng)}
.point{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:.93rem}
.point b{font-family:var(--f-head)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox button{font-family:var(--f-head);font-size:2.2rem;font-weight:700;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;cursor:pointer;line-height:1.2}
.ox button span{display:block;font-size:.8rem;font-family:var(--f-body);color:var(--muted);font-weight:500}
.term{background:linear-gradient(transparent 62%,var(--mark) 62%);border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:inherit;display:inline}
.list{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.item{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.item .meta{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}
.item .t{font-size:.93rem;line-height:1.5}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:.92rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.75rem;color:var(--muted);font-weight:500}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-left:6px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--accent)}
.chart .lbl{fill:var(--ink);font-size:10px;font-weight:700}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink)}
dl.gl{margin:0;display:flex;flex-direction:column;gap:10px}
dl.gl div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
dl.gl dt{font-family:var(--f-head);font-weight:700}
dl.gl dd{margin:2px 0 0;font-size:.92rem;color:var(--ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet h3{font-size:1.15rem;margin-bottom:6px}
.sheet p{margin:0 0 14px}
.note{font-size:.8rem;color:var(--muted)}
.twocol{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--sunk);border-radius:10px;padding:8px;text-align:center}
.mini b{display:block;font-family:var(--f-head);font-size:1.2rem;font-variant-numeric:tabular-nums}
.mini span{font-size:.72rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fade{animation:fd .2s ease-out}@keyframes fd{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div><h1>ケアマネ合格ドリル</h1><small>介護支援専門員試験 ・ 全<span id="qcount">0</span>問</small></div>
    <span class="sync" id="sync">読み込み中…</span>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="メニュー"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button data-tab="quiz"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>解く</button>
  <button data-tab="miss"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><span>間違えた<span id="missBadge"></span></span></button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>成績</button>
  <button data-tab="rank"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>ランキング</button>
  <button data-tab="words"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>用語</button>

険施設など"], "point": "新規は市町村が調査・6か月／更新は委託OK・12か月／効力は申請日から／審査会は市町村"}, {"id": "k10-30", "date": "10/30", "field": "保健医療", "topic": "認知症について", "opts": ["血管性認知症は、アルツハイマー型認知症に比べて症状が「まだら」に現れることが多い", "レビー小体型認知症では、幻視やパーキンソン症状がみられることがある", "前頭側頭型認知症は、初期から記憶障害が目立ち、人格は保たれやすい", "慢性硬膜下血腫による認知機能の低下は、治療しても改善しない", "徘徊や妄想などの行動・心理症状（BPSD）は、中核症状に含まれる"], "ans": [1, 2], "exp": ["脳梗塞などの場所によって、できること・できないことが分かれる「まだら認知症」になりやすい", "レビー小体型は幻視・パーキンソン症状・日による調子の変動が特徴", "前頭側頭型は初期は記憶障害が目立たない。人格の変化・脱抑制・常同行動が出やすい", "慢性硬膜下血腫は手術で改善が期待できる「治る認知症」（正常圧水頭症・甲状腺機能低下症も）", "BPSDは周辺症状。中核症状は記憶障害・見当識障害・判断力の低下など"], "point": "血管性＝まだら／レビー＝幻視＋パーキンソン症状／前頭側頭＝人格変化（記憶は初期に保たれる）／硬膜下血腫・水頭症は治る認知症／BPSDは周辺症状"}, {"id": "k10-31", "date": "10/31", "field": "福祉サービス", "topic": "訪問入浴介護について", "opts": ["通常、看護職員2人と介護職員1人の計3人で提供する", "利用者の身体の状況に支障がなく、主治医の意見を確認した場合は、介護職員3人で提供できる", "事業所には、訪問介護と同じようにサービス提供責任者を置かなければならない", "利用者の身体に直接ふれる浴槽などの器具は、サービスの提供ごとに消毒したものを使う", "全身入浴が難しく、清拭や部分浴に変えた場合も、所定単位数どおり算定する"], "ans": [2, 4], "exp": ["通常は看護職員1人＋介護職員2人の3人（うち1人が責任者）。介護予防訪問入浴介護は看護1人＋介護1人の2人", "身体の状況に支障がなく主治医の意見を確認すれば、介護職員3人で提供できる（介護予防なら介護職員2人）", "サービス提供責任者は訪問介護の職種。訪問入浴介護には置かない（管理者は常勤専従、兼務可）", "身体にふれる設備・器具はサービス提供ごとに消毒したものを使う", "清拭・部分浴に変えたときは所定単位数の90%で算定（10%減算）"], "point": "「看1介2（予防は看1介1）」「医師OKなら介護職員だけでも可」「サ責は訪問介護だけ」「清拭・部分浴は減算」"}, {"id": "k11-1", "date": "11/1", "field": "介護保険制度", "topic": "介護保険事業計画について", "opts": ["市町村介護保険事業計画は、市町村老人福祉計画と一体のものとして作成する", "市町村介護保険事業計画は、5年を1期として定める", "介護保険事業計画の基本指針は、都道府県知事が定める", "市町村は、市町村介護保険事業計画を定めたり変えたりするときは、あらかじめ都道府県の意見を聴かなければならない", "介護保険施設の種類ごとの必要入所定員総数は、市町村介護保険事業計画で定める"], "ans": [1, 4], "exp": ["市町村計画は市町村老人福祉計画と一体で作る", "3年を1期として定める（保険料の見直しと同じサイクル）", "基本指針は厚生労働大臣が定め、市町村・都道府県はそれに沿って計画を作る", "市町村は計画を作ったり変えたりするとき、あらかじめ都道府県の意見を聴く", "介護保険施設の必要入所定員総数は都道府県介護保険事業支援計画で定める。市町村計画で定めるのは地域密着型（認知症グループホームなど）の必要利用定員総数"], "point": "「3年1期」「指針は大臣」「施設は県、地域密着型は市町村」「老人福祉計画とは一体（地域福祉計画とは“調和”）」"}, {"id": "k11-5", "date": "11/5", "field": "保健医療", "topic": "高齢者のバイタルサインについて", "opts": ["高齢者の体温は、一般に成人に比べて低めの傾向がある", "脈拍が1分間に100回を超える状態を徐脈という", "起座呼吸は、左心不全の症状としてみられることがある", "チェーンストークス呼吸は、睡眠時無呼吸症候群だけにみられる呼吸である", "高齢者では、収縮期血圧が低下し、拡張期血圧が上昇する傾向がある"], "ans": [1, 3], "exp": ["高齢者は体温が低め。平熱が低い人の37℃台は要注意", "100回超は頻脈。徐脈は60回未満", "寝ると苦しく、座ると楽になるのが起座呼吸。左心不全のサイン", "チェーンストークス呼吸は重い心不全・脳血管障害・臨終が近いときなどにみられる", "逆。高齢者は動脈硬化で収縮期↑・拡張期↓"], "point": "頻脈100超／徐脈60未満、起座呼吸＝左心不全、高齢者の血圧は収縮期↑拡張期↓"}, {"id": "k11-6", "date": "11/6", "field": "福祉サービス", "topic": "認知症対応型共同生活介護（グループホーム）について", "opts": ["要支援1の人も利用できる", "居室は、原則として2人部屋とする", "共同生活住居（ユニット）の入居定員は5人以上9人以下である", "家賃や食材料費は、介護保険の給付対象になる", "食事などの家事は、利用者と介護従業者が共同で行うよう努める"], "ans": [3, 5], "exp": ["介護予防の対象は要支援2だけ。要支援1は使えない", "居室は原則個室（7.43㎡以上）", "1ユニット5〜9人、1事業所は1〜3ユニット", "家賃・食材料費・光熱水費などは自己負担（保険給付外）", "家事を一緒にするのも認知症ケアの一部"], "point": "要支援2から／5〜9人・1〜3ユニット／原則個室／家賃・食費は自己負担／地域密着型なので原則その市町村の住民だけ"}, {"id": "k11-7", "date": "11/7", "field": "介護保険制度", "topic": "住所地特例について", "opts": ["住所地特例の対象者は、入所した施設がある市町村の被保険者になる", "特定施設に該当する有料老人ホームは、住所地特例の対象施設に含まれる", "認知症対応型共同生活介護（グループホーム）は、住所地特例の対象施設である", "住所地特例の適用を受けている人は、施設がある市町村が行う地域支援事業を利用できる", "A市の自宅からB市の施設に入り、その後C市の施設に移った場合、住所地特例は適用されなくなる"], "ans": [2, 4], "exp": ["施設のある市町村ではなく、もとの住所地（入所前）の市町村の被保険者のまま", "対象施設＝介護保険施設・特定施設（有料老人ホーム、軽費老人ホーム、有料老人ホームに当たるサ高住）・養護老人ホーム", "グループホームなど地域密着型サービスの事業所は対象外（入居すると所在地の市町村の被保険者になる）", "2015年4月から、施設所在地の市町村の地域支援事業や地域密着型サービスを利用できる", "施設を移り続けても（連続入所）、最初の自宅があったA市が保険者のまま"], "point": "「保険者はもとの市町村」「地域密着型（グループホーム等）は対象外」「連続入所でも最初の市町村」「地域支援事業は所在地の市町村で使える」"}, {"id": "k11-8", "date": "11/8", "field": "保健医療", "topic": "高齢者の薬について", "opts": ["高齢者は体内の水分量が増えるため、水溶性の薬の血中濃度は低くなりやすい", "錠剤が飲みにくいときは、自己判断でつぶしたり粉にしたりしてよい", "高齢者は腎機能が低下しているため、薬の副作用が出やすい", "服薬後に気になる症状があっても、医師の指示がなければ報告する必要はない", "複数の医療機関から薬が出ている場合は、お薬手帳などで一元的に管理するのが望ましい"], "ans": [3, 5], "exp": ["高齢者は体内の水分量が減るので、水溶性の薬は血中濃度が上がりやすい（脂肪は増えるので、脂溶性の薬は体にたまりやすい）", "徐放剤や腸溶剤など、つぶすと効き方が変わる薬がある。医師・薬剤師に相談する", "腎機能・肝機能が低下して薬が体に残りやすく、副作用が出やすい", "ふらつき・食欲低下などに気づいたら、すぐ医師・薬剤師に報告する", "お薬手帳やかかりつけ薬局でまとめて管理し、重複や飲み合わせを防ぐ"], "point": "「水分↓→水溶性の薬の濃度↑」「腎・肝機能↓→副作用↑」「勝手につぶさない」"}, {"id": "k11-9", "date": "11/9", "field": "福祉サービス", "topic": "成年後見制度について", "opts": ["成年後見人には、本人の手術などの医療行為に同意する権限がある", "法定後見には、後見・保佐・補助の3つの類型がある", "任意後見契約は、公正証書でなくても書面で結べば有効である", "成年後見人が本人の居住用不動産を売却するには、家庭裁判所の許可が必要である", "市町村長は、後見開始の審判を申し立てることができない"], "ans": [2, 4], "exp": ["医療行為への同意権はない（後見人の仕事は財産管理と、介護契約などの身上保護。手術の同意は原則家族など）", "判断能力の程度で、後見（欠く）・保佐（著しく不十分）・補助（不十分）の3類型", "任意後見契約は公正証書で結ぶ必要がある。家庭裁判所が任意後見監督人を選任して効力が生じる", "居住用不動産の売却・賃貸・抵当権設定などは家庭裁判所の許可が必要（許可なしは無効）", "身寄りがない人などのため、市町村長も申立てできる（老人福祉法など）"], "point": "「医療同意はNG」「任意後見は公正証書」「居住用不動産は家裁の許可」「市町村長申立てOK」"}, {"id": "k11-10", "date": "11/10", "field": "介護保険制度", "topic": "介護保険審査会について", "opts": ["保険料に関する処分も審査請求の対象となる", "市町村に設置される", "審査請求は、処分があったことを知った日の翌日から60日以内にしなければならない", "審査請求をしなくても、処分の取消しの訴えを直接裁判所に起こせる", "要介護認定に関する処分の審査請求は、公益代表委員で構成される合議体で扱う"], "ans": [1, 5], "exp": ["保険給付に関する処分（要介護認定を含む）と、保険料などの徴収金に関する処分が審査請求の対象", "設置は都道府県。市町村の処分を外からチェックする立場", "60日ではなく3か月以内（処分を知った日の翌日から起算）", "審査請求の裁決を経た後でないと取消訴訟は起こせない（審査請求前置）", "要介護認定の審査請求は公益代表委員の合議体。それ以外の処分は被保険者・市町村・公益の3者代表の合議体"], "point": "「都道府県に設置・3か月以内・裁決が出てから訴訟」。委員は都道府県知事が任命、会長は公益代表委員から選挙。"}, {"id": "k11-11", "date": "11/11", "field": "保健医療", "topic": "訪問看護について", "opts": ["訪問看護事業所の管理者は、医師でなければならない", "訪問看護は、主治の医師が交付した訪問看護指示書に基づいて行われる", "急性増悪時に特別訪問看護指示書が出された場合の訪問看護は、介護保険から給付される", "理学療法士は、訪問看護を行うことはできない", "末期の悪性腫瘍の利用者に対する訪問看護は、医療保険から給付される"], "ans": [2, 5], "exp": ["管理者は原則として保健師か看護師", "主治医の訪問看護指示書が必要", "特別訪問看護指示書の期間は医療保険（原則月1回・14日間まで）", "訪問看護ステーションのPT・OT・STも訪問看護としてリハビリができる", "末期の悪性腫瘍など厚生労働大臣が定める疾病等は医療保険"], "point": "要介護者は介護保険が優先。ただし「末期がん等の厚労大臣が定める疾病等」と「特別指示書の期間」は医療保険。"}, {"id": "k11-12", "date": "11/12", "field": "福祉サービス", "topic": "高齢者虐待防止法について", "opts": ["養護者による虐待を受けたと思われる高齢者を発見した者は、その高齢者の生命・身体に重大な危険が生じている場合、市町村に通報しなければならない", "この法律でいう「高齢者」とは、70歳以上の者をいう", "養介護施設従事者等は、自分が働く施設で虐待を受けたと思われる高齢者を発見したときは、市町村に通報しなければならない", "高齢者虐待の種類は、身体的・心理的・性的・経済的虐待の4つである", "通報を受けた市町村は、必要があっても高齢者の住所に立入調査を行うことはできない"], "ans": [1, 3], "exp": ["養護者による虐待は、生命・身体に重大な危険があれば通報義務（それ以外は努力義務）", "高齢者は65歳以上", "施設職員が自分の施設で発見した場合は、重大な危険がなくても通報義務", "種類は5つ。身体的・心理的・性的・経済的＋介護等放棄（ネグレクト）", "市町村長は地域包括支援センター職員などに立入調査をさせられる（警察署長に援助を求めることもできる）"], "point": "虐待は「身・心・性・経・放棄」の5つ。施設職員の通報は常に義務、養護者による虐待の通報は重大な危険があれば義務。"}, {"id": "k11-13", "date": "11/13", "field": "福祉サービス", "topic": "短期入所生活介護について", "opts": ["短期入所生活介護計画は、利用期間にかかわらず介護支援専門員が作成しなければならない", "事業所には、単独型・併設型・空床利用型がある", "災害などやむを得ない事情があっても、利用定員を超えて受け入れることはできない", "短期入所生活介護では、利用者の送迎を行うことはできない", "連続して30日を超えて利用した場合、30日を超えた日以降は保険給付の対象にならない"], "ans": [2, 5], "exp": ["計画を作るのは事業所の管理者で、おおむね4日以上続けて利用する場合に作成。ケアマネ（居宅の介護支援専門員）ではない", "単独型・併設型・空床利用型（特養の空きベッドを使う）がある", "災害・虐待などやむを得ない事情があれば、定員を超えて受け入れられる", "送迎は行える（送迎加算あり）", "連続30日を超えた日以降は保険給付の対象外（全額自己負担）"], "point": "「計画は管理者（4日以上）」「連続30日まで」「やむを得なければ定員超えOK」「単独型・併設型・空床利用型」"}, {"id": "k11-14", "date": "11/14", "field": "保健医療", "topic": "高齢者の糖尿病について", "opts": ["高齢者の糖尿病では、口渇・多飲・多尿などの典型的な症状が出にくい", "高齢者の低血糖は、冷や汗や動悸などの典型的な症状が出にくく、意識障害やふらつきで気づかれることがある", "インスリン注射をしている人が、シックデイ（発熱・下痢などの体調不良）で食事がとれないときは、自己判断でインスリンを中止してよい", "高齢者の血糖コントロール目標（HbA1c）は、若い人より必ず厳しく設定する", "糖尿病の三大合併症は、網膜症・腎症・脳梗塞である"], "ans": [1, 2], "exp": ["のどの渇き・多飲・多尿が出にくく、気づかないうちに高血糖や脱水が進むことがある", "冷や汗・動悸が出にくく、元気がない・ふらつく・ぼーっとするで気づくことも。認知症とまちがわれやすい", "シックデイでも自己判断でインスリンをやめない。水分をとり、早めに主治医に相談する", "高齢者は低血糖を防ぐため、目標はゆるめに個別に設定する", "三大合併症は網膜症・腎症・神経障害。脳梗塞は大血管の合併症"], "point": "三大合併症は「しめじ」（神経・目・腎臓）。高齢者は高血糖も低血糖も症状が出にくい。シックデイは自己判断で中止しない。"}, {"id": "k11-15", "date": "11/15", "field": "介護保険制度", "topic": "区分支給限度基準額について", "opts": ["区分支給限度基準額は、都道府県知事が定める", "市町村は、条例で、厚生労働大臣が定める額を上回る額を区分支給限度基準額とすることができる", "居宅療養管理指導は、区分支給限度基準額の対象となる", "居宅介護福祉用具購入費の支給限度基準額は、同一年度で10万円である", "居宅介護住宅改修費の支給限度基準額は、要介護状態区分ごとに異なる"], "ans": [2, 4], "exp": ["定めるのは厚生労働大臣", "市町村は条例で上乗せできる（財源は第1号保険料）", "居宅療養管理指導は限度額の対象外", "福祉用具購入費は同一年度（4/1〜3/31）で10万円", "住宅改修費は要介護度に関係なく一律20万円。要介護度が3段階以上上がったときや転居したときは、もう一度20万円使える"], "point": "限度額は大臣が決めて、市町村は上乗せOK。枠の外は居宅療養管理指導、特定施設・グループホーム（短期利用を除く）など。購入費は年10万、住宅改修は一律20万（3段階アップか転居でリセット）。"}, {"id": "k11-17", "date": "11/17", "field": "福祉サービス", "topic": "通所介護について", "opts": ["利用定員が19人以上の事業所は、地域密着型通所介護に該当する", "既に居宅サービス計画が作成されている場合は、通所介護計画はその内容に沿って作成しなければならない", "食事の提供に要する費用は、保険給付の対象となる", "送迎時に行った居宅内での介助等は、一定の要件を満たせば、1日30分以内を限度に通所介護の所要時間に含めることができる", "通所介護計画は、生活相談員が作成しなければならない"], "ans": [2, 4], "exp": ["地域密着型通所介護は利用定員18人以下（市町村が指定）", "ケアプランが先。通所介護計画はその内容に沿って作る", "食費は保険給付の対象外（利用者負担）。おむつ代なども自己負担", "着替えやベッドへの移乗などの居宅内介助。介護福祉士などが行う場合、1日30分以内なら所要時間に含められる", "通所介護計画を作るのは管理者（生活相談員などに作らせることはできるが、責任は管理者）"], "point": "18人以下＝地域密着型。計画を作るのは管理者。食費・おむつ代は自己負担。送迎時の居宅内介助は30分以内なら時間に含められる。"}, {"id": "k11-18", "date": "11/18", "field": "保健医療", "topic": "ターミナルケア（看取り）について", "opts": ["臨終が近づくと、チェーン・ストークス呼吸や下顎呼吸がみられることがある", "聴覚は最期まで比較的保たれるとされるため、意識が低下していても声かけを続けることが大切である", "死亡診断書は、医師のほか看護師も作成することができる", "在宅で亡くなった場合、死亡前24時間以内に医師の診察を受けていなければ、必ず警察に届け出なければならない", "本人の意思が確認できない場合は、家族の希望だけで治療方針を決めてよい"], "ans": [1, 2], "exp": ["呼吸が浅い・深いをくり返すチェーン・ストークス呼吸や、あごだけで呼吸する下顎呼吸は臨終が近いサイン", "聴覚は最期まで残るとされる。家族にも話しかけてもらうよう伝える", "死亡診断書を作成できるのは医師だけ（ICTを使った看取りでも、看護師は情報を医師に伝えるだけ）", "24時間を過ぎていても、診察中の病気で亡くなったと医師が判断できれば死亡診断書を書ける。警察に届けるのは異状死のとき", "本人の推定意思を尊重し、家族や医療・ケアチームで話し合って決める（ACP＝人生会議）"], "point": "死亡診断書は医師だけ。「24時間たったら警察」は誤解。聴覚は最期まで残る。本人の意思（推定意思）が中心。"}, {"id": "k11-19", "date": "11/19", "field": "介護保険制度", "topic": "第1号被保険者の保険料について", "opts": ["保険料率は市町村が条例で定め、おおむね5年を通じて財政の均衡を保つように設定する。", "年額18万円以上の老齢・退職年金などを受けている人は、原則として特別徴収（年金から天引き）になる。", "普通徴収の場合、世帯主と配偶者は保険料を連帯して納付する義務がある。", "所得段階別の保険料は、国の標準では9段階となっている。", "第1号被保険者の保険料は、医療保険者が医療保険料と一体的に徴収する。"], "ans": [2, 3], "exp": ["5年ではなく3年。介護保険事業計画と同じ3年1期で見直す", "障害・遺族年金も対象。年額18万円未満は普通徴収", "普通徴収では世帯主・配偶者に連帯納付義務がある", "2024年度から標準13段階（以前は9段階）", "これは第2号被保険者の話。医療保険者が徴収して社会保険診療報酬支払基金に納付する"], "point": "第1号＝市町村が徴収（年金18万円以上は天引き）、第2号＝医療保険者が徴収→支払基金へ。保険料率は3年ごと、標準13段階"}, {"id": "k11-20", "date": "11/20", "field": "福祉サービス", "topic": "生活保護制度について", "opts": ["介護扶助は、原則として金銭給付によって行われる。", "65歳以上の被保護者の介護保険料は、生活扶助に加算されて支給される。", "生活保護は、個人を単位として保護の要否や程度を定めるのが原則である。", "40歳以上65歳未満で医療保険に加入していない被保護者の介護サービス費用は、全額が介護扶助から給付される。", "生活保護の扶助は、生活扶助・医療扶助・介護扶助など全部で7種類である。"], "ans": [2, 4], "exp": ["金銭給付ではなく現物給付（介護券で事業所に支払われる）", "「介護保険料加算」として生活扶助に上乗せされる", "個人ではなく世帯単位（世帯単位の原則。例外として世帯分離あり）", "医療保険未加入だと第2号被保険者にならないので、10割介護扶助", "7種類ではなく8種類（生活・教育・住宅・医療・介護・出産・生業・葬祭）"], "point": "介護扶助＝現物給付、単位は世帯、扶助は8種類。65歳以上の被保護者は介護保険9割＋介護扶助1割、40〜64歳で医療保険なしは全額介護扶助"}, {"id": "k11-21", "date": "11/21", "field": "保健医療", "topic": "高齢者の骨粗鬆症・骨折について", "opts": ["骨粗鬆症は、男性に多くみられる。", "脊椎圧迫骨折は、尻もちなどの軽い外力でも起こることがある。", "骨粗鬆症の予防のためには、日光浴を避けることが望ましい。", "骨粗鬆症は、骨折する前から強い痛みを伴うことが多い。", "大腿骨頸部骨折は転倒によって起こることが多く、寝たきりの原因となりやすい。"], "ans": [2, 5], "exp": ["男性ではなく女性（特に閉経後。エストロゲンの減少で骨がもろくなる）", "軽い外力でも起き、気づかないうちに背中が丸くなることも", "日光浴はビタミンDを作りカルシウムの吸収を助けるので、適度に行うのがよい", "骨折するまで自覚症状はほとんどない", "転倒が主な原因で寝たきりにつながりやすい。転倒予防が大事"], "point": "骨粗鬆症は閉経後の女性に多く、骨折するまで症状がない。予防はカルシウム・ビタミンD・日光浴・運動。高齢者に多い骨折は大腿骨頸部・脊椎圧迫・橈骨遠位端・上腕骨近位端。"}, {"id": "k11-22", "date": "11/22", "field": "介護保険制度", "topic": "介護保険の利用者負担について", "opts": ["第2号被保険者の利用者負担は、所得に応じて1割〜3割である。", "居宅介護支援（ケアプランの作成）には利用者負担がない。", "高額介護サービス費は、年単位で負担上限額を超えた分が支給される。", "特定入所者介護サービス費（補足給付）は、通所介護の食費も対象となる。", "福祉用具購入費や住宅改修費の自己負担は、高額介護サービス費の対象とならない。"], "ans": [2, 5], "exp": ["第2号被保険者は所得にかかわらず一律1割。2割・3割があるのは第1号被保険者だけ", "ケアマネジメントは10割給付で自己負担なし", "年単位ではなく月単位。年単位（8月〜翌7月）で医療と合算するのは高額医療合算介護サービス費", "補足給付の対象は施設サービスと短期入所の食費・居住費。通所介護の食費は対象外", "福祉用具購入費・住宅改修費の自己負担、食費・居住費・日常生活費は高額介護サービス費の対象外"], "point": "2割・3割は第1号だけ（第2号は一律1割）。高額介護サービス費は月単位、医療と合算は年単位。補足給付は施設＋ショートだけ"}, {"id": "k11-23", "date": "11/23", "field": "介護保険制度", "topic": "介護保険の財政について", "opts": ["財政安定化基金は、市町村に設置される。", "調整交付金は、国の負担分の中から市町村に交付される。", "第2号被保険者の保険料は、市町村が普通徴収で直接徴収する。", "施設等給付費における国の負担割合は25%である。", "介護給付費（利用者負担を除く）の財源は、公費50%・保険料50%である。"], "ans": [2, 5], "exp": ["市町村ではなく都道府県に設置。財源は国・都道府県・市町村で1/3ずつ", "国の負担25%のうち5%相当が調整交付金", "第2号の保険料は医療保険者が医療保険料と一緒に徴収し、社会保険診療報酬支払基金を通して市町村へ交付", "施設等給付費の国の負担は20%（都道府県17.5%・市町村12.5%）。居宅給付費は国25%・都道府県12.5%", "保険料50%の内訳は第1号23%・第2号27%（3年ごとに見直し）"], "point": "基金＝都道府県、第2号の保険料＝医療保険者、施設は国20%"}, {"id": "k11-24", "date": "11/24", "field": "福祉サービス", "topic": "定期巡回・随時対応型訪問介護看護について", "opts": ["要支援者も利用できる。", "介護・医療連携推進会議を、おおむね6か月に1回以上開催しなければならない。", "一体型の事業所では、訪問看護サービスも同じ事業所が提供する。", "夜間の時間帯だけ提供するサービスである。", "定期巡回・随時対応型訪問介護看護計画は、居宅サービス計画を作成した介護支援専門員が作成する。"], "ans": [2, 3], "exp": ["要介護者のみ（要支援者向けの予防給付はない）", "介護・医療連携推進会議はおおむね6か月に1回以上", "一体型は同じ事業所が訪問看護も提供。連携型は外部の訪問看護事業所と連携", "24時間（日中・夜間とも）提供する。夜間だけなのは夜間対応型訪問介護", "計画を作るのは計画作成責任者（看護師・介護福祉士など）。ケアプランの内容に沿って作る"], "point": "要介護のみ・24時間・一体型／連携型・会議は6か月に1回、計画は計画作成責任者"}, {"field": "介護保険制度", "topic": "介護保険の保険給付について", "opts": ["市町村特別給付の財源は、原則として第1号被保険者の保険料である。", "予防給付には、施設サービスが含まれる。", "居宅介護サービス費は、法定代理受領により現物給付化することができる。", "高額介護サービス費にあたる給付は、予防給付にはない。", "住宅改修費は、事業者に直接支払う現物給付が原則である。"], "ans": [1, 3], "exp": ["市町村が条例で独自に行う給付（配食・移送など）。財源は第1号保険料", "施設サービスは介護給付だけ。要支援者は施設に入所できない", "事業者が利用者の代わりに保険給付を受け取るので、利用者は自己負担分だけ払えばよい", "予防給付にも「高額介護予防サービス費」がある", "住宅改修費・福祉用具購入費は償還払い（いったん全額払って後から戻る）が原則。受領委任払いの市町村もある"], "point": "施設は介護給付のみ／特別給付は第1号保険料／住宅改修・福祉用具購入は償還払いが原則", "id": "n01", "date": "新作"}, {"field": "介護保険制度", "topic": "介護予防・日常生活支援総合事業について", "opts": ["介護予防・生活支援サービス事業の対象には、基本チェックリストで該当した事業対象者が含まれる。", "総合事業は、都道府県が実施する。", "一般介護予防事業は、要支援者だけが利用できる。", "介護予防ケアマネジメントは、地域包括支援センターが行う。", "訪問型サービスと通所型サービスは、全国一律の基準・単価で行われる。"], "ans": [1, 4], "exp": ["要支援1・2の人と、基本チェックリストで該当した「事業対象者」が対象", "実施するのは市町村", "一般介護予防事業は、すべての第1号被保険者とその支援のための活動にかかわる人が対象", "地域包括支援センターが行う（居宅介護支援事業者に一部委託もできる）", "基準や単価は市町村が地域の実情に合わせて決める"], "point": "総合事業は市町村／事業対象者＝基本チェックリスト該当者／一般介護予防は65歳以上みんな", "id": "n02", "date": "新作"}, {"field": "介護保険制度", "topic": "指定居宅介護支援の運営基準について", "opts": ["モニタリングの結果は、少なくとも1か月に1回記録しなければならない。", "作成した居宅サービス計画は、利用者と担当者に交付しなければならない。", "居宅サービス計画の原案は、利用者の同意を得なくても確定できる。", "居宅サービス計画に福祉用具貸与を位置づけるときは、必要な理由を書かなくてよい。", "サービス担当者会議には、利用者や家族は参加できない。"], "ans": [1, 2], "exp": ["モニタリングの結果は少なくとも月1回記録する", "利用者と、サービスを担当する事業者（担当者）の両方に交付する", "原案は利用者や家族に説明し、文書で同意を得てから確定する", "福祉用具貸与を位置づけるときは、必要な理由をケアプランに記載する", "利用者・家族も参加するのが原則"], "point": "同意は文書で／計画は利用者と担当者に交付／モニタリング記録は月1回以上", "id": "n03", "date": "新作"}, {"field": "介護保険制度", "topic": "介護サービス情報の公表について", "opts": ["介護サービス事業者は、介護サービス情報を都道府県知事に報告しなければならない。", "報告された情報の公表は、市町村長が行う。", "都道府県知事は、報告の内容について必要に応じて調査できる。", "公表の対象は、介護保険施設だけである。", "報告は任意なので、報告しなくても何も起こらない。"], "ans": [1, 3], "exp": ["サービス提供を始めるときなどに、都道府県知事へ報告する義務がある", "公表するのは都道府県知事", "報告の内容を確認するため、必要なら調査できる", "居宅サービス事業者なども含め、幅広い事業者が対象", "報告しないと都道府県知事が命令でき、従わないと指定の取消しなどもありうる"], "point": "報告も公表も都道府県知事／報告は義務", "id": "n04", "date": "新作"}, {"field": "保健医療", "topic": "脳卒中について", "opts": ["脳梗塞の再発予防には、高血圧の管理が大切である。", "左の大脳半球が障害されると、左半身にまひが出やすい。", "失語症は、多くの場合、右の大脳半球の障害で起こる。", "右の大脳半球の障害では、左側を見落とす半側空間無視が起こりやすい。", "くも膜下出血は、脳の細い血管が詰まって起こることが多い。"], "ans": [1, 4], "exp": ["高血圧は脳梗塞・脳出血どちらにも大きな危険因子", "まひは障害された側と反対側に出る。左半球なら右半身", "言葉の中枢は多くの人で左半球にあるので、失語症は左半球の障害で起こりやすい", "右半球の障害で左側の空間に気づかなくなることが多い", "くも膜下出血の多くは脳動脈瘤の破裂。血管が詰まるのは脳梗塞"], "point": "まひは反対側／失語は左半球／左の見落とし（半側空間無視）は右半球", "id": "n05", "date": "新作"}, {"field": "保健医療", "topic": "高齢者の脱水について", "opts": ["高齢者は体内の水分量が若い人より多いので、脱水になりにくい。", "高齢者はのどの渇きを感じにくい。", "脱水になると、皮膚や口の中が乾燥しやすい。", "利尿薬を飲んでいる人は、脱水になりにくい。", "脱水の予防には、のどが渇いてから一度にたくさん飲むのがよい。"], "ans": [2, 3], "exp": ["高齢者は体内の水分量が少なく、脱水になりやすい", "渇きを感じにくいので、時間を決めて飲むなどの工夫がいる", "皮膚や舌、わきの下の乾燥はサイン", "利尿薬で尿が増えるので、脱水になりやすい", "のどが渇く前に、こまめに少しずつ飲む"], "point": "水分量が少ない・渇きを感じにくい・利尿薬は要注意→こまめに水分補給", "id": "n06", "date": "新作"}, {"field": "保健医療", "topic": "在宅酸素療法について", "opts": ["酸素を吸っているときは、火気から2m以上離れる。", "息苦しいときは、本人の判断で酸素の流量を自由に上げてよい。", "在宅酸素療法を受けている人は、外出や旅行ができない。", "慢性閉塞性肺疾患（COPD）は、在宅酸素療法の主な対象となる病気のひとつである。", "酸素濃縮装置は、身体障害者手帳がないと使えない。"], "ans": [1, 4], "exp": ["酸素は燃焼を助けるので、火気から2m以上離れる", "流量は医師の指示どおり。勝手に上げるとCO2ナルコーシスを起こすことがある", "携帯用の酸素ボンベを使えば外出も旅行もできる", "COPDは在宅酸素療法の代表的な対象", "医療保険で利用できる。手帳は必要ない"], "point": "火気から2m／流量は医師の指示どおり／携帯ボンベで外出OK", "id": "n07", "date": "新作"}, {"field": "保健医療", "topic": "高齢者のうつ病について", "opts": ["高齢者のうつ病は、気分の落ち込みより、体の不調の訴えが目立つことが多い。", "うつ病が認知症とまちがえられることはない。", "うつ病の人は、励ますほど早く回復するので、積極的に励ますとよい。", "配偶者との死別や退職などの喪失体験が、きっかけになることがある。", "抗うつ薬は、飲み始めてすぐに効果が出る。"], "ans": [1, 4], "exp": ["頭痛・食欲不振・不眠など体の症状として出やすい", "もの忘れや反応の鈍さから認知症のように見えることがある（仮性認知症）", "励ましはかえって負担になる。休養をすすめ、気持ちを受けとめる", "死別・退職・病気などの喪失体験が引き金になりやすい", "効果が出るまで数週間かかることが多い。自己判断でやめない"], "point": "体の訴えが多い／仮性認知症／励まさない／喪失体験がきっかけ", "id": "n08", "date": "新作"}, {"field": "福祉サービス", "topic": "介護老人福祉施設（特別養護老人ホーム）について", "opts": ["新規入所は、原則として要介護3以上の人が対象である。", "入所定員が29人以下のものも、介護老人福祉施設として都道府県知事が指定する。", "医師は配置しなくてよい。", "要介護1・2でも、やむを得ない事情があれば特例的に入所できる。", "入所者の食費と居住費は、介護保険から全額給付される。"], "ans": [1, 4], "exp": ["2015年4月から、新規入所は原則要介護3以上", "29人以下は地域密着型介護老人福祉施設で、市町村長が指定する", "入所者の健康管理に必要な数の医師を置く（非常勤でもよい）", "認知症や虐待のおそれなど、やむを得ない事情があれば特例入所できる", "食費・居住費は自己負担。所得が低い人は補足給付（特定入所者介護サービス費）で軽くなる"], "point": "原則要介護3以上（特例あり）／29人以下は地域密着型／食費・居住費は自己負担", "id": "n09", "date": "新作"}, {"field": "福祉サービス", "topic": "夜間対応型訪問介護について", "opts": ["要支援者も利用できる。", "夜間の定期的な巡回訪問と、通報による随時訪問を組み合わせたサービスである。", "地域密着型サービスであり、市町村長が指定する。", "日中も含めて24時間提供しなければならない。", "オペレーションセンターは、どの事業所でも必ず設置しなければならない。"], "ans": [2, 3], "exp": ["要介護者のみ。予防給付はない", "定期巡回サービスと随時訪問サービスを組み合わせる", "地域密着型サービスなので市町村長が指定", "夜間（22時〜翌6時を必ず含む時間帯）に行うサービス。24時間は定期巡回・随時対応型訪問介護看護", "条件を満たせば、オペレーションセンターを置かない事業所もある"], "point": "要介護のみ・夜間・地域密着型。24時間なら定期巡回・随時対応型", "id": "n10", "date": "新作"}, {"field": "福祉サービス", "topic": "介護保険と障害福祉サービスの関係について", "opts": ["同じようなサービスがある場合、原則として介護保険のサービスが優先される。", "65歳になった障害者は、障害福祉サービスを一切利用できなくなる。", "障害福祉サービスを利用するには、介護保険の要介護認定が必要である。", "共生型サービスは、介護保険と障害福祉の両方の指定を受けやすくする仕組みである。", "障害者支援施設の入所者は、介護保険の被保険者になる。"], "ans": [1, 4], "exp": ["介護保険優先の原則。ただし一律ではなく個別に判断する", "介護保険にないサービス（同行援護・行動援護など）は引き続き使える", "障害福祉サービスで使うのは障害支援区分", "同じ事業所で高齢者と障害者がサービスを受けやすくするため、2018年度にできた", "障害者支援施設などの入所者は適用除外で、介護保険の被保険者にならない"], "point": "介護保険優先／障害福祉は障害支援区分／共生型サービス／障害者支援施設は適用除外", "id": "n11", "date": "新作"}, {"field": "福祉サービス", "topic": "介護保険の住宅改修について", "opts": ["手すりの取付けは、住宅改修費の支給対象である。", "支給限度基準額は、要介護度によって異なる。", "原則として、工事の前に市町村へ申請する必要がある。", "階段昇降機の設置は、住宅改修の対象になる。", "洋式便器から和式便器への取替えも対象になる。"], "ans": [1, 3], "exp": ["手すり・段差解消・滑り防止の床材変更・引き戸などへの扉の取替え・洋式便器への取替えが対象", "要介護度に関係なく一律20万円（要支援も同じ）", "事前申請が原則。必要な書類に住宅改修が必要な理由書がある", "昇降機やリフトなど動力で動くものは対象外", "対象は和式から洋式への取替え"], "point": "一律20万円／事前申請／動力のある設備は対象外", "id": "n12", "date": "新作"}, {"field": "福祉サービス", "topic": "介護老人保健施設について", "opts": ["在宅復帰をめざして、リハビリテーションなどを行う施設である。", "医師は配置しなくてよい。", "開設には、都道府県知事の許可が必要である。", "要支援者も入所できる。", "医療は一切行うことができない。"], "ans": [1, 3], "exp": ["看護・医学的管理のもとで介護や機能訓練を行い、在宅復帰をめざす", "常勤の医師を1人以上置く", "特養は「指定」、老健と介護医療院は都道府県知事の「許可」", "入所できるのは要介護者だけ", "医師がいて、必要な医療も行う"], "point": "在宅復帰／常勤医師あり／開設は都道府県知事の許可", "id": "n13", "date": "新作"}, {"id": "a001", "date": "新作", "field": "介護保険制度", "topic": "被保険者の資格の取得と喪失", "opts": ["資格取得の届出は、本人が都道府県に行う。", "第2号被保険者が医療保険の加入者でなくなった場合、その翌日に資格を喪失する。", "他の市町村から転入した場合、転入した日の翌日に資格を取得する。", "医療保険の加入者が40歳に達したとき、第2号被保険者の資格を取得する。", "第1号被保険者の資格は、65歳に達した日（誕生日の前日）に取得する。"], "ans": [4, 5], "exp": ["届出先は市町村（世帯主が代わりに届け出てもよい）", "医療保険の加入者でなくなった当日に喪失する。死亡・転出は翌日に喪失", "転入した当日に取得する", "40歳に達した日（誕生日の前日）に取得", "年齢は誕生日の前日に達するとされる"], "point": "取得は当日、喪失は「死亡・転出は翌日」「医療保険をぬけたら当日」"}, {"id": "a002", "date": "新作", "field": "介護保険制度", "topic": "介護保険の適用除外について", "opts": ["医療型障害児入所施設の入所者は、適用除外となる。", "介護老人福祉施設の入所者は、適用除外となる。", "適用除外施設の入所者も、介護保険料を納めなければならない。", "有料老人ホームの入居者は、適用除外となる。", "障害者支援施設に入所して生活介護と施設入所支援を受けている人は、介護保険の被保険者とならない。"], "ans": [1, 5], "exp": ["適用除外施設のひとつ", "特養は介護保険施設。適用除外ではない", "被保険者ではないので保険料はかからない", "有料老人ホームは適用除外ではない", "障害福祉側で介護が受けられるため適用除外"], "point": "適用除外＝障害者支援施設・医療型障害児入所施設など。介護保険施設や有料老人ホームはちがう"}, {"id": "a003", "date": "新作", "field": "介護保険制度", "topic": "介護保険の被保険者証について", "opts": ["資格を失っても、被保険者証を返す必要はない。", "第2号被保険者には、全員に被保険者証が交付される。", "被保険者証は、都道府県が交付する。", "要介護認定の申請をするときは、被保険者証を添付する。", "第1号被保険者には、全員に被保険者証が交付される。"], "ans": [4, 5], "exp": ["資格を失ったら返還する", "第2号は要介護認定を申請した人と、交付を求めた人にだけ交付", "交付するのは市町村", "第2号でまだ証がない人は医療保険の被保険者証などを提示する", "65歳になると全員に交付される"], "point": "第1号は全員、第2号は申請した人だけに交付"}, {"id": "a004", "date": "新作", "field": "介護保険制度", "topic": "要介護認定の申請と調査について", "opts": ["認定調査の基本調査の結果は、要介護認定等基準時間の推計に使われる。", "市町村は、申請日から原則60日以内に認定しなければならない。", "介護認定審査会では、申請者の主治医が委員として審査する。", "主治医がいない場合は、医師の意見なしで認定が行われる。", "要介護認定の申請は、成年後見人が本人に代わって行うことができる。"], "ans": [1, 5], "exp": ["コンピュータによる一次判定に使う", "原則30日以内", "主治医が審査会の委員として審査するしくみではない", "主治医がいなければ、市町村が指定する医師などの診断を受けさせる", "成年後見人や家族は代理で申請できる"], "point": "代理申請OK・一次判定は基準時間・認定は原則30日以内"}, {"id": "a005", "date": "新作", "field": "介護保険制度", "topic": "要介護認定の有効期間について", "opts": ["更新認定の有効期間は、原則12か月である。", "有効期間が過ぎてから更新を申請した場合は、理由を問わず認められる。", "更新の申請は、有効期間満了日の30日前から行える。", "更新認定の有効期間の上限は、24か月である。", "区分変更申請による認定の有効期間は、原則6か月である。"], "ans": [1, 5], "exp": ["更新は原則12か月", "やむを得ない理由があるときだけ、満了後1か月以内なら申請できる", "更新申請は満了日の60日前からできる", "上限は36か月。前回と要介護度が同じなら48か月まで", "区分変更は新規と同じく原則6か月（3〜12か月で設定可）"], "point": "新規・区分変更は6か月、更新は12か月（最長36〜48か月）、更新申請は60日前から"}, {"id": "a006", "date": "新作", "field": "介護保険制度", "topic": "保険給付の制限について", "opts": ["保険料を1年以上滞納した第1号被保険者は、償還払いに切り替えられることがある。", "刑事施設に拘禁されている期間は、介護給付は行われない。", "保険料を長く滞納して時効で消えた期間があっても、給付率が下がることはない。", "故意の犯罪行為で要介護状態になった人には、給付の全部または一部を行わないことができる。", "正当な理由なく市町村の求める書類の提出に応じなくても、給付は制限されない。"], "ans": [1, 2, 4], "exp": ["1年以上の滞納で支払方法の変更（償還払い化）", "拘禁中は給付されない", "時効で消えた期間に応じて、給付率が7割（または6割）に下がる", "給付制限の対象", "給付の全部または一部が制限されることがある"], "point": "滞納は「1年→償還払い」「1年6か月→一時差止め」「時効消滅→給付率引下げ」"}, {"id": "a007", "date": "新作", "field": "介護保険制度", "topic": "第三者行為と不正利得について", "opts": ["保険給付として受け取ったお金には、税金がかかる。", "偽りその他不正な手段で保険給付を受けた人から、市町村はその給付額の全部または一部を徴収できる。", "交通事故など第三者の行為で要介護状態になった場合、市町村は給付した額の範囲で損害賠償請求権を取得する。", "不正に介護報酬を受けた事業者に、加算金が課されることはない。", "保険給付を受ける権利は、ほかの人に譲り渡すことができる。"], "ans": [2, 3], "exp": ["租税その他の公課は課されない", "不正利得の徴収", "市町村が加害者に請求できるようになる", "返還額に加えて40%を上乗せして徴収できる", "譲渡・担保・差押えは禁止"], "point": "給付の権利は譲渡・差押え禁止、非課税。不正な事業者は40%加算"}, {"id": "a008", "date": "新作", "field": "介護保険制度", "topic": "介護保険の時効について", "opts": ["保険料を徴収する権利は、2年で時効になる。", "保険給付を受ける権利は、5年で時効になる。", "保険料を滞納しても、市町村は督促を行わない。", "時効で消えた期間の保険料も、あとから納めることができる。", "保険料の督促は、時効を更新（中断）させる効力がある。"], "ans": [1, 5], "exp": ["2年で時効", "これも2年", "督促を行う", "時効で消えた分は納められない。そのため給付率が下がる", "督促で時効がリセットされる"], "point": "保険料も給付も時効は2年"}, {"id": "a009", "date": "新作", "field": "介護保険制度", "topic": "介護保険の財政（負担割合）について", "opts": ["包括的支援事業の財源には、第2号保険料も使われる。", "国は、居宅給付費について25%（調整交付金5%を含む）を負担する。", "市町村の負担割合は25%である。", "都道府県の負担割合は、居宅給付費・施設等給付費とも12.5%である。", "第1号保険料と第2号保険料の割合は、人口比で3年ごとに見直される。"], "ans": [2, 5], "exp": ["第2号保険料が入るのは総合事業だけ。包括的支援事業・任意事業は第1号保険料と公費", "居宅給付費は国25%・都道府県12.5%・市町村12.5%", "市町村は12.5%", "施設等給付費は都道府県17.5%", "現在は第1号23%・第2号27%"], "point": "施設等は国20%・都道府県17.5%。第2号保険料は総合事業まで"}, {"id": "a010", "date": "新作", "field": "介護保険制度", "topic": "地域支援事業について", "opts": ["在宅医療・介護連携推進事業は、任意事業に含まれる。", "任意事業には、介護給付等費用適正化事業や家族介護支援事業がある。", "地域支援事業は、介護予防・日常生活支援総合事業、包括的支援事業、任意事業からなる。", "要介護者は、地域支援事業を一切利用できない。", "生活支援体制整備事業は、都道府県が行う。"], "ans": [2, 3], "exp": ["包括的支援事業に含まれる", "任意事業の例", "3つの事業で構成", "一般介護予防事業や任意事業などは要介護者も対象になりうる", "市町村が行う包括的支援事業"], "point": "包括的支援事業＝総合相談・権利擁護・在宅医療介護連携・認知症施策・生活支援体制整備など"}, {"id": "a011", "date": "新作", "field": "介護保険制度", "topic": "地域ケア会議について", "opts": ["市町村は、地域ケア会議を置くよう努めなければならない。", "地域ケア会議の参加者には、守秘義務は課されない。", "地域ケア会議は、介護支援専門員だけで行う。", "地域ケア会議は、都道府県が必ず置かなければならない。", "個別ケースの検討を通して、地域の課題を見つけることもねらいである。"], "ans": [1, 5], "exp": ["市町村の努力義務", "正当な理由なく秘密を漏らしてはならない", "医療・介護・福祉・地域の人など多職種で行う", "置くのは市町村（努力義務）", "個別課題から地域課題・政策形成へつなげる"], "point": "市町村が設置に努める・多職種・守秘義務あり"}, {"id": "a012", "date": "新作", "field": "介護保険制度", "topic": "サービス事業者の指定について", "opts": ["保険医療機関が訪問看護などの指定を受けたものとみなされることはない。", "個人でも、原則として指定居宅サービス事業者になれる。", "指定居宅サービス事業者の指定は、6年ごとに更新しないと効力を失う。", "地域密着型サービス事業者は、都道府県知事が指定する。", "指定は、サービスの種類ごと・事業所ごとに行われる。"], "ans": [3, 5], "exp": ["保険医療機関は訪問看護・訪問リハなどの指定があったものとみなされる（みなし指定）", "原則として法人でなければならない", "更新は6年ごと", "地域密着型は市町村長が指定", "種類ごと・事業所ごと"], "point": "指定は6年更新・法人が原則・地域密着型は市町村長"}, {"id": "a013", "date": "新作", "field": "介護保険制度", "topic": "介護支援専門員の義務について", "opts": ["他人に自分の名義を使わせて、介護支援専門員の業務をさせてはならない。", "登録を受けていれば、介護支援専門員証がなくても業務ができる。", "介護支援専門員証を不正に使ってはならない。", "介護支援専門員証の有効期間は3年である。", "秘密保持の義務は、介護支援専門員でなくなれば消える。"], "ans": [1, 3], "exp": ["名義貸しの禁止", "業務には介護支援専門員証の交付が必要", "不正使用の禁止", "有効期間は5年", "辞めたあとも秘密保持義務は続く"], "point": "証は5年・名義貸し禁止・秘密保持は辞めた後も"}, {"id": "a014", "date": "新作", "field": "介護保険制度", "topic": "介護支援専門員の登録について", "opts": ["登録を消除された人は、どんな場合でも二度と登録できない。", "禁錮以上の刑を受けても、登録には影響しない。", "業務に従事するために他の都道府県へ移るときは、登録の移転を申請できる。", "介護支援専門員証の更新に、研修の受講は必要ない。", "登録は、試験に合格して実務研修を修了した人が、都道府県知事に申請して受ける。"], "ans": [3, 5], "exp": ["一定期間がたてば再び登録できる場合がある", "欠格事由にあたり、登録が消除される", "登録の移転ができる", "更新研修を受ける必要がある", "試験合格→実務研修→登録→証の交付"], "point": "登録も証も都道府県知事。更新には更新研修"}, {"id": "a015", "date": "新作", "field": "介護保険制度", "topic": "アセスメント（課題分析）について", "opts": ["課題分析標準項目は、基本情報に関する項目と、課題分析（アセスメント）に関する項目からなる。", "アセスメントは、利用者の居宅を訪問し、利用者と家族に面接して行う。", "課題分析は、介護支援専門員の個人的な考えだけで行ってよい。", "アセスメントは、最初の計画をつくるときだけ行えばよい。", "アセスメントでは、利用者ができないことだけに注目する。"], "ans": [1, 2], "exp": ["合わせて23項目", "居宅を訪問して面接するのが原則", "客観的に把握できる適切な方法で行う", "状態が変わったときや計画を見直すときにも行う", "できること・強み（ストレングス）にも目を向ける"], "point": "居宅訪問・面接・23項目・強みにも注目"}, {"id": "a016", "date": "新作", "field": "介護保険制度", "topic": "居宅サービス計画の作成について", "opts": ["計画には、利用者の生活全般の解決すべき課題（ニーズ）を書く。", "訪問看護などの医療系サービスを位置づけるとき、主治医の指示は必要ない。", "区分支給限度基準額を超えるサービスは、計画に入れることができない。", "長期目標と短期目標は、同じ期間にしなければならない。", "介護保険以外の保健医療・福祉サービスや地域の支え（インフォーマルサポート）も位置づけるよう努める。"], "ans": [1, 5], "exp": ["ニーズ→目標→サービスの順に組み立てる", "医療系サービスは主治の医師等の指示がある場合に限る", "入れてもよい。超えた分は全額自己負担", "短期目標は長期目標を達成するための段階的な目標で、期間は短い", "フォーマル・インフォーマルの両方"], "point": "インフォーマルも位置づける・医療系は主治医の指示"}, {"id": "a017", "date": "新作", "field": "介護保険制度", "topic": "介護予防支援について", "opts": ["2024年4月から、指定居宅介護支援事業者も介護予防支援の指定を受けられるようになった。", "介護予防支援の対象は、要介護1の人である。", "介護予防サービス計画は、地域包括支援センター以外は作ることができない。", "介護予防支援の対象は、要支援1・2の人である。", "介護予防支援事業者の指定は、市町村長が行う。"], "ans": [1, 4, 5], "exp": ["2024年度の改正", "対象は要支援1・2", "居宅介護支援事業者も、指定を受けるか委託を受ければ作れる", "要支援者のケアマネジメント", "市町村長が指定"], "point": "要支援＝介護予防支援。指定は市町村長、2024年から居宅介護支援事業者も指定OK"}, {"id": "a018", "date": "新作", "field": "介護保険制度", "topic": "国民健康保険団体連合会（国保連）について", "opts": ["介護給付費等審査委員会は、都道府県に置かれる。", "国保連は、要介護認定を行う。", "国保連は、サービスに関する苦情を受け付け、事業者に指導・助言を行う。", "国保連は、介護給付費の審査・支払を行う。", "国保連は、事業者の指定を取り消すことができる。"], "ans": [3, 4], "exp": ["国保連に置かれる", "要介護認定は市町村", "苦情処理を行う", "市町村から委託を受けて審査・支払", "指定の取消は都道府県知事・市町村長"], "point": "国保連＝審査・支払・苦情処理（強い権限はない）"}, {"id": "a019", "date": "新作", "field": "介護保険制度", "topic": "介護保険法の目的と理念について", "opts": ["被保険者は、サービスの種類や事業者を選ぶことができない。", "要介護者等が尊厳を保ち、能力に応じて自立した日常生活を営めるよう支援することを目的とする。", "国民は、要介護状態にならないよう、健康の保持増進に努めるものとされている。", "保険給付は、できるだけ施設で生活できるように配慮して行う。", "保険給付は、医療との連携に配慮しなくてよい。"], "ans": [2, 3], "exp": ["被保険者の選択に基づいて行う", "法第1条の目的", "国民の努力義務（第4条）", "できる限り居宅で自立した生活ができるよう配慮する", "医療との連携に十分配慮する"], "point": "尊厳の保持・自立支援・居宅重視・利用者の選択"}, {"id": "a020", "date": "新作", "field": "介護保険制度", "topic": "国と都道府県の役割について", "opts": ["要介護認定の基準は、厚生労働大臣が定める。", "財政安定化基金を置くのは、市町村である。", "介護保険審査会を置くのは、国である。", "第1号被保険者の保険料率は、都道府県が決める。", "介護報酬の算定基準は、厚生労働大臣が定める。"], "ans": [1, 5], "exp": ["国の役割", "都道府県が置く", "都道府県が置く", "市町村が条例で定める", "社会保障審議会の意見を聴いて定める"], "point": "国＝基準づくり、都道府県＝基金・審査会・指定、市町村＝保険者"}, {"id": "a021", "date": "新作", "field": "介護保険制度", "topic": "医療保険者と年金保険者の役割について", "opts": ["医療保険者は、介護給付費・地域支援事業支援納付金を社会保険診療報酬支払基金に納める。", "医療保険者は、第2号被保険者の保険料を医療保険料と一体で徴収する。", "年金保険者は、要介護認定を行う。", "医療保険者は、第1号被保険者の保険料も徴収する。", "年金保険者は、年金から保険料を天引きし、市町村に納める。"], "ans": [1, 2, 5], "exp": ["支払基金を通して市町村へ交付される", "健康保険料などと一緒に集める", "要介護認定は市町村", "第1号の保険料は市町村が徴収する", "特別徴収の事務を行う"], "point": "第2号は医療保険者→支払基金→市町村。第1号の特別徴収は年金保険者"}, {"id": "a022", "date": "新作", "field": "介護保険制度", "topic": "施設サービス計画について", "opts": ["計画の原案は、入所者や家族に説明し、文書で同意を得る。", "施設サービス計画は、入所者に交付しなくてよい。", "施設サービス計画をつくるときは、アセスメントは不要である。", "計画担当介護支援専門員は、モニタリングで入所者に面接しなくてよい。", "施設サービス計画は、施設の計画担当介護支援専門員が作成する。"], "ans": [1, 5], "exp": ["説明・同意が必要", "入所者に交付する", "アセスメントを行ってから作成する", "定期的に入所者に面接してモニタリングを行う", "施設の介護支援専門員が担当"], "point": "施設も居宅と同じ流れ（アセスメント→原案→同意→交付→モニタリング）"}, {"id": "a023", "date": "新作", "field": "介護保険制度", "topic": "特定疾病について", "opts": ["末期がん（回復の見込みがないと医師が判断したもの）は、特定疾病に含まれる。", "骨折を伴う骨粗鬆症は、特定疾病に含まれる。", "特定疾病は、全部で20種類ある。", "統合失調症は、特定疾病に含まれる。", "関節リウマチは、特定疾病に含まれる。"], "ans": [1, 2, 5], "exp": ["特定疾病のひとつ", "特定疾病のひとつ", "16種類", "含まれない", "特定疾病のひとつ"], "point": "特定疾病は16種類。加齢と関係の深い病気"}, {"id": "a024", "date": "新作", "field": "介護保険制度", "topic": "事業者への指導・監督について", "opts": ["指定を取り消されてから5年を経過しない者は、原則として指定を受けられない。", "市町村は、どんな場合も居宅サービス事業者に報告を求めたり立ち入ったりできない。", "勧告に従わない事業者は、その旨を公表されることがある。", "指定の取消は、事業者が同意しなければできない。", "都道府県知事は、事業者が人員の基準を満たさないとき、期限を決めて基準を守るよう勧告できる。"], "ans": [1, 3, 5], "exp": ["欠格事由", "市町村も、保険給付に関して報告を求めたり立入検査をしたりできる", "勧告→公表→命令→取消などの流れ", "同意は不要", "勧告できる"], "point": "勧告→公表→命令→指定取消・効力停止"}, {"id": "a025", "date": "新作", "field": "介護保険制度", "topic": "区分変更とサービスの種類の指定について", "opts": ["介護認定審査会は、利用できるサービスの種類について意見を述べることができる。", "区分変更の申請は、有効期間が終わるまでできない。", "要介護者は、心身の状態が変わったとき、有効期間の途中でも要介護状態区分の変更を申請できる。", "審査会の意見があっても、市町村がサービスの種類を指定することはできない。", "市町村は、要介護度が軽くなったと認めるとき、職権で区分を変更できる。"], "ans": [1, 3, 5], "exp": ["療養に関する事項やサービスの種類について意見を付けられる", "いつでも申請できる", "区分変更申請", "市町村は審査会の意見に基づいてサービスの種類を指定できる", "職権による変更"], "point": "区分変更はいつでも。審査会の意見→市町村がサービスの種類を指定"}, {"id": "a026", "date": "新作", "field": "介護保険制度", "topic": "保険者である市町村の事務について", "opts": ["要介護認定は、市町村が行う。", "第2号被保険者の保険料は、市町村が直接徴収する。", "介護保険施設の指定は、市町村長が行う。", "被保険者の資格の管理は、市町村の事務である。", "介護保険審査会の運営は、市町村の事務である。"], "ans": [1, 4], "exp": ["審査会の判定に基づいて市町村が認定", "医療保険者が徴収する", "介護保険施設の指定（老健・介護医療院は許可）は都道府県知事", "被保険者台帳の作成など", "審査会は都道府県"], "point": "市町村＝資格管理・認定・給付・第1号保険料・地域密着型の指定"}, {"id": "a027", "date": "新作", "field": "介護保険制度", "topic": "保険者について", "opts": ["国が保険者として保険料を集める。", "複数の市町村が広域連合をつくって、保険者の事務を行うことができる。", "保険者は都道府県である。", "保険者は、被保険者が自分で選ぶことができる。", "介護保険の保険者は、市町村と特別区（東京23区）である。"], "ans": [2, 5], "exp": ["国は保険者ではない", "広域連合や一部事務組合でも運営できる", "都道府県は保険者を支える立場", "住所のある市町村が保険者になる", "市町村・特別区"], "point": "保険者＝市町村・特別区（広域連合も可）"}, {"id": "a028", "date": "新作", "field": "介護保険制度", "topic": "高額介護サービス費について", "opts": ["同じ世帯の利用者の負担額を合算して計算できる。", "生活保護受給者の上限額は、個人で月15,000円である。", "福祉用具購入費の自己負担も、高額介護サービス費の対象となる。", "1か月の利用者負担の合計が上限額を超えたとき、超えた分が支給される。", "施設での食費・居住費も、高額介護サービス費の対象となる。"], "ans": [1, 2, 4], "exp": ["世帯合算ができる", "所得の低い区分の上限", "福祉用具購入費・住宅改修費は対象外", "月ごとに計算", "食費・居住費・日常生活費は対象外"], "point": "高額介護サービス費は月単位・世帯合算。食費・居住費・福祉用具購入・住宅改修は対象外"}, {"id": "a029", "date": "新作", "field": "介護保険制度", "topic": "特定入所者介護サービス費（補足給付）について", "opts": ["対象は、介護保険施設や短期入所サービスを利用する所得の低い人である。", "利用するには、市町村から負担限度額認定を受ける。", "所得が低ければ、預貯金がいくらあっても対象になる。", "食費と居住費（滞在費）の負担を軽くする。", "通所介護の食費も対象になる。"], "ans": [1, 2, 4], "exp": ["施設とショートステイが対象", "負担限度額認定証を施設に提示する", "預貯金などの資産が一定額を超えると対象外", "食費・居住費", "通所系の食費は対象外"], "point": "補足給付＝施設・ショートの食費・居住費。所得と資産の両方で判定"}, {"id": "a030", "date": "新作", "field": "介護保険制度", "topic": "福祉用具購入費について", "opts": ["腰掛便座や入浴補助用具は、購入費の対象である。", "支給限度基準額は、同一年度で10万円である。", "指定特定福祉用具販売事業者から購入しないと支給されない。", "原則として、事業者に直接支払われる現物給付である。", "車いすは、購入費の対象である。"], "ans": [1, 2, 3], "exp": ["肌にふれるもの・使い回しにくいものは購入", "4月〜翌3月で10万円", "指定を受けた事業者からの購入が条件", "原則は償還払い", "車いすは貸与"], "point": "購入＝腰掛便座・入浴補助用具・簡易浴槽・リフトのつり具など。年度10万円・償還払い"}, {"id": "a031", "date": "新作", "field": "介護保険制度", "topic": "介護保険施設について", "opts": ["要支援者も介護保険施設に入所できる。", "介護保険施設には、有料老人ホームが含まれる。", "介護医療院の開設には、市町村長の許可が必要である。", "介護療養型医療施設は、2024年3月末で廃止された。", "介護保険施設は、介護老人福祉施設・介護老人保健施設・介護医療院の3種類である。"], "ans": [4, 5], "exp": ["施設サービスは要介護者だけ", "有料老人ホームは介護保険施設ではない（特定施設になりうる）", "都道府県知事の許可", "介護医療院などに移行した", "3種類"], "point": "介護保険施設は3種類（特養・老健・介護医療院）。要介護者のみ"}, {"id": "a032", "date": "新作", "field": "介護保険制度", "topic": "包括的支援事業の内容について", "opts": ["総合相談支援業務は、包括的支援事業に含まれる。", "家族介護支援事業は、包括的支援事業に含まれる。", "包括的・継続的ケアマネジメント支援業務では、地域の介護支援専門員への助言や支援を行う。", "福祉用具の貸与は、包括的支援事業に含まれる。", "権利擁護業務は、包括的支援事業に含まれる。"], "ans": [1, 3, 5], "exp": ["何でも相談の窓口", "家族介護支援事業は任意事業", "困難事例への助言やネットワークづくり", "福祉用具貸与は保険給付", "虐待対応・成年後見制度の利用支援など"], "point": "包括的支援事業＝総合相談・権利擁護・包括的継続的ケアマネ支援・介護予防ケアマネジメントなど"}, {"id": "a033", "date": "新作", "field": "介護保険制度", "topic": "介護認定審査会について", "opts": ["委員の任期は、原則2年である。", "複数の市町村で共同して設置することができる。", "委員は、保健・医療・福祉の学識経験者のうちから都道府県知事が任命する。", "審査会は、都道府県に置かれる。", "審査会は、委員全員がそろわなければ判定できない。"], "ans": [1, 2], "exp": ["条例で2年を超え3年以下にもできる", "共同設置や都道府県への審査判定業務の委託ができる", "任命するのは市町村長", "市町村に置かれる", "合議体の過半数の出席で開ける"], "point": "審査会は市町村・任期2年・共同設置OK"}, {"id": "a034", "date": "新作", "field": "介護保険制度", "topic": "一次判定と二次判定について", "opts": ["一次判定は、認定調査の基本調査の結果などをもとにコンピュータで行う。", "二次判定では、特記事項や主治医意見書も使われる。", "二次判定は、介護認定審査会が行う。", "二次判定は、市町村の職員が一人で行う。", "一次判定の結果は、二次判定で変更されることはない。"], "ans": [1, 2, 3], "exp": ["要介護認定等基準時間を推計する", "特記事項・主治医意見書をふまえる", "審査会が審査・判定", "審査会の合議体で行う", "変更されることがある"], "point": "一次＝コンピュータ、二次＝審査会（特記事項・主治医意見書）"}, {"id": "a035", "date": "新作", "field": "介護保険制度", "topic": "主治医意見書について", "opts": ["意見書を作成する費用は、市町村が負担する。", "主治医意見書は、一次判定だけに使われる。", "主治医意見書には、傷病や特別な医療についての項目がある。", "主治医意見書は、市町村が申請者の主治医に求める。", "意見書の費用は、申請者が全額負担する。"], "ans": [1, 3, 4], "exp": ["保険者（市町村）が負担", "二次判定でも使われる", "傷病・特別な医療・心身の状態など", "市町村から主治医に依頼", "申請者の負担はない"], "point": "意見書は市町村が依頼して費用も負担"}, {"id": "a036", "date": "新作", "field": "介護保険制度", "topic": "認定調査の委託について", "opts": ["認定調査は、必ず都道府県の職員が行う。", "新規認定の調査は、指定市町村事務受託法人に委託できる。", "委託を受けた調査員には、守秘義務は課されない。", "更新認定の調査は、指定居宅介護支援事業者に委託できる。", "新規認定の調査は、指定居宅介護支援事業者に委託できる。"], "ans": [2, 4], "exp": ["市町村の職員などが行う", "新規は市町村か事務受託法人", "みなし公務員として守秘義務がある", "更新・区分変更は委託できる", "新規は居宅介護支援事業者に委託できない"], "point": "新規＝市町村か事務受託法人／更新・区分変更＝居宅介護支援事業者などにも委託OK"}, {"id": "a037", "date": "新作", "field": "介護保険制度", "topic": "保険料の減免と徴収猶予について", "opts": ["第1号被保険者の保険料は、全国一律の金額である。", "保険料の減免は、国が個人ごとに決める。", "市町村は、条例で保険料の徴収を猶予できる。", "市町村は、災害など特別な理由がある人について、条例で保険料を減免できる。", "保険料の減免は、どんな理由があっても認められない。"], "ans": [3, 4], "exp": ["市町村ごとに異なる", "市町村が行う", "徴収猶予も条例で", "条例で定める", "特別な理由があれば減免できる"], "point": "減免・徴収猶予は市町村の条例で"}, {"id": "a038", "date": "新作", "field": "介護保険制度", "topic": "第2号被保険者の保険料について", "opts": ["健康保険の被扶養者である第2号被保険者は、個別に保険料を納める。", "健康保険の加入者の保険料は、標準報酬月額などに介護保険料率をかけて計算する。", "第2号被保険者の保険料は、全国一律の定額である。", "健康保険の加入者の保険料は、原則として事業主と被保険者が半分ずつ負担する。", "国民健康保険の加入者には、国の負担はない。"], "ans": [2, 4], "exp": ["被扶養者は個別に保険料を負担しない", "医療保険のしくみで計算", "医療保険ごとに計算方法が異なる", "労使折半", "国保の加入者には国庫負担がある"], "point": "第2号は医療保険のしくみで計算・徴収（被扶養者は個別負担なし）"}, {"id": "a039", "date": "新作", "field": "介護保険制度", "topic": "予防給付のサービスについて", "opts": ["介護予防訪問看護は、予防給付にある。", "介護予防小規模多機能型居宅介護は、予防給付にある。", "介護予防訪問介護は、現在も予防給付にある。", "定期巡回・随時対応型訪問介護看護は、予防給付にある。", "介護予防認知症対応型共同生活介護は、要支援1から利用できる。"], "ans": [1, 2], "exp": ["予防給付にある", "地域密着型の予防給付", "訪問介護・通所介護の予防給付は総合事業に移った", "要介護者だけ", "要支援2から"], "point": "予防給付にないもの＝訪問介護・通所介護・施設・定期巡回・夜間対応・看多機など"}, {"id": "a040", "date": "新作", "field": "介護保険制度", "topic": "指定居宅介護支援事業者の運営について", "opts": ["利用者に特定の事業者のサービスを使わせる代わりに、その事業者から金品を受け取ってもよい。", "利用者が希望しても、ケアプランに位置づけた事業所を選んだ理由を説明する必要はない。", "正当な理由なく、サービスの提供を拒んではならない。", "自分の事業所でサービスを提供するのが難しいときは、ほかの事業者を紹介する。", "利用者に、入院するときは担当の介護支援専門員の名前などを病院に伝えるよう頼んでおく。"], "ans": [3, 4, 5], "exp": ["金品の受け取りは禁止", "求めがあれば理由を説明する", "提供拒否の禁止", "適切な事業者の紹介", "入院時の連携のため"], "point": "提供拒否の禁止・入院時の情報連携・利益収受の禁止"}, {"id": "a041", "date": "新作", "field": "介護保険制度", "topic": "サービス担当者会議について", "opts": ["サービス担当者会議には、主治医は参加できない。", "新しく居宅サービス計画を作ったときは、原則としてサービス担当者会議を開く。", "更新認定や区分変更認定を受けたときも、原則として会議を開く。", "利用者や家族が同意すれば、テレビ電話装置などを使って会議を開ける。", "サービス担当者会議を開くのは、訪問介護のサービス提供責任者である。"], "ans": [2, 3, 4], "exp": ["主治医も参加できる。出られないときは照会で意見を聴く", "計画作成時", "更新・区分変更時も", "同意を得てオンラインで開催できる", "開くのは介護支援専門員"], "point": "会議＝新規・更新・区分変更のとき。開くのはケアマネ"}, {"id": "a042", "date": "新作", "field": "介護保険制度", "topic": "居宅介護支援のモニタリングについて", "opts": ["少なくとも1か月に1回、モニタリングの結果を記録する。", "モニタリングは、利用者の状態が変わったときだけ行えばよい。", "モニタリングは、サービス事業者に任せてよい。", "利用者の同意など一定の要件を満たせば、テレビ電話装置などを使ったモニタリングも認められる。", "モニタリングでは、利用者の家族と話す必要はない。"], "ans": [1, 4], "exp": ["月1回以上記録", "継続的に行う", "介護支援専門員が行う", "2024年度から。2か月に1回は居宅を訪問する", "利用者・家族、事業者などと連絡をとる"], "point": "モニタリング＝月1回以上の記録。テレビ電話は条件付き"}, {"id": "a043", "date": "新作", "field": "介護保険制度", "topic": "介護保険事業支援計画（都道府県）について", "opts": ["地域密着型サービスの必要利用定員総数は、都道府県計画で定める。", "都道府県介護保険事業支援計画は、3年を1期とする。", "介護保険施設の種類ごとの必要入所定員総数を定める。", "都道府県の計画は、市町村の意見を聴かずに作ってよい。", "都道府県計画は、老人福祉計画と別々に作らなければならない。"], "ans": [2, 3], "exp": ["地域密着型は市町村計画で定める", "市町村と同じく3年1期", "施設の定員は都道府県計画", "市町村の計画をふまえて作る", "都道府県老人福祉計画と一体で作る"], "point": "施設の定員＝都道府県計画、地域密着型＝市町村計画"}, {"id": "a044", "date": "新作", "field": "介護保険制度", "topic": "財政安定化基金について", "opts": ["財政安定化基金は、国に置かれる。", "保険料の収納が不足した場合、その不足額の全額が交付される。", "市町村が負担する分には、第1号保険料が使われる。", "財源は、国・都道府県・市町村が3分の1ずつ負担する。", "基金からの貸付は、返済しなくてよい。"], "ans": [3, 4], "exp": ["都道府県に置かれる", "収納不足の2分の1が交付され、残りは貸付", "市町村の拠出は第1号保険料", "3分の1ずつ", "貸付は次の計画期間に保険料で返す"], "point": "基金＝都道府県・財源3分の1ずつ・貸付は返済"}, {"id": "a045", "date": "新作", "field": "介護保険制度", "topic": "地域密着型サービスについて", "opts": ["市町村長は、厚生労働大臣が定める額の範囲内で独自の介護報酬を定められる。", "ほかの市町村の住民は、どんな場合も利用できない。", "地域密着型サービスの指定は、都道府県知事が行う。", "地域密着型サービスには、要支援者が使えるものはない。", "原則として、その市町村の被保険者だけが利用できる。"], "ans": [1, 5], "exp": ["市町村独自の報酬設定ができる", "所在地の市町村の同意があれば利用できる", "市町村長が指定", "介護予防小多機・介護予防認知症対応型通所介護・介護予防GH（要支援2）がある", "住民が原則"], "point": "地域密着型＝市町村長が指定・住民が原則・独自報酬OK"}, {"id": "a046", "date": "新作", "field": "介護保険制度", "topic": "審査請求の対象について", "opts": ["要介護認定の結果は、審査請求の対象になる。", "審査請求は、口頭ではできない。", "保険料の賦課・徴収に関する処分は、審査請求の対象になる。", "事業者の指定の取消は、介護保険審査会への審査請求の対象である。", "審査請求をしなくても、すぐに裁判所に取消しの訴えを起こせる。"], "ans": [1, 3], "exp": ["保険給付に関する処分", "文書でも口頭でもできる", "保険料等に関する処分", "事業者の指定に関することは介護保険審査会の対象外", "審査請求の裁決を経てからでないと訴えられない（審査請求前置）"], "point": "対象＝保険給付・保険料等の処分。裁決を経てから訴訟"}, {"id": "a047", "date": "新作", "field": "介護保険制度", "topic": "居宅サービス計画の自己作成について", "opts": ["自分で作った計画は、市町村に届け出る。", "計画の自己作成は、要支援者だけに認められている。", "自分で計画を作った場合は、保険給付を受けられない。", "自分で作る場合は、区分支給限度基準額の管理をしなくてよい。", "利用者は、居宅サービス計画を自分で作ることができる。"], "ans": [1, 5], "exp": ["市町村に届け出ると現物給付（法定代理受領）が受けられる", "要介護者もできる", "届け出れば保険給付を受けられる", "限度額の管理は必要", "セルフケアプランともいう"], "point": "自己作成OK・市町村へ届出"}, {"id": "a048", "date": "新作", "field": "介護保険制度", "topic": "介護給付費の請求と支払いについて", "opts": ["介護給付費の審査は、都道府県が直接行う。", "介護給付費の支払いは、社会保険診療報酬支払基金が行う。", "事業者は、介護給付費を利用者から全額受け取り、利用者が国に請求する。", "事業者は、介護給付費を国保連に請求する。", "国保連は、市町村から委託を受けて審査・支払を行う。"], "ans": [4, 5], "exp": ["国保連の介護給付費等審査委員会が審査", "支払基金は第2号保険料の交付をする機関", "原則は法定代理受領で、利用者は自己負担分だけ払う", "国保連に請求", "市町村の委託"], "point": "請求→国保連（審査・支払）"}, {"id": "a049", "date": "新作", "field": "介護保険制度", "topic": "要支援者が利用できる地域密着型サービスについて", "opts": ["夜間対応型訪問介護", "介護予防小規模多機能型居宅介護", "介護予防認知症対応型通所介護", "地域密着型通所介護", "看護小規模多機能型居宅介護"], "ans": [2, 3], "exp": ["要介護者だけ", "要支援者も利用できる", "要支援者も利用できる", "要介護者だけ", "要介護者だけ"], "point": "要支援が使える地域密着型＝介護予防小多機・介護予防認知症対応型通所・介護予防GH（要支援2）"}, {"id": "a050", "date": "新作", "field": "介護保険制度", "topic": "介護保険と他の制度の給付の調整について", "opts": ["障害福祉サービスと同じ内容のサービスがある場合、原則として障害福祉サービスが優先される。", "生活保護の介護扶助は、介護保険の給付より優先される。", "医療保険の訪問看護と介護保険の訪問看護が使える要介護者は、原則として介護保険が優先される。", "労災保険から介護に相当する給付を受けられる場合は、その限度で介護保険の給付は行われない。", "公費負担医療制度は、介護保険と調整されることはない。"], "ans": [3, 4], "exp": ["介護保険が優先", "介護保険が優先で、自己負担分などを介護扶助でまかなう", "要介護者は介護保険が優先（末期がんなどは医療保険）", "労災などの給付が優先", "一部の公費負担医療は介護保険の自己負担分を負担するなど調整がある"], "point": "労災＞介護保険＞医療保険・障害福祉・生活保護"}, {"id": "a051", "date": "新作", "field": "介護保険制度", "topic": "介護報酬について", "opts": ["介護報酬の単価は、全国どこでも1単位10円で同じである。", "介護報酬の単位数は、厚生労働大臣が定める。", "介護報酬は、事業者が自由に決めることができる。", "介護報酬は、5年ごとに改定するよう法律で決められている。", "1単位の単価は、地域やサービスの種類によって異なる。"], "ans": [2, 5], "exp": ["地域によって10円より高くなる", "社会保障審議会の意見を聴いて定める", "国の基準で決まる", "法律で5年ごとと決まっているわけではない。おおむね3年ごとに改定されている", "基本は10円で、地域区分によって上乗せされる"], "point": "単位数は大臣が決める・1単位は10円が基本で地域差あり"}, {"id": "a052", "date": "新作", "field": "介護保険制度", "topic": "要介護状態・要支援状態の定義について", "opts": ["要介護状態は、3か月以上続く見込みがあれば認められる。", "要介護状態区分は、要介護1〜7の7段階である。", "要介護状態とは、日常生活の基本的な動作について、6か月にわたり継続して常時介護が必要と見込まれる状態をいう。", "第2号被保険者は、原因を問わず要介護状態と認められる。", "要支援状態も、6か月にわたり継続して支援が必要と見込まれる状態をいう。"], "ans": [3, 5], "exp": ["6か月", "要介護1〜5の5段階（要支援1・2を合わせて7区分）", "6か月継続の見込み", "第2号は特定疾病が原因の場合だけ", "要支援も6か月"], "point": "要介護も要支援も「6か月継続の見込み」"}, {"id": "a053", "date": "新作", "field": "介護保険制度", "topic": "要介護認定の効力と申請前のサービスについて", "opts": ["認定の効力は、結果の通知が届いた日から生じる。", "申請してから認定が出るまでのサービスは、すべて全額自己負担になる。", "認定調査に正当な理由なく応じない場合でも、申請は必ず受理・認定される。", "要介護認定の効力は、申請日にさかのぼって生じる。", "認定の前に緊急でやむを得ずサービスを受けた場合、特例居宅介護サービス費が支給されることがある。"], "ans": [4, 5], "exp": ["申請日にさかのぼる", "申請日以降のサービスは、認定されれば給付の対象になる", "市町村は申請を却下できる", "申請日から有効", "特例サービス費"], "point": "効力は申請日から。調査に応じないと却下されることも"}, {"id": "a054", "date": "新作", "field": "介護保険制度", "topic": "基準該当サービスについて", "opts": ["基準該当サービスは、利用者の全額自己負担になる。", "基準該当サービスは、都道府県知事が個別に指定する。", "指定の基準をすべては満たさないが、一定の基準を満たす事業者のサービスを、市町村が認めて給付の対象にするしくみである。", "基準該当サービスは、施設サービスでも認められる。", "基準該当サービスには、特例居宅介護サービス費が支給される。"], "ans": [3, 5], "exp": ["特例サービス費として給付される", "市町村が認める", "法人格がないなど指定基準を満たさない事業者でも認められる場合がある", "居宅サービスなどが対象で、施設サービスにはない", "特例サービス費（原則償還払い）"], "point": "基準該当＝市町村が認める・特例サービス費"}, {"id": "a055", "date": "新作", "field": "介護保険制度", "topic": "介護支援専門員実務研修受講試験について", "opts": ["受験資格に、実務経験は必要ない。", "保健・医療・福祉の法定資格にもとづく業務の経験が5年以上で、従事日数が900日以上の人は受験できる。", "試験は、市町村長が実施する。", "試験に合格すれば、研修を受けずに登録できる。", "生活相談員などの相談援助業務の経験が5年以上の人も受験できる。"], "ans": [2, 5], "exp": ["実務経験が必要", "法定資格＋5年・900日", "都道府県知事が行う", "合格後に実務研修を修了してから登録", "相談援助業務5年・900日"], "point": "受験＝実務5年・900日以上。試験も登録も都道府県知事"}, {"id": "a056", "date": "新作", "field": "介護保険制度", "topic": "主任介護支援専門員について", "opts": ["地域包括支援センターには、主任介護支援専門員を置くことになっている。", "主任介護支援専門員にも更新研修がある。", "主任介護支援専門員になるのに、介護支援専門員としての実務経験は必要ない。", "主任介護支援専門員は、要介護認定を行うことができる。", "主任介護支援専門員は、主任介護支援専門員研修を修了した介護支援専門員である。"], "ans": [1, 2, 5], "exp": ["包括の3職種のひとつ", "有効期間は5年で、更新研修がある", "専任の介護支援専門員として一定期間（原則5年）の経験などが必要", "認定は市町村", "研修修了者"], "point": "主任ケアマネ＝研修修了・5年ごとに更新・包括の必置職種"}, {"id": "a057", "date": "新作", "field": "介護保険制度", "topic": "介護支援専門員の基本的な義務について", "opts": ["特定のサービスや事業者にかたよることなく、公正かつ誠実に業務を行う。", "要介護者等の人格を尊重し、常に要介護者等の立場に立って業務を行う。", "信用を傷つけるような行為をしても、罰則はない。", "介護支援専門員としての資質の向上に努める。", "業務を行ううえで、厚生労働省令の基準に従う必要はない。"], "ans": [1, 2, 4], "exp": ["公正・誠実", "義務", "信用失墜行為の禁止。違反すれば登録消除などがある", "資質向上の努力義務", "省令の基準に従う"], "point": "人格尊重・公正誠実・資質向上・信用失墜行為の禁止・秘密保持"}, {"id": "a058", "date": "新作", "field": "介護保険制度", "topic": "ケアマネジメントの過程について", "opts": ["一般的な流れは、インテーク→アセスメント→計画原案の作成→サービス担当者会議→実施→モニタリング→評価の順である。", "いったん計画を作ったら、変更することはできない。", "モニタリングで課題が変わったと分かったら、再アセスメントを行う。", "モニタリングは、計画を作る前に行う。", "アセスメントは、サービス担当者会議のあとに行う。"], "ans": [1, 3], "exp": ["基本の流れ", "必要に応じて変更する", "状態変化に応じて見直す", "モニタリングはサービス開始後", "アセスメントが先"], "point": "インテーク→アセスメント→原案→会議→同意・交付→実施→モニタリング→評価"}, {"id": "a059", "date": "新作", "field": "介護保険制度", "topic": "インテーク（受付・契約）について", "opts": ["インテークの段階では、利用者の主訴を聴かなくてよい。", "契約は、利用者の家族とだけ結べばよい。", "サービスの提供を始める前に、重要事項を記した文書を渡して説明し、同意を得る。", "利用者が自分で事業所を選べるよう、必要な情報を提供する。", "重要事項の説明は、契約が終わったあとに行う。"], "ans": [3, 4], "exp": ["主訴を受け止めることが大切", "本人との契約が原則（判断能力がない場合は代理人など）", "重要事項説明書で説明し同意を得る", "利用者の選択を支える", "契約の前に説明する"], "point": "インテーク＝主訴を聴く・重要事項の説明と同意"}, {"id": "a060", "date": "新作", "field": "介護保険制度", "topic": "共生型サービスについて", "opts": ["共生型サービスは、介護保険と障害福祉の両方のサービスを同じ事業所で提供しやすくするためのしくみである。", "共生型サービスの対象には、訪問介護・通所介護・短期入所生活介護がある。", "共生型サービスでは、障害者は介護保険のサービスを利用できなくなる。", "共生型サービスは、2000年の介護保険制度スタートと同時にできた。", "共生型サービスは、施設サービスに限られる。"], "ans": [1, 2], "exp": ["高齢者と障害児者が同じ事業所で", "ホームヘルプ・デイサービス・ショートステイなど", "65歳になっても慣れた事業所を使い続けやすくするしくみ", "2018年度に創設", "居宅系のサービス"], "point": "共生型（2018年〜）＝訪問介護・通所介護・短期入所生活介護など"}, {"id": "a061", "date": "新作", "field": "介護保険制度", "topic": "介護医療院について", "opts": ["介護医療院には、医師を置かなくてよい。", "介護医療院は、長期の療養が必要な要介護者に、医療と介護、生活の場を一体的に提供する施設である。", "介護医療院は、地域密着型サービスに分類される。", "介護医療院は、2018年4月に創設された。", "介護医療院の入所者は、要支援者でもよい。"], "ans": [2, 4], "exp": ["医師を置く", "医療と生活の場", "介護保険施設", "2018年度に創設", "要介護者のみ"], "point": "介護医療院（2018年〜）＝医療＋生活の場・都道府県知事の許可"}, {"id": "a062", "date": "新作", "field": "介護保険制度", "topic": "看護小規模多機能型居宅介護について", "opts": ["要支援者も利用できる。", "登録定員は29人以下である。", "都道府県知事が指定する。", "小規模多機能型居宅介護と訪問看護を組み合わせたサービスである。", "利用者は、ほかの訪問看護事業所の訪問看護を併用しなければならない。"], "ans": [2, 4], "exp": ["要介護者だけ", "小多機と同じく29人以下", "地域密着型サービスなので市町村長", "通い・泊まり・訪問介護・訪問看護", "事業所自身が訪問看護を行う"], "point": "看多機（複合型サービス）＝小多機＋訪問看護・要介護のみ・29人以下"}, {"id": "a063", "date": "新作", "field": "介護保険制度", "topic": "地域密着型介護老人福祉施設入所者生活介護について", "opts": ["要支援者も入所できる。", "新規入所は、原則として要介護3以上である。", "入所定員29人以下の特別養護老人ホームで行われる。", "指定は市町村長が行う。", "都道府県知事が指定する。"], "ans": [2, 3, 4], "exp": ["要介護者のみ", "特養と同じく原則要介護3以上", "小規模な特養", "地域密着型サービス", "市町村長"], "point": "地域密着型特養＝29人以下・市町村長が指定・原則要介護3以上"}, {"id": "a064", "date": "新作", "field": "介護保険制度", "topic": "介護サービスの苦情処理について", "opts": ["国保連は、苦情があった事業者の指定を取り消すことができる。", "国保連は、苦情を受け付けて調査し、事業者に指導・助言を行う。", "苦情の内容は、記録しなくてよい。", "事業者は、利用者からの苦情に迅速かつ適切に対応しなければならない。", "介護支援専門員は、利用者の苦情の受付に協力する必要はない。"], "ans": [2, 4], "exp": ["指定の取消はできない", "国保連の業務", "苦情の内容を記録する", "事業者の義務", "居宅介護支援事業者も苦情の受付や国保連への申立ての援助を行う"], "point": "苦情＝事業者・市町村・国保連が対応。国保連は指導・助言まで"}, {"id": "a065", "date": "新作", "field": "介護保険制度", "topic": "運営推進会議について", "opts": ["運営推進会議には、利用者や家族は参加できない。", "認知症対応型共同生活介護では、おおむね2か月に1回以上開催する。", "運営推進会議の報告や評価は、公表しなくてよい。", "地域密着型通所介護では、おおむね6か月に1回以上開催する。", "小規模多機能型居宅介護では、おおむね2か月に1回以上開催する。"], "ans": [2, 4, 5], "exp": ["利用者・家族・地域の代表・市町村職員などが参加", "2か月に1回", "記録を作って公表する", "6か月に1回", "2か月に1回"], "point": "運営推進会議＝小多機・GHは2か月ごと、地域密着型通所は6か月ごと"}, {"id": "a066", "date": "新作", "field": "介護保険制度", "topic": "介護保険制度の改正の歩みについて", "opts": ["2005年の改正で、地域包括支援センターや地域密着型サービスが創設された。", "介護医療院は、2005年の改正で創設された。", "介護保険制度は、2000年4月に始まった。", "2014年の改正で、特別養護老人ホームの新規入所が原則要介護3以上になった。", "定期巡回・随時対応型訪問介護看護は、2000年の制度開始時からある。"], "ans": [1, 3, 4], "exp": ["2005年改正（2006年施行）", "2017年改正（2018年施行）", "2000年施行", "2014年改正（2015年施行）", "2011年改正（2012年施行）でできた"], "point": "2005包括・地域密着型／2011定期巡回／2014総合事業・特養要介護3／2017介護医療院・共生型"}, {"id": "a067", "date": "新作", "field": "介護保険制度", "topic": "利用者負担の割合について", "opts": ["第2号被保険者も、所得が高ければ3割負担になる。", "3割負担は、2018年8月から導入された。", "居宅介護支援にも、1割の自己負担がある。", "市町村は、要介護・要支援の認定を受けた人に負担割合証を交付する。", "利用者負担は、所得に応じて1割・2割・3割のいずれかである。"], "ans": [2, 4, 5], "exp": ["第2号は一律1割", "現役並み所得の人", "居宅介護支援は自己負担なし", "負担割合証", "所得で決まる"], "point": "1〜3割は第1号のみ。負担割合証で確認"}, {"id": "a068", "date": "新作", "field": "介護保険制度", "topic": "介護予防・生活支援サービス事業について", "opts": ["介護予防・生活支援サービス事業は、都道府県が行う。", "配食や見守りなどの生活支援サービスも含まれる。", "住民主体のボランティアなどもサービスの担い手になれる。", "介護予防・生活支援サービス事業には、介護予防ケアマネジメントは含まれない。", "訪問型サービスと通所型サービスは、介護予防・生活支援サービス事業に含まれる。"], "ans": [2, 3, 5], "exp": ["市町村が行う", "その他の生活支援サービス", "多様な担い手が想定されている", "第1号介護予防支援事業として含まれる", "訪問型・通所型"], "point": "訪問型・通所型・生活支援・介護予防ケアマネジメントの4つ"}, {"id": "a069", "date": "新作", "field": "介護保険制度", "topic": "一般介護予防事業について", "opts": ["一般介護予防事業の対象は、要支援者だけである。", "地域リハビリテーション活動支援事業は、一般介護予防事業に含まれる。", "住民主体の通いの場づくりは、一般介護予防事業の対象外である。", "一般介護予防事業は、国が直接行う。", "介護予防把握事業は、一般介護予防事業に含まれる。"], "ans": [2, 5], "exp": ["すべての第1号被保険者などが対象", "リハ専門職が通いの場などに関わる", "地域介護予防活動支援事業として支援する", "市町村が行う", "支援が必要な人を早く見つける"], "point": "一般介護予防＝把握・普及啓発・地域活動支援・評価・地域リハ活動支援の5つ"}, {"id": "a070", "date": "新作", "field": "介護保険制度", "topic": "認知症総合支援事業について", "opts": ["認知症地域支援推進員は、都道府県にだけ置かれる。", "認知症初期集中支援チームは、認知症が疑われる人や家族を訪問し、初期の支援を集中的に行う。", "認知症総合支援事業は、任意事業である。", "認知症地域支援推進員は、医療・介護・地域の支援をつなぐ役割をもつ。", "認知症初期集中支援チームは、医師を含まない。"], "ans": [2, 4], "exp": ["市町村（地域包括支援センターなど）に置かれる", "おおむね6か月で集中的に支援", "包括的支援事業に含まれる", "連携をつくるコーディネーター", "認知症サポート医などの専門医と、看護師・社会福祉士などの専門職で構成"], "point": "初期集中支援チーム・地域支援推進員＝包括的支援事業"}, {"id": "a071", "date": "新作", "field": "介護保険制度", "topic": "事業者の業務管理体制について", "opts": ["業務管理体制の整備は、大規模な事業者だけの義務である。", "介護サービス事業者は、法令を守るための業務管理体制を整えなければならない。", "業務管理体制は、市町村が整備する。", "業務管理体制の整備として、法令遵守責任者を選ぶ。", "業務管理体制の届出は不要である。"], "ans": [2, 4], "exp": ["規模で内容は変わるが、全事業者が対象", "すべての事業者の義務", "事業者が整備する", "法令遵守責任者の選任はすべての事業者", "事業所の所在地などに応じて国・都道府県・市町村に届け出る"], "point": "業務管理体制＝全事業者・法令遵守責任者を選任・届出が必要"}, {"id": "a072", "date": "新作", "field": "介護保険制度", "topic": "保険給付の対象にならない費用について", "opts": ["理美容代は、保険給付に含まれる。", "おむつ代は、施設サービスでは保険給付に含まれる。", "通所介護のおむつ代は、保険給付に含まれる。", "特別養護老人ホームの居住費は、保険給付に含まれる。", "通所介護での食費は、保険給付の対象外である。"], "ans": [2, 5], "exp": ["理美容代は自己負担", "施設ではおむつ代は介護報酬に含まれ、別に払わない", "通所系のおむつ代は自己負担", "居住費は自己負担（補足給付あり）", "食費は自己負担"], "point": "施設のおむつ代は報酬に含む、通所のおむつ代・食費は自己負担"}, {"id": "a073", "date": "新作", "field": "介護保険制度", "topic": "介護保険の特別会計について", "opts": ["市町村の一般会計から介護保険に繰り入れることは一切できない。", "特別会計には、保険料収入は入らない。", "市町村は、介護保険に関する収入と支出について特別会計を設ける。", "介護保険の特別会計は、一般会計と分けて管理する。", "介護保険の会計は、国が一括して管理する。"], "ans": [3, 4], "exp": ["市町村の負担分（12.5%）などは一般会計から繰り入れる", "保険料も入る", "特別会計を設ける", "一般会計と区別", "市町村ごと"], "point": "市町村は介護保険特別会計で管理"}, {"id": "a074", "date": "新作", "field": "介護保険制度", "topic": "指定居宅サービス事業者の共通の基準について", "opts": ["事業者は、ケアプランがあってもそれに沿わないサービスを自由に提供してよい。", "事業者は、サービスの提供記録を整備しなければならない。", "事業者は、事故が起きても市町村に報告しなくてよい。", "事業者は、従業者の秘密保持のための措置をとらなくてよい。", "事業者は、利用者の病状が急変したときは、主治医への連絡などの措置をとる。"], "ans": [2, 5], "exp": ["居宅サービス計画に沿って提供する", "記録の整備", "市町村・家族・居宅介護支援事業者に連絡する", "従業者が辞めた後も秘密を守るよう措置をとる", "緊急時の対応"], "point": "ケアプランに沿う・記録・緊急時対応・秘密保持・事故報告"}, {"id": "a075", "date": "新作", "field": "介護保険制度", "topic": "居宅介護支援の介護支援専門員の配置について", "opts": ["管理者は、看護師でもよい。", "管理者は、原則として主任介護支援専門員である。", "指定居宅介護支援事業所には、常勤の介護支援専門員を1人以上置く。", "非常勤の介護支援専門員は、居宅介護支援の業務ができない。", "介護支援専門員1人あたりの担当件数に上限の目安はない。"], "ans": [2, 3], "exp": ["主任介護支援専門員が原則", "管理者は主任ケアマネが原則（経過措置あり）", "常勤1人以上", "非常勤でも従事できる", "担当件数に応じて人員基準が定められている"], "point": "居宅介護支援＝常勤ケアマネ1人以上・管理者は主任ケアマネ"}, {"id": "a076", "date": "新作", "field": "介護保険制度", "topic": "介護保険の被保険者になる人について", "opts": ["海外に住んでいる日本人も、第1号被保険者になる。", "40〜64歳で医療保険に加入していない人も、第2号被保険者になる。", "市町村に住所がある65歳以上の人は、第1号被保険者になる。", "被保険者になるには、本人の申込みが必要である。", "日本国籍がなくても、住民票があり要件を満たせば被保険者になる。"], "ans": [3, 5], "exp": ["日本に住所がない人は対象外", "第2号は医療保険加入者のみ", "第1号", "要件を満たせば自動的に被保険者になる（強制加入）", "在留期間が3か月を超えるなど住所があると認められれば対象"], "point": "強制加入・住所が要件・第2号は医療保険加入が要件"}, {"id": "a077", "date": "新作", "field": "介護保険制度", "topic": "介護予防ケアマネジメントと介護予防支援のちがいについて", "opts": ["事業対象者は、介護予防支援の対象である。", "総合事業のサービスだけを使う人のケアマネジメントは、介護予防ケアマネジメントである。", "予防給付のサービスを使う要支援者のケアマネジメントは、介護予防支援である。", "介護予防支援と介護予防ケアマネジメントは、まったく同じものである。", "介護予防ケアマネジメントは、要介護者を対象とする。"], "ans": [2, 3], "exp": ["事業対象者は総合事業だけを使うので介護予防ケアマネジメント", "総合事業のみ利用＝介護予防ケアマネジメント", "予防給付を使う＝介護予防支援", "財源やしくみが異なる", "要支援者・事業対象者が対象"], "point": "予防給付あり→介護予防支援／総合事業のみ→介護予防ケアマネジメント"}, {"id": "a078", "date": "新作", "field": "介護保険制度", "topic": "利用者の居宅サービス計画の変更について", "opts": ["利用者の希望で計画を変更するときも、原則としてアセスメントから一連の流れを行う。", "サービス提供日時の変更など軽微な変更は、一連の業務を行わなくてよい場合がある。", "計画は、市町村の許可がなければ変更できない。", "計画の変更には、利用者の同意は不要である。", "計画を変更したときは、事業者に交付しなくてよい。"], "ans": [1, 2], "exp": ["変更も作成と同じ流れ", "軽微な変更は省略できる", "市町村の許可はいらない", "同意が必要", "変更した計画も交付する"], "point": "変更も作成と同じ流れ。軽微な変更は例外"}, {"id": "a079", "date": "新作", "field": "介護保険制度", "topic": "介護保険と医療保険の関係について", "opts": ["要介護者の訪問看護は、すべて医療保険から給付される。", "要介護者の通院時の診察費用は、介護保険から給付される。", "末期がんの要介護者の訪問看護は、医療保険から給付される。", "介護保険と医療保険を同じ日に使うことは、どんな場合もできない。", "要介護者の訪問リハビリテーションは、原則として介護保険から給付される。"], "ans": [3, 5], "exp": ["要介護者は原則介護保険（例外あり）", "診察は医療保険", "厚生労働大臣が定める疾病等は医療保険", "サービスの種類によっては同じ日に使える", "要介護者は介護保険が優先"], "point": "要介護者は介護保険優先。末期がん・急性増悪時などの訪問看護は医療保険"}, {"id": "a080", "date": "新作", "field": "介護保険制度", "topic": "指定介護老人福祉施設の基準について", "opts": ["入所者が入院したら、すぐに退所させなければならない。", "身体的拘束等の適正化のための対策を検討する委員会を開く。", "入所者の負担で、おむつ代を別に受け取ってよい。", "やむを得ず身体拘束をするときでも、記録は不要である。", "入所者の数に応じて、介護支援専門員を1人以上置く。"], "ans": [2, 5], "exp": ["おおむね3か月以内に退院が見込まれるときは、原則として再び入所できるようにする", "3か月に1回以上委員会を開く", "施設ではおむつ代は受け取れない", "態様・時間・理由などを記録する", "介護支援専門員の配置"], "point": "身体拘束は原則禁止・やむを得ないときは記録・委員会は3か月ごと"}, {"id": "a081", "date": "新作", "field": "介護保険制度", "topic": "身体拘束について", "opts": ["介護保険施設では、緊急やむを得ない場合を除き、身体拘束をしてはならない。", "家族が同意すれば、どんな身体拘束も認められる。", "緊急やむを得ない場合とは、切迫性・非代替性・一時性の3つをすべて満たす場合である。", "ベッドを柵で囲むことは、身体拘束にあたらない。", "身体拘束をした場合でも、記録は不要である。"], "ans": [1, 3], "exp": ["原則禁止", "家族の同意だけでは認められない", "3要件", "四方を柵で囲むなど、自分で降りられないようにすることは身体拘束", "態様・時間・心身の状況・理由を記録する"], "point": "身体拘束の3要件＝切迫性・非代替性・一時性"}, {"id": "a082", "date": "新作", "field": "介護保険制度", "topic": "介護保険の保険料の普通徴収について", "opts": ["普通徴収は、コンビニでは納付できない。", "普通徴収の保険料は、医療保険者が徴収する。", "年金額が年18万円未満の人は、普通徴収になる。", "普通徴収では、世帯主に連帯して納付する義務はない。", "普通徴収は、市町村が納付書などで直接徴収する方法である。"], "ans": [3, 5], "exp": ["市町村によってはコンビニ収納などもある", "市町村", "18万円未満は普通徴収", "世帯主・配偶者に連帯納付義務がある", "納付書・口座振替"], "point": "普通徴収＝市町村が直接・世帯主と配偶者に連帯納付義務"}, {"id": "a083", "date": "新作", "field": "介護保険制度", "topic": "介護保険の事業者情報と利用者の選択について", "opts": ["介護支援専門員は、利用者に複数の事業所を紹介するよう求められたら応じる。", "介護サービス情報の公表制度は、利用者がサービスを選ぶのを助けるためのものである。", "利用者が事業所を選ぶことはできず、介護支援専門員が決める。", "公表される情報は、事業者の宣伝だけである。", "介護サービス情報の公表は、インターネットでは行われていない。"], "ans": [1, 2], "exp": ["複数の紹介を求められることを説明し、応じる", "利用者の選択を支える", "利用者が選ぶ", "運営状況など決められた項目を公表", "インターネットで公表されている"], "point": "利用者の選択を支える（情報公表・複数事業所の紹介）"}, {"id": "a084", "date": "新作", "field": "介護保険制度", "topic": "地域包括ケアシステムについて", "opts": ["地域包括ケアシステムは、施設への入所を増やすことを目的とする。", "地域包括ケアシステムは、住まい・医療・介護・予防・生活支援が一体的に提供されるしくみである。", "自助・互助は、地域包括ケアシステムには含まれない。", "おおむね30分以内に必要なサービスが提供される日常生活圏域（中学校区など）を単位に想定されている。", "地域包括ケアシステムづくりは、国だけの役割である。"], "ans": [2, 4], "exp": ["住み慣れた地域で暮らし続けることが目的", "5つの要素", "自助・互助・共助・公助の組み合わせ", "日常生活圏域", "市町村が中心となり地域の特性に応じてつくる"], "point": "住まい・医療・介護・予防・生活支援／日常生活圏域／自助・互助・共助・公助"}, {"id": "a085", "date": "新作", "field": "保健医療", "topic": "老年症候群について", "opts": ["高齢者の病気は、若い人と同じ典型的な症状が出やすい。", "老年症候群には、認知機能の低下、転倒、尿失禁、低栄養などが含まれる。", "老年症候群とは、高齢者に多くみられ、医療と介護の両方が必要になる症状や状態のまとまりをいう。", "高齢者は、いくつもの病気を同時にもつことは少ない。", "老年症候群は、一つの病気だけが原因で起こる。"], "ans": [2, 3], "exp": ["症状が典型的でないことが多い", "代表的な症状", "高齢者特有の症状のまとまり", "複数の病気をもつことが多い（多病）", "複数の原因が重なって起こることが多い"], "point": "高齢者は多病・症状が非典型・老年症候群"}, {"id": "a086", "date": "新作", "field": "保健医療", "topic": "フレイルについて", "opts": ["フレイルは、体の問題だけで、社会的な孤立とは関係がない。", "フレイルになったら、運動は控えたほうがよい。", "フレイルとは、加齢で心身の活力が低下し、要介護状態になる危険が高まった状態をいう。", "フレイルは、適切な対応で健康な状態に戻ることがある。", "体重減少、疲れやすさ、握力の低下、歩く速さの低下、身体活動の低下が評価の目安になる。"], "ans": [3, 4, 5], "exp": ["身体的・精神心理的・社会的フレイルがある", "運動・栄養・社会参加で予防・改善", "健康と要介護の中間", "可逆性がある", "5項目のうち3つ以上でフレイル、1〜2つでプレフレイル"], "point": "フレイルは戻れる。運動・栄養・社会参加"}, {"id": "a087", "date": "新作", "field": "保健医療", "topic": "サルコペニアについて", "opts": ["サルコペニアとは、加齢などにより筋肉量が減り、筋力や身体機能が低下した状態をいう。", "サルコペニアの予防には、安静にしているのがいちばんよい。", "サルコペニアの予防には、たんぱく質をとることと運動が大切である。", "サルコペニアは、転倒や骨折の原因になりやすい。", "サルコペニアは、若い人だけにみられる。"], "ans": [1, 3, 4], "exp": ["筋肉量と筋力の低下", "安静は筋肉を減らす", "栄養と運動", "転倒しやすくなる", "高齢者に多い"], "point": "サルコペニア＝筋肉の減少→たんぱく質＋運動"}, {"id": "a088", "date": "新作", "field": "保健医療", "topic": "廃用症候群（生活不活発病）について", "opts": ["長く安静にしていると、筋力の低下や関節の拘縮が起こる。", "起き上がったときに、起立性低血圧を起こしやすくなる。", "廃用症候群は、一度起こると改善しない。", "廃用症候群は、心の状態には影響しない。", "廃用症候群の予防には、できるだけ寝ている時間を長くする。"], "ans": [1, 2], "exp": ["筋萎縮・関節拘縮", "起立性低血圧", "リハビリで改善が期待できる", "抑うつ・意欲低下も起こる", "早めに体を動かすことが大切"], "point": "廃用症候群＝筋萎縮・拘縮・起立性低血圧・褥瘡・抑うつ。早期離床で予防"}, {"id": "a089", "date": "新作", "field": "保健医療", "topic": "高齢者の転倒について", "opts": ["転倒による骨折は、要介護状態になる原因の一つである。", "転倒予防のためには、歩く機会を減らすのがよい。", "室内は段差がないので、転倒はほとんど起こらない。", "睡眠薬などの薬は、ふらつきの原因になることがある。", "転んだ経験があると、転倒への不安から活動が減ることがある。"], "ans": [1, 4, 5], "exp": ["大腿骨頸部骨折など", "筋力・バランスを保つ運動が予防になる", "自宅内での転倒は多い", "睡眠薬・降圧薬などに注意", "転倒後症候群"], "point": "転倒の原因＝体・薬・環境。転倒後の不安にも注意"}, {"id": "a090", "date": "新作", "field": "保健医療", "topic": "関節リウマチについて", "opts": ["関節リウマチは、使いすぎた関節だけに起こる。", "関節リウマチは、介護保険の特定疾病に含まれる。", "朝起きたときに、関節のこわばりがみられる。", "関節リウマチでは、関節の痛みが強いときほど積極的に動かす。", "関節リウマチは、女性に多い。"], "ans": [2, 3, 5], "exp": ["自己免疫の病気で、左右対称に複数の関節に起こりやすい", "特定疾病のひとつ", "朝のこわばり", "痛みが強いときは安静にし、関節に負担をかけない", "30〜50代の女性に多い"], "point": "リウマチ＝女性・朝のこわばり・左右対称・関節保護"}, {"id": "a091", "date": "新作", "field": "保健医療", "topic": "変形性膝関節症について", "opts": ["肥満は、悪化させる原因の一つである。", "正座を続けると、膝への負担が少なくなる。", "変形性膝関節症は、男性に多い。", "太ももの筋肉を鍛えることは、症状の改善に役立つ。", "膝の軟骨がすり減ることで、痛みや変形が起こる。"], "ans": [1, 4, 5], "exp": ["体重が膝の負担になる", "正座は膝の負担が大きい", "女性に多い", "大腿四頭筋の筋力強化", "軟骨のすり減り"], "point": "変形性膝関節症＝女性・肥満・O脚。筋力強化と体重管理"}, {"id": "a092", "date": "新作", "field": "保健医療", "topic": "脊柱管狭窄症について", "opts": ["背中をそらす姿勢をとると、症状が楽になる。", "歩くと足にしびれや痛みが出て、休むとまた歩けるようになる（間欠性跛行）のが特徴である。", "脊柱管狭窄症は、若い人に多い。", "骨折を伴う骨粗鬆症などと並んで、介護保険の特定疾病に含まれる。", "前かがみの姿勢をとると、症状が楽になることが多い。"], "ans": [2, 4, 5], "exp": ["そらすと悪化しやすい", "間欠性跛行", "中高年に多い", "特定疾病のひとつ", "前かがみで楽（シルバーカーや自転車は楽なことが多い）"], "point": "脊柱管狭窄症＝間欠性跛行・前かがみで楽"}, {"id": "a093", "date": "新作", "field": "保健医療", "topic": "心不全について", "opts": ["心不全の人には、水分の制限が必要になることはない。", "心不全の人は、塩分を多めにとったほうがよい。", "息切れやむくみは、心不全の症状である。", "横になると息苦しく、起き上がると楽になる起座呼吸がみられることがある。", "急な体重の増加は、心不全の悪化のサインのことがある。"], "ans": [3, 4, 5], "exp": ["医師の指示で水分制限することがある", "塩分は控える", "代表的な症状", "起座呼吸", "体に水がたまると体重が増える"], "point": "心不全＝息切れ・むくみ・起座呼吸・体重増加。減塩"}, {"id": "a094", "date": "新作", "field": "保健医療", "topic": "狭心症と心筋梗塞について", "opts": ["高齢者の心筋梗塞では、胸の痛みがはっきりしないことがある。", "狭心症の発作は、運動で起こることはない。", "心筋梗塞の痛みは、ニトログリセリンですぐにおさまる。", "心筋梗塞は、時間がたってから病院に行っても治療の効果は変わらない。", "狭心症の発作には、ニトログリセリンの舌下投与が使われる。"], "ans": [1, 5], "exp": ["息切れや吐き気だけのこともある", "労作性狭心症は動いたときに起こる", "心筋梗塞ではニトログリセリンが効きにくい", "発症から早いほど治療効果が高い。すぐ救急車", "舌下で使う"], "point": "高齢者は症状が非典型。心筋梗塞はニトロが効かない→すぐ救急"}, {"id": "a095", "date": "新作", "field": "保健医療", "topic": "心房細動について", "opts": ["心房細動は、脳梗塞（心原性脳塞栓症）の原因になる。", "抗凝固薬を飲んでいる人は、出血しにくくなる。", "心房細動では、脈が不規則になる。", "心房細動の人には、血液をかたまりにくくする薬が使われることがある。", "心房細動は、若い人だけに起こる。"], "ans": [1, 3, 4], "exp": ["心臓でできた血栓が脳に飛ぶ", "出血しやすくなるので、けがや内出血に注意", "不規則な脈", "抗凝固薬", "高齢になるほど多い"], "point": "心房細動→脳塞栓の危険→抗凝固薬（出血に注意）"}, {"id": "a096", "date": "新作", "field": "保健医療", "topic": "高齢者の高血圧について", "opts": ["高齢者の血圧は、加齢により下がることが多い。", "病院で測ると高く、家では正常な人がいる（白衣高血圧）。", "降圧薬を飲んでいる高齢者は、起立性低血圧に注意する。", "高血圧は、自覚症状がはっきり出るので気づきやすい。", "高血圧の治療では、減塩が大切である。"], "ans": [2, 3, 5], "exp": ["動脈が硬くなり、収縮期血圧が上がりやすい", "家庭血圧も参考にする", "立ちくらみ・転倒に注意", "自覚症状が少ない", "食塩は1日6g未満が目標とされる"], "point": "高血圧＝減塩・起立性低血圧に注意・家庭血圧も大切"}, {"id": "a097", "date": "新作", "field": "保健医療", "topic": "慢性閉塞性肺疾患（COPD）について", "opts": ["COPDの人は、運動はしないほうがよい。", "COPDの最大の原因は、喫煙である。", "インフルエンザや肺炎球菌の予防接種がすすめられる。", "COPDでは、息を吸うときより吐くときが楽である。", "口すぼめ呼吸は、息切れをやわらげるのに役立つ。"], "ans": [2, 3, 5], "exp": ["呼吸リハビリテーションが勧められる", "たばこ", "感染で悪化しやすい", "息を吐きにくくなる", "ゆっくり息を吐く"], "point": "COPD＝たばこ・口すぼめ呼吸・予防接種・呼吸リハ"}, {"id": "a098", "date": "新作", "field": "保健医療", "topic": "高齢者の肺炎について", "opts": ["高齢者の肺炎は、必ずせきとたんが出る。", "高齢者の肺炎は、熱が高く出ないことがある。", "肺炎は、高齢者の死因にはならない。", "食欲がない、元気がないといった症状だけのこともある。", "肺炎球菌ワクチンは、肺炎の予防に役立つ。"], "ans": [2, 4, 5], "exp": ["せき・たんが目立たないことも", "発熱がはっきりしない", "死因の上位", "なんとなく元気がない", "定期接種の対象"], "point": "高齢者の肺炎は症状が出にくい。いつもとちがうに気づく"}, {"id": "a099", "date": "新作", "field": "保健医療", "topic": "結核について", "opts": ["結核は、空気感染する。", "高齢者では、昔感染した結核菌が再び活動して発病することがある。", "結核は、現在の日本ではまったく発生していない。", "結核は、接触感染だけで広がる。", "結核が疑われる人のケアでは、N95マスクを使う。"], "ans": [1, 2, 5], "exp": ["空気感染（飛沫核感染）", "免疫が落ちて再燃する", "高齢者を中心に今も発生している", "空気感染", "N95マスク（患者はサージカルマスク）"], "point": "結核＝空気感染・N95マスク・高齢者の再燃"}, {"id": "a100", "date": "新作", "field": "保健医療", "topic": "インフルエンザについて", "opts": ["インフルエンザは、主に飛沫感染で広がる。", "インフルエンザは、空気感染だけで広がる。", "インフルエンザは、高齢者でも重症になることはない。", "高齢者には、予防接種がすすめられる。", "抗インフルエンザ薬は、発症から48時間以内に使うと効果が高い。"], "ans": [1, 4, 5], "exp": ["せき・くしゃみの飛沫（接触感染もある）", "主に飛沫・接触", "肺炎を起こし重症化しやすい", "65歳以上は定期接種", "早めの受診"], "point": "インフル＝飛沫・予防接種・48時間以内の治療"}, {"id": "a101", "date": "新作", "field": "保健医療", "topic": "疥癬について", "opts": ["角化型疥癬の人のケアでは、一定期間の個室管理が必要になる。", "角化型（ノルウェー）疥癬は、感染力が非常に強い。", "疥癬のかゆみは、昼間だけに強くなる。", "疥癬は、ヒゼンダニが皮膚に寄生して起こる。", "疥癬は、空気感染する。"], "ans": [1, 2, 4], "exp": ["個室・予防衣・手袋", "ダニの数が非常に多い", "夜間に強いことが多い", "ダニによる", "接触感染（寝具・衣類も）"], "point": "疥癬＝ヒゼンダニ・接触感染。角化型は感染力が強く個室"}, {"id": "a102", "date": "新作", "field": "保健医療", "topic": "MRSAについて", "opts": ["MRSAは、空気感染する。", "MRSAの保菌者は、通所サービスを一切利用できない。", "MRSAを保菌しているだけで症状がない人は、一般に隔離の必要はない。", "MRSAは、多くの抗生物質が効きにくい黄色ブドウ球菌である。", "標準予防策（スタンダード・プリコーション）を守ることが大切である。"], "ans": [3, 4, 5], "exp": ["主に接触感染", "保菌を理由にサービスを断るのは適切でない", "保菌だけなら過度な制限はいらない", "薬剤耐性菌", "手洗い・手袋など"], "point": "MRSA＝接触感染・標準予防策・保菌者を過度に制限しない"}, {"id": "a103", "date": "新作", "field": "保健医療", "topic": "帯状疱疹について", "opts": ["帯状疱疹には、予防のためのワクチンはない。", "治ったあとも、神経の痛みが長く続くことがある。", "帯状疱疹は、水ぼうそう（水痘）のウイルスが体の中で再び活動して起こる。", "体の片側に、帯のように水ぶくれと痛みが出る。", "帯状疱疹は、一度かかったら二度とかからない。"], "ans": [2, 3, 4], "exp": ["50歳以上などにワクチンがある", "帯状疱疹後神経痛", "免疫が落ちたときに再活性化", "片側に出る", "再発することもある"], "point": "帯状疱疹＝水痘ウイルスの再活性化・片側・後遺の神経痛"}, {"id": "a104", "date": "新作", "field": "保健医療", "topic": "高齢者の目の病気について", "opts": ["緑内障は、初期から自覚症状がはっきりしている。", "緑内障は、日本の中途失明の原因の上位である。", "白内障は、目の水晶体がにごる病気で、手術で治療できる。", "白内障は、ほとんど高齢者に起こらない。", "緑内障は、視野が少しずつ欠けていく病気である。"], "ans": [2, 3, 5], "exp": ["初期は気づきにくい", "失明原因の上位", "水晶体のにごり", "加齢で多くなる", "視神経の障害で視野が欠ける"], "point": "白内障＝水晶体・手術／緑内障＝視野欠損・失明原因上位・早期発見"}, {"id": "a105", "date": "新作", "field": "保健医療", "topic": "加齢による難聴について", "opts": ["補聴器は、使い始めに調整や慣れが必要である。", "聞こえにくい人には、大声で高い声を出すのがいちばんよい。", "加齢による難聴は、片方の耳だけに起こる。", "話しかけるときは、正面から、ゆっくり、はっきり話す。", "加齢による難聴は、高い音から聞こえにくくなる。"], "ans": [1, 4, 5], "exp": ["調整と慣れが必要", "大声・高い声はかえって聞き取りにくい。低めの声でゆっくり", "両耳に起こることが多い", "口元が見えるように", "高音域から"], "point": "高音から聞こえにくい→低めの声でゆっくり、正面から"}, {"id": "a106", "date": "新作", "field": "保健医療", "topic": "前立腺肥大症について", "opts": ["前立腺肥大症は、男性だけにみられる。", "前立腺肥大症では、水分をとるほど悪化するので、水分はとらないほうがよい。", "尿が出にくい、残尿感がある、夜間頻尿などの症状がある。", "一部の風邪薬など抗コリン作用のある薬で、尿が出なくなることがある。", "前立腺肥大症は、女性にも多い。"], "ans": [1, 3, 4], "exp": ["男性の病気", "水分を極端に控えると脱水になる", "排尿障害", "尿閉に注意", "前立腺は男性にしかない"], "point": "前立腺肥大＝男性・排尿困難・抗コリン薬で尿閉"}, {"id": "a107", "date": "新作", "field": "保健医療", "topic": "尿失禁の種類について", "opts": ["腹圧性尿失禁には、骨盤底筋訓練が効果的である。", "腹圧性尿失禁は、せきやくしゃみでおなかに力が入ったときにもれるもので、女性に多い。", "切迫性尿失禁は、膀胱に尿がたまりすぎてあふれ出るものである。", "機能性尿失禁は、トイレの場所がわからない、移動に時間がかかるなどが原因で起こる。", "尿失禁があれば、すぐにおむつを使うのがよい。"], "ans": [1, 2, 4], "exp": ["骨盤底筋訓練", "腹圧性", "あふれ出るのは溢流性。切迫性は急に強い尿意がきて間に合わない", "認知機能や運動機能の低下による", "原因に合わせた対応が先。安易なおむつは自立をさまたげる"], "point": "腹圧性・切迫性・溢流性・機能性を区別する"}, {"id": "a108", "date": "新作", "field": "保健医療", "topic": "高齢者の便秘について", "opts": ["下剤は、いつも同じ量を長く使い続けるのがよい。", "薬の副作用で便秘になることがある。", "便秘のときは、水分を控えたほうがよい。", "運動不足は、便秘の原因になる。", "水分や食物繊維が少ないと、便秘になりやすい。"], "ans": [2, 4, 5], "exp": ["状態に合わせて調整する。医師に相談", "鎮痛薬・抗コリン薬など", "水分は十分にとる", "腸の動きが弱まる", "食事の内容"], "point": "便秘＝水分・食物繊維・運動・薬の副作用をチェック"}, {"id": "a109", "date": "新作", "field": "保健医療", "topic": "高齢者の低栄養について", "opts": ["体重が短い期間で減っているときは、低栄養を疑う。", "低栄養は、肥満の人には起こらない。", "低栄養は、褥瘡や感染症とは関係がない。", "血清アルブミン値が低いことは、低栄養の目安になる。", "BMIが18.5未満のときは、やせと判断される。"], "ans": [1, 4, 5], "exp": ["体重減少が大切なサイン", "肥満でもたんぱく質不足は起こる", "褥瘡・感染症・筋力低下の原因になる", "3.5g/dL以下が目安", "BMI＝体重(kg)÷身長(m)÷身長(m)"], "point": "低栄養の目安＝アルブミン・BMI・体重減少"}, {"id": "a110", "date": "新作", "field": "保健医療", "topic": "摂食・嚥下について", "opts": ["食事のときは、いすに深く座り、あごを軽く引いた姿勢がよい。", "水分でむせる人には、とろみをつけることがある。", "摂食・嚥下は、先行期・準備期・口腔期・咽頭期・食道期の5つの段階に分けて考えられる。", "食事中は、話しかけてたくさん話してもらうのがよい。", "飲み込みにくい人には、さらさらの水がいちばん飲みやすい。"], "ans": [1, 2, 3], "exp": ["安全な姿勢", "とろみで流れる速さをゆっくりに", "5期モデル", "飲み込むときに話すと誤嚥しやすい", "さらさらの水は速く流れてむせやすい"], "point": "5期モデル・とろみ・あごを引く姿勢"}, {"id": "a111", "date": "新作", "field": "保健医療", "topic": "慢性腎不全と人工透析について", "opts": ["透析をしている人は、果物や生野菜をたくさんとるのがよい。", "シャントのある腕で重い荷物を持つのはよい運動になる。", "透析をしている人は、水分や塩分、カリウムを制限することが多い。", "血液透析は、一般的に週3回程度、医療機関で行われる。", "人工透析を受けている人は、シャントのある腕で血圧を測らない。"], "ans": [3, 4, 5], "exp": ["カリウムが多いので制限されることが多い", "シャントを圧迫しない", "医師の指示に従う", "1回4時間程度・週3回が多い", "シャントを守る"], "point": "透析＝シャントを守る・水分・塩分・カリウム制限"}, {"id": "a112", "date": "新作", "field": "保健医療", "topic": "高齢者の熱中症について", "opts": ["高齢者は、暑さやのどの渇きを感じにくい。", "熱中症は、室内でも起こる。", "高齢者は汗をかきやすいので、熱中症になりにくい。", "熱中症は、夜には起こらない。", "エアコンを適切に使うことは、熱中症の予防に役立つ。"], "ans": [1, 2, 5], "exp": ["感覚が鈍くなる", "室内での発症が多い", "体温を調節する力が落ちていて、なりやすい", "夜間も起こる", "がまんせず使う"], "point": "高齢者は暑さ・渇きを感じにくい→室内でも熱中症"}, {"id": "a113", "date": "新作", "field": "保健医療", "topic": "アルツハイマー型認知症について", "opts": ["ゆっくりと少しずつ進行する。", "症状が急に出て、日によって大きく変わるのが特徴である。", "もの忘れ（記憶障害）から始まることが多い。", "アルツハイマー型認知症は、男性に多い。", "忘れたことを、その場の話でうまくごまかす「取り繕い」がみられることがある。"], "ans": [1, 3, 5], "exp": ["緩やかに進行", "急な発症や変動はせん妄やレビー小体型などで目立つ", "記憶障害", "女性に多い", "取り繕い反応"], "point": "アルツハイマー型＝記憶障害から・ゆっくり進行・取り繕い・女性に多い"}, {"id": "a114", "date": "新作", "field": "保健医療", "topic": "認知症の薬について", "opts": ["薬の副作用で、食欲不振や吐き気が出ることがある。", "認知症の薬は、飲み忘れても問題はない。", "認知症の人には、薬の管理をすべて本人に任せるのがよい。", "今使われている薬で、認知症は完全に治る。", "アルツハイマー型認知症の薬には、症状の進行をゆるやかにすることを目的とするものがある。"], "ans": [1, 5], "exp": ["消化器の症状などの副作用", "決められたとおりに飲むことが大切", "服薬の支援（一包化・お薬カレンダーなど）を考える", "根本的に治す薬はまだ限られている", "ドネペジルなど"], "point": "認知症の薬は進行を遅らせるもの。服薬管理の支援が大切"}, {"id": "a115", "date": "新作", "field": "保健医療", "topic": "認知症の人への関わり方について", "opts": ["本人のペースに合わせて、ゆっくり関わる。", "本人の言うことを頭ごなしに否定しない。", "その人らしさを大切にするパーソン・センタード・ケアの考え方が大切である。", "まちがいはその場ですぐに強く指摘して直してもらう。", "認知症の人には、何を話しても理解できないので説明はいらない。"], "ans": [1, 2, 3], "exp": ["本人のペースで", "否定や叱責は混乱を強める", "人として尊重するケア", "強い指摘は不安や怒りを招く", "わかりやすく説明する。感情は残っている"], "point": "否定しない・本人のペース・パーソン・センタード・ケア"}, {"id": "a116", "date": "新作", "field": "保健医療", "topic": "せん妄について", "opts": ["薬・脱水・感染症・手術などがきっかけになる。", "夕方から夜にかけて悪化しやすい。", "せん妄と認知症は、まったく同じものである。", "せん妄は、原因がなくても徐々に何年もかけて進む。", "せん妄は、急に起こり、症状が1日の中でも変動する。"], "ans": [1, 2, 5], "exp": ["原因を取り除くと改善することが多い", "夜間せん妄", "別のもの。認知症の人に重なって起こることも多い", "進行がゆっくりなのは認知症", "急な発症・変動"], "point": "せん妄＝急に起こる・変動する・原因がある→原因に対応"}, {"id": "a117", "date": "新作", "field": "保健医療", "topic": "軽度認知障害（MCI）について", "opts": ["記憶などの認知機能が低下しているが、日常生活はほぼ自立している状態をいう。", "MCIの段階では、運動などの予防的な取組みは意味がない。", "MCIの人の一部は、認知症に移行する。", "MCIから正常な状態に戻る人もいる。", "MCIは、すでに認知症であると診断された状態である。"], "ans": [1, 3, 4], "exp": ["日常生活はほぼ自立", "運動・社会参加などが勧められる", "年に1〜2割程度が移行するといわれる", "回復する人もいる", "認知症の手前の状態"], "point": "MCI＝生活は自立・一部は認知症へ・戻る人もいる"}, {"id": "a118", "date": "新作", "field": "保健医療", "topic": "認知機能の評価について", "opts": ["改訂長谷川式簡易知能評価スケール（HDS-R）は、30点満点である。", "HDS-Rは、点数が高いほど認知症の疑いが強い。",
