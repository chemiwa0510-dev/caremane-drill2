 "HDS-Rの点数だけで、認知症の診断が確定する。", "MMSE（ミニメンタルステート検査）も、認知機能の評価に使われる。", "HDS-Rでは、20点以下だと認知症の疑いがあるとされる。"], "ans": [1, 4, 5], "exp": ["30点満点", "点数が低いほど疑いが強い", "点数だけでは診断できない", "30点満点の検査", "20点以下で疑い"], "point": "HDS-R・MMSEは30点満点。HDS-Rは20点以下で疑い"}, {"id": "a119", "date": "新作", "field": "保健医療", "topic": "筋萎縮性側索硬化症（ALS）について", "opts": ["ALSは、介護保険の特定疾病に含まれる。", "ALSでは、知能や感覚は保たれることが多い。", "ALSは、治療によって完全に治る病気である。", "ALSでは、手足や飲み込み、呼吸の筋肉が少しずつ弱くなる。", "ALSでは、感覚がなくなって褥瘡ができやすい。"], "ans": [1, 2, 4], "exp": ["特定疾病のひとつ", "目の動きや感覚・知能は保たれやすい", "進行性の難病", "運動神経の障害", "感覚は保たれ、褥瘡はできにくいとされる"], "point": "ALS＝筋力低下・知能や感覚は保たれる・呼吸の管理・意思伝達の支援"}, {"id": "a120", "date": "新作", "field": "保健医療", "topic": "脊髄小脳変性症について", "opts": ["脊髄小脳変性症は、急に発症してすぐに治る。", "ふらつきや、手足がうまく動かせない運動失調が主な症状である。", "ろれつが回らない（構音障害）ことがある。", "脊髄小脳変性症では、転倒の心配はない。", "介護保険の特定疾病に含まれる。"], "ans": [2, 3, 5], "exp": ["ゆっくり進行する", "運動失調", "構音障害", "ふらつくので転倒に注意", "特定疾病のひとつ"], "point": "脊髄小脳変性症＝運動失調・ふらつき・構音障害・転倒注意"}, {"id": "a121", "date": "新作", "field": "保健医療", "topic": "高齢者の睡眠について", "opts": ["睡眠薬を飲んでいる人は、夜中にトイレに行くときの転倒に注意する。", "朝早く目が覚めることが多くなる。", "昼寝は長ければ長いほど、夜よく眠れる。", "高齢者は若い人より長く深く眠るのがふつうである。", "高齢になると、眠りが浅くなり夜中に目が覚めやすくなる。"], "ans": [1, 2, 5], "exp": ["ふらつき", "早朝覚醒", "長い昼寝は夜の睡眠をさまたげる。短めにする", "眠りは浅く短くなる", "中途覚醒"], "point": "高齢者の睡眠＝浅い・早朝覚醒。睡眠薬はふらつきに注意"}, {"id": "a122", "date": "新作", "field": "保健医療", "topic": "検査値について", "opts": ["AST・ALTは、腎臓の働きの目安である。", "血清アルブミンが高いほど、低栄養である。", "CRPは、体の中の炎症の強さの目安になる。", "HbA1cは、過去1〜2か月の血糖の状態を反映する。", "eGFRは、腎臓の働きの目安になる。"], "ans": [3, 4, 5], "exp": ["AST・ALTは主に肝臓の目安", "アルブミンが低いと低栄養", "炎症・感染で上がる", "糖尿病の管理の指標", "値が低いほど腎機能が低い"], "point": "HbA1c＝血糖・CRP＝炎症・eGFR＝腎臓・AST/ALT＝肝臓・アルブミン＝栄養"}, {"id": "a123", "date": "新作", "field": "保健医療", "topic": "心肺蘇生とAEDについて", "opts": ["胸骨圧迫は、1分間に100〜120回のテンポで行う。", "AEDは、医療職しか使ってはいけない。", "胸骨圧迫は、AEDが届くまで始めないほうがよい。", "呼びかけに反応がなく、普段どおりの呼吸がなければ、すぐに胸骨圧迫を始める。", "AEDは、電源を入れたら音声の指示に従って使う。"], "ans": [1, 4, 5], "exp": ["強く・速く・絶え間なく", "誰でも使える", "AEDを待たずに始める", "119番とAEDを頼んで、すぐに胸骨圧迫", "音声ガイドに従う"], "point": "反応なし・普段どおりの呼吸なし→119番・AED・胸骨圧迫（100〜120回/分）"}, {"id": "a124", "date": "新作", "field": "保健医療", "topic": "食べ物がのどにつまったとき（窒息）の対応について", "opts": ["すぐに水を飲ませて流し込む。", "反応がなくなったら、119番通報して心肺蘇生を始める。", "口の中が見えないときは、指で奥まで探って取り出す。", "せきができるなら、まず強くせきをするよう促す。", "背中を手のひらで強くたたく背部叩打法を行う。"], "ans": [2, 4, 5], "exp": ["水を飲ませると悪化する", "意識がなくなったら心肺蘇生", "見えないものを指で探ると押し込むおそれがある", "自分でせきをするのがいちばん", "背部叩打法（腹部突き上げ法もある）"], "point": "窒息＝せき→背部叩打・腹部突き上げ→反応なしなら心肺蘇生"}, {"id": "a125", "date": "新作", "field": "保健医療", "topic": "けがややけどの応急手当について", "opts": ["やけどでできた水ぶくれは、すぐにつぶしたほうがよい。", "服の上からやけどしたときは、服を着たまま冷やす。", "出血しているときは、傷口を心臓より低くする。", "やけどをしたら、すぐに流水で冷やす。", "出血しているときは、清潔な布などで傷口を直接おさえる（直接圧迫止血）。"], "ans": [2, 4, 5], "exp": ["つぶすと感染しやすい", "無理に脱がすと皮膚がはがれる", "できれば心臓より高くする", "流水で十分に冷やす", "直接圧迫が基本"], "point": "止血は直接圧迫・やけどは流水で冷やす・水ぶくれはつぶさない"}, {"id": "a126", "date": "新作", "field": "保健医療", "topic": "経管栄養（胃ろう）について", "opts": ["胃ろうの人でも、口腔ケアは必要である。", "注入が終わったら、すぐに体を平らに寝かせる。", "胃ろうがあっても、入浴はできる。", "栄養剤を注入するときは、上半身を起こした姿勢にする。", "胃ろうの人は、口から食べることを一切してはいけない。"], "ans": [1, 3, 4], "exp": ["口の中の細菌を減らし肺炎を予防", "しばらく上半身を起こしておく", "主治医の確認のうえ入浴できる", "逆流・誤嚥を防ぐ", "医師が認めれば楽しみ程度に口から食べられることもある"], "point": "胃ろう＝上半身を起こす・口腔ケア必要・入浴できる"}, {"id": "a127", "date": "新作", "field": "保健医療", "topic": "在宅中心静脈栄養法について", "opts": ["在宅中心静脈栄養法は、腸が使える人に優先して行われる。", "太い静脈にカテーテルを入れて、高カロリーの栄養を入れる方法である。", "カテーテルからの感染に注意が必要である。", "中心静脈栄養の人は、一切入浴できない。", "入浴は、カテーテルの部分を保護すればできることが多い。"], "ans": [2, 3, 5], "exp": ["腸が使える人は経管栄養などが優先される", "中心静脈から栄養", "発熱などは感染のサイン", "保護すれば入浴できることが多い", "保護して入浴"], "point": "中心静脈栄養＝感染に注意・入浴は保護して"}, {"id": "a128", "date": "新作", "field": "保健医療", "topic": "ストーマ（人工肛門・人工膀胱）について", "opts": ["ストーマのまわりの皮膚の状態を観察することが大切である。", "パウチにたまった排泄物を捨てることは、介護職も行える。", "ストーマがある人は、外出してはいけない。", "ストーマの装具は、一度つけたら交換しない。", "ストーマがあっても、入浴はできる。"], "ans": [1, 2, 5], "exp": ["皮膚トラブルに注意", "パウチの排泄物の処理は医行為ではない", "外出も旅行もできる", "定期的に交換する", "装具をつけたまま、または外して入浴できる"], "point": "ストーマ＝入浴OK・外出OK・皮膚の観察・排泄物の処理は介護職も可"}, {"id": "a129", "date": "新作", "field": "保健医療", "topic": "インスリン療法と低血糖について", "opts": ["低血糖になると、冷や汗、手のふるえ、動悸などの症状が出る。", "インスリンを使っている人は、低血糖に注意が必要である。", "低血糖の症状は、高齢者でははっきり出やすい。", "低血糖のときは、ブドウ糖や砂糖をとる。", "食事がとれないときも、インスリンはいつもと同じ量を打つのが原則である。"], "ans": [1, 2, 4], "exp": ["典型的な症状", "インスリン・飲み薬で起こる", "高齢者は症状が出にくく、意識障害や異常行動だけのこともある", "すぐに糖分をとる", "食べられないとき（シックデイ）は医師の指示に従う"], "point": "低血糖＝冷や汗・ふるえ・動悸→ブドウ糖。シックデイは医師の指示"}, {"id": "a130", "date": "新作", "field": "保健医療", "topic": "在宅人工呼吸療法について", "opts": ["在宅人工呼吸療法の人には、たんの吸引が必要になることが多い。", "停電や災害に備えて、予備のバッテリーや連絡先を確認しておく。", "人工呼吸器のアラームが鳴っても、様子を見ればよい。", "マスクで行う非侵襲的陽圧換気（NPPV）と、気管切開をして行う方法（TPPV）がある。", "人工呼吸器を使っている人は、在宅では生活できない。"], "ans": [1, 2, 4], "exp": ["吸引が必要なことが多い", "停電対策が大切", "すぐに原因を確認する", "NPPVとTPPV", "在宅でも生活できる"], "point": "在宅人工呼吸＝NPPV/TPPV・停電対策・アラーム対応・吸引"}, {"id": "a131", "date": "新作", "field": "保健医療", "topic": "介護職員などによる喀痰吸引について", "opts": ["介護職員は、医師の指示がなくても喀痰吸引を行える。", "介護職員が行える喀痰吸引は、口の中・鼻の中・気管カニューレの内部である。", "一定の研修を受けた介護職員などは、医師の指示のもとで喀痰吸引を行える。", "喀痰吸引を行う事業者は、都道府県知事への登録が必要である。", "研修を受けていなくても、介護福祉士でなくても、誰でも喀痰吸引を行える。"], "ans": [2, 3, 4], "exp": ["医師の指示が必要", "範囲が決まっている", "認定特定行為業務従事者・介護福祉士", "登録事業者", "研修などが必要"], "point": "喀痰吸引＝研修・医師の指示・登録事業者。範囲は口腔・鼻腔・気管カニューレ内"}, {"id": "a132", "date": "新作", "field": "保健医療", "topic": "医行為ではないとされる行為について", "opts": ["褥瘡の処置", "わきの下での体温測定", "インスリンの注射", "皮膚への軟膏の塗布（床ずれの処置を除く）", "自動血圧測定器による血圧測定"], "ans": [2, 4, 5], "exp": ["医行為", "医行為ではない", "医行為。介護職は行えない", "医行為ではない", "医行為ではない"], "point": "体温・自動血圧計・パルスオキシメーター・軟膏・湿布・目薬などは条件付きで医行為ではない"}, {"id": "a133", "date": "新作", "field": "保健医療", "topic": "訪問リハビリテーションについて", "opts": ["理学療法士・作業療法士・言語聴覚士が、利用者の居宅を訪問して行う。", "訪問リハビリテーションは、通院できる人だけが対象である。", "病院・診療所・介護老人保健施設・介護医療院が提供できる。", "訪問リハビリテーションは、医師の指示のもとで行う。", "訪問リハビリテーションは、介護福祉士だけが行う。"], "ans": [1, 3, 4], "exp": ["PT・OT・ST", "通院が難しい人などが対象", "提供できる事業所", "医師の指示", "リハビリ専門職が行う"], "point": "訪問リハ＝医師の指示・PT/OT/ST・病院・診療所・老健・介護医療院"}, {"id": "a134", "date": "新作", "field": "保健医療", "topic": "通所リハビリテーションについて", "opts": ["通所リハビリテーションでは、送迎は行わない。", "通所リハビリテーションの計画は、医師・理学療法士などが共同で作成する。", "医師の指示のもと、リハビリテーション計画にもとづいて行う。", "介護老人保健施設や病院・診療所などで行われる。", "通所リハビリテーションは、医師がいない事業所でも行える。"], "ans": [2, 3, 4], "exp": ["送迎もある", "多職種で作る", "医学的管理のもと", "老健・病院・診療所・介護医療院", "医師がいる施設で行う"], "point": "通所リハ＝医師の指示・リハ計画は多職種で作成"}, {"id": "a135", "date": "新作", "field": "保健医療", "topic": "居宅療養管理指導について", "opts": ["居宅療養管理指導は、介護福祉士も行える。", "医師や歯科医師は、介護支援専門員にケアプラン作成に必要な情報を提供する。", "医師・歯科医師・薬剤師・管理栄養士・歯科衛生士などが居宅を訪問して行う。", "居宅療養管理指導は、ケアプランに位置づけなければ一切受けられない。", "区分支給限度基準額の対象外である。"], "ans": [2, 3, 5], "exp": ["介護福祉士は行えない", "ケアマネへの情報提供", "訪問による管理・指導", "ケアプランへの位置づけは必須ではない（給付管理の対象外）", "限度額の外"], "point": "居宅療養管理指導＝医師・歯科医師・薬剤師・管理栄養士・歯科衛生士／限度額外"}, {"id": "a136", "date": "新作", "field": "保健医療", "topic": "短期入所療養介護について", "opts": ["介護老人保健施設や介護医療院などに短期間入所して、医学的管理のもとで介護や機能訓練を受ける。", "医療的な管理が必要な人の在宅生活を支える。", "短期入所療養介護は、要介護者しか利用できない。", "家族の介護負担を軽くするためにも利用できる。", "短期入所療養介護は、特別養護老人ホームで行われる。"], "ans": [1, 2, 4], "exp": ["医療型ショートステイ", "医療ニーズのある人", "要支援者も介護予防短期入所療養介護を使える", "レスパイト", "特養で行うのは短期入所生活介護"], "point": "ショートの医療型＝短期入所療養介護（老健・介護医療院など）"}, {"id": "a137", "date": "新作", "field": "保健医療", "topic": "口腔ケアについて", "opts": ["寝るときは、原則として入れ歯を外して水などにつけて保管する。", "入れ歯は、熱湯で消毒するのがよい。", "歯がない人には、口腔ケアは必要ない。", "入れ歯（義歯）は、毎食後に外して洗う。", "舌の汚れ（舌苔）も、やさしく取り除く。"], "ans": [1, 4, 5], "exp": ["乾燥による変形を防ぐ", "熱湯は変形の原因", "歯がなくても粘膜・舌のケアが必要", "食べかすを落とす", "舌もケア"], "point": "入れ歯は毎食後洗う・夜は外して水へ・熱湯NG・歯がなくても口腔ケア"}, {"id": "a138", "date": "新作", "field": "保健医療", "topic": "標準予防策（スタンダード・プリコーション）について", "opts": ["血液・体液・排泄物などは、感染のおそれがあるものとして扱う。", "排泄物を扱うときは、使い捨て手袋を使う。", "標準予防策は、感染症と診断された人にだけ行う。", "手洗いは、感染予防の基本である。", "手袋をしていれば、外したあとの手洗いはいらない。"], "ans": [1, 2, 4], "exp": ["すべての人の湿性生体物質を感染性ありとみなす", "手袋・エプロンなど", "すべての人に行う", "1ケア1手洗い", "手袋を外したあとも手洗い"], "point": "標準予防策＝すべての人の血液・体液・排泄物を感染性ありとみなす"}, {"id": "a139", "date": "新作", "field": "保健医療", "topic": "ノロウイルスの嘔吐物の処理について", "opts": ["嘔吐物は、乾いてから片づけたほうが安全である。", "ノロウイルスには、アルコール消毒がとてもよく効く。", "処理をするときは、換気をする。", "処理をする人は、使い捨ての手袋・マスク・エプロンをつける。", "嘔吐物の処理には、次亜塩素酸ナトリウムを使う。"], "ans": [3, 4, 5], "exp": ["乾くとウイルスが舞い上がる。すぐに処理する", "アルコールは効きにくい", "換気", "防護具をつける", "塩素系の消毒"], "point": "ノロ＝次亜塩素酸ナトリウム・防護具・換気・すぐ処理"}, {"id": "a140", "date": "新作", "field": "保健医療", "topic": "パルスオキシメーターと酸素飽和度について", "opts": ["マニキュアをしていても、測定値に影響はない。", "パルスオキシメーターの装着は、医行為ではないとされている（新生児以外で入院治療の不要な人）。", "健康な人のSpO2は、おおむね96〜99%である。", "パルスオキシメーターは、指先などで血液中の酸素飽和度（SpO2）を測る機器である。", "SpO2が80%でも、正常な範囲である。"], "ans": [2, 3, 4], "exp": ["マニキュアや指の冷えで正しく測れないことがある", "医行為ではない", "正常値の目安", "酸素飽和度", "90%以下は呼吸不全の目安で危険"], "point": "SpO2の正常は96〜99%・90%以下は危険・装着は医行為ではない"}, {"id": "a141", "date": "新作", "field": "保健医療", "topic": "脂質異常症について", "opts": ["LDLコレステロールが高いと、動脈硬化が進みやすい。", "脂質異常症は、心筋梗塞や脳梗塞とは関係がない。", "食事では、動物性脂肪をとりすぎないことが大切である。", "HDLコレステロールは、高いほど動脈硬化が進む。", "脂質異常症は、自覚症状がほとんどない。"], "ans": [1, 3, 5], "exp": ["悪玉コレステロール", "動脈硬化から心筋梗塞・脳梗塞の原因になる", "食事療法", "HDLは善玉。低いと動脈硬化が進みやすい", "症状がないまま進む"], "point": "LDL高い・HDL低い→動脈硬化→心筋梗塞・脳梗塞"}, {"id": "a142", "date": "新作", "field": "保健医療", "topic": "高齢者の貧血について", "opts": ["鉄が不足して起こる鉄欠乏性貧血がある。", "貧血では、息切れ・だるさ・ふらつきなどがみられる。", "胃や腸からの出血が、貧血の原因になることがある。", "貧血の人は、転倒の心配はない。", "高齢者の貧血は、加齢のせいなので原因を調べる必要はない。"], "ans": [1, 2, 3], "exp": ["鉄欠乏性", "代表的な症状", "消化管出血など", "ふらつきで転倒しやすい", "病気が隠れていることがある"], "point": "貧血＝息切れ・だるさ・ふらつき。原因（出血など）を確認"}, {"id": "a143", "date": "新作", "field": "保健医療", "topic": "高齢者の皮膚の乾燥とかゆみについて", "opts": ["熱いお湯に長く入ると、乾燥やかゆみが悪化しやすい。", "かゆいときは、かいたほうが早く治る。", "体はナイロンタオルで強くこすって洗うのがよい。", "入浴後は、保湿剤をぬるとよい。", "高齢者は皮脂が減って、皮膚が乾燥しやすい。"], "ans": [1, 4, 5], "exp": ["ぬるめのお湯", "かくと悪化する", "強くこすると皮膚を傷める", "入浴後すぐの保湿", "皮脂欠乏"], "point": "乾燥肌＝ぬるめのお湯・こすらない・入浴後に保湿"}, {"id": "a144", "date": "新作", "field": "保健医療", "topic": "白癬（水虫）について", "opts": ["足の指の間を清潔にし、よく乾かすことが予防になる。", "白癬は、ウイルスが原因である。", "白癬は、カビ（真菌）の一種による皮膚の感染症である。", "白癬は、ほかの人にうつることはない。", "爪にも感染して、爪白癬になることがある。"], "ans": [1, 3, 5], "exp": ["清潔と乾燥", "真菌（カビ）", "白癬菌（真菌）", "バスマットなどを介してうつることがある", "爪が厚く白くにごる"], "point": "白癬＝真菌・清潔と乾燥・爪白癬"}, {"id": "a145", "date": "新作", "field": "保健医療", "topic": "高齢者の発熱について", "opts": ["高齢者は平熱が低めのことが多いので、ふだんの体温を知っておく。", "発熱時は、水分を控えたほうがよい。", "体温が37℃以下なら、感染症の心配はない。", "発熱があるときは、脱水に注意する。", "高齢者は、感染症でも高い熱が出ないことがある。"], "ans": [1, 4, 5], "exp": ["平熱との比較が大切", "水分補給が大切", "熱が出にくいので、ほかの症状も見る", "発汗で水分が失われる", "熱が出にくい"], "point": "高齢者は平熱が低め・熱が出にくい・脱水に注意"}, {"id": "a146", "date": "新作", "field": "保健医療", "topic": "低体温症について", "opts": ["低体温の人は、熱いお湯にすぐ入れて急に温める。", "体の深部の温度が35℃未満になった状態を低体温症という。", "高齢者は、冬の室内でも低体温症になることがある。", "低栄養や甲状腺の病気が、低体温の原因になることがある。", "低体温症は、夏には絶対に起こらない。"], "ans": [2, 3, 4], "exp": ["急な加温は危険。毛布などでゆっくり温め、医療につなぐ", "35℃未満", "室内でも起こる", "熱をつくる力の低下", "季節に関係なく起こりうる"], "point": "低体温＝35℃未満・室内でも起こる・ゆっくり温める"}, {"id": "a147", "date": "新作", "field": "保健医療", "topic": "呼吸の観察について", "opts": ["成人の安静時の呼吸数は、1分間に12〜20回程度である。", "横になると苦しくて、座ると楽になる呼吸を起座呼吸という。", "呼吸数は、1分間に40回程度がふつうである。", "下あごを動かすような呼吸（下顎呼吸）は、回復が近いサインである。", "チェーンストークス呼吸は、呼吸が深くなったり浅くなったり、止まったりをくり返す呼吸で、重い病気や死が近いときにみられる。"], "ans": [1, 2, 5], "exp": ["正常の目安", "心不全などで起こる", "40回は頻呼吸", "死が近いときのサイン", "重い心不全・脳の障害・終末期など"], "point": "呼吸数12〜20回/分。チェーンストークス・下顎呼吸は終末期のサイン"}, {"id": "a148", "date": "新作", "field": "保健医療", "topic": "リハビリテーションの段階について", "opts": ["生活期のリハビリテーションでは、本人の生活上の目標は考えない。", "介護保険のリハビリテーションは、急性期だけが対象である。", "集中的に機能の回復をめざすのは、回復期リハビリテーションである。", "生活の場で機能を維持し、生活を支えるのは、生活期（維持期）リハビリテーションである。", "病気やけがの直後に行うのは、急性期リハビリテーションである。"], "ans": [3, 4, 5], "exp": ["生活の目標に沿って行う", "介護保険は主に生活期", "回復期", "生活期", "急性期"], "point": "急性期→回復期→生活期（介護保険は主に生活期）"}, {"id": "a149", "date": "新作", "field": "保健医療", "topic": "ICF（国際生活機能分類）について", "opts": ["ICFでは、環境は生活機能に影響しないと考える。", "ICFは、障害の原因となる病気だけに注目する考え方である。", "それぞれの要素は、互いに影響しあう。", "環境因子と個人因子を、背景因子として考える。", "ICFでは、生活機能を「心身機能・身体構造」「活動」「参加」の3つに分ける。"], "ans": [3, 4, 5], "exp": ["環境因子も影響する", "できること・生活全体に注目する", "相互作用モデル", "背景因子", "3つの生活機能"], "point": "ICF＝心身機能・活動・参加＋環境因子・個人因子（相互作用）"}, {"id": "a150", "date": "新作", "field": "保健医療", "topic": "ADLとIADLについて", "opts": ["買い物・調理・金銭管理・服薬管理などは、IADL（手段的日常生活動作）にあたる。", "バーセルインデックスは、ADLを評価する方法の一つである。", "IADLには、トイレでの排泄が含まれる。", "ADLが自立していれば、IADLも必ず自立している。", "食事・排泄・入浴・移動などは、ADL（日常生活動作）にあたる。"], "ans": [1, 2, 5], "exp": ["IADL", "ADLの評価法（FIMもある）", "排泄はADL", "IADLが先に低下することが多い", "基本的ADL"], "point": "ADL＝身の回り／IADL＝買い物・調理・金銭・服薬など"}, {"id": "a151", "date": "新作", "field": "保健医療", "topic": "片麻痺のある人の介助について", "opts": ["杖は、健側の手に持つ。", "歩行の介助では、健側の後ろに立つ。", "麻痺のある側は感覚が鈍いことがあるので、かえって観察はいらない。", "階段を上るときは健側の足から、下りるときは患側の足から出す。", "衣服を着替えるときは、健側から脱いで、患側から着る（脱健着患）。"], "ans": [1, 4, 5], "exp": ["杖は健側", "介助者は患側の後ろ（斜め後ろ）に立つ", "感覚が鈍いので、けがや圧迫に気づきにくい。観察が大切", "上りは健側から、下りは患側から", "脱健着患"], "point": "脱健着患・杖は健側・介助は患側・上りは健側から下りは患側から"}, {"id": "a152", "date": "新作", "field": "保健医療", "topic": "高次脳機能障害について", "opts": ["高次脳機能障害には、失語・失行・失認・注意障害・記憶障害などがある。", "高次脳機能障害は、本人の努力不足が原因である。", "高次脳機能障害は、手足の麻痺のことをいう。", "脳卒中や頭のけがが原因になる。", "外から見てわかりにくく、周囲に理解されにくいことがある。"], "ans": [1, 4, 5], "exp": ["代表的な症状", "脳の損傷による障害", "麻痺とは別の障害", "脳の損傷", "見えない障害"], "point": "高次脳機能障害＝失語・失行・失認・注意・記憶。見えにくい障害"}, {"id": "a153", "date": "新作", "field": "保健医療", "topic": "糖尿病のある人の足のケアについて", "opts": ["糖尿病の人は、足の感覚が鈍くなり、けがに気づきにくい。", "糖尿病の人は、はだしで歩いたほうがよい。", "小さな傷から、壊疽（えそ）に進むことがある。", "糖尿病の人の足は、熱い湯たんぽで温めるとよい。", "毎日、足に傷や靴ずれがないか観察する。"], "ans": [1, 3, 5], "exp": ["神経障害", "けがを防ぐため靴下や靴をはく", "血流が悪く治りにくい", "感覚が鈍いので低温やけどに注意", "毎日の観察"], "point": "糖尿病の足＝毎日観察・靴ずれ・低温やけどに注意"}, {"id": "a154", "date": "新作", "field": "保健医療", "topic": "ポリファーマシー（多剤服用）について", "opts": ["薬の数が多いと、副作用や飲みまちがいが起こりやすい。", "高齢者は複数の病気をもち、たくさんの薬を飲んでいることが多い。", "お薬手帳で、ほかの病院の薬も含めて確認することが大切である。", "市販薬やサプリメントは、薬の飲み合わせに関係しない。", "薬が多いときは、本人の判断で飲むのをやめてよい。"], "ans": [1, 2, 3], "exp": ["有害事象が増える", "多病・多剤", "一元的に把握", "市販薬・サプリも影響する", "自己判断でやめず、医師・薬剤師に相談"], "point": "多剤服用は副作用・飲み忘れのもと。お薬手帳・医師・薬剤師と連携"}, {"id": "a155", "date": "新作", "field": "保健医療", "topic": "服薬の介助について", "opts": ["飲み忘れたときに、次の分と2回分をまとめて飲むのはよくない。", "薬は、水かぬるま湯で飲む。", "薬はお茶やジュースで飲むと、効き目がよくなる。", "寝たまま飲むと、誤嚥しやすいので、上半身を起こして飲む。", "飲みにくい錠剤は、自由につぶして飲ませてよい。"], "ans": [1, 2, 4], "exp": ["医師・薬剤師の指示に従う", "基本", "飲み物で効き方が変わることがある", "姿勢を整える", "つぶしてはいけない薬もある。薬剤師に確認"], "point": "水かぬるま湯で・体を起こして・2回分まとめない・勝手につぶさない"}, {"id": "a156", "date": "新作", "field": "保健医療", "topic": "アドバンス・ケア・プランニング（ACP・人生会議）について", "opts": ["ACPは、これからの医療やケアについて、本人が家族や医療・ケアチームとくり返し話し合うことである。", "ACPは、一度だけ書類に書けばそれで終わりである。", "ACPは、医師だけで決めるものである。", "本人の意思が確認できなくなったときに備えて、本人の価値観を共有しておく。", "話し合った内容は、気持ちが変われば何度でも変えてよい。"], "ans": [1, 4, 5], "exp": ["くり返し話し合うプロセス", "くり返し話し合う", "本人中心に家族や多職種で", "代わりに判断する人の支えになる", "変わってよい"], "point": "ACP＝本人中心・くり返し話し合う・変更OK"}, {"id": "a157", "date": "新作", "field": "保健医療", "topic": "グリーフケアについて", "opts": ["悲しみの表れ方は、人によってさまざまである。", "遺族には、早く悲しみを忘れるよう励ますのがよい。", "グリーフケアとは、大切な人を亡くした家族などの悲しみに寄りそう支援である。", "グリーフケアは、亡くなった当日だけ行えばよい。", "亡くなる前からの関わりも、家族のグリーフケアにつながる。"], "ans": [1, 3, 5], "exp": ["個人差がある", "気持ちを受け止める", "遺族への支援", "時間をかけた支援", "予期悲嘆への支援"], "point": "グリーフケア＝悲しみを受け止め、時間をかけて寄りそう"}, {"id": "a158", "date": "新作", "field": "保健医療", "topic": "高齢者の精神疾患について", "opts": ["高齢者のアルコール依存症では、転倒や認知機能の低下がみられることがある。", "高齢者の妄想は、周囲の人に向けられることがある。", "アルコール依存症は、本人の意志が弱いだけなので治療はいらない。", "精神疾患のある人は、介護保険サービスを利用できない。", "統合失調症の人も高齢になり、介護が必要になることがある。"], "ans": [1, 2, 5], "exp": ["飲酒による影響", "物盗られ妄想など", "専門的な治療が必要な病気", "利用できる", "長期入院から地域へ戻る人もいる"], "point": "精神疾患の人も介護保険を利用できる。アルコール依存は治療が必要な病気"}, {"id": "a159", "date": "新作", "field": "保健医療", "topic": "入院・退院時の医療との連携について", "opts": ["入院中は、介護支援専門員は病院と連絡をとってはいけない。", "入院するときは、介護支援専門員が利用者の情報を病院に提供する。", "退院のときは、病院だけで在宅生活の準備をすべて行う。", "退院前に、病院の多職種と在宅のケアチームでカンファレンスを開くことがある。", "退院後の生活に向けて、早めに準備を始めることが大切である。"], "ans": [2, 4, 5], "exp": ["連携が大切", "入院時の情報提供", "在宅のケアチームと一緒に行う", "退院前カンファレンス", "早期からの退院支援"], "point": "入院時の情報提供・退院前カンファレンス・早めの準備"}, {"id": "a160", "date": "新作", "field": "保健医療", "topic": "食中毒の予防について", "opts": ["作り置きの料理は、常温で長く置いても問題ない。", "食中毒予防の3原則は、菌を「つけない」「増やさない」「やっつける」である。", "加熱するときは、食品の中心部を75℃で1分以上加熱するのが目安である。", "肉や魚を切った包丁で、そのままサラダの野菜を切ってよい。", "作った料理は、早めに食べる。"], "ans": [2, 3, 5], "exp": ["冷蔵・冷凍で保存する", "3原則", "中心温度の目安", "調理器具は洗って使い分ける", "時間がたつと菌が増える"], "point": "つけない・増やさない・やっつける（75℃1分以上）"}, {"id": "a161", "date": "新作", "field": "保健医療", "topic": "B型肝炎・C型肝炎について", "opts": ["血液がつく可能性があるときは、手袋をつける。", "肝炎ウイルスをもつ人は、入浴の順番を必ず最後にしなければならない。", "日常生活のふつうの接触では、感染することはほとんどない。", "B型肝炎・C型肝炎は、主に血液を介して感染する。", "B型・C型肝炎の人と同じ食器を使うと、感染する。"], "ans": [1, 3, 4], "exp": ["標準予防策", "標準予防策を守れば特別な制限はいらない", "日常生活で過度に心配しない", "血液感染", "食器で感染することはない"], "point": "B型・C型肝炎＝血液感染。標準予防策で十分。差別につながる過剰な対応をしない"}, {"id": "a162", "date": "新作", "field": "保健医療", "topic": "がんの痛みの緩和について", "opts": ["医療用麻薬を使うと、必ず中毒になる。", "痛みは、がまんせずに伝えてもらうことが大切である。", "がんの痛みには、医療用麻薬が使われることがある。", "痛みの評価は、本人の訴えより周囲の判断を優先する。", "医療用麻薬の副作用として、便秘がよくみられる。"], "ans": [2, 3, 5], "exp": ["医師の指示どおり使えば依存はほとんど起こらない", "痛みの評価と調整", "オピオイド", "痛みは本人の訴えが基本", "便秘・吐き気・眠気など"], "point": "医療用麻薬＝便秘・吐き気・眠気に注意。痛みは本人の訴えが基本"}, {"id": "a163", "date": "新作", "field": "保健医療", "topic": "てんかん発作が起きたときの対応について", "opts": ["舌をかまないように、口の中に物を入れる。", "体をおさえつけて、けいれんを止める。", "まわりの危ない物をどけて、けがを防ぐ。", "発作がおさまったら、横向きに寝かせて気道を確保する。", "発作が続いた時間を確認する。"], "ans": [3, 4, 5], "exp": ["口に物を入れると窒息やけがのおそれ", "おさえつけない", "安全の確保", "回復体位", "5分以上続くなら救急要請の目安"], "point": "てんかん発作＝安全確保・時間を測る・口に物を入れない・横向きに"}, {"id": "a164", "date": "新作", "field": "保健医療", "topic": "むくみ（浮腫）について", "opts": ["片足だけの急なむくみは、心配ない。", "長く座っていると、足がむくみやすい。", "心臓・腎臓・肝臓の病気で、むくみが出ることがある。", "むくみは、どんな原因でも水分をとらなければすぐに治る。", "むくんだ皮膚は傷つきやすいので、ていねいに扱う。"], "ans": [2, 3, 5], "exp": ["深部静脈血栓症などのことがある。医療職に伝える", "重力の影響", "病気のサイン", "原因によって対応は異なる。自己判断で水分を制限しない", "皮膚が薄く傷つきやすい"], "point": "むくみ＝病気のサインのことも。片足の急なむくみは医療職へ"}, {"id": "a165", "date": "新作", "field": "保健医療", "topic": "高齢者の下痢について", "opts": ["下痢が続くと、脱水になりやすい。", "下痢のときは、水分をとらないほうがよい。", "感染症による下痢のこともある。", "下痢のときは、おしりの皮膚がただれやすいので清潔を保つ。", "下痢をしている人のおむつ交換のあとは、手洗いはいらない。"], "ans": [1, 3, 4], "exp": ["脱水に注意", "水分補給が大切", "ノロウイルスなど", "皮膚のケア", "手洗いが基本"], "point": "下痢＝脱水・感染症・皮膚のただれに注意"}, {"id": "a166", "date": "新作", "field": "保健医療", "topic": "起立性低血圧について", "opts": ["起き上がるときは、いったん座ってから、ゆっくり立ち上がる。", "起立性低血圧は、若い人にしか起こらない。", "降圧薬や長い寝たきりが原因になることがある。", "寝た状態や座った状態から立ち上がったときに、血圧が下がってふらつく。", "ふらついたときは、すぐに歩き出すのがよい。"], "ans": [1, 3, 4], "exp": ["段階的に起こす", "高齢者に多い", "薬・廃用など", "立ちくらみ", "座らせるか横にする"], "point": "起立性低血圧＝ゆっくり段階的に起こす"}, {"id": "a167", "date": "新作", "field": "福祉サービス", "topic": "バイスティックの7原則について", "opts": ["利用者を一人ひとりちがう人としてとらえることを「個別化」という。", "利用者が自分で決めることを尊重するのは「自己決定」の原則である。", "援助者の価値観に合わせて、利用者の考えを変えてもらうことを「受容」という。", "利用者の考えや行動を、善い悪いで裁かないことを「非審判的態度」という。", "利用者の秘密は、援助者の判断で自由に話してよい。"], "ans": [1, 2, 4], "exp": ["個別化", "利用者の自己決定", "受容とは、ありのままを受け止めること", "非審判的態度", "秘密保持の原則"], "point": "個別化・意図的な感情表出・統制された情緒的関与・受容・非審判的態度・自己決定・秘密保持"}, {"id": "a168", "date": "新作", "field": "福祉サービス", "topic": "面接での質問の仕方について", "opts": ["「はい」「いいえ」で答えられる質問を閉じられた質問という。", "「どのようにお過ごしですか」のように、自由に答えられる質問を開かれた質問という。", "「なぜ〜しないのですか」と理由を何度も問いつめるのがよい。", "閉じられた質問は、事実を確認するときに役立つ。", "面接では、閉じられた質問だけを続けるのがよい。"], "ans": [1, 2, 4], "exp": ["閉じられた質問", "開かれた質問", "責められていると感じさせやすい", "事実確認に向く", "使い分けが大切"], "point": "開かれた質問で話を広げ、閉じられた質問で確認する"}, {"id": "a169", "date": "新作", "field": "福祉サービス", "topic": "面接の基本的な技法について", "opts": ["相手が話している途中でも、援助者がすぐに解決策を示すのがよい。", "話の要点をまとめて返す「要約」は、話を整理するのに役立つ。", "面接中の沈黙は、すぐに援助者が話して埋めるべきである。", "相手の話を、相手の言葉を使って言い換えて返すことは、理解を確かめるのに役立つ。", "相手の気持ちをくみ取って言葉で返すことを「感情の反映」という。"], "ans": [2, 4, 5], "exp": ["まずは話を十分に聴く", "要約", "沈黙は考えている時間のこともあるので待つ", "言い換え", "感情の反映"], "point": "言い換え・要約・感情の反映。沈黙にも意味がある"}, {"id": "a170", "date": "新作", "field": "福祉サービス", "topic": "非言語的コミュニケーションについて", "opts": ["腕を組んで聴く姿勢は、相手に安心感を与える。", "面接では、正面より斜めに座るほうが緊張がやわらぎやすい。", "非言語的なメッセージは、相手に伝わることはない。", "相手と目の高さを合わせることが大切である。", "表情・視線・姿勢・身ぶりは、非言語的コミュニケーションである。"], "ans": [2, 4, 5], "exp": ["拒否的に見えやすい", "斜め（90度程度）の位置", "言葉以上に伝わることもある", "目線を合わせる", "言葉以外の伝達"], "point": "表情・視線・姿勢・座る位置も大切"}, {"id": "a171", "date": "新作", "field": "福祉サービス", "topic": "ソーシャルワークの対象と方法について", "opts": ["グループや組織を対象とする支援を、メゾレベルの支援という。", "個人や家族を対象とする支援を、ミクロレベルの支援という。", "ソーシャルワークは、病院の中だけで行われる。", "地域や制度を対象とする支援を、マクロレベルの支援という。", "介護支援専門員の仕事は、個人の支援だけで、地域とは関係ない。"], "ans": [1, 2, 4], "exp": ["メゾ", "ミクロ", "地域・施設などさまざまな場で行われる", "マクロ", "地域の社会資源づくりなどにも関わる"], "point": "ミクロ（個人・家族）・メゾ（集団）・マクロ（地域・制度）"}, {"id": "a172", "date": "新作", "field": "福祉サービス", "topic": "集団を活用した援助（グループワーク）について", "opts": ["援助者は、メンバーの相互作用を促す役割をもつ。", "グループの中で、メンバー同士が影響しあう力を活用する。", "同じ悩みをもつ人が集まる家族会などは、グループを活用した支援の例である。", "グループワークでは、メンバーの個性は考えなくてよい。", "グループワークは、援助者が一方的に話す講義の形で行う。"], "ans": [1, 2, 3], "exp": ["促進役", "相互作用", "セルフヘルプグループなど", "個別化も大切", "メンバー同士の交流が中心"], "point": "グループワーク＝メンバーの相互作用を活かす"}, {"id": "a173", "date": "新作", "field": "福祉サービス", "topic": "地域を対象とした援助（コミュニティワーク）について", "opts": ["地域の関係機関とのネットワークづくりも含まれる。", "住民が地域の課題に主体的に取り組めるよう支援する。", "地域の課題は、行政だけが解決すればよい。", "不足している社会資源を開発することも含まれる。", "コミュニティワークでは、住民の参加は必要ない。"], "ans": [1, 2, 4], "exp": ["ネットワーク", "住民主体", "住民・関係機関とともに取り組む", "社会資源の開発", "住民参加が基本"], "point": "コミュニティワーク＝住民主体・社会資源の開発・ネットワーク"}, {"id": "a174", "date": "新作", "field": "福祉サービス", "topic": "アウトリーチについて", "opts": ["アウトリーチでは、本人の気持ちより援助者の都合を優先する。", "アウトリーチは、相談に来た人だけを対象にする。", "地域の見守りや民生委員などからの情報も、アウトリーチのきっかけになる。", "自分から助けを求めない人や、問題に気づいていない人への支援に役立つ。", "支援が必要なのに相談に来ない人のところへ、援助者から出向いて支援することをいう。"], "ans": [3, 4, 5], "exp": ["本人の気持ちを尊重して関係をつくる", "相談に来ない人が主な対象", "地域からの情報", "潜在的なニーズ", "出向く支援"], "point": "アウトリーチ＝相談に来ない人へ出向く"}, {"id": "a175", "date": "新作", "field": "福祉サービス", "topic": "エンパワメントとストレングスについて", "opts": ["ストレングス視点では、利用者の問題点だけを詳しく分析する。", "エンパワメントとは、援助者が利用者の代わりにすべて決めることである。", "ストレングス視点とは、利用者の強み・できること・意欲などに注目する考え方である。", "エンパワメントとは、利用者が本来もっている力を発揮できるよう支援することである。", "利用者の強みには、本人の趣味や人とのつながりなども含まれる。"], "ans": [3, 4, 5], "exp": ["問題だけでなく強みに注目", "本人の力を高める支援", "強みに注目", "本来の力を引き出す", "環境の強みも含む"], "point": "エンパワメント・ストレングス＝本人の強みと力を活かす"}, {"id": "a176", "date": "新作", "field": "福祉サービス", "topic": "セルフ・ネグレクトについて", "opts": ["本人が支援を拒むことが多い。", "セルフ・ネグレクトは、本人が望んでいるのだから放っておいてよい。", "命の危険がある場合は、関係機関と連携して介入を考える。", "セルフ・ネグレクトとは、自分の健康や生活に必要なことを自分でしなくなり、心身が危険な状態になることをいう。", "セルフ・ネグレクトの人には、一度断られたら二度と関わらないほうがよい。"], "ans": [1, 3, 4], "exp": ["拒否が多い", "生命・健康に関わるので見守りと支援が必要", "地域包括支援センターなどと連携", "自己放任", "粘り強く関係づくりを続ける"], "point": "セルフ・ネグレクト＝拒否が多い・粘り強い関係づくり・多機関連携"}, {"id": "a177", "date": "新作", "field": "福祉サービス", "topic": "サービスの利用を拒否する利用者への対応について", "opts": ["拒否の理由や背景を、ていねいに聴く。", "拒否する利用者は、支援の対象外として記録を残さない。", "本人が受け入れやすいサービスから少しずつ始める。", "拒否されたら、本人に黙ってサービスを入れる。", "信頼できる人を通して関係をつくることも考える。"], "ans": [1, 3, 5], "exp": ["理由を知ることが出発点", "経過を記録し、関わりを続ける", "小さな一歩から", "本人の同意なしにサービスを入れない", "家族・知人・主治医など"], "point": "拒否には理由がある→聴く・小さく始める・信頼できる人を通す"}, {"id": "a178", "date": "新作", "field": "福祉サービス", "topic": "複合的な課題をもつ世帯への支援について", "opts": ["介護支援専門員は、利用者本人以外の家族の課題には一切関わらない。", "高齢の親と、ひきこもりの子が同居している世帯（8050問題）では、世帯全体を見て支援する。", "重層的支援体制整備事業は、分野をこえて包括的に支援するための市町村の事業である。", "複合的な課題は、一つの機関だけで解決するのが望ましい。", "介護保険だけで解決できない課題は、障害福祉・生活困窮・医療など他の機関と連携する。"], "ans": [2, 3, 5], "exp": ["必要に応じて関係機関につなぐ", "世帯全体の支援", "2021年度から", "多機関で連携する", "多機関連携"], "point": "8050問題など＝世帯全体を見る・多機関連携・重層的支援体制"}, {"id": "a179", "date": "新作", "field": "福祉サービス", "topic": "家族介護者への支援について", "opts": ["ショートステイなどで、介護者が休める時間をつくること（レスパイトケア）も大切である。", "介護者の仕事と介護の両立にも配慮する。", "介護者の心身の負担や疲れにも目を向ける。", "介護者の気持ちを聞くことは、ケアマネジメントには関係ない。", "家族には、介護をすべて担ってもらうのが当然である。"], "ans": [1, 2, 3], "exp": ["レスパイト", "介護離職の防止", "介護者もケアの対象", "介護者の思いもアセスメントの大切な情報", "社会全体で支えるのが介護保険の考え方"], "point": "介護者支援＝負担の把握・レスパイト・仕事との両立"}, {"id": "a180", "date": "新作", "field": "福祉サービス", "topic": "ヤングケアラーについて", "opts": ["ヤングケアラーの子どもには、さらに介護を任せるようケアプランを組む。", "本人が自分をヤングケアラーだと気づいていないことも多い。", "ヤングケアラーとは、本来大人が担うような家事や家族の世話を日常的に行っている子どもや若者をいう。", "ヤングケアラーは、家族の問題なので関係機関が関わる必要はない。", "学業や友人関係に影響が出ることがある。"], "ans": [2, 3, 5], "exp": ["子どもの負担を減らす方向で考える", "自覚がないことが多い", "家族の世話をする子ども・若者", "子ども・若者支援の機関と連携する", "学校生活への影響"], "point": "ヤングケアラー＝気づく・負担を減らす・関係機関につなぐ"}, {"id": "a181", "date": "新作", "field": "福祉サービス", "topic": "社会資源について", "opts": ["インフォーマルな社会資源は、ケアプランに書いてはいけない。", "社会資源は、介護保険サービスのことだけを指す。", "家族・友人・近所の人・ボランティアなどは、インフォーマルな社会資源である。", "利用者本人の能力や意欲も、内的な資源として考えられる。", "介護保険サービスや行政の制度は、フォーマルな社会資源である。"], "ans": [3, 4, 5], "exp": ["位置づけるよう努める", "さまざまなものを含む", "インフォーマル", "内的資源", "フォーマル"], "point": "フォーマル・インフォーマル・本人の力"}, {"id": "a182", "date": "新作", "field": "福祉サービス", "topic": "支援の記録について", "opts": ["いつ・どこで・誰が・何を・なぜ・どのようにを意識して書く。", "記録には、援助者の印象だけを書けばよい。", "記録は、利用者から開示を求められても見せる必要はない。", "記録では、事実と援助者の解釈や判断を分けて書く。", "記録は、支援の継続性や、チームでの情報共有に役立つ。"], "ans": [1, 4, 5], "exp": ["5W1H", "客観的な事実を中心に", "本人からの開示請求には原則応じる", "事実と解釈を区別", "チームで共有"], "point": "記録＝事実と解釈を分ける・5W1H・チームで共有"}, {"id": "a183", "date": "新作", "field": "福祉サービス", "topic": "個人情報の取扱いについて", "opts": ["個人情報の記録は、決められた方法で適切に保管する。", "家族の個人情報を使うときも、その家族の同意を得る。", "サービス担当者会議で利用者の個人情報を使うときは、あらかじめ文書で同意を得る。", "利用者の個人情報は、同意がなくても誰にでも伝えてよい。", "業務で知った秘密は、仕事を辞めたら話してもよい。"], "ans": [1, 2, 3], "exp": ["適切な管理", "家族の同意", "利用者の文書による同意", "原則として同意が必要（生命の危険など例外あり）", "辞めたあとも守る"], "point": "個人情報＝利用者・家族の文書同意・適切な保管・退職後も秘密保持"}, {"id": "a184", "date": "新作", "field": "福祉サービス", "topic": "意思決定支援について", "opts": ["認知症の人の意思は、家族が決めればよい。", "本人の意思が周りから見て合理的でなくても、そのことだけで能力がないと判断しない。", "認知症があっても、本人には意思があり、意思決定能力があることを前提に支援する。", "本人の意思決定支援は、本人に情報を伝えずに行う。", "本人が意思を形成・表明・実現できるよう、段階に応じて支援する。"], "ans": [2, 3, 5], "exp": ["本人の意思が中心", "不合理に見えても尊重を考える", "意思決定能力を前提に", "わかりやすく情報を伝える", "意思形成・意思表明・意思実現の支援"], "point": "意思決定支援＝本人の意思を前提に・形成・表明・実現を支える"}, {"id": "a185", "date": "新作", "field": "福祉サービス", "topic": "自己覚知とスーパービジョンについて", "opts": ["スーパービジョンは、援助者を評価して罰するためのものである。", "スーパービジョンには、教育的・支持的・管理的な機能がある。", "スーパービジョンは、経験のある人が援助者を指導・支援することである。", "自己覚知とは、援助者が自分の価値観や感情のくせに気づくことである。", "援助者は、自分の感情や価値観を気にする必要はない。"], "ans": [2, 3, 4], "exp": ["援助者の成長を支えるもの", "3つの機能", "指導・支援", "自分を知る", "価値観が支援にかたよりを生むことがある"], "point": "自己覚知・スーパービジョン（教育・支持・管理）"}, {"id": "a186", "date": "新作", "field": "福祉サービス", "topic": "多職種連携（チームアプローチ）について", "opts": ["それぞれの専門職が役割を理解し、情報を共有して支援する。", "利用者や家族も、チームの一員として考える。", "多職種連携では、介護支援専門員がすべてを決めて指示する。", "目標をチーム全体で共有することが大切である。", "専門職同士は、意見がちがうときは話し合わないほうがよい。"], "ans": [1, 2, 4], "exp": ["役割理解と情報共有", "利用者中心", "調整役であって、指示する立場ではない", "目標の共有", "話し合って調整する"], "point": "多職種連携＝役割理解・情報共有・目標共有・利用者中心"}, {"id": "a187", "date": "新作", "field": "福祉サービス", "topic": "権利擁護（アドボカシー）について", "opts": ["権利擁護は、弁護士だけが行うものである。", "判断能力が低下した人の財産や権利を守るため、成年後見制度などを活用する。", "虐待や消費者被害から利用者を守ることも、権利擁護に含まれる。", "アドボカシーとは、自分の権利を主張しにくい人の代わりに、その権利を守り主張することである。", "利用者の意思より、援助者の判断を優先することが権利擁護である。"], "ans": [2, 3, 4], "exp": ["さまざまな専門職・地域が関わる", "成年後見・日常生活自立支援事業", "虐待・消費者被害", "代弁・権利を守る", "本人の意思を尊重する"], "point": "権利擁護＝代弁・成年後見・虐待防止・消費者被害の防止"}, {"id": "a188", "date": "新作", "field": "福祉サービス", "topic": "相談援助を行う人の倫理について", "opts": ["援助者の都合で、利用者の秘密を話してよい。", "援助者が気に入った利用者だけをていねいに支援してよい。", "援助者の専門性を高めるよう努める。", "援助者は、利用者との関係を個人的な利益のために利用してはならない。", "利用者の利益を最優先に考える。"], "ans": [3, 4, 5], "exp": ["秘密保持", "公平に支援する", "専門性の向上", "個人的な利用の禁止", "利用者本位"], "point": "利用者本位・公平・秘密保持・専門性の向上"}, {"id": "a189", "date": "新作", "field": "福祉サービス", "topic": "インテーク面接について", "opts": ["インテークでは、援助者の考えをまず説明し、利用者の話はあとで聴く。", "利用者が安心して話せる雰囲気づくりが大切である。", "自分の機関で対応できるかを判断し、できなければ適切な機関につなぐ。", "インテーク面接は、必ず援助者の事務所で行わなければならない。", "利用者の主訴（いちばん困っていること）を受け止める。"], "ans": [2, 3, 5], "exp": ["まず利用者の話を聴く", "信頼関係のスタート", "スクリーニングと紹介", "自宅訪問などでもよい", "主訴"], "point": "インテーク＝主訴を聴く・スクリーニング・信頼関係づくり"}, {"id": "a190", "date": "新作", "field": "福祉サービス", "topic": "傾聴と共感について", "opts": ["傾聴とは、相手の話を関心をもって、ていねいに聴くことである。", "うなずきやあいづちは、傾聴の姿勢を伝える。", "共感とは、援助者が相手と同じように泣いたり怒ったりすることである。", "傾聴では、相手の話をさえぎって援助者の意見を伝える。", "共感とは、相手の気持ちを相手の立場に立って理解しようとすることである。"], "ans": [1, 2, 5], "exp": ["積極的に聴く", "非言語的な傾聴", "巻き込まれず理解する（統制された情緒的関与）", "最後まで聴く", "相手の立場で理解"], "point": "傾聴・共感・うなずき。巻き込まれすぎない"}, {"id": "a191", "date": "新作", "field": "福祉サービス", "topic": "高齢者の消費者被害について", "opts": ["消費者ホットライン「188（いやや）」で、身近な相談窓口につながる。", "通信販売にも、法律で必ずクーリング・オフ制度がある。", "訪問販売で契約した場合、契約書面を受け取った日から8日以内ならクーリング・オフができる。", "高齢者をねらった悪質商法の相談先として、消費生活センターがある。", "いったん契約したら、どんな場合でも取り消すことはできない。"], "ans": [1, 3, 4], "exp": ["188", "通信販売には法律上のクーリング・オフはない（返品ルールは販売者が決める）", "訪問販売・電話勧誘販売は8日", "消費生活センター", "クーリング・オフや取消しができる場合がある"], "point": "訪問販売は8日間クーリング・オフ・相談は消費生活センター（188）"}, {"id": "a192", "date": "新作", "field": "福祉サービス", "topic": "支援困難事例への対応について", "opts": ["地域ケア会議で事例を検討することも有効である。", "支援困難な事例は、本人・家族・環境などいくつもの要因が重なっていることが多い。", "一人で抱え込まず、地域包括支援センターなどに相談する。", "支援困難な利用者は、すぐに担当を外れたほうがよい。", "支援困難事例では、本人の意向を聞く必要はない。"], "ans": [1, 2, 3], "exp": ["地域ケア会議", "複合的な要因", "包括などに相談", "チームで支え、継続して関わる", "本人の意向は常に大切"], "point": "支援困難事例＝複合要因・抱え込まない・地域ケア会議"}, {"id": "a193", "date": "新作", "field": "福祉サービス", "topic": "利用者との信頼関係（ラポール）について", "opts": ["信頼関係を深めるために、援助者の個人的な連絡先を教えて私的に会う。", "約束を守ることは、信頼関係の基本である。", "支援の初期から、利用者との信頼関係づくりを大切にする。", "信頼関係ができれば、利用者の同意をとらずに進めてよい。", "利用者のペースを尊重することが、信頼関係につながる。"], "ans": [2, 3, 5], "exp": ["専門職としての適切な距離を保つ", "約束を守る", "ラポール", "同意は常に必要", "本人のペース"], "point": "ラポール＝約束を守る・本人のペース・専門職としての距離"}, {"id": "a194", "date": "新作", "field": "福祉サービス", "topic": "訪問介護の生活援助で行えないことについて", "opts": ["来客へのお茶出しは、生活援助で行える。", "庭の草むしりやペットの世話は、生活援助で行えない。", "利用者が使う居室の掃除は、生活援助で行える。", "窓ふきや大掃除など、日常の家事の範囲をこえるものは行えない。", "家族のための買い物は、生活援助で行える。"], "ans": [2, 3, 4], "exp": ["本人以外のための援助は対象外", "本人の援助ではない", "本人の居室の掃除", "日常的な家事の範囲外", "本人のための援助だけ"], "point": "生活援助＝本人のための日常的な家事だけ"}, {"id": "a195", "date": "新作", "field": "福祉サービス", "topic": "訪問介護の身体介護について", "opts": ["利用者と一緒に手助けしながら行う調理など、自立支援のための見守り的援助は、身体介護に含まれる。", "服薬の介助は、身体介護に含まれる。", "身体介護は、生活援助より報酬が低い。", "入浴・排泄・食事の介助は、身体介護にあたる。", "利用者がいない部屋の掃除は、身体介護にあたる。"], "ans": [1, 2, 4], "exp": ["自立支援・重度化防止のための見守り的援助", "服薬介助", "身体介護のほうが報酬は高い", "身体介護", "生活援助（しかも本人の居室でなければ対象外）"], "point": "身体介護には「自立支援のための見守り的援助」も含まれる"}, {"id": "a196", "date": "新作", "field": "福祉サービス", "topic": "訪問介護の人員と計画について", "opts": ["サービス提供責任者は、介護福祉士や実務者研修修了者などから選ぶ。", "訪問介護計画は、居宅サービス計画とは関係なく作ってよい。", "サービス提供責任者は、看護師でなければならない。", "訪問介護計画は、利用者に説明して同意を得て交付する。", "サービス提供責任者は、訪問介護計画を作成する。"], "ans": [1, 4, 5], "exp": ["資格要件", "居宅サービス計画に沿って作る", "介護福祉士・実務者研修修了者など", "説明・同意・交付", "サ責の役割"], "point": "サ責が訪問介護計画を作る（ケアプランに沿って）"}, {"id": "a197", "date": "新作", "field": "福祉サービス", "topic": "福祉用具貸与の対象について", "opts": ["取付け工事のいらない手すり", "特殊寝台（介護用ベッド）", "腰掛便座", "入浴補助用具", "車いす"], "ans": [1, 2, 5], "exp": ["貸与（工事が必要なものは住宅改修）", "貸与", "購入", "購入", "貸与"], "point": "貸与＝車いす・特殊寝台・床ずれ防止用具・体位変換器・手すり・スロープ・歩行器・杖・徘徊感知機器・リフト・自動排泄処理装置"}, {"id": "a198", "date": "新作", "field": "福祉サービス", "topic": "軽度者への福祉用具貸与について", "opts": ["要支援1・2と要介護1の人は、車いすや特殊寝台などの貸与は原則として対象外である。", "軽度者の例外的な貸与は、福祉用具販売事業者が決める。", "手すりやスロープ、歩行器は、要支援の人も貸与を受けられる。", "軽度者でも、状態像によっては例外的に貸与が認められることがある。", "要介護1の人は、どんな福祉用具も貸与を受けられない。"], "ans": [1, 3, 4], "exp d": "福祉サービス", "topic": "養護老人ホームについて", "opts": ["入所するには、要介護認定が必要である。", "環境上の理由と経済的な理由で、自宅での生活が難しい65歳以上の人が入所する。", "入所は、市町村の措置による。", "養護老人ホームの入所者は、介護保険サービスを一切使えない。", "養護老人ホームは、介護保険施設ではない。"], "ans": [2, 3, 5], "exp": ["要介護認定は要件ではない", "環境上・経済的理由", "措置", "外部の介護保険サービスや特定施設として利用できる", "老人福祉施設"], "point": "養護老人ホーム＝措置・環境上と経済的理由・介護保険施設ではない"}, {"id": "a211", "date": "新作", "field": "福祉サービス", "topic": "軽費老人ホーム（ケアハウス）について", "opts": ["軽費老人ホームは、介護保険施設である。", "入居は、本人と施設との契約による。", "入居は、市町村の措置で決まる。", "特定施設入居者生活介護の指定を受けることができる。", "無料または低い料金で、高齢者が入居できる施設である。"], "ans": [2, 4, 5], "exp": ["老人福祉施設", "契約", "契約による", "特定施設になりうる", "低額"], "point": "ケアハウス＝契約・低額・特定施設になりうる"}, {"id": "a212", "date": "新作", "field": "福祉サービス", "topic": "有料老人ホームについて", "opts": ["介護付有料老人ホームは、特定施設入居者生活介護の指定を受けている。", "住宅型有料老人ホームでは、外部の介護保険サービスは利用できない。", "「介護付」「住宅型」「健康型」の類型がある。", "有料老人ホームは、介護保険施設である。", "有料老人ホームを設置する人は、都道府県知事に届け出る。"], "ans": [1, 3, 5], "exp": ["介護付＝特定施設", "外部の訪問介護などを利用できる", "3類型", "介護保険施設ではない", "届出制"], "point": "有料老人ホーム＝都道府県知事への届出・介護付は特定施設"}, {"id": "a213", "date": "新作", "field": "福祉サービス", "topic": "サービス付き高齢者向け住宅について", "opts": ["サービス付き高齢者向け住宅は、介護保険施設である。", "安否確認と生活相談のサービスがついている。", "居室の床面積は、原則25㎡以上である。", "高齢者住まい法にもとづき、都道府県知事などに登録する。", "入居者は、介護保険サービスを利用できない。"], "ans": [2, 3, 4], "exp": ["住宅である", "安否確認・生活相談は必須", "原則25㎡以上（共用部分が十分なら18㎡以上）", "登録制", "外部サービスなどを利用できる"], "point": "サ高住＝登録制・安否確認と生活相談・原則25㎡以上"}, {"id": "a214", "date": "新作", "field": "福祉サービス", "topic": "後期高齢者医療制度について", "opts": ["後期高齢者医療制度の保険者は、国である。", "後期高齢者の医療費の自己負担は、全員1割である。", "運営は、都道府県ごとにすべての市町村が加入する広域連合が行う。", "75歳以上の人が対象となる。", "65〜74歳で一定の障害があると認定された人も対象になれる。"], "ans": [3, 4, 5], "exp": ["広域連合", "所得に応じて1割・2割・3割", "後期高齢者医療広域連合", "75歳以上", "一定の障害"], "point": "後期高齢者医療＝75歳以上・広域連合・1〜3割"}, {"id": "a215", "date": "新作", "field": "福祉サービス", "topic": "生活困窮者自立支援制度について", "opts": ["家計改善支援事業や就労準備支援事業もある。", "住居確保給付金の支給は、必ず実施しなければならない事業である。", "自立相談支援事業は、必ず実施しなければならない事業である。", "生活困窮者自立支援制度は、生活保護を受けている人だけが対象である。", "この制度は、国が個人に直接支援を行う。"], "ans": [1, 2, 3], "exp": ["任意事業（努力義務）", "必須事業", "必須事業", "生活保護に至る前の人が主な対象", "福祉事務所を設置する自治体が実施"], "point": "生活困窮者自立支援＝自立相談支援・住居確保給付金が必須"}, {"id": "a216", "date": "新作", "field": "福祉サービス", "topic": "日常生活自立支援事業について", "opts": ["日常生活自立支援事業では、不動産の売買など大きな財産の管理を行う。", "利用料は、必ず無料である。", "福祉サービスの利用援助や、日常的な金銭管理の支援を行う。", "実施主体は、都道府県・指定都市の社会福祉協議会である。", "利用するには、本人がこの事業の契約内容を理解できる能力が必要である。"], "ans": [3, 4, 5], "exp": ["大きな財産管理は成年後見制度", "原則有料（生活保護受給者は無料など）", "利用援助・金銭管理・書類の預かり", "社協（窓口は市町村社協のことが多い）", "契約能力が必要"], "point": "日常生活自立支援事業＝社協・契約できる人・日常的な金銭管理"}, {"id": "a217", "date": "新作", "field": "福祉サービス", "topic": "介護休業について", "opts": ["介護休業は、1年間に1回しか取れない。", "介護休業は、対象家族1人につき通算93日まで取得できる。", "介護休業は、要介護認定を受けていないと取れない。", "介護休業中は、雇用保険から介護休業給付金が支給されることがある。", "介護休業は、3回まで分けて取得できる。"], "ans": [2, 4, 5], "exp": ["93日を3回まで分けて取れる", "93日", "常時介護が必要な状態であればよく、要介護認定は必須ではない", "介護休業給付", "3回まで分割"], "point": "介護休業＝93日・3回まで分割・介護休業給付金"}, {"id": "a218", "date": "新作", "field": "福祉サービス", "topic": "障害者総合支援法のサービスについて", "opts": ["障害支援区分は、都道府県知事が認定する。", "居宅介護（ホームヘルプ）は、障害福祉サービスの一つである。", "サービス等利用計画は、相談支援専門員が作る。", "障害福祉サービスの利用者負担は、全員一律3割である。", "障害福祉サービスを利用するときは、障害支援区分の認定を受けることがある。"], "ans": [2, 3, 5], "exp": ["市町村が認定", "居宅介護", "相談支援専門員", "所得に応じた負担上限がある（原則1割）", "区分1〜6"], "point": "障害福祉＝障害支援区分（市町村）・相談支援専門員がサービス等利用計画"}, {"id": "a219", "date": "新作", "field": "福祉サービス", "topic": "難病の医療費助成について", "opts": ["難病の医療費助成は、介護保険から支給される。", "助成を受けるには、都道府県などに申請して医療受給者証を受ける。", "指定難病の医療費は、どんな場合も全額無料である。", "自己負担には、所得に応じた月ごとの上限額がある。", "指定難病の患者は、医療費の助成を受けられる。"], "ans": [2, 4, 5], "exp": ["難病法による公費", "申請して受給者証", "自己負担はある（原則2割で上限あり）", "上限額あり", "難病法"], "point": "指定難病＝申請して受給者証・自己負担上限あり"}, {"id": "a220", "date": "新作", "field": "福祉サービス", "topic": "身体障害者手帳について", "opts": ["手帳があると、障害福祉サービスや税の控除などを受けやすくなる。", "手帳の交付は、都道府県知事（指定都市・中核市の市長）が行う。", "要介護認定を受けると、自動的に身体障害者手帳が交付される。", "身体障害者手帳は、障害の程度により1級から6級に分けられる。", "身体障害者手帳は、65歳以上の人は取れない。"], "ans": [1, 2, 4], "exp": ["さまざまな支援", "都道府県知事など", "別の制度。申請が必要", "1〜6級（7級は単独では交付されない）", "年齢制限はない"], "point": "身体障害者手帳＝1〜6級・都道府県知事など・年齢制限なし"}, {"id": "a221", "date": "新作", "field": "福祉サービス", "topic": "民生委員について", "opts": ["民生委員には、守秘義務はない。", "民生委員は、厚生労働大臣から委嘱される。", "地域の住民の相談に応じ、必要な支援につなぐ。", "民生委員は、市町村の常勤職員である。", "民生委員は、児童委員も兼ねている。"], "ans": [2, 3, 5], "exp": ["守秘義務がある", "厚生労働大臣が委嘱", "地域の相談役", "非常勤の特別職の地方公務員でボランティア（無報酬）", "児童委員を兼ねる"], "point": "民生委員＝厚生労働大臣が委嘱・児童委員を兼ねる・無報酬・守秘義務"}, {"id": "a222", "date": "新作", "field": "福祉サービス", "topic": "社会福祉協議会について", "opts": ["市町村社会福祉協議会は、ボランティアセンターの運営などを行う。", "日常生活自立支援事業は、社会福祉協議会が実施している。", "社会福祉協議会は、介護保険の保険者である。", "社会福祉協議会は、地域福祉の推進を目的とする団体である。", "社会福祉協議会は、国の機関である。"], "ans": [1, 2, 4], "exp": ["ボランティア活動の支援", "社協が実施", "保険者は市町村", "地域福祉の推進", "民間の社会福祉法人"], "point": "社協＝地域福祉の推進・ボランティア・日常生活自立支援事業"}, {"id": "a223", "date": "新作", "field": "福祉サービス", "topic": "保佐と補助について", "opts": ["保佐は、判断能力を常に欠いている人が対象である。", "補助開始の審判をするには、本人の同意が必要である。", "補助人は、本人のすべての法律行為を代理する。", "保佐人に代理権を与えるには、本人の同意が必要である。", "保佐人は、借金や不動産の売買など法律で決められた重要な行為について同意権をもつ。"], "ans": [2, 4, 5], "exp": ["常に欠く人は後見。保佐は著しく不十分な人", "補助は本人の同意が必要", "補助人の権限は家庭裁判所が決めた特定の行為だけ", "代理権の付与には本人の同意", "民法13条1項の行為"], "point": "後見＝常に欠く・保佐＝著しく不十分・補助＝不十分（開始に本人同意）"}, {"id": "a224", "date": "新作", "field": "福祉サービス", "topic": "任意後見制度について", "opts": ["任意後見契約は、公正証書で結ばなければならない。", "任意後見人には、取消権がある。", "本人に判断能力があるうちに、将来の後見人と内容を決めておく制度である。", "任意後見契約は、口約束でも有効である。", "家庭裁判所が任意後見監督人を選任したときに、契約の効力が生じる。"], "ans": [1, 3, 5], "exp": ["公正証書", "任意後見人に取消権はない", "元気なうちに準備", "公正証書が必要", "監督人の選任で効力発生"], "point": "任意後見＝公正証書・監督人選任で効力・取消権なし"}, {"id": "a225", "date": "新作", "field": "福祉サービス", "topic": "成年後見制度の利用を支えるしくみについて", "opts": ["成年後見制度利用支援事業は、市町村が行う。", "成年後見制度利用支援事業では、申立ての費用や後見人の報酬を助成することがある。", "成年後見人には、親族しかなれない。", "身寄りがないなど申し立てる人がいない場合、市町村長が後見開始の審判を申し立てることができる。", "後見開始の審判は、市町村長が決定する。"], "ans": [1, 2, 4], "exp": ["地域支援事業の任意事業など", "費用の助成", "弁護士・司法書士・社会福祉士・市民後見人・法人もなれる", "市町村長申立て", "審判は家庭裁判所"], "point": "市町村長申立て・利用支援事業（費用助成）・後見人は専門職や法人も"}, {"id": "a226", "date": "新作", "field": "福祉サービス", "topic": "虐待を受けた高齢者の保護について", "opts": ["措置で保護した高齢者について、市町村などは虐待した養護者との面会を制限できる。", "虐待した養護者には、支援は一切行わない。", "養護者の負担を軽くするための支援も、市町村の役割である。", "虐待を受けた高齢者の保護は、家族の同意がなければできない。", "市町村は、生命や身体に重大な危険がある場合、高齢者を老人福祉法の措置で施設に入所させることができる。"], "ans": [1, 3, 5], "exp": ["面会制限", "養護者への支援も行う", "養護者支援も法律の目的", "命を守るため家族の同意がなくても措置できる", "やむを得ない事由による措置"], "point": "保護＝措置入所・面会制限。養護者への支援も行う"}, {"id": "a227", "date": "新作", "field": "福祉サービス", "topic": "経済的虐待について", "opts": ["家族のお金の使い方は、どんな場合も虐待にはあたらない。", "経済的虐待を見つけても、介護支援専門員は市町村に知らせなくてよい。", "本人の年金や預金を、家族が本人の同意なく使ってしまうことは経済的虐待にあたる。", "本人に無断で、本人の財産を処分することは経済的虐待にあたる。", "本人の生活に必要なお金を渡さないことは、経済的虐待にあたる。"], "ans": [3, 4, 5], "exp": ["本人の財産を不当に使えば虐待", "市町村に通報・相談する", "財産の不当な使用", "無断の処分", "必要な金銭を渡さない"], "point": "経済的虐待＝本人の財産を不当に使う・渡さない・無断で処分"}, {"id": "a228", "date": "新作", "field": "福祉サービス", "topic": "生活保護の原理と原則について", "opts": ["生活保護は、資産や能力などあらゆるものを活用することが前提とされる（補足性の原理）。", "生活保護は、困窮の理由によって受けられない人がいる。", "生活保護は、原則として本人などからの申請にもとづいて始まる（申請保護の原則）。", "生活保護は、原則として世帯を単位として行われる。", "生活保護は、ほかの法律の給付より優先して使われる。"], "ans": [1, 3, 4], "exp": ["補足性", "無差別平等の原理", "申請保護（急迫時は職権でも）", "世帯単位", "他法他施策が優先"], "point": "原理＝国家責任・無差別平等・最低生活・補足性／原則＝申請保護・基準及び程度・必要即応・世帯単位"}, {"id": "a229", "date": "新作", "field": "福祉サービス", "topic": "生活保護の介護扶助の内容について", "opts": ["福祉用具や住宅改修は、介護扶助に含まれる。", "介護扶助は、原則として金銭で給付される。", "居宅介護は、介護扶助に含まれる。", "移送は、介護扶助に含まれる。", "介護扶助は、都道府県が直接サービスを提供する。"], "ans": [1, 3, 4], "exp": ["福祉用具・住宅改修", "原則現物給付", "居宅介護", "移送", "指定介護機関に委託して行う"], "point": "介護扶助＝居宅介護・福祉用具・住宅改修・施設介護・介護予防・移送など／現物給付"}, {"id": "a230", "date": "新作", "field": "福祉サービス", "topic": "生活保護の申請と医療扶助について", "opts": ["生活保護を受けると、国民健康保険の被保険者ではなくなる。", "生活保護の申請は、本人・扶養義務者・同居の親族が行える。", "生活保護を受けている65歳以上の人は、介護保険の被保険者にならない。", "医療扶助は、原則として現物給付である。", "生活保護の申請は、市町村長に限られる。"], "ans": [1, 2, 4], "exp": ["国保の適用除外", "申請できる人", "65歳以上は第1号被保険者のまま", "現物給付", "本人などが福祉事務所に申請"], "point": "申請＝本人・扶養義務者・同居親族。被保護者は国保から外れるが、65歳以上は介護保険の第1号"}, {"id": "a231", "date": "新作", "field": "福祉サービス", "topic": "福祉事務所について", "opts": ["生活保護の実施は、福祉事務所が行う。", "町村は、福祉事務所を設置することができる（任意）。", "福祉事務所は、国が全国に1か所だけ置いている。", "都道府県と市（特別区を含む）は、福祉事務所を設置しなければならない。", "福祉事務所は、介護保険の保険者である。"], "ans": [1, 2, 4], "exp": ["生活保護の窓口", "任意設置", "都道府県・市などに置かれる", "設置義務", "保険者は市町村"], "point": "福祉事務所＝都道府県・市は必置、町村は任意。生活保護を実施"}, {"id": "a232", "date": "新作", "field": "福祉サービス", "topic": "認知症基本法について", "opts": ["認知症の人が尊厳を保ち、希望をもって暮らせる共生社会の実現をめざしている。", "国は、認知症施策推進基本計画を定める。", "認知症基本法では、認知症の人本人の意見は聞かないことになっている。", "認知症基本法（共生社会の実現を推進するための認知症基本法）は、2024年1月に施行された。", "認知症基本法は、認知症の人を施設に集めることを目的としている。"], "ans": [1, 2, 4], "exp": ["共生社会", "国の基本計画（都道府県・市町村の計画は努力義務）", "本人や家族の意見を聴くことが重視されている", "2024年1月施行", "地域で暮らせる社会をめざす"], "point": "認知症基本法（2024年）＝共生社会・本人の声を大切に"}, {"id": "a233", "date": "新作", "field": "福祉サービス", "topic": "認知症サポーターとチームオレンジについて", "opts": ["認知症サポーターには、特別な資格は必要ない。", "チームオレンジは、都道府県警察が運営する。", "チームオレンジは、認知症サポーターなどが、認知症の人や家族の困りごとを支えるしくみである。", "認知症サポーターは、養成講座を受けて、認知症を正しく理解し、認知症の人や家族を見守る応援者である。", "認知症サポーターは、医師でなければなれない。"], "ans": [1, 3, 4], "exp": ["講座を受ければなれる", "市町村がコーディネーターを置いて取り組む", "近所でできる支援", "応援者", "誰でもなれる"], "point": "認知症サポーター＝講座を受けた応援者／チームオレンジ＝サポーターなどの支援チーム"}, {"id": "a234", "date": "新作", "field": "福祉サービス", "topic": "認知症カフェについて", "opts": ["認知症の人や家族、地域の人、専門職などが気軽に集まれる場である。", "家族の悩みを話したり、情報を得たりする場にもなる。", "認知症の人本人の居場所としての役割もある。", "認知症カフェは、医療機関の外来診療の一つである。", "認知症カフェは、認知症の診断を受けた人しか参加できない。"], "ans": [1, 2, 3], "exp": ["誰でも集える場", "家族支援", "本人の居場所", "医療機関の外来ではない", "地域の人も参加できる"], "point": "認知症カフェ＝本人・家族・地域・専門職が集う場"}, {"id": "a235", "date": "新作", "field": "福祉サービス", "topic": "地域共生社会について", "opts": ["高齢・障害・子どもなど、分野をこえて支援することが大切とされる。", "住民が地域の課題を「我が事」として考えることが大切とされる。", "地域共生社会は、高齢者だけを対象にした考え方である。", "支える側・支えられる側という関係をこえて、地域の人がつながり支えあう社会をめざす。", "地域共生社会では、福祉の専門職だけが地域の課題を解決する。"], "ans": [1, 2, 4], "exp": ["分野をこえた包括的な支援", "我が事・丸ごと", "すべての人が対象", "支え手と受け手の固定をこえる", "住民と専門職がともに取り組む"], "point": "地域共生社会＝支え手・受け手をこえる・分野をこえる・我が事・丸ごと"}, {"id": "a236", "date": "新作", "field": "福祉サービス", "topic": "認知症対応型共同生活介護の計画について", "opts": ["グループホームに入居している間は、居宅介護支援は利用しない。", "計画作成担当者のうち1人以上は、介護支援専門員でなければならない。", "認知症対応型共同生活介護計画は、計画作成担当者が作る。", "計画は、入居者や家族に説明しなくてよい。", "グループホームの入居者のケアプランは、外部の居宅介護支援事業所が作る。"], "ans": [1, 2, 3], "exp": ["ホームの計画作成担当者が担当", "介護支援専門員を含む", "計画作成担当者", "説明して同意を得て交付する", "外部ではなくホームの計画作成担当者"], "point": "GHの計画＝計画作成担当者（ケアマネを含む）が作成"}, {"id": "a237", "date": "新作", "field": "福祉サービス", "topic": "小規模多機能型居宅介護の利用について", "opts": ["小規模多機能型居宅介護を利用している間は、居宅介護支援は利用しない。", "登録者のケアプランは、その事業所の介護支援専門員が作る。", "登録者は、ほかの事業所の通所介護も自由に併用できる。", "訪問看護や福祉用具貸与は、小規模多機能型居宅介護と一緒に利用できる。", "登録者は、複数の小規模多機能型居宅介護事業所に同時に登録できる。"], "ans": [1, 2, 4], "exp": ["居宅介護支援とは併用しない", "事業所のケアマネ", "通所介護・訪問介護・短期入所などは併用できない", "訪問看護・訪問リハ・福祉用具貸与などは併用できる", "登録は1か所だけ"], "point": "小多機＝事業所のケアマネがプラン作成・登録は1か所・訪問看護や福祉用具貸与は併用可"}, {"id": "a238", "date": "新作", "field": "福祉サービス", "topic": "車いすの介助について", "opts": ["車いすから離れるときや止まるときは、ブレーキをかける。", "段差を下りるときは、前向きのまま前輪から下ろす。", "段差を上がるときは、ティッピングレバーを踏んで前輪を上げる。", "車いすを押すときは、足をフットサポートにのせなくてもよい。", "急な下り坂では、車いすを後ろ向きにしてゆっくり下りる。"], "ans": [1, 3, 5], "exp": ["ブレーキ", "段差を下りるときは後ろ向きで後輪から", "前輪を上げる", "足はフットサポートにのせる", "後ろ向き"], "point": "上りはティッピングレバーで前輪を上げる・下りは後ろ向き・止まったらブレーキ"}, {"id": "a239", "date": "新作", "field": "福祉サービス", "topic": "ベッドから車いすへの移乗の介助について", "opts": ["移乗の前に、車いすのブレーキがかかっているか確認する。", "片麻痺のある人の場合、車いすは患側に置く。", "片麻痺のある人の場合、車いすはベッドに対して健側に置く。", "車いすは、ベッドに対して20〜30度くらいの角度に置く。", "移乗のときは、本人の力を使わず、介助者がすべて持ち上げる。"], "ans": [1, 3, 4], "exp": ["ブレーキの確認", "健側", "健側に置く", "斜めに置く", "本人のもっている力を活かす"], "point": "車いすは健側に20〜30度・ブレーキ確認・本人の力を活かす"}, {"id": "a240", "date": "新作", "field": "福祉サービス", "topic": "入浴の介助について", "opts": ["片麻痺のある人は、患側の足から浴槽に入る。", "脱衣所と浴室の温度差を小さくする。", "お湯の温度は、介助者が手で確かめてから入ってもらう。", "入浴は、食事の直後がいちばんよい。", "入浴後は、水分を補給してもらう。"], "ans": [2, 3, 5], "exp": ["健側から入る", "ヒートショックの予防", "湯温の確認", "食事直後や空腹時は避ける", "水分補給"], "point": "湯温確認・温度差を小さく・食直後は避ける・健側から入る・入浴後は水分"}, {"id": "a241", "date": "新作", "field": "福祉サービス", "topic": "排泄の介助について", "opts": ["本人の尿意や便意を大切にし、できるだけトイレで排泄できるよう支援する。", "排泄の介助は、本人に声をかけずに手早く行う。", "失敗を防ぐため、尿意があってもすぐにおむつを使う。", "プライバシーに配慮し、羞恥心を傷つけないようにする。", "ポータブルトイレは、片麻痺のある人の場合、ベッドの健側に置く。"], "ans": [1, 4, 5], "exp": ["自立支援", "声をかけて同意を得る", "安易なおむつは自立を妨げる", "羞恥心への配慮", "健側"], "point": "排泄＝プライバシー・尿意を大切に・トイレでの排泄を支える"}, {"id": "a242", "date": "新作", "field": "福祉サービス", "topic": "食事の介助について", "opts": ["一口の量は少なめにし、飲み込んだのを確認してから次を口に運ぶ。", "食事のペースは、介助者の都合に合わせる。", "片麻痺のある人は、麻痺側の口の中に食べ物が残りやすい。", "介助者は立ったまま、上から口に運ぶのがよい。", "いすに深く座り、軽く前かがみの姿勢で食べてもらう。"], "ans": [1, 3, 5], "exp": ["一口量と飲み込みの確認", "本人のペースで", "麻痺側に残りやすい", "座って目線を合わせる。上からだとあごが上がり誤嚥しやすい", "安全な姿勢"], "point": "前かがみ・一口は少なめ・飲み込みを確認・介助者は座って目線を合わせる"}, {"id": "a243", "date": "新作", "field": "福祉サービス", "topic": "認知症の人の帰宅願望やひとり歩きへの対応について", "opts": ["外に出ないように、部屋に鍵をかけて閉じ込める。", "ひとり歩きをする人には、強い口調で注意する。", "「帰りたい」という気持ちを否定せず、受け止める。", "地域の見守りやSOSネットワークを活用する。", "どんな時間帯や状況で起こるか観察し、理由を考える。"], "ans": [3, 4, 5], "exp": ["身体拘束・虐待にあたる", "不安を強める", "気持ちを受け止める", "地域で見守る", "理由を探る"], "point": "帰宅願望・ひとり歩き＝否定しない・理由を考える・地域で見守る"}, {"id": "a244", "date": "新作", "field": "福祉サービス", "topic": "災害時の避難支援について", "opts": ["避難行動要支援者名簿は、都道府県が作る。", "本人の同意があれば、名簿の情報を平常時から民生委員などの避難支援者に提供できる。", "市町村は、避難行動要支援者名簿を作らなければならない。", "災害が起きたときは、本人の同意がなければ名簿の情報は使えない。", "市町村は、避難行動要支援者ごとの個別避難計画を作るよう努めなければならない。"], "ans": [2, 3, 5], "exp": ["市町村が作る", "同意で平常時から提供", "作成義務", "災害時は同意がなくても提供できる", "努力義務（2021年から）"], "point": "名簿＝市町村の義務・個別避難計画＝努力義務・平常時は同意で提供"}, {"id": "a245", "date": "新作", "field": "福祉サービス", "topic": "福祉避難所について", "opts": ["状況に応じて、一般の避難所を経由せずに福祉避難所へ直接避難できるようにする取組みがある。", "福祉避難所は、災害が起きてから初めて場所を決める。", "福祉避難所には、介護施設などが指定されることがある。", "福祉避難所は、健康な若い人だけが利用できる。", "福祉避難所は、高齢者や障害者など特別な配慮が必要な人のための避難所である。"], "ans": [1, 3, 5], "exp": ["直接避難", "事前に指定・公示しておく", "社会福祉施設など", "要配慮者が対象", "要配慮者のため"], "point": "福祉避難所＝要配慮者のため・事前に指定・直接避難も"}, {"id": "a246", "date": "新作", "field": "福祉サービス", "topic": "介護事業所の業務継続計画（BCP）について", "opts": ["業務継続計画は、一度作ったら見直す必要はない。", "2024年4月から、すべての介護サービス事業者に業務継続計画の策定が義務づけられた。", "業務継続計画は、大きな施設だけが作ればよい。", "計画にもとづいて、研修や訓練を定期的に行う。", "業務継続計画は、感染症と自然災害の両方について作る。"], "ans": [2, 4, 5], "exp": ["定期的に見直す", "2024年度から完全義務化", "全事業者が対象", "研修・訓練", "感染症・災害"], "point": "BCP＝全事業者の義務（2024年〜）・感染症と災害・研修と訓練・見直し"}, {"id": "a247", "date": "新作", "field": "福祉サービス", "topic": "介護現場のハラスメント対策について", "opts": ["事業者は、職場のハラスメントを防ぐための措置をとらなければならない。", "利用者からのハラスメントは、介護の仕事だからがまんすべきである。", "ハラスメントの相談は、職員個人で解決しなければならない。", "ハラスメントを受けた職員が相談できる窓口を設ける。", "利用者や家族からのハラスメントへの対策も、事業者に求められている。"], "ans": [1, 4, 5], "exp": ["事業者の義務", "がまんさせない", "組織で対応する", "相談体制", "カスタマーハラスメント対策"], "point": "ハラスメント＝事業者が防止措置・相談窓口・組織で対応"}, {"id": "a248", "date": "新作", "field": "福祉サービス", "topic": "高齢者の社会参加の場について", "opts": ["社会参加は、介護予防にも役立つ。", "老人クラブは、地域の高齢者が自主的に活動する組織である。", "シルバー人材センターでは、常勤のフルタイムの仕事だけを紹介する。", "シルバー人材センターは、高齢者に臨時的・短期的な仕事などを提供する。", "老人クラブは、介護保険の指定事業者である。"], "ans": [1, 2, 4], "exp": ["閉じこもり予防など", "自主的な組織", "臨時的・短期的な仕事が中心", "臨時的・短期的・軽易な仕事", "住民の自主的な組織"], "point": "シルバー人材センター・老人クラブ＝社会参加・介護予防"}, {"id": "a249", "date": "新作", "field": "福祉サービス", "topic": "福祉有償運送について", "opts": ["料金は、タクシーより高く自由に決めてよい。", "福祉有償運送は、誰でも登録なしで自由に行える。", "NPO法人などが、ひとりで公共交通機関を使うのが難しい人を、自家用車で有償で運送するしくみである。", "利用者は、あらかじめ会員として登録する。", "行うには、国（運輸支局など）への登録が必要である。"], "ans": [3, 4, 5], "exp": ["営利とならない範囲（タクシー料金のおおむね半額が目安）", "登録が必要", "自家用車による有償運送", "会員登録", "登録制"], "point": "福祉有償運送＝NPO法人など・登録制・会員制・営利でない料金"}, {"id": "a250", "date": "新作", "field": "福祉サービス", "topic": "孤独・孤立対策について", "opts": ["孤独・孤立対策推進法が、2024年4月に施行された。", "孤独・孤立は、本人の責任なので社会で対応する必要はない。", "孤独・孤立対策は、高齢者だけが対象である。", "地方公共団体は、孤独・孤立対策地域協議会を置くよう努める。", "孤独・孤立は、誰にでも起こりうる問題とされている。"], "ans": [1, 4, 5], "exp": ["2024年4月施行", "社会全体で取り組む", "すべての世代が対象", "努力義務", "誰にでも起こりうる"], "point": "孤独・孤立対策推進法（2024年）＝誰にでも起こりうる・社会全体で"}, {"id": "b001", "date": "新作", "field": "介護保険制度", "topic": "介護保険制度ができた背景について", "opts": ["家族だけで介護を支えることが難しくなったことが背景にある。", "措置制度から、利用者が自分でサービスを選んで契約するしくみに変わった。", "高齢化が進み、介護が必要な高齢者が増えたことが背景にある。", "介護保険ができる前は、高齢者の介護サービスはまったくなかった。", "介護保険は、税金だけでまかなう社会扶助方式である。"], "ans": [1, 2, 3], "exp": ["核家族化・介護の長期化", "措置から契約へ", "高齢化と要介護者の増加", "老人福祉法の措置などでサービスはあった", "保険料と公費による社会保険方式"], "point": "介護保険＝社会保険方式・措置から契約へ・介護の社会化"}, {"id": "b002", "date": "新作", "field": "介護保険制度", "topic": "社会保険方式について", "opts": ["社会保険は、要件を満たす人は加入が義務づけられる（強制加入）。", "社会保険は、加入者が保険料を出し合い、要件にあてはまった人に給付するしくみである。", "生活保護は、社会保険の一つである。", "社会保険で ": [1, 2, 5], "exp": ["法人が原則", "5年", "病院・診療所は個人でも指定（みなし指定）を受けられる", "経験は欠格事由ではない", "人員基準"], "point": "欠格＝法人でない・人員や設備や運営の基準を満たさない・取消し後5年など"}, {"id": "b024", "date": "新作", "field": "介護保険制度", "topic": "介護保険施設の指定と許可について", "opts": ["介護医療院は、都道府県知事の開設許可を受ける。", "介護老人福祉施設は、都道府県知事の指定を受ける。", "介護老人保健施設は、都道府県知事の開設許可を受ける。", "介護老人保健施設は、市町村長の指定を受ける。", "介護保険施設には、更新の制度はない。"], "ans": [1, 2, 3], "exp": ["介護医療院は許可", "特養は指定", "老健は許可", "都道府県知事の許可", "6年ごとの更新がある"], "point": "特養＝指定、老健・介護医療院＝許可（いずれも都道府県知事・6年更新）"}, {"id": "b025", "date": "新作", "field": "介護保険制度", "topic": "介護保険施設を開設できる者について", "opts": ["介護老人保健施設は、地方公共団体・医療法人・社会福祉法人などが開設できる。", "特別養護老人ホームは、個人が設置できる。", "介護医療院は、地方公共団体・医療法人・社会福祉法人などが開設できる。", "介護老人保健施設は、株式会社が自由に開設できる。", "特別養護老人ホームは、地方公共団体や社会福祉法人が設置できる。"], "ans": [1, 3, 5], "exp": ["非営利の法人など", "個人はできない", "非営利の法人など", "営利法人は開設できない", "主に地方公共団体・社会福祉法人"], "point": "施設の開設は非営利（地方公共団体・社会福祉法人・医療法人など）"}, {"id": "b026", "date": "新作", "field": "介護保険制度", "topic": "指定居宅介護支援事業者の指定について", "opts": ["居宅介護支援事業者の指定は、厚生労働大臣が行う。", "指定の更新は、6年ごとである。", "指定居宅介護支援事業者の指定は、市町村長が行う。", "居宅介護支援事業者の指定は、2018年度から都道府県から市町村に移った。", "居宅介護支援事業者の指定には、更新はない。"], "ans": [2, 3, 4], "exp": ["市町村長", "6年更新", "市町村長", "2018年度から", "6年ごとに更新"], "point": "居宅介護支援事業者＝市町村長が指定（2018年度〜）・6年更新"}, {"id": "b027", "date": "新作", "field": "介護保険制度", "topic": "居宅介護支援を始めるときの説明と同意について", "opts": ["同意は、サービスを始めてから1年以内に得ればよい。", "利用者は、ケアプランに位置づける事業所の紹介を複数求めることができると説明する。", "サービスの提供を始める前に、運営規程の概要などの重要事項を文書で説明する。", "重要事項の説明は、口頭だけで済ませてよい。", "利用者の同意を得てから、サービスの提供を始める。"], "ans": [2, 3, 5], "exp": ["開始前に同意を得る", "複数紹介を求められることの説明", "文書で説明", "文書を交付して説明", "同意を得て開始"], "point": "開始前に文書で説明・同意。複数の事業所の紹介を求められると説明"}, {"id": "b028", "date": "新作", "field": "介護保険制度", "topic": "居宅介護支援での被保険者証の確認と申請の援助について", "opts": ["更新の申請は、有効期間が終わる30日前までには行われるよう援助する。", "認定の申請は、介護支援専門員が自分の判断で行ってはならず、援助もできない。", "被保険者証の確認は、利用者の家族に任せればよい。", "まだ要介護認定を受けていない人には、申請が行われるよう必要な援助を行う。", "サービスを始めるときは、被保険者証で被保険者資格や認定の有無・有効期間を確かめる。"], "ans": [1, 4, 5], "exp": ["満了30日前までに", "申請の代行や援助ができる", "事業者が確認する", "申請の援助", "被保険者証の確認"], "point": "被保険者証の確認・申請の援助・更新は満了30日前までに"}, {"id": "b029", "date": "新作", "field": "介護保険制度", "topic": "居宅介護支援事業者から市町村への通知について", "opts": ["利用者がサービスを一度でも休んだら、必ず市町村に通知する。", "利用者が偽りその他不正な行為で保険給付を受けた（受けようとした）ときは、市町村に通知する。", "通知は、遅れることなく行う。", "利用者の不正を知っても、市町村に知らせてはならない。", "利用者が正当な理由なく、介護給付の利用に関する指示に従わず、要介護状態を悪化させたときは、市町村に通知する。"], "ans": [2, 3, 5], "exp": ["休んだだけでは対象外", "不正受給", "遅滞なく", "通知する", "指示に従わない"], "point": "指示に従わず悪化・不正受給は市町村へ通知"}, {"id": "b030", "date": "新作", "field": "介護保険制度", "topic": "主治医への情報提供について", "opts": ["利用者が医療系サービスの利用を希望するときは、利用者の同意を得て主治医などの意見を求める。", "医療系サービスを位置づけたケアプランは、その意見を求めた主治医などに交付する。", "主治医には、ケアプランを見せてはならない。", "医療系サービスの利用には、主治医の意見は関係ない。", "介護支援専門員は、利用者の服薬状況や口腔の状態など、必要な情報を主治医などに提供する。"], "ans": [1, 2, 5], "exp": ["主治医の意見を求める", "ケアプランを主治医に交付", "交付する", "主治医の指示が必要", "気づいたことを主治医へ"], "point": "医療系サービス＝主治医の意見→ケアプランを主治医にも交付・服薬などの情報提供"}, {"id": "b031", "date": "新作", "field": "介護保険制度", "topic": "生活援助の回数が多いケアプランについて", "opts": ["生活援助は、何回位置づけても届出はいらない。", "訪問介護の生活援助中心型を、厚生労働大臣が定める回数以上位置づけたときは、ケアプランを市町村に届け出る。", "届出の目的は、利用者の自立支援・重度化防止の観点からケアプランを見直すことである。", "届出をしたら、生活援助は必ず減らされる。", "届け出たケアプランは、地域ケア会議などで検証されることがある。"], "ans": [2, 3, 5], "exp": ["一定回数以上は届出", "届出が必要", "自立支援の視点", "必要な場合はそのまま認められる", "検証される"], "point": "生活援助が多いケアプランは市町村に届出→検証"}, {"id": "b032", "date": "新作", "field": "介護保険制度", "topic": "福祉用具貸与をケアプランに位置づけるときについて", "opts": ["福祉用具貸与は、サービス担当者会議で検討しなくてよい。", "継続が必要な場合は、その理由をケアプランに書く。", "継続して貸与を受ける必要があるか、必要に応じて随時検証する。", "いったん位置づけた福祉用具は、検証しなくてよい。", "福祉用具貸与が必要な理由を、ケアプランに書く。"], "ans": [2, 3, 5], "exp": ["会議で検討する", "継続の理由", "随時検証", "検証が必要", "理由の記載"], "point": "福祉用具＝必要な理由を記載・継続の必要性を検証"}, {"id": "b033", "date": "新作", "field": "介護保険制度", "topic": "短期入所サービスをケアプランに位置づけるときについて", "opts": ["利用者の心身の状況などから特に必要な場合は、半数を超えることもできる。", "短期入所サービスは、何日でも上限なく連続で使える。", "短期入所サービスの利用日数は、原則として要介護認定の有効期間のおおむね半数を超えないようにする。", "短期入所サービスは、ケアプランに位置づけなくても保険給付される。", "短期入所サービスは、在宅生活を続けるために計画的に使うことが前提である。"], "ans": [1, 3, 5], "exp": ["特に必要なら例外", "連続30日まで（31日目は自費）", "おおむね半数", "ケアプランに位置づけて給付", "在宅生活の継続のため"], "point": "短期入所＝有効期間のおおむね半数まで・連続30日まで"}, {"id": "b034", "date": "新作", "field": "介護保険制度", "topic": "介護保険施設への紹介について", "opts": ["施設への入所は、介護支援専門員が利用者の同意なく決める。", "介護保険施設から退所しようとする人から依頼があれば、円滑に在宅に移れるよう、居宅サービス計画の作成などの援助を行う。", "居宅で生活するのが難しくなったと判断したときや、利用者が施設への入所を希望するときは、介護保険施設への紹介などを行う。", "介護支援専門員は、施設への紹介は一切してはならない。", "施設への紹介は、利用者の希望や状態をふまえて行う。"], "ans": [2, 3, 5], "exp": ["本人の同意が必要", "退所時の支援", "施設の紹介", "紹介も業務", "本人の希望をふまえて"], "point": "入所の紹介・退所後の在宅生活の準備も居宅介護支援の役割"}, {"id": "b035", "date": "新作", "field": "介護保険制度", "topic": "退院・退所するときの連携について", "opts": ["退院前カンファレンスに参加して、在宅での生活の準備をする。", "利用者が退院・退所するときは、病院や施設の職員と面談して必要な情報を得る。", "退院が決まってから、病院と連絡をとる必要はない。", "退院後のサービスは、病院がすべて決める。", "退院後のケアプランは、病院や施設から得た情報をふまえて作る。"], "ans": [1, 2, 5], "exp": ["カンファレンス", "情報の収集", "早めに連携する", "介護支援専門員が利用者と一緒に調整する", "情報をふまえて作成"], "point": "退院・退所時は病院・施設と面談して情報収集し、ケアプランに反映"}, {"id": "b036", "date": "新作", "field": "介護保険制度", "topic": "居宅介護支援の記録について", "opts": ["記録は、サービスが終わったらすぐ捨ててよい。", "記録は、利用者に見せてはならない。", "記録は、その完結の日から2年間保存する（条例でそれ以上の期間を定めていることもある）。", "居宅サービス計画やアセスメント、モニタリングの記録を整備する。", "サービス担当者会議の記録も整備する。"], "ans": [3, 4, 5], "exp": ["保存義務がある", "本人の開示請求には応じる", "基準上は2年", "記録の整備", "会議の記録"], "point": "記録は完結から2年保存（条例で5年などもある）"}, {"id": "b037", "date": "新作", "field": "介護保険制度", "topic": "指定居宅介護支援事業所の管理者について", "opts": ["管理者は、原則として主任介護支援専門員である。", "管理者は、事業所の業務とは関係なく、ほかの事業所の管理者を何か所も自由に兼務できる。", "管理者は、事業所の介護支援専門員の管理や業務の実施状況の把握を行う。", "管理者は、従業者に基準を守らせるため必要な指揮命令を行う。", "管理者は、介護支援専門員の資格がなくてもよい。"], "ans": [1, 3, 4], "exp": ["主任ケアマネが原則", "兼務は管理に支障がない範囲などで認められる", "一元的な管理", "指揮命令", "主任介護支援専門員が原則"], "point": "管理者＝主任ケアマネが原則・事業所を一元的に管理"}, {"id": "b038", "date": "新作", "field": "介護保険制度", "topic": "居宅介護支援での秘密保持について", "opts": ["サービス担当者会議で利用者の個人情報を使うときは、あらかじめ利用者から文書で同意を得る。", "介護支援専門員でなくなったあとは、秘密を漏らしてもよい。", "家族の個人情報を使うときは、あらかじめ家族から文書で同意を得る。", "秘密保持の同意は、口頭で得ればよい。", "介護支援専門員は、正当な理由なく、業務で知った利用者や家族の秘密を漏らしてはならない。"], "ans": [1, 3, 5], "exp": ["利用者の文書同意", "辞めたあとも守る", "家族の文書同意", "文書で同意を得る", "秘密保持"], "point": "会議で使う個人情報＝利用者・家族それぞれから文書で同意"}, {"id": "b039", "date": "新作", "field": "介護保険制度", "topic": "重要事項の掲示について", "opts": ["2025年度から、原則として重要事項をウェブサイトにも掲載する。", "掲示のかわりに、ファイルなどにして自由に見られるようにしておくこともできる。", "重要事項は、事業者だけが知っていればよい。", "事業所の見やすい場所に、運営規程の概要などの重要事項を掲示する。", "掲示する内容に、苦情処理の体制は含まれない。"], "ans": [1, 2, 4], "exp": ["ウェブ掲載", "閲覧できる形でもよい", "利用者が見られるようにする", "掲示", "苦情処理の体制なども含む"], "point": "重要事項の掲示・閲覧・ウェブ掲載（2025年度〜）"}, {"id": "b040", "date": "新作", "field": "介護保険制度", "topic": "居宅介護支援で事故が起きたときについて", "opts": ["賠償すべき事故の場合は、速やかに損害を賠償する。", "事故の内容は、家族に知らせなくてよい。", "事故の状況や処置について記録する。", "事故が起きたときは、市町村や利用者の家族などに連絡し、必要な措置をとる。", "事故の記録は不要である。"], "ans": [1, 3, 4], "exp": ["賠償", "家族に連絡", "記録", "連絡と措置", "記録する"], "point": "事故＝市町村・家族へ連絡・記録・賠償"}, {"id": "b041", "date": "新作", "field": "介護保険制度", "topic": "居宅サービス計画書の第1表について", "opts": ["第1表には、総合的な援助の方針を書く。", "第1表には、利用者と家族の生活に対する意向を書く。", "第1表には、介護認定審査会の意見やサービスの種類の指定を書く欄がある。", "第1表には、週間のサービスの予定を書く。", "第1表には、サービス事業者の請求金額を書く。"], "ans": [1, 2, 3], "exp": ["総合的な援助の方針", "意向", "審査会の意見", "週間サービス計画表は第3表", "請求は別の書類"], "point": "第1表＝意向・審査会の意見・総合的な援助の方針"}, {"id": "b042", "date": "新作", "field": "介護保険制度", "topic": "居宅サービス計画書の第2表について", "opts": ["第2表には、サービスの内容・種別・頻度・期間を書く。", "第2表には、介護支援専門員の訪問の経過を書く。", "第2表には、生活全般の解決すべき課題（ニーズ）を書く。", "第2表には、サービス担当者会議の要点を書く。", "第2表には、長期目標と短期目標、その期間を書く。"], "ans": [1, 3, 5], "exp": ["援助内容", "経過は第5表", "ニーズ", "会議の要点は第4表", "目標と期間"], "point": "第2表＝ニーズ→長期目標→短期目標→サービス内容"}, {"id": "b043", "date": "新作", "field": "介護保険制度", "topic": "居宅サービス計画の第3表から第5表について", "opts": ["第3表には、課題と目標を書く。", "第3表は、週間サービス計画表である。", "第5表は、サービス利用票である。", "第4表は、サービス担当者会議の要点である。", "第5表は、居宅介護支援経過である。"], "ans": [2, 4, 5], "exp": ["課題と目標は第2表", "週間の予定", "サービス利用票は第6表", "会議の要点", "経過記録"], "point": "第3表＝週間・第4表＝会議の要点・第5表＝支援経過・第6表＝利用票・第7表＝利用票別表"}, {"id": "b044", "date": "新作", "field": "介護保険制度", "topic": "サービス利用票と給付管理について", "opts": ["サービス利用票は、利用者に月ごとのサービスの予定を示し、確認を得るためのものである。", "サービス提供票は、居宅介護支援事業者からサービス事業者へ渡す。", "サービス利用票は、年に1回だけ作ればよい。", "給付管理票は、利用者が市町村に提出する。", "居宅介護支援事業者は、毎月、給付管理票を国保連に提出する。"], "ans": [1, 2, 5], "exp": ["利用者への予定の提示", "事業者への提供票", "毎月作る", "居宅介護支援事業者が国保連へ", "給付管理票は国保連へ"], "point": "利用票（利用者）・提供票（事業者）・給付管理票（国保連へ毎月）"}, {"id": "b045", "date": "新作", "field": "介護保険制度", "topic": "ケアプランの目標の書き方について", "opts": ["目標は、具体的で、達成できたかどうかがわかるように書く。", "目標は、サービス事業者がすることを書く。", "目標は、できるだけあいまいに書いたほうがよい。", "目標は、利用者が自分のこととして取り組めるよう、利用者を主語にして考える。", "短期目標は、長期目標を達成するための段階的な目標として書く。"], "ans": [1, 4, 5], "exp": ["具体的・評価できる", "援助内容と目標は別", "あいまいだと評価できない", "利用者が主体", "段階的な目標"], "point": "目標＝利用者が主語・具体的・評価できる・短期は段階的"}, {"id": "b046", "date": "新作", "field": "介護保険制度", "topic": "生活全般の解決すべき課題（ニーズ）について", "opts": ["ニーズは、利用したいサービスの名前を書けばよい。", "ニーズは、利用者の自立をさまたげている要因や、本人の望む生活とのずれから導き出す。", "ニーズには、優先順位をつける。", "ニーズは、本人や家族の言葉を大切にしながら、専門職として判断して導き出す。", "ニーズは、介護支援専門員が一人で決めて、利用者には伝えない。"], "ans": [2, 3, 4], "exp": ["サービス名ではなく生活上の課題", "望む生活とのずれ", "優先順位", "本人の言葉と専門的判断", "利用者と共有する"], "point": "ニーズ＝望む生活とのずれ。サービス名ではない"}, {"id": "b047", "date": "新作", "field": "介護保険制度", "topic": "ケアマネジメントの公正・中立について", "opts": ["同じ法人の事業所だけを紹介するなど、利用者の選択を不当にせばめてはならない。", "自分の法人のサービスを使うよう、利用者に強く勧めてよい。", "介護支援専門員は、特定の事業者にかたよることなく、公正・中立に業務を行う。", "公正・中立は、施設のケアマネジメントには関係ない。", "事業者から、利用者を紹介した見返りの金品を受け取ってはならない。"], "ans": [1, 3, 5], "exp": ["選択の自由", "利用者の選択を尊重", "公正中立", "どこでも大切", "利益収受の禁止"], "point": "公正中立・利用者の選択・利益収受の禁止"}, {"id": "b048", "date": "新作", "field": "介護保険制度", "topic": "介護予防支援の考え方について", "opts": ["介護予防支援では、利用者が目標をもって主体的に取り組めるよう支援する。", "介護予防支援では、利用者の意欲は考えなくてよい。", "目標を達成するための具体的な方法を、利用者と一緒に考える。", "介護予防サービス計画の期間が終わるときは、目標が達成できたか評価する。", "介護予防支援は、サービスをできるだけ多く使うことを目的とする。"], "ans": [1, 3, 4], "exp": ["主体的な取組み", "意欲を引き出す", "一緒に考える", "計画期間終了時の評価", "自立に向けた支援が目的"], "point": "介護予防＝目標志向・主体性・期間終了時に評価"}, {"id": "b049", "date": "新作", "field": "介護保険制度", "topic": "介護予防ケアマネジメントの類型について", "opts": ["ケアマネジメントCでは、毎月モニタリングを行う。", "原則的な介護予防ケアマネジメント（ケアマネジメントA）は、介護予防支援と同じような流れで行う。", "介護予防ケアマネジメントには、一つの類型しかない。", "初回のみの介護予防ケアマネジメント（ケアマネジメントC）は、住民主体のサービスなどを使う場合に行う。", "簡略化した介護予防ケアマネジメント（ケアマネジメントB）では、サービス担当者会議を省略することがある。"], "ans": [2, 4, 5], "exp": ["Cは初回だけでモニタリングは行わない", "A＝原則的", "A・B・Cがある", "C＝初回のみ", "B＝簡略化"], "point": "A（原則的）・B（簡略化）・C（初回のみ）"}, {"id": "b050", "date": "新作", "field": "介護保険制度", "topic": "総合事業の事業対象者について", "opts": ["事業対象者は、介護保険施設に入所できる。", "事業対象者は、予防給付のサービスは使えない。", "事業対象者は、65歳以上で、基本チェックリストで生活機能の低下がみられた人である。", "事業対象者は、要介護認定を受けなくても、介護予防・生活支援サービス事業を使える。", "第2号被保険者も、基本チェックリストだけで事業対象者になれる。"], "ans": [2, 3, 4], "exp": ["施設は要介護者", "予防給付は要支援者", "65歳以上・基本チェックリスト", "認定なしで使える", "第2号は要介護認定が必要"], "point": "事業対象者＝65歳以上・基本チェックリスト該当・総合事業のみ"}, {"id": "b051", "date": "新作", "field": "介護保険制度", "topic": "任意事業について", "opts": ["介護給付等費用適正化事業は、任意事業に含まれる。", "任意事業は、都道府県が行う。", "家族介護支援事業は、任意事業に含まれる。", "任意事業には、第2号保険料が使われる。", "ケアプランの点検は、適正化事業の取組みの一つである。"], "ans": [1, 3, 5], "exp": ["適正化事業", "市町村が行う", "家族介護支援", "第2号保険料は使わない", "ケアプラン点検"], "point": "任意事業＝適正化事業・家族介護支援・その他（成年後見利用支援など）"}, {"id": "b052", "date": "新作", "field": "介護保険制度", "topic": "在宅医療・介護連携推進事業について", "opts": ["この事業は、都道府県だけが行う。", "医療・介護関係者の研修や、相談窓口の設置などを行う。", "在宅医療と介護が切れ目なく提供されるよう、関係者の連携を進める事業である。", "在宅医療・介護連携推進事業は、任意事業である。", "地域の医療・介護の資源を把握し、課題を抽出して対応策を考える。"], "ans": [2, 3, 5], "exp": ["市町村が行う（都道府県は支援）", "研修・相談支援", "切れ目のない提供", "包括的支援事業", "資源の把握と課題の抽出"], "point": "在宅医療・介護連携推進事業＝包括的支援事業・市町村"}, {"id": "b053", "date": "新作", "field": "介護保険制度", "topic": "生活支援体制整備事業について", "opts": ["住民や関係者が話し合う協議体を設ける。", "生活支援コーディネーターは、国が置く。", "地域の支え合いの活動や、生活支援サービスの担い手づくりを進める。", "生活支援体制整備事業は、任意事業である。", "生活支援コーディネーター（地域支え合い推進員）を置く。"], "ans": [1, 3, 5], "exp": ["協議体", "市町村が置く", "担い手づくり", "包括的支援事業", "コーディネーター"], "point": "生活支援体制整備＝生活支援コーディネーター＋協議体"}, {"id": "b054", "date": "新作", "field": "介護保険制度", "topic": "介護保険審査会の構成について", "opts": ["市町村を代表する委員は、3人である。", "委員の任期は、1年である。", "公益を代表する委員は、3人以上である。", "委員は、市町村長が任命する。", "被保険者を代表する委員は、3人である。"], "ans": [1, 3, 5], "exp": ["市町村代表3人", "任期は3年", "公益代表3人以上", "都道府県知事が任命する", "被保険者代表3人"], "point": "審査会＝被保険者代表3・市町村代表3・公益代表3人以上（知事が任命）"}, {"id": "b055", "date": "新作", "field": "介護保険制度", "topic": "保健事業と介護予防の一体的実施について", "opts": ["通いの場などで、健康状態の把握や保健指導を行う。", "一体的実施は、介護保険施設の入所者だけが対象である。", "後期高齢者医療広域連合は、保健事業を市町村に委託できる。", "後期高齢者の保健事業と介護予防を、市町村が一体的に行う取組みである。", "一体的実施は、国が直接、高齢者に保健指導を行うしくみである。"], "ans": [1, 3, 4], "exp": ["通いの場の活用", "地域の高齢者が対象", "広域連合から市町村へ委託", "2020年度から", "市町村が実施"], "point": "保健事業と介護予防の一体的実施（2020年度〜）＝市町村・通いの場"}, {"id": "b056", "date": "新作", "field": "介護保険制度", "topic": "施設入所者の在宅復帰の検討について", "opts": ["施設は、入所者が居宅で日常生活を送れるかどうか、定期的に検討する。", "退所後の生活については、施設は一切関わらない。", "検討は、介護職員・看護職員・介護支援専門員などで協議して行う。", "一度入所した人について、在宅に戻れるかを考える必要はない。", "居宅で生活できると認められる入所者には、本人の希望などをふまえて円滑な退所を支援する。"], "ans": [1, 3, 5], "exp": ["定期的に検討", "居宅介護支援事業者への情報提供など退所の援助を行う", "多職種で協議", "定期的に検討する", "退所の支援"], "point": "施設は入所者が居宅で暮らせるか定期的に検討・退所を支援"}, {"id": "b057", "date": "新作", "field": "介護保険制度", "topic": "介護保険施設の入所の優先順位について", "opts": ["入所は、申込みの早い順に必ず決めなければならない。", "入所申込者が多いときは、介護の必要の程度や家族の状況などを考えて、必要性が高い人を優先する。", "入所の必要性は、施設が定める指針などにもとづいて判断する。", "入所の判断に、家族の介護力は関係ない。", "特別養護老人ホームの入所の判定は、申込みの順番だけで決めるのではない。"], "ans": [2, 3, 5], "exp": ["必要性で判断", "必要性の高い人を優先", "入所指針", "家族の状況も考慮", "順番だけではない"], "point": "入所は申込順ではなく必要性の高い人から"}, {"id": "b058", "date": "新作", "field": "介護保険制度", "topic": "施設での栄養と口腔の管理について", "opts": ["口腔衛生の管理は、歯科医師がいない施設では行わなくてよい。", "施設では、入所者の体重を測る必要はない。", "2024年度から、施設での栄養管理と口腔衛生管理は基本の基準として求められている。", "介護保険施設では、入所者の口腔衛生の管理を計画的に行う。", "介護保険施設では、入所者の栄養状態に応じた栄養管理を計画的に行う。"], "ans": [3, 4, 5], "exp": ["歯科医師・歯科衛生士の助言をもとに行う", "体重の変化は栄養状態の大切な指標", "運営基準に位置づけ", "口腔衛生管理", "栄養管理"], "point": "施設＝栄養管理・口腔衛生管理を計画的に"}, {"id": "b059", "date": "新作", "field": "介護保険制度", "topic": "介護事業所の感染症対策について", "opts": ["感染症対策は、感染症が発生してから考えればよい。", "感染症対策の研修は、看護職員だけが受ければよい。", "従業者に、感染症対策の研修と訓練（シミュレーション）を定期的に行う。", "感染症の予防とまん延防止のための対策を検討する委員会を、定期的に開く。", "感染症の予防とまん延防止のための指針を整備する。"], "ans": [3, 4, 5], "exp": ["平時からの備え", "すべての従業者", "研修と訓練", "委員会", "指針"], "point": "感染症対策＝委員会・指針・研修・訓練（全サービスで義務）"}, {"id": "b060", "date": "新作", "field": "介護保険制度", "topic": "介護事業所の虐待防止の措置について", "opts": ["虐待防止の研修は、新人職員だけが受ければよい。", "虐待防止のための指針を整備する。", "虐待防止の措置は、施設だけに義務づけられている。", "虐待防止の研修を定期的に行い、担当者を置く。", "虐待防止のための対策を検討する委員会を、定期的に開く。"], "ans": [2, 4, 5], "exp": ["全従業者", "指針", "2024年度からすべてのサービスで義務", "研修と担当者", "委員会"], "point": "虐待防止＝委員会・指針・研修・担当者（全サービスで義務）"}, {"id": "b061", "date": "新作", "field": "介護保険制度", "topic": "認知症介護基礎研修について", "opts": ["介護に直接かかわる職員のうち、医療・福祉の資格をもたない人には、認知症介護基礎研修を受けさせる措置が求められている。", "介護福祉士も、この研修を必ず受けなければならない。", "2024年度から、無資格の職員への受講の措置が義務となった。", "この研修は、認知症についての基本的な知識や技術を学ぶものである。", "この研修は、事務職員だけが対象である。"], "ans": [1, 3, 4], "exp": ["無資格の介護職員", "介護福祉士などの資格者は対象外", "義務化", "基本的な知識と技術", "介護に直接かかわる職員"], "point": "無資格の介護職員に認知症介護基礎研修を受けさせる（義務）"}, {"id": "b062", "date": "新作", "field": "介護保険制度", "topic": "科学的介護情報システム（LIFE）について", "opts": ["LIFEは、利用者の状態やケアの内容などのデータを集めて分析するしくみである。", "LIFEへのデータ提出は、一部の加算の要件になっている。", "事業所は、LIFEに情報を送り、返ってくるフィードバックをケアの改善に活用する。", "LIFEは、介護報酬の請求をするためのシステムである。", "LIFEは、利用者が自分でデータを入力するしくみである。"], "ans": [1, 2, 3], "exp": ["科学的介護", "加算の要件", "PDCAに活用", "請求は国保連", "事業所が提出する"], "point": "LIFE＝データ提出→フィードバック→ケアの改善"}, {"id": "b063", "date": "新作", "field": "介護保険制度", "topic": "介護支援専門員の研修について", "opts": ["介護支援専門員証を更新するには、更新研修を受ける必要がある。", "実務に就いている介護支援専門員向けに、専門研修がある。", "研修は、すべて市町村が実施する。", "介護支援専門員になるには、介護支援専門員実務研修を修了する必要がある。", "介護支援専門員は、一度資格をとれば研修を受ける必要はない。"], "ans": [1, 2, 4], "exp": ["更新研修", "専門研修", "都道府県が行う", "実務研修", "更新研修が必要"], "point": "実務研修→専門研修→更新研修／主任研修・主任更新研修（都道府県）"}, {"id": "b064", "date": "新作", "field": "介護保険制度", "topic": "介護支援専門員の登録の消除について", "opts": ["不正な手段で登録を受けたときは、登録を消除される。", "登録の消除は、市町村長が行う。", "一度でも利用者からの苦情があれば、必ず登録が消除される。", "業務禁止の処分に違反したときは、登録を消除される。", "他人に名義を貸して業務をさせたときは、登録を消除されることがある。"], "ans": [1, 4, 5], "exp": ["不正登録", "都道府県知事", "苦情だけで消除にはならない", "業務禁止違反", "名義貸し"], "point": "登録の消除＝都道府県知事。不正登録・名義貸し・業務禁止違反など"}, {"id": "b065", "date": "新作", "field": "介護保険制度", "topic": "介護支援専門員への指示や業務禁止について", "opts": ["都道府県知事は、必要な場合、介護支援専門員に研修を受けるよう命じることができる。", "都道府県知事は、指示や命令に従わない介護支援専門員に、1年以内の業務禁止を命じることができる。", "業務禁止の処分は、市町村長が行う。", "介護支援専門員には、都道府県知事が指示をすることはできない。", "都道府県知事は、介護支援専門員に業務について報告を求めることができる。"], "ans": [1, 2, 5], "exp": ["研修の受講命令", "1年以内の業務禁止", "都道府県知事", "指示できる", "報告"], "point": "知事→報告・指示・研修命令・業務禁止（1年以内）・登録消除"}, {"id": "b066", "date": "新作", "field": "介護保険制度", "topic": "介護支援専門員証について", "opts": ["介護支援専門員証は、市町村長が交付する。", "介護支援専門員証を失くしたら、再交付は受けられない。", "介護支援専門員証の有効期間は5年である。", "介護支援専門員は、関係者から求められたときは、介護支援専門員証を提示しなければならない。", "登録を消除されたときは、介護支援専門員証を返納する。"], "ans": [3, 4, 5], "exp": ["都道府県知事", "再交付を受けられる", "5年", "提示義務", "返納"], "point": "証は5年・求められたら提示・消除されたら返納"}, {"id": "b067", "date": "新作", "field": "介護保険制度", "topic": "地域包括支援センター運営協議会について", "opts": ["地域包括支援センターの適切で公正・中立な運営を確保するために置かれる。", "運営協議会は、都道府県が設置する。", "センターの設置や、事業の委託先の選定などに関わる。", "運営協議会のメンバーは、センターの職員だけである。", "市町村が設置する。"], "ans": [1, 3, 5], "exp": ["公正・中立の確保", "市町村", "設置・運営に関わる", "利用者・被保険者・関係団体・学識経験者など", "市町村"], "point": "運営協議会＝市町村が設置・センターの公正中立を確保"}, {"id": "b068", "date": "新作", "field": "介護保険制度", "topic": "地域包括支援センターの総合相談支援業務について", "opts": ["総合相談支援業務は、任意事業である。", "高齢者や家族からのさまざまな相談を受け、必要な支援につなぐ。", "地域の高齢者の心身の状況や家庭環境などの実態を把握する。", "地域の関係者とのネットワークをつくる。", "総合相談は、介護保険に関する相談だけを受ける。"], "ans": [2, 3, 4], "exp": ["包括的支援事業", "ワンストップの相談", "実態把握", "ネットワーク構築", "介護保険以外の相談も受ける"], "point": "総合相談支援＝相談・実態把握・ネットワーク"}, {"id": "b069", "date": "新作", "field": "介護保険制度", "topic": "地域包括支援センターの権利擁護業務について", "opts": ["権利擁護業務は、地域包括支援センターでは行わない。", "権利擁護業務の対象は、要介護認定を受けた人だけである。", "消費者被害の防止に取り組む。", "高齢者虐待の防止や早期発見、対応を行う。", "成年後見制度の利用が必要な人への支援を行う。"], "ans": [3, 4, 5], "exp": ["包括的支援事業の一つ", "認定の有無に関係なく対象", "消費者被害", "虐待対応", "成年後見制度の活用支援"], "point": "権利擁護＝虐待・消費者被害・成年後見"}, {"id": "b070", "date": "新作", "field": "介護保険制度", "topic": "包括的・継続的ケアマネジメント支援業務について", "opts": ["地域ケア会議などを通じて、関係機関との連携の体制をつくる。", "この業務では、地域包括支援センターがすべてのケアプランを作り直す。", "支援困難事例について、介護支援専門員を支援する。", "地域の介護支援専門員への個別の相談や助言を行う。", "この業務は、主任介護支援専門員だけが行ってはならない。"], "ans": [1, 3, 4], "exp": ["連携体制づくり", "ケアマネを支援する業務", "支援困難事例", "個別指導・相談", "主任ケアマネが中心となって行う"], "point": "ケアマネ支援＝個別相談・困難事例への支援・地域ケア会議（主任ケアマネが中心）"}, {"id": "b071", "date": "新作", "field": "介護保険制度", "topic": "保険料を滞納したときの給付の一時差止めについて", "opts": ["一時差止めになっても、滞納分を払う必要はない。", "差し止めた保険給付の額から、滞納している保険料を差し引くことがある。", "保険料を1か月滞納しただけで、給付は一時差止めになる。", "一時差止めは、要介護認定を受けている第1号被保険者に行われる。", "保険料を1年6か月以上滞納すると、保険給付の全部または一部が一時差し止められることがある。"], "ans": [2, 4, 5], "exp": ["滞納分は払う必要がある", "滞納保険料に充てる", "1年6か月以上", "第1号被保険者", "1年6か月以上"], "point": "1年→償還払い・1年6か月→一時差止め（差止額から控除）・2年→時効で給付率引下げ"}, {"id": "b072", "date": "新作", "field": "介護保険制度", "topic": "療養上の指示に従わない場合の給付制限について", "opts": ["重大な過失で要介護状態を悪化させた場合も、給付の制限がありうる。", "正当な理由なく、介護給付などに関する指示に従わず、要介護状態を悪化させた場合は、給付の全部または一部を行わないことができる。", "給付の制限は、介護支援専門員が決める。", "闘争・泥酔・著しい不行跡で要介護状態になった場合も、給付の制限がありうる。", "どんな理由があっても、介護保険の給付が制限されることはない。"], "ans": [1, 2, 4], "exp": ["重大な過失", "指示に従わない", "市町村が決める", "闘争・泥酔・著しい不行跡", "制限されることがある"], "point": "給付制限＝故意の犯罪・重大な過失・指示に従わない・闘争や泥酔など"}, {"id": "b073", "date": "新作", "field": "介護保険制度", "topic": "被保険者の届出について", "opts": ["住所を変えたときや氏名が変わったときも、届け出る。", "世帯主が、世帯の第1号被保険者に代わって届け出ることができる。", "第2号被保険者は、65歳になる前にも必ず市町村に資格取得を届け出なければならない。", "第1号被保険者は、資格を取得したときなどに、14日以内に市町村に届け出る。", "第1号被保険者の届出は、1年以内にすればよい。"], "ans": [1, 2, 4], "exp": ["住所・氏名の変更も", "世帯主が代わって届出可", "第2号は医療保険の加入で資格を得るため、原則として届出はいらない", "14日以内", "14日以内"], "point": "第1号の届出は14日以内（世帯主も可）"}, {"id": "b074", "date": "新作", "field": "介護保険制度", "topic": "居宅サービス計画と個別サービス計画の関係について", "opts": ["個別サービス計画は、居宅サービス計画と関係なく作ってよい。", "訪問介護計画などの個別サービス計画は、居宅サービス計画に沿って作られる。", "居宅サービス計画を変えたときは、個別サービス計画も必要に応じて変更される。", "介護支援専門員は、居宅サービス計画に位置づけた事業者に、個別サービス計画の提出を求める。", "個別サービス計画は、介護支援専門員が作る。"], "ans": [2, 3, 4], "exp": ["ケアプランに沿う", "ケアプランに沿う", "連動して見直す", "提出を求める（2015年度〜）", "各サービス事業者が作る"], "point": "ケアプラン→個別サービス計画（事業者が作成・ケアマネは提出を求める）"}, {"id": "b075", "date": "新作", "field": "介護保険制度", "topic": "居宅介護支援の基本方針について", "opts": ["利用者の選択にもとづき、適切なサービスが多様な事業者から総合的・効率的に提供されるよう配慮する。", "サービスは、事業者の都合にあわせて選ぶ。", "要介護状態になっても、可能な限り居宅で、能力に応じ自立した日常生活を営めるよう配慮する。", "居宅介護支援は、できるだけ早く施設に入所できるよう支援することを目的とする。", "市町村や地域包括支援センター、他の事業者などと連携する。"], "ans": [1, 3, 5], "exp": ["利用者の選択・多様な事業者", "利用者の選択が基本", "居宅での自立", "居宅での生活を支える", "連携"], "point": "基本方針＝居宅で自立・利用者の選択・公正中立・連携"}, {"id": "b076", "date": "新作", "field": "介護保険制度", "topic": "本人と家族の意向がちがうときのケアマネジメントについて", "opts": ["本人の意向を中心にしながら、家族の負担や思いにも配慮する。", "話し合いの場をもち、両者が納得できる方法を一緒に考える。", "家族の意向がいつも本人より優先される。", "本人と家族それぞれの思いを、ていねいに聴く。", "意向がちがうときは、介護支援専門員が一方的に決める。"], "ans": [1, 2, 4], "exp": ["本人中心・家族にも配慮", "合意形成", "本人の意向が中心", "両方の思いを聴く", "一緒に考える"], "point": "本人中心・家族にも配慮・話し合って調整"}, {"id": "b077", "date": "新作", "field": "介護保険制度", "topic": "認知症の人のケアマネジメントについて", "opts": ["認知症の人の行動は、薬だけで解決するようにケアプランを作る。", "本人がこれまで大切にしてきた生活や習慣を把握する。", "家族の介護負担にも目を向け、家族への支援も考える。", "本人の意思や思いを、言葉や表情などからくみ取るよう努める。", "認知症の人は意思をもたないので、家族の意向だけでケアプランを作る。"], "ans": [2, 3, 4], "exp": ["環境やかかわりも見直す", "生活歴", "家族支援", "本人の思いをくみ取る", "本人の意思を尊重する"], "point": "本人の意思・生活歴・家族支援"}, {"id": "b078", "date": "新作", "field": "介護保険制度", "topic": "終末期（ターミナル期）のケアマネジメントについて", "opts": ["状態が急に変わりやすいので、主治医や訪問看護と密に連携する。", "終末期には、サービス担当者会議は開いてはいけない。", "本人や家族の意向を確かめ、必要に応じてくり返し話し合う。", "終末期には、モニタリングは不要である。", "状態の変化に合わせて、ケアプランを速やかに見直す。"], "ans": [1, 3, 5], "exp": ["医療との連携", "必要なら開く。状況によっては照会も", "意向の確認", "状態把握はより大切", "速やかな見直し"], "point": "終末期＝医療と密に連携・意向の確認・速やかな見直し"}, {"id": "b079", "date": "新作", "field": "介護保険制度", "topic": "医療ニーズの高い人のケアマネジメントについて", "opts": ["主治医や訪問看護師と連携して、医療面の情報を共有する。", "医療的なことは、介護支援専門員は一切知る必要がない。", "家族が医療的ケアを行う場合、その負担にも配慮する。", "医療ニーズのある人は、介護保険のサービスを利用できない。", "緊急時の連絡先や対応方法を、事前に決めておく。"], "ans": [1, 3, 5], "exp": ["医療との連携", "必要な情報を把握し連携する", "家族の負担", "利用できる", "緊急時の対応"], "point": "医療ニーズ＝主治医・訪問看護と連携・緊急時の対応を決めておく"}, {"id": "b080", "date": "新作", "field": "介護保険制度", "topic": "サービス担当者会議を開けない場合について", "opts": ["やむを得ない理由がある場合は、担当者への照会などで意見を求めることができる。", "照会で意見を聞いたときは、記録を残さなくてよい。", "利用者の状態に大きな変化がない軽微な変更の場合などは、会議を開かなくてよいことがある。", "照会した内容は、記録しておく。", "サービス担当者会議は、どんな場合も省略できない。"], "ans": [1, 3, 4], "exp": ["照会で代替", "記録する", "軽微な変更", "記録", "やむを得ない場合は照会でよい"], "point": "やむを得ないときは照会で意見を求め、記録する"}, {"id": "b081", "date": "新作", "field": "介護保険制度", "topic": "認定の結果が出る前のサービス利用（暫定ケアプラン）について", "opts": ["認定されれば、申請日以降に受けたサービスは保険給付の対象になる。", "結果が出る前は、要介護度の見込みにもとづいて暫定的なケアプランを作ることがある。", "結果が出る前に使ったサービスは、どんな場合も保険給付の対象にならない。", "要介護認定の申請をしたあと、結果が出る前でもサービスを利用できる。", "暫定ケアプランでは、区分支給限度基準額を気にしなくてよい。"], "ans": [1, 2, 4], "exp": ["効力は申請日から", "暫定ケアプラン", "申請日以降は対象になりうる", "申請後は利用できる", "見込みの要介護度とずれると自己負担が増えるので注意"], "point": "認定前も暫定ケアプランで利用できる（見込みがずれると自己負担に注意）"}, {"id": "b082", "date": "新作", "field": "介護保険制度", "topic": "認定の結果が非該当（自立）だった場合について", "opts": ["非該当の結果に不服があるときは、介護保険審査会に審査請求できる。", "非該当でも、介護給付と同じように9割が給付される。", "非該当でも、一般介護予防事業などは利用できる。", "非該当の人は、総合事業の事業対象者には絶対になれない。", "結果が出る前に使ったサービスの費用は、原則として全額自己負担になる。"], "ans": [1, 3, 5], "exp": ["審査請求できる", "給付されない", "地域支援事業は利用できる", "基本チェックリストで該当すれば事業対象者になれる", "保険給付されない"], "point": "非該当＝それまでの費用は自己負担・審査請求可・一般介護予防や事業対象者の道も"}, {"id": "b083", "date": "新作", "field": "介護保険制度", "topic": "介護予防支援の担当職員について", "opts": ["担当職員は、介護予防サービス計画を作る。", "居宅介護支援事業者が介護予防支援の指定を受けた場合は、介護支援専門員が担当する。", "地域包括支援センターの介護予防支援では、保健師や介護支援専門員、社会福祉士などが担当職員になる。", "介護予防支援の担当職員には、資格の要件がない。", "介護予防支援の担当職員は、要介護者のケアプランも必ず作る。"], "ans": [1, 2, 3], "exp": ["介護予防サービス計画の作成", "居宅介護支援事業者は介護支援専門員", "包括の担当職員", "一定の資格や経験が必要", "要介護者は居宅介護支援"], "point": "介護予防支援の担当職員＝保健師・介護支援専門員・社会福祉士など"}, {"id": "b084", "date": "新作", "field": "介護保険制度", "topic": "介護予防支援のモニタリングについて", "opts": ["少なくとも3か月に1回は、利用者の居宅を訪問して面接する（テレビ電話などの例外を除く）。", "訪問しない月は、電話などで利用者に連絡をとる。", "介護予防支援では、モニタリングは一切行わない。", "モニタリングの結果は、記録しなくてよい。", "サービスの評価期間が終わる月にも、居宅を訪問して面接する。"], "ans": [1, 2, 5], "exp": ["3か月に1回は訪問", "訪問しない月は連絡", "モニタリングを行う", "毎月記録する", "評価期間終了月"], "point": "介護予防支援のモニタリング＝3か月に1回訪問・それ以外は連絡・毎月記録"}, {"id": "b085", "date": "新作", "field": "介護保険制度", "topic": "地域包括支援センターの職員の配置について", "opts": ["原則として、第1号被保険者3,000〜6,000人ごとに、保健師・社会福祉士・主任介護支援専門員を1人ずつ置く。", "職員の数は、地域の高齢者の数に関係なく1人でよい。", "3職種は、それぞれの専門性を活かしてチームで業務を行う。", "地域包括支援センターの職員は、介護福祉士だけでよい。", "保健師がいない場合、地域ケアの経験のある看護師などで代えられることがある。"], "ans": [1, 3, 5], "exp": ["3,000〜6,000人ごとに3職種", "高齢者数に応じて置く", "チームアプローチ", "3職種が基本", "準ずる者で代えられる"], "point": "包括＝第1号3,000〜6,000人ごとに3職種"}, {"id": "b086", "date": "新作", "field": "介護保険制度", "topic": "償還払いの手続きについて", "opts": ["利用者は、領収書などを添えて市町村に支給を申請する。", "償還払いは、時効がないのでいつまでも申請できる。", "償還払いでは、利用者がいったん費用の全額を事業者に支払う。", "支給が認められると、保険給付分が利用者に払い戻される。", "償還払いでは、利用者は自己負担分だけを払えばよい。"], "ans": [1, 3, 4], "exp": ["市町村へ申請", "2年で時効", "いったん全額", "払い戻し", "それは現物給付（法定代理受領）"], "point": "償還払い＝全額払う→市町村に申請→払い戻し（時効2年）"}, {"id": "b087", "date": "新作", "field": "介護保険制度", "topic": "予防給付の種類について", "opts": ["施設介護サービス費は、予防給付に含まれる。", "介護予防サービス計画費は、予防給付に含まれる。", "介護予防住宅改修費は、予防給付に含まれる。", "介護予防サービス費は、予防給付に含まれる。", "予防給付には、高額介護予防サービス費はない。"], "ans": [2, 3, 4], "exp": ["施設は介護給付だけ", "ケアプラン作成の費用（10割）", "住宅改修", "予防給付", "高額介護予防サービス費がある"], "point": "予防給付にも計画費・住宅改修・福祉用具購入・高額などがある（施設はない）"}, {"id": "b088", "date": "新作", "field": "介護保険制度", "topic": "介護保険事業計画とほかの計画の関係について", "opts": ["市町村介護保険事業計画は、ほかの計画とは関係なく作る。", "市町村介護保険事業計画は、市町村老人福祉計画と一体のものとして作る。", "市町村介護保険事業計画は、市町村地域福祉計画などと調和が保たれたものとする。", "都道府県介護保険事業支援計画は、医療計画との整合性を確保する。", "都道府県介護保険事業支援計画は、医療計画と関係なく作る。"], "ans": [2, 3, 4], "exp": ["ほかの計画と調和させる", "一体", "調和", "医療計画との整合", "整合性を確保する"], "point": "老人福祉計画と一体・地域福祉計画と調和・医療計画と整合"}, {"id": "b089", "date": "新作", "field": "介護保険制度", "topic": "介護保険事業計画の作成について", "opts": ["計画は、住民の意見を聞かずに作らなければならない。", "市町村は、日常生活圏域ごとに、高齢者の状況などを把握するよう努める。", "市町村の計画は、厚生労働大臣の許可がなければ効力がない。", "市町村は、計画を作るとき、被保険者の意見を反映させるための措置をとる。", "市町村は、計画を作ったり変えたりしたときは、都道府県知事に提出する。"], "ans": [2, 4, 5], "exp": ["意見を反映させる", "実態把握", "許可制ではない", "被保険者の意見の反映", "都道府県知事に提出"], "point": "計画作成＝被保険者の意見を反映・都道府県知事に提出"}, {"id": "b090", "date": "新作", "field": "介護保険制度", "topic": "市町村による事業者への調査について", "opts": ["市町村は、保険給付に関して必要があるとき、居宅サービス事業者などに報告を求めたり立入検査をしたりできる。", "市町村は、都道府県が指定した事業者に問題があれば、都道府県知事に通知できる。", "市町村は、どの事業者にも立入検査はできない。", "市町村は、都道府県が指定した事業者の指定を取り消せる。", "市町村長は、指定した地域密着型サービス事業者に対して、勧告・命令・指定の取消しができる。"], "ans": [1, 2, 5], "exp": ["報告・立入検査", "都道府県知事への通知", "立入検査できる", "指定権者の都道府県知事が取り消す", "地域密着型は市町村長"], "point": "市町村＝調査・立入検査OK。取消しは指定した者（地域密着型は市町村長）"}, {"id": "b091", "date": "新作", "field": "介護保険制度", "topic": "指定の取消しの理由について", "opts": ["都道府県知事などへの報告に虚偽があった場合", "要介護者の人格を尊重するなどの義務に違反した場合", "事業所の名前を変えた場合", "利用者から感謝の手紙が届いた場合", "介護報酬を不正に請求した場合"], "ans": [1, 2, 5], "exp": ["虚偽の報告", "人格尊重義務違反", "届出が必要なだけ", "取消しの理由にならない", "不正請求"], "point": "取消し＝不正請求・虚偽報告・基準違反・人格尊重義務違反など"}, {"id": "b092", "date": "新作", "field": "介護保険制度", "topic": "指定の効力の停止について", "opts": ["効力の停止は、期間を決めずに永久に行われる。", "効力の停止は、事業者の同意がなければできない。", "指定権者は、期間を決めて指定の一部の効力を停止できる。", "効力停止の例として、新しい利用者の受け入れの停止がある。", "指定権者は、期間を決めて指定の全部の効力を停止できる。"], "ans": [3, 4, 5], "exp": ["期間を定める", "同意はいらない", "一部停止", "新規受入停止など", "全部停止"], "point": "効力停止＝期間を定めて全部または一部"}, {"id": "b093", "date": "新作", "field": "介護保険制度", "topic": "事業の休止・廃止の届出について", "opts": ["休止・廃止するときは、利用者が必要なサービスを続けて受けられるよう、ほかの事業者との連絡調整などの便宜を図る。", "指定居宅サービス事業者が事業を休止・廃止するときは、1か月前までに届け出る。", "事業を廃止するときは、届出はいらない。", "事業を休止したら、利用者への対応はしなくてよい。", "事業所の名前や所在地を変えたときは、10日以内に届け出る。"], "ans": [1, 2, 5], "exp": ["利用者のための便宜の提供", "1か月前まで", "届出が必要", "便宜を図る", "変更は10日以内"], "point": "休止・廃止は1か月前に届出・利用者の継続のための便宜を図る"}, {"id": "b094", "date": "新作", "field": "介護保険制度", "topic": "サービス付き高齢者向け住宅と住所地特例について", "opts": ["住所地特例の対象者も、住んでいる市町村の地域支援事業を利用できる。", "住所地特例の対象者は、住んでいる市町村が保険者になる。", "有料老人ホームにあたるサービス付き高齢者向け住宅は、住所地特例の対象になる。", "住所地特例の対象者は、もとの市町村の被保険者のままになる。", "すべての賃貸住宅が住所地特例の対象になる。"], "ans": [1, 3, 4], "exp": ["住所地の地域支援事業を利用", "もとの市町村が保険者", "有料老人ホームに該当するサ高住は対象", "もとの市町村が保険者", "一般の住宅は対象外"], "point": "有料老人ホームに該当するサ高住も住所地特例の対象"}, {"id": "b095", "date": "新作", "field": "介護保険制度", "topic": "負担割合証について", "opts": ["負担割合証には、利用者負担の割合（1割・2割・3割）が書かれている。", "負担割合証は、医療保険者が交付する。", "負担割合証の有効期間は、原則として8月1日から翌年7月31日までである。", "負担割合証は、一度もらえば一生使える。", "負担割合証は、要介護・要支援認定を受けた人などに交付される。"], "ans": [1, 3, 5], "exp": ["負担割合", "市町村が交付", "毎年8月に更新", "毎年交付される", "認定を受けた人など"], "point": "負担割合証＝市町村が交付・8月〜翌7月"}, {"id": "b096", "date": "新作", "field": "介護保険制度", "topic": "地域密着型サービスの公募による指定について", "opts": ["公募による指定は、都道府県知事が行う。", "公募による指定は、小規模多機能型居宅介護や看護小規模多機能型居宅介護も対象になりうる。", "市町村長は、定期巡回・随時対応型訪問介護看護などについて、公募で事業者を選んで指定することができる。", "公募で選ぶことで、地域に必要なサービスを計画的に整えることがねらいである。", "公募による指定は、すべての居宅サービスで義務づけられている。"], "ans": [2, 3, 4], "exp": ["市町村長", "小多機・看多機も対象", "公募指定", "計画的な整備", "対象は一部のサービス"], "point": "公募指定＝市町村長・定期巡回・小多機・看多機など"}, {"id": "b097", "date": "新作", "field": "介護保険制度", "topic": "都道府県知事の指定と市町村の関わりについて", "opts": ["市町村は、都道府県の指定に意見を言うことはできない。", "市町村長は、都道府県知事が居宅サービス事業者を指定する際に、市町村の計画との調整のため意見を申し出ることができる。", "都道府県知事は、市町村長の意見をふまえて、指定に条件を付けることができる。", "総量規制は、訪問介護にも適用される。", "介護保険施設などは、計画で定めた定員をこえる場合、指定をしないことができる（総量規制）。"], "ans": [2, 3, 5], "exp": ["意見を申し出られる", "意見の申出", "条件の付与", "総量規制は施設・特定施設・GHなどが対象", "総量規制"], "point": "総量規制＝施設・介護専用型特定施設・GHなど。市町村長は意見を申し出られる"}, {"id": "b098", "date": "新作", "field": "介護保険制度", "topic": "グループホームの外部評価について", "opts": ["評価の結果は、利用者や家族に提供し、公表する。", "認知症対応型共同生活介護では、サービスの質を自分で評価（自己評価）する。", "評価の結果は、外部に知らせてはならない。", "グループホームは、評価を受ける必要はない。", "外部の者による評価を受けるか、運営推進会議で評価を受ける。"], "ans": [1, 2, 5], "exp": ["公表", "自己評価", "公表する", "評価が必要", "外部評価か運営推進会議での評価"], "point": "GH＝自己評価＋外部評価（または運営推進会議での評価）→公表"}, {"id": "b099", "date": "新作", "field": "介護保険制度", "topic": "介護サービス相談員について", "opts": ["利用者の不満や疑問を事業所に伝え、サービスの質の向上につなげる橋渡しをする。", "市町村が派遣する事業である。", "介護サービス相談員は、利用者のケアプランを作る。", "介護サービス相談員は、事業者の指定を取り消す権限をもつ。", "介護サービス相談員は、事業所や施設を訪問して、利用者の話を聴く。"], "ans": [1, 2, 5], "exp": ["橋渡し", "市町村の事業", "ケアプランは作らない", "権限はない", "訪問して話を聴く"], "point": "介護サービス相談員＝市町村が派遣・利用者と事業所の橋渡し"}, {"id": "b100", "date": "新作", "field": "介護保険制度", "topic": "介護保険の財政運営の期間について", "opts": ["介護保険事業計画も、3年を1期として作られる。", "第1号被保険者の保険料は、3年ごとに見直される。", "市町村の介護保険の財政は、3年を1期として運営される。", "第1号保険料は、毎月見直される。", "介護保険の財政運営期間は、10年である。"], "ans": [1, 2, 3], "exp": ["3年1期", "3年ごと", "3年1期", "3年ごと", "3年"], "point": "財政運営・保険料・事業計画はすべて3年1期"}, {"id": "b101", "date": "新作", "field": "介護保険制度", "topic": "介護給付の適正化について", "opts": ["医療情報との突合・縦覧点検は、適正化の主な取組みの一つである。", "適正化事業は、介護サービスを減らすことだけが目的である。", "要介護認定の適正化は、適正化の主な取組みの一つである。", "ケアプランの点検は、適正化の主な取組みの一つである。", "適正化事業は、都道府県が単独で行うもので、市町村は関わらない。"], "ans": [1, 3, 4], "exp": ["医療情報との突合・縦覧点検", "必要なサービスを適切に提供するのが目的", "認定の適正化", "ケアプラン点検（住宅改修・福祉用具の点検を含む）", "市町村が中心（都道府県・国保連が支援）"], "point": "適正化の主要3事業＝認定の適正化・ケアプラン点検等・医療情報との突合と縦覧点検"}, {"id": "b102", "date": "新作", "field": "介護保険制度", "topic": "介護保険施設の介護支援専門員について", "opts": ["施設の介護支援専門員は、入所者の居宅サービス計画を作る。", "介護保険施設には、介護支援専門員を置かなくてもよい。", "介護支援専門員の数は、入所者100人に
