の対象である。", "自動排泄処理装置は、すべての部分が購入の対象である。", "便を自動で吸引できるものは、原則として要介護4・5の人が対象である。"], "ans": [2, 3, 5], "exp": ["軽度者は原則対象外", "交換部品は購入", "本体は貸与", "本体は貸与", "便も吸引するものは要介護4・5が原則"], "point": "自動排泄処理装置＝本体は貸与・交換部品は購入"}, {"id": "b108", "date": "新作", "field": "福祉サービス", "topic": "認知症老人徘徊感知機器について", "opts": ["要支援1・2と要介護1の人は、原則として対象外である。", "福祉用具貸与の対象である。", "徘徊感知機器は、購入の対象である。", "認知症の人が屋外に出ようとしたときなどに、センサーで家族などに知らせる機器である。", "徘徊感知機器は、外出を防ぐために部屋に鍵をかける装置である。"], "ans": [1, 2, 4], "exp": ["軽度者は原則対象外", "貸与", "貸与", "知らせる機器", "知らせるだけで閉じ込めるものではない"], "point": "徘徊感知機器＝貸与・知らせる機器・軽度者は原則対象外"}, {"id": "b109", "date": "新作", "field": "福祉サービス", "topic": "移動用リフトについて", "opts": ["移動用リフトのつり具の部分は、購入の対象である。", "移動用リフトの設置に工事が必要な場合は、住宅改修の対象になる。", "移動用リフトのつり具も、本体と一緒に貸与される。", "移動用リフトの本体は、福祉用具貸与の対象である。", "移動用リフトは、要支援1・2と要介護1の人は原則として対象外である。"], "ans": [1, 4, 5], "exp": ["つり具は購入", "住宅の改修を伴うものは対象外", "つり具は購入", "本体は貸与", "軽度者は原則対象外"], "point": "リフト本体＝貸与・つり具＝購入"}, {"id": "b110", "date": "新作", "field": "福祉サービス", "topic": "住宅改修費の支給の手続きについて", "opts": ["原則として、いったん費用を支払ってから、あとで保険給付分が支給される。", "工事の前に、住宅改修が必要な理由書などを添えて市町村に申請する（事前申請）。", "工事が終わってから初めて市町村に相談すればよい。", "工事が終わったら、領収書や工事後の写真などを提出する。", "住宅改修が必要な理由書は、施工業者だけが書ける。"], "ans": [1, 2, 4], "exp": ["償還払いが原則", "事前申請", "事前申請が必要", "事後の書類提出", "介護支援専門員などが作成する"], "point": "事前申請→工事→事後の書類提出→支給（償還払いが原則）"}, {"id": "b111", "date": "新作", "field": "福祉サービス", "topic": "配食サービスと緊急通報システムについて", "opts": ["配食サービスは、介護保険の居宅サービスである。", "緊急通報システムは、警察しか利用できない。", "緊急通報システムは、ボタンを押すと通報センターなどにつながるしくみである。", "配食サービスは、食事を届けると同時に安否確認の役割も果たすことがある。", "ひとり暮らしの高齢者の見守りに役立つ。"], "ans": [3, 4, 5], "exp": ["市町村の事業や民間サービスなど", "高齢者などが利用できる", "緊急時の通報", "安否確認", "見守り"], "point": "配食・緊急通報＝見守りに役立つ介護保険外の資源"}, {"id": "b112", "date": "新作", "field": "福祉サービス", "topic": "成年後見人の仕事について", "opts": ["成年後見人は、家庭裁判所に仕事の内容を報告する。", "成年後見人は、介護サービスの契約など、本人の生活や療養看護に関する手続き（身上保護）を行う。", "成年後見人は、本人に代わって手術に同意できる。", "成年後見人は、本人の財産を管理する。", "成年後見人は、本人の介護そのもの（食事やおむつ交換）を自分で行う義務がある。"], "ans": [1, 2, 4], "exp": ["家裁の監督", "身上保護（契約など）", "医療行為への同意権はない", "財産管理", "事実行為としての介護は職務ではない"], "point": "後見人＝財産管理と身上保護（契約）。介護そのものや医療同意はしない"}, {"id": "b113", "date": "新作", "field": "福祉サービス", "topic": "施設職員による虐待の通報について", "opts": ["施設の職員が、自分の施設での虐待を見つけたときは、市町村に通報する義務がある。", "通報したことを理由に、解雇などの不利益な扱いを受けない。", "通報は、施設長の許可を得てからでなければできない。", "虐待かどうか確信がないときは、通報してはならない。", "通報を受けた市町村は、事実を確認し、都道府県に報告する。"], "ans": [1, 2, 5], "exp": ["通報義務", "通報者の保護", "許可はいらない", "疑いの段階でも通報できる", "市町村→都道府県"], "point": "施設内の虐待は職員に通報義務・通報者は保護される"}, {"id": "b114", "date": "新作", "field": "福祉サービス", "topic": "身体拘束と高齢者虐待の関係について", "opts": ["ミトン型の手袋をつけて手を使えないようにすることは、身体拘束にあたる。", "外せないベルトで車いすに固定することは、身体拘束にあたる。", "家族が頼めば、身体拘束は虐待にはならない。", "向精神薬を使って動けなくすることは、身体拘束にはあたらない。", "緊急やむを得ない場合にあたらない身体拘束は、原則として高齢者虐待にあたる。"], "ans": [1, 2, 5], "exp": ["ミトン", "ベルト固定", "家族の希望だけでは理由にならない", "行動を落ち着かせるための過剰な向精神薬も身体拘束にあたる", "原則として虐待"], "point": "3要件を満たさない身体拘束は虐待。ミトン・ベルト・過剰な向精神薬なども"}, {"id": "b115", "date": "新作", "field": "福祉サービス", "topic": "補装具と福祉用具の関係について", "opts": ["車いすなど、介護保険の福祉用具と同じ品目は、原則として介護保険が優先される。", "体に合わせて作る必要がある車いすなどは、障害者総合支援法の補装具として支給されることがある。", "65歳以上の人は、補装具の支給を一切受けられない。", "補装具は、障害者総合支援法にもとづいて支給される。", "補装具は、すべて介護保険から支給される。"], "ans": [1, 2, 4], "exp": ["介護保険優先", "オーダーメイドは補装具", "受けられる場合がある", "補装具", "障害者総合支援法"], "point": "共通する品目は介護保険優先・オーダーメイドは補装具"}, {"id": "b116", "date": "新作", "field": "福祉サービス", "topic": "社会福祉士と介護福祉士について", "opts": ["どちらにも、信用を傷つける行為をしてはならない義務がある。", "社会福祉士は、資格がなければ相談業務を一切してはいけない業務独占の資格である。", "介護福祉士は、医師の指示なしで医行為を自由に行える。", "社会福祉士と介護福祉士は、資格がない人がその名前を名乗ってはいけない名称独占の資格である。", "どちらにも、秘密保持の義務がある。"], "ans": [1, 4, 5], "exp": ["信用失墜行為の禁止", "業務独占ではない", "喀痰吸引などは医師の指示のもと一定の範囲で", "名称独占", "秘密保持"], "point": "社会福祉士・介護福祉士＝名称独占・誠実義務・信用失墜禁止・秘密保持・連携・資質向上"}, {"id": "b117", "date": "新作", "field": "福祉サービス", "topic": "支援の終結について", "opts": ["終結にあたっては、利用者と一緒にそれまでの支援を振り返る。", "支援の目標が達成されたときなどに、支援を終結する。", "終結は、援助者が一方的に決めて利用者に知らせなくてよい。", "必要になればまた相談できることを伝えておく。", "支援が終わったら、利用者とは二度と関わってはならない。"], "ans": [1, 2, 4], "exp": ["振り返り", "目標達成など", "利用者と話し合って決める", "再開の窓口", "必要なら再び支援する"], "point": "終結＝振り返り・再相談できることを伝える"}, {"id": "b118", "date": "新作", "field": "福祉サービス", "topic": "家族との面接について", "opts": ["家族の中で一番声の大きい人の意見に従えばよい。", "家族の一人ひとりが、それぞれちがう思いをもっていることを理解する。", "家族の関係には、介護支援専門員は関心をもたなくてよい。", "家族の関係やこれまでの歴史が、介護に影響していることがある。", "特定の家族の意見だけでなく、できるだけ多くの家族の思いを聴く。"], "ans": [2, 4, 5], "exp": ["かたよらずに聴く", "一人ひとりの思い", "家族の関係は支援に影響する", "家族の歴史", "多くの家族の思い"], "point": "家族はひとつではない。一人ひとりの思いと関係性を理解する"}, {"id": "b119", "date": "新作", "field": "福祉サービス", "topic": "地域の見守りネットワークについて", "opts": ["新聞配達や郵便、宅配などの民間事業者と、見守りの協定を結ぶ市町村がある。", "見守りは、行政の職員だけが行うものである。", "異変に気づいたときの連絡先を決めておくことが大切である。", "住民による声かけや見守り活動も、ネットワークの一部である。", "見守りで気づいたことは、どこにも連絡してはいけない。"], "ans": [1, 3, 4], "exp": ["民間との協定", "多様な担い手", "連絡先", "住民の見守り", "地域包括支援センターなどに連絡する"], "point": "見守り＝住民・民間事業者・行政のネットワーク"}, {"id": "b120", "date": "新作", "field": "福祉サービス", "topic": "地域福祉計画について", "opts": ["地域福祉計画は、介護保険法にもとづいて作る。", "市町村地域福祉計画は、社会福祉法にもとづく計画である。", "地域福祉計画は、住民の意見を聞かずに作る。", "計画を作るときは、住民などの意見を反映させるよう努める。", "高齢者・障害者・子どもなど、各分野の福祉に共通する事項を定める。"], "ans": [2, 4, 5], "exp": ["社会福祉法", "社会福祉法", "住民の意見を反映させる", "住民参加", "分野共通の事項"], "point": "地域福祉計画＝社会福祉法・住民参加・分野共通の上位計画"}, {"id": "b121", "date": "新作", "field": "福祉サービス", "topic": "特定非営利活動法人（NPO法人）について", "opts": ["NPO法人は、介護保険の事業を一切行えない。", "NPO法人も、介護保険の指定事業者になることができる。", "設立には、所轄庁（都道府県知事など）の認証が必要である。", "NPO法人は、職員に給料を払ってはならない。", "NPO法人は、特定非営利活動促進法にもとづいて設立される。"], "ans": [2, 3, 5], "exp": ["事業者になれる", "指定を受けられる", "所轄庁の認証", "給与は払える（利益を分配しない）", "NPO法"], "point": "NPO法人＝認証で設立・介護保険事業者にもなれる"}, {"id": "b122", "date": "新作", "field": "福祉サービス", "topic": "生活福祉資金貸付制度について", "opts": ["低所得世帯・障害者世帯・高齢者世帯などに、資金を貸し付ける制度である。", "生活福祉資金は、所得の高い世帯だけが利用できる。", "相談の窓口は、市町村社会福祉協議会であることが多い。", "実施主体は、都道府県社会福祉協議会である。", "生活福祉資金は、返済しなくてよい給付金である。"], "ans": [1, 3, 4], "exp": ["貸付制度", "低所得世帯などが対象", "市町村社協が窓口", "都道府県社協", "貸付なので返済が必要"], "point": "生活福祉資金＝都道府県社協・貸付（返済が必要）"}, {"id": "b123", "date": "新作", "field": "福祉サービス", "topic": "介護休暇について", "opts": ["対象家族が1人なら年5日、2人以上なら年10日まで取れる。", "介護休暇は、正社員以外は一切取れない。", "介護休暇は、要介護状態の家族の世話などのために取れる休暇である。", "介護休暇は、1年に1日しか取れない。", "時間単位で取ることができる。"], "ans": [1, 3, 5], "exp": ["年5日・10日", "一定の条件を満たせば有期雇用の人なども取れる", "家族の世話", "年5日（2人以上は10日）", "時間単位"], "point": "介護休暇＝年5日（2人以上10日）・時間単位OK（介護休業は93日）"}, {"id": "b124", "date": "新作", "field": "福祉サービス", "topic": "住まいに困っている高齢者の支援について", "opts": ["高齢者は、賃貸住宅に入居を断られることがある。", "住まいの相談は、介護支援専門員の仕事とまったく関係がない。", "住宅確保要配慮者の入居を拒まない賃貸住宅（セーフティネット住宅）を登録するしくみがある。", "高齢者は、法律で賃貸住宅に入居できないことになっている。", "居住支援法人が、住まい探しや入居後の見守りを支援することがある。"], "ans": [1, 3, 5], "exp": ["入居を断られやすい", "住まいは生活の基盤", "セーフティネット住宅", "入居できる", "居住支援法人"], "point": "住宅確保要配慮者・セーフティネット住宅・居住支援法人"}, {"id": "b125", "date": "新作", "field": "福祉サービス", "topic": "高齢者の運転免許について", "opts": ["免許を返納したあとの移動手段を一緒に考えることが大切である。", "運転経歴証明書は、身分証明書としては使えない。", "高齢者は、70歳になると自動的に免許を失う。", "運転免許を自主返納した人は、運転経歴証明書の交付を受けられる。", "75歳以上の人は、免許の更新のときに認知機能検査を受ける。"], "ans": [1, 4, 5], "exp": ["移動手段の確保", "本人確認書類として使える", "年齢で自動的に失うことはない", "運転経歴証明書", "認知機能検査"], "point": "75歳以上は認知機能検査・返納後は運転経歴証明書・移動手段の確保"}, {"id": "b126", "date": "新作", "field": "福祉サービス", "topic": "障害者差別解消法の合理的配慮について", "opts": ["2024年4月から、民間の事業者にも合理的配慮の提供が義務づけられた。", "障害のある人から社会的なバリアを取り除いてほしいと求められたとき、負担が重すぎない範囲で対応することを合理的配慮という。", "合理的配慮は、行政機関だけの努力義務である。", "障害のある人の求めには、どんなに重い負担でも必ず応じなければならない。", "障害を理由として、正当な理由なくサービスを断ることは差別にあたる。"], "ans": [1, 2, 5], "exp": ["民間も義務化", "合理的配慮", "民間事業者も義務", "過重な負担にならない範囲で", "不当な差別的取扱いの禁止"], "point": "合理的配慮＝民間事業者も義務（2024年〜）・過重な負担でない範囲"}, {"id": "b127", "date": "新作", "field": "福祉サービス", "topic": "身元保証人がいない人の入所・入院について", "opts": ["入院や入所のときの手続きの支援について、地域包括支援センターなどと相談する。", "身元保証人がいない人は、介護保険施設に入所できない。", "身寄りのない人には、成年後見制度などの活用を考えることがある。", "身元保証人がいないことだけを理由に、介護保険施設への入所を拒むことは適切ではない。", "身元保証人は、必ず介護支援専門員がなる。"], "ans": [1, 3, 4], "exp": ["包括などと連携", "入所できる", "成年後見制度の活用", "正当な理由にあたらない", "介護支援専門員はならない"], "point": "身元保証人がいないことは入所拒否の正当な理由にならない"}, {"id": "b128", "date": "新作", "field": "福祉サービス", "topic": "外国人の介護人材について", "opts": ["外国人は、日本で介護の仕事をすることはできない。", "在留資格「介護」は、介護福祉士の資格をもつ外国人が介護の仕事をするための在留資格である。", "EPA（経済連携協定）にもとづいて、介護福祉士候補者を受け入れるしくみがある。", "特定技能の在留資格で、介護の仕事をする外国人もいる。", "外国人の介護職員には、日本語の学習の支援は必要ない。"], "ans": [2, 3, 4], "exp": ["いくつかのしくみがある", "在留資格「介護」", "EPA", "特定技能", "日本語やコミュニケーションの支援が大切"], "point": "在留資格「介護」・特定技能・EPA・育成就労（技能実習の後継）など"}, {"id": "b129", "date": "新作", "field": "福祉サービス", "topic": "訪問介護員（ホームヘルパー）になるための研修について", "opts": ["訪問介護員には、資格や研修はまったく必要ない。", "実務者研修は、介護福祉士の受験資格にかかわる研修である。", "生活援助従事者研修の修了者は、身体介護も行える。", "介護職員初任者研修を修了すると、訪問介護員として働ける。", "介護福祉士は、訪問介護員として働ける。"], "ans": [2, 4, 5], "exp": ["研修の修了などが必要", "実務者研修", "生活援助従事者研修は生活援助中心型のみ", "初任者研修", "介護福祉士"], "point": "初任者研修・実務者研修・介護福祉士。生活援助従事者研修は生活援助のみ"}, {"id": "b130", "date": "新作", "field": "保健医療", "topic": "高齢者の体の特徴について", "opts": ["高齢者は、病気の症状がいつも若い人より強く出る。", "個人差が大きいのが特徴である。", "高齢者はみな同じように老化するので、個人差はほとんどない。", "体の予備力が低下し、病気になると回復に時間がかかりやすい。", "体温や水分などを一定に保つ働き（恒常性の維持）が弱くなる。"], "ans": [2, 4, 5], "exp": ["症状が出にくい・はっきりしないことが多い", "個人差が大きい", "個人差が大きい", "予備力の低下", "恒常性の維持機能の低下"], "point": "予備力・恒常性の低下・個人差が大きい・症状が非典型"}, {"id": "b131", "date": "新作", "field": "保健医療", "topic": "加齢による感覚の変化について", "opts": ["明るいところから暗いところに入ったとき、目が慣れるのに時間がかかる。", "高齢になると、青と緑の区別がしやすくなる。", "塩味を感じにくくなり、味つけが濃くなりやすい。", "高齢になると、においに敏感になる。", "近くのものが見えにくくなる（老視）。"], "ans": [1, 3, 5], "exp": ["暗順応の低下", "青系の色が見分けにくくなる", "味覚の低下", "嗅覚は低下する（ガス漏れなどに気づきにくい）", "老視"], "point": "老視・明暗順応の低下・味覚と嗅覚の低下"}, {"id": "b132", "date": "新作", "field": "保健医療", "topic": "認知症の行動・心理症状（BPSD）への対応について", "opts": ["抗精神病薬は、副作用に注意し必要最小限に使う。", "住環境やかかわり方を見直すことで、BPSDが落ち着くことがある。", "便秘や痛み、発熱など体の不調が、BPSDのきっかけになることがある。", "BPSDの原因は、本人のわがままである。", "BPSDは、薬だけで必ず解決する。"], "ans": [1, 2, 3], "exp": ["薬は慎重に", "環境とかかわり", "体の不調の確認", "不安や混乱などから起こる", "薬だけに頼らない"], "point": "BPSD＝体の不調・環境・かかわりを見直す。薬は最小限"}, {"id": "b133", "date": "新作", "field": "保健医療", "topic": "前頭側頭型認知症について", "opts": ["前頭側頭型認知症は、65歳以上にしか起こらない。", "同じ行動をくり返す常同行動がみられることがある。", "前頭側頭型認知症では、幻視が最も特徴的な症状である。", "社会のルールを守れなくなる脱抑制がみられることがある。", "初期には、もの忘れが目立たないことが多い。"], "ans": [2, 4, 5], "exp": ["若い年齢でも起こる", "常同行動", "幻視はレビー小体型", "脱抑制・人格変化", "記憶は保たれやすい"], "point": "前頭側頭型＝人格変化・脱抑制・常同行動・記憶は初期に保たれる"}, {"id": "b134", "date": "新作", "field": "保健医療", "topic": "血管性認知症について", "opts": ["脳梗塞や脳出血などが原因で起こる。", "階段を下りるように、段階的に悪くなることがある。", "血管性認知症は、すべての能力が同じように低下する。", "血管性認知症は、生活習慣とは関係がない。", "再発を防ぐため、高血圧などの管理が大切である。"], "ans": [1, 2, 5], "exp": ["脳血管障害", "段階的な悪化", "まだら認知症（できることとできないことがある）", "高血圧・糖尿病・脂質異常症などが関係", "危険因子の管理"], "point": "血管性＝脳卒中が原因・段階的悪化・まだら・危険因子の管理"}, {"id": "b135", "date": "新作", "field": "保健医療", "topic": "正常圧水頭症について", "opts": ["歩行障害・尿失禁・認知機能の低下が主な症状である。", "正常圧水頭症の最初の症状は、幻視であることが多い。", "正常圧水頭症は、治療法がまったくない。", "治療で改善が期待できる認知症の原因の一つである。", "手術（シャント術）で症状がよくなることがある。"], "ans": [1, 4, 5], "exp": ["3つの症状", "歩行障害が目立つことが多い", "手術で改善しうる", "治る認知症", "シャント術"], "point": "正常圧水頭症＝歩行障害・尿失禁・認知低下→シャント術で改善"}, {"id": "b136", "date": "新作", "field": "保健医療", "topic": "若年性認知症について", "opts": ["65歳未満で発症する認知症を、若年性認知症という。", "40〜64歳で初老期における認知症と診断されれば、介護保険を利用できる。", "若年性認知症は、高齢の認知症と比べて本人や家族への影響が小さい。", "若年性認知症の人は、介護保険を一切利用できない。", "仕事や子育て、家計など、生活への影響が大きい。"], "ans": [1, 2, 5], "exp": ["65歳未満", "特定疾病", "影響が大きい", "特定疾病として利用できる", "就労・経済面への影響"], "point": "若年性認知症＝65歳未満・就労や経済への影響・40〜64歳は特定疾病"}, {"id": "b137", "date": "新作", "field": "保健医療", "topic": "一過性脳虚血発作（TIA）について", "opts": ["一時的に片側の手足のまひや言葉のもつれなどが出て、短い時間でおさまる。", "脳梗塞の前ぶれのことがある。", "一過性脳虚血発作は、脳出血の一種である。", "症状がすぐ消えたなら、受診の必要はない。", "症状がおさまっても、早めに医療機関を受診する。"], "ans": [1, 2, 5], "exp": ["一時的な症状", "脳梗塞の前ぶれ", "脳の血流が一時的に悪くなるもの", "受診が必要", "早めの受診"], "point": "TIA＝一時的なまひ・言語障害→脳梗塞の前ぶれ→すぐ受診"}, {"id": "b138", "date": "新作", "field": "保健医療", "topic": "進行性核上性麻痺について", "opts": ["目を上下に動かしにくくなる。", "進行性核上性麻痺では、転倒の心配はない。", "転びやすさが初期から目立つ。", "進行性核上性麻痺は、自然に完全に治る。", "介護保険の特定疾病（パーキンソン病関連疾患）に含まれる。"], "ans": [1, 3, 5], "exp": ["眼球運動の障害", "転倒しやすい", "後ろに転倒しやすい", "進行性の難病", "特定疾病"], "point": "進行性核上性麻痺＝転倒・眼球運動障害・特定疾病"}, {"id": "b139", "date": "新作", "field": "保健医療", "topic": "後縦靱帯骨化症について", "opts": ["転倒しても、症状が悪くなることはない。", "背骨の中の靱帯が骨のように硬くなり、神経を圧迫する病気である。", "手足のしびれや動かしにくさが出る。", "介護保険の特定疾病に含まれる。", "後縦靱帯骨化症は、皮膚の病気である。"], "ans": [2, 3, 4], "exp": ["転倒で急に悪化することがある", "靱帯の骨化", "しびれ・運動障害", "特定疾病", "背骨の病気"], "point": "後縦靱帯骨化症＝しびれ・まひ・特定疾病・転倒に注意"}, {"id": "b140", "date": "新作", "field": "保健医療", "topic": "関節拘縮の予防について", "opts": ["痛みが出ない範囲で、ゆっくり動かす。", "関節拘縮を防ぐには、できるだけ関節を動かさないのがよい。", "寝ているときの姿勢を、拘縮しにくい良い姿勢（良肢位）に整える。", "関節を動かすときは、痛みが強くても勢いよく動かす。", "関節を動かす範囲を保つための関節可動域（ROM）訓練が予防になる。"], "ans": [1, 3, 5], "exp": ["無理をしない", "動かさないと拘縮が進む", "良肢位", "痛みのない範囲でゆっくり", "ROM訓練"], "point": "拘縮予防＝ROM訓練・良肢位・痛みのない範囲でゆっくり"}, {"id": "b141", "date": "新作", "field": "保健医療", "topic": "褥瘡を防ぐ姿勢と寝具について", "opts": ["体圧分散寝具（エアマットなど）は、褥瘡の予防に役立つ。", "ベッドの頭側を上げると、おしりにずれの力がかかりやすい。", "横向きに寝るときは、体を30度くらい傾けると骨の出っぱった部分への圧迫が減る。", "ベッドの頭側は、できるだけ高く上げたままにする。", "体位変換のときは、体を引きずって動かすのがよい。"], "ans": [1, 2, 3], "exp": ["体圧分散", "ずれに注意（上げたら背抜きをする）", "30度側臥位", "ずれ・圧迫が増える", "引きずると摩擦とずれで皮膚を傷める"], "point": "30度側臥位・背抜き・体圧分散寝具・引きずらない"}, {"id": "b142", "date": "新作", "field": "保健医療", "topic": "気管支喘息について", "opts": ["喘息の吸入薬は、症状がないときは一切使わない。", "発作のときは、ゼーゼー・ヒューヒューという呼吸音がする。", "喘息の人は、かぜをひいても発作には影響しない。", "吸入薬は、正しい方法で使うことが大切である。", "夜間や明け方に発作が起きやすい。"], "ans": [2, 4, 5], "exp": ["発作を予防する吸入薬は毎日使う", "喘鳴", "感染で悪化しやすい", "吸入の手技が大切", "夜間・明け方"], "point": "喘息＝喘鳴・吸入薬を正しく・感染で悪化"}, {"id": "b143", "date": "新作", "field": "保健医療", "topic": "胃食道逆流症について", "opts": ["食後すぐに横にならないことが予防になる。", "胃食道逆流症は、高齢者には起こらない。", "逆流したものを誤嚥して、肺炎を起こすことがある。", "胃の内容物が食道に逆流し、胸やけなどが起こる。", "食後はすぐに横になるのがよい。"], "ans": [1, 3, 4], "exp": ["食後は上半身を起こしておく", "高齢者にも多い（背中が曲がると起こりやすい）", "誤嚥性肺炎の原因", "胸やけ", "すぐ横にならない"], "point": "逆流＝食後すぐ横にならない・誤嚥性肺炎に注意"}, {"id": "b144", "date": "新作", "field": "保健医療", "topic": "肝硬変について", "opts": ["肝硬変では、出血しにくくなる。", "意識障害が起こる肝性脳症がみられることがある。", "皮膚や白目が黄色くなる（黄疸）ことがある。", "おなかに水がたまる（腹水）ことがある。", "肝硬変は、アルコールとはまったく関係がない。"], "ans": [2, 3, 4], "exp": ["出血しやすくなる（食道静脈瘤の破裂など）", "肝性脳症", "黄疸", "腹水", "アルコールやウイルス性肝炎が原因になる"], "point": "肝硬変＝腹水・黄疸・肝性脳症・出血しやすい"}, {"id": "b145", "date": "新作", "field": "保健医療", "topic": "甲状腺機能低下症について", "opts": ["もの忘れなどが出て、認知症とまちがえられることがある。", "甲状腺機能低下症は、治療しても良くならない。", "甲状腺機能低下症では、暑がりで汗が多くなる。", "薬で治療することができる。", "元気がない、寒がり、むくみなどの症状がみられる。"], "ans": [1, 4, 5], "exp": ["認知症と似る", "治療で改善する", "暑がり・汗は機能亢進症", "ホルモン薬で治療", "代表的な症状"], "point": "甲状腺機能低下症＝寒がり・むくみ・認知症に似る→治療で改善"}, {"id": "b146", "date": "新作", "field": "保健医療", "topic": "オーラルフレイルについて", "opts": ["オーラルフレイルは、回復することはない。", "口の機能が衰えると、低栄養やフレイルにつながる。", "滑舌が悪くなる、食べこぼしが増える、むせるなどがサインになる。", "オーラルフレイルとは、かむ・飲み込む・話すなどの口の機能が少しずつ衰えた状態をいう。", "オーラルフレイルは、歯の本数とはまったく関係がない。"], "ans": [2, 3, 4], "exp": ["早く気づけば改善が期待できる", "全身のフレイルにつながる", "ささいなサイン", "口の機能の衰え", "歯の喪失も関係する"], "point": "オーラルフレイル＝口の衰え→低栄養・フレイルへ。早めの対応で改善"}, {"id": "b147", "date": "新作", "field": "保健医療", "topic": "食が細くなった高齢者の食事の工夫について", "opts": ["高齢者はたんぱく質をとる必要はない。", "少ない量でもエネルギーやたんぱく質がとれる食品を工夫する。", "食欲がないときは、食事を抜いて様子をみる。", "本人の好きなものや食べやすい形を取り入れる。", "1日3回の食事でとりきれないときは、間食でおぎなう。"], "ans": [2, 4, 5], "exp": ["高齢者もたんぱく質は大切", "少量で高栄養", "抜くと低栄養が進む", "嗜好と食べやすさ", "間食の活用"], "point": "少量高栄養・間食・好きなもの・食べやすい形"}, {"id": "b148", "date": "新作", "field": "保健医療", "topic": "嚥下障害のある人の食事の形態について", "opts": ["汁物には、とろみをつけるとむせにくくなる。", "嚥下障害のある人には、きざみ食がいちばん安全である。", "きざみ食は口の中でばらばらになりやすく、そのままでは誤嚥しやすいことがある。", "ゼリー状やペースト状など、まとまりやすく飲み込みやすい形態がある。", "ぱさぱさした食品は、飲み込みやすい。"], "ans": [1, 3, 4], "exp": ["とろみ", "まとまりにくく注意が必要", "きざみ食はあんかけなどでまとめる", "まとまりやすい形態", "ぱさぱさ・ぼろぼろしたものは飲み込みにくい"], "point": "嚥下食＝まとまりやすく・とろみ。きざみ食は要注意"}, {"id": "b149", "date": "新作", "field": "保健医療", "topic": "夜間頻尿について", "opts": ["夜中に何度もトイレに起きることを夜間頻尿という。", "夜間頻尿の原因は、どの人も同じである。", "夜間頻尿のある人は、昼間も含めて水分をできるだけとらないようにする。", "前立腺肥大症や過活動膀胱、心不全などが原因になることがある。", "夜のトイレへの移動は、転倒の原因になりやすい。"], "ans": [1, 4, 5], "exp": ["夜間に排尿で起きる", "原因はさまざま", "極端な水分制限は脱水を招く。医師に相談", "さまざまな原因", "転倒に注意"], "point": "夜間頻尿＝原因はさまざま・転倒に注意・極端な水分制限はしない"}, {"id": "b150", "date": "新作", "field": "保健医療", "topic": "膀胱留置カテーテルについて", "opts": ["チューブが折れたり、つぶれたりしていないか確認する。", "尿の色やにごり、量を観察する。", "蓄尿バッグは、ベッドの上の高いところに置く。", "カテーテルを入れていれば、感染の心配はない。", "蓄尿バッグは、膀胱より低い位置に置く。"], "ans": [1, 2, 5], "exp": ["閉塞を防ぐ", "観察", "逆流して感染の原因になる", "感染しやすいので注意", "逆流を防ぐ"], "point": "バッグは膀胱より低く・チューブの折れ・尿の観察・感染に注意"}, {"id": "b151", "date": "新作", "field": "保健医療", "topic": "腹膜透析について", "opts": ["腹膜透析は、おなかの中に透析液を入れて、自宅などで行える透析である。", "腹膜透析をしている人は、入浴は一切できない。", "カテーテルの出口の部分を清潔に保つことが大切である。", "腹膜透析は、必ず病院で週3回行わなければならない。", "腹膜炎などの感染症に注意が必要である。"], "ans": [1, 3, 5], "exp": ["自宅で行える", "出口部を保護すれば入浴できることが多い", "出口部のケア", "病院で週3回は血液透析", "腹膜炎"], "point": "腹膜透析＝在宅で・出口部を清潔に・腹膜炎に注意"}, {"id": "b152", "date": "新作", "field": "保健医療", "topic": "高齢者の脈拍と血圧の測り方について", "opts": ["脈拍は、手首の親指側（橈骨動脈）で測ることが多い。", "脈拍は、15秒だけ数えれば、不規則でもそのまま4倍してよい。", "脈が不規則なときは、1分間しっかり数える。", "血圧は、なるべく同じ時間帯・同じ姿勢で測る。", "血圧は、入浴直後や食事直後に測るのがいちばん正確である。"], "ans": [1, 3, 4], "exp": ["橈骨動脈", "不規則なら1分間数える", "不整脈は1分間", "条件をそろえる", "安静にしてから測る"], "point": "脈は橈骨動脈・不規則なら1分・血圧は同じ条件で安静時に"}, {"id": "b153", "date": "新作", "field": "保健医療", "topic": "高齢者の歯と入れ歯について", "opts": ["合わない入れ歯は、痛みや食事量の低下の原因になる。", "歯を失うと、かむ力が落ちて食べられるものが減る。", "定期的に歯科で診てもらうことが大切である。", "入れ歯をしていれば、歯科の受診はいらない。", "歯の数は、全身の健康とは関係がない。"], "ans": [1, 2, 3], "exp": ["入れ歯の調整", "咀嚼力の低下", "定期受診", "入れ歯の調整や口の中の確認が必要", "全身の健康と関係する"], "point": "歯と入れ歯の状態は栄養と全身の健康に直結→定期的に歯科へ"}, {"id": "b154", "date": "新作", "field": "保健医療", "topic": "尿検査について", "opts": ["尿検査では、肝臓の病気については何もわからない。", "尿検査の結果は、水分のとり方には影響されない。", "尿の中の白血球や細菌は、尿路感染症の手がかりになる。", "尿たんぱくは、腎臓の病気の手がかりになる。", "尿糖は、糖尿病の手がかりになる。"], "ans": [3, 4, 5], "exp": ["ビリルビンなど肝臓に関係する項目もある", "濃さは水分量で変わる", "尿路感染", "腎臓", "血糖"], "point": "尿たんぱく＝腎臓・尿糖＝糖尿病・白血球や細菌＝尿路感染"}, {"id": "b155", "date": "新作", "field": "保健医療", "topic": "心電図について", "opts": ["心電図は、不整脈を見つけるのに役立つ。", "心電図は、一度正常なら今後も異常は出ない。", "心電図は、心筋梗塞の診断に役立つ。", "心電図は、骨折を見つけるための検査である。", "24時間記録する心電図（ホルター心電図）もある。"], "ans": [1, 3, 5], "exp": ["不整脈", "発作時だけ異常が出ることもある", "心筋梗塞", "骨折はレントゲン", "ホルター心電図"], "point": "心電図＝不整脈・心筋梗塞。発作時だけ異常が出ることもある"}, {"id": "b156", "date": "新作", "field": "保健医療", "topic": "体重の測定について", "opts": ["体重は、健康状態とは関係がない。", "体重は、なるべく同じ条件（時間帯・服装）で測る。", "高齢者の体重は、測る必要はない。", "短い期間での体重の増加は、心不全などでむくんでいるサインのことがある。", "体重の減少は、低栄養のサインになる。"], "ans": [2, 4, 5], "exp": ["健康状態の大切な指標", "条件をそろえる", "定期的に測る", "むくみ・心不全", "低栄養"], "point": "体重＝減れば低栄養・急に増えればむくみ。同じ条件で測る"}, {"id": "b157", "date": "新作", "field": "保健医療", "topic": "意識レベルの評価（JCS）について", "opts": ["JCSでは、数字が小さいほど意識障害が重い。", "刺激しても目を開けない状態は、刺激で目を開ける状態より重い。", "意識障害は、介護職が観察する必要はない。", "JCSでは、数字が大きいほど意識障害が重い。", "JCS（ジャパン・コーマ・スケール）は、意識障害の程度を表す方法である。"], "ans": [2, 4, 5], "exp": ["大きいほど重い", "3桁が最も重い", "異変に早く気づくことが大切", "数字が大きいほど重い", "3-3-9度方式"], "point": "JCS＝1桁・2桁・3桁の順に重い"}, {"id": "b158", "date": "新作", "field": "保健医療", "topic": "ショック状態について", "opts": ["ショックの人は、すぐに座らせて歩かせるとよい。", "脈が速く弱くなることがある。", "意識がぼんやりすることがある。", "ショックの疑いがあっても、しばらく様子を見る。", "顔色が青白く、冷や汗をかいていることがある。"], "ans": [2, 3, 5], "exp": ["横に寝かせて安静に", "頻脈・脈が弱い", "意識の低下", "すぐに119番", "蒼白・冷汗"], "point": "蒼白・冷汗・速く弱い脈・意識低下→すぐ救急"}, {"id": "b159", "date": "新作", "field": "保健医療", "topic": "吐血と下血・便の色について", "opts": ["鮮やかな赤い血が便につくのは、肛門に近いところからの出血のことが多い。", "吐血や下血があれば、すぐに医療職に連絡する。", "黒い便は、どんな場合も心配いらない。", "吐血したら、すぐに水をたくさん飲ませる。", "黒くてタールのような便は、胃や十二指腸などからの出血のことがある。"], "ans": [1, 2, 5], "exp": ["下部の出血", "すぐに連絡", "鉄剤などでも黒くなるが、出血のこともあるので伝える", "飲ませない。顔を横に向けて誤嚥を防ぐ", "上部消化管出血"], "point": "タール便＝上部の出血・鮮血＝肛門に近い出血→すぐ連絡"}, {"id": "b160", "date": "新作", "field": "保健医療", "topic": "薬をまちがえて飲ませたとき（誤薬）の対応について", "opts": ["何の薬をどのくらい飲んだかを確認する。", "誤薬に気づいても、様子が変わらなければ誰にも報告しない。", "本人の様子を観察し、事故として記録・報告する。", "誤薬に気づいたら、すぐに吐かせる。", "すぐに医師や看護師、薬剤師に連絡して指示を受ける。"], "ans": [1, 3, 5], "exp": ["内容の確認", "必ず報告", "観察と記録", "自己判断で吐かせない", "すぐ連絡"], "point": "誤薬＝すぐ連絡・内容の確認・観察・記録と報告"}, {"id": "b161", "date": "新作", "field": "保健医療", "topic": "頭を打ったあとの観察について", "opts": ["頭を打っても、その場で元気なら観察はいらない。", "頭を打った翌日に異常がなければ、その後は心配いらない。", "抗凝固薬を飲んでいる人は、頭の中で出血しやすいので特に注意する。", "頭を打ってから数週間〜数か月たってから、症状が出ることがある。", "頭を打ったあとは、意識や手足の動き、吐き気などを観察する。"], "ans": [3, 4, 5], "exp": ["しばらく観察が必要", "後から症状が出ることがある", "出血しやすい", "慢性硬膜下血腫", "観察のポイント"], "point": "頭部打撲＝しばらく観察。数週〜数か月後の症状（慢性硬膜下血腫）にも注意"}, {"id": "b162", "date": "新作", "field": "保健医療", "topic": "慢性硬膜下血腫について", "opts": ["手術で血を取り除くと、症状がよくなることが多い。", "もの忘れや歩きにくさなど、認知症に似た症状が出ることがある。", "慢性硬膜下血腫は、治療してもよくならない。", "慢性硬膜下血腫は、頭を打った直後に必ず症状が出る。", "頭を打ってから数週間〜数か月かけて、脳の表面に血がたまる。"], "ans": [1, 2, 5], "exp": ["治る認知症の一つ", "認知症に似る", "手術で改善しやすい", "後から出る", "ゆっくりたまる"], "point": "慢性硬膜下血腫＝打撲の数週〜数か月後・認知症に似る・手術で改善"}, {"id": "b163", "date": "新作", "field": "保健医療", "topic": "大腿骨頸部骨折について", "opts": ["骨粗鬆症があると起こりやすい。", "手術のあとは、長い期間ずっと寝ていたほうがよい。", "大腿骨頸部骨折は、若い男性に多い。", "高齢者が転んで足の付け根を打ったときに起こりやすい骨折である。", "手術のあとは、できるだけ早く体を動かし始めることが大切である。"], "ans": [1, 4, 5], "exp": ["骨粗鬆症", "寝たきりや認知機能低下を防ぐため早期離床", "高齢の女性に多い", "転倒による", "早期離床・早期リハ"], "point": "大腿骨頸部骨折＝転倒・骨粗鬆症→手術→早期離床"}, {"id": "b164", "date": "新作", "field": "保健医療", "topic": "人工股関節の手術後の生活について", "opts": ["手術後は、正座や横座りをどんどんしたほうがよい。", "股関節を深く曲げすぎる姿勢は、脱臼の原因になることがある。", "人工股関節の人は、脱臼の心配はまったくない。", "低いいすやしゃがみこむ動作は、避けたほうがよい。", "足を組んだり内側にねじったりする姿勢に注意する。"], "ans": [2, 4, 5], "exp": ["脱臼しやすい姿勢", "深く曲げない", "脱臼に注意する", "高めのいすを使う", "脱臼しやすい姿勢"], "point": "人工股関節＝深く曲げない・低いいすを避ける・足を組まない"}, {"id": "b165", "date": "新作", "field": "保健医療", "topic": "杖などの歩行補助具について", "opts": ["T字杖の高さは、立ったときの手首（または大転子）の高さが目安である。", "歩行器は、杖よりも体を支える力が大きい。", "杖は、痛みのある側の手で持つのが基本である。", "杖は、原則として麻痺や痛みのない側の手で持つ。", "杖は、長ければ長いほど安全である。"], "ans": [1, 2, 4], "exp": ["高さの目安", "支持性が高い", "健側で持つ", "健側で持つ", "高さが合わないと危ない"], "point": "杖＝健側で持つ・高さは手首（大転子）の位置"}, {"id": "b166", "date": "新作", "field": "保健医療", "topic": "失語症のある人とのコミュニケーションについて", "opts": ["言葉が出るまで、何度も急かして言わせる。", "失語症の人は、こちらの話もまったく理解できない。", "短い文で、ゆっくり話しかける。", "「はい」「いいえ」で答えられる質問を使う。", "絵や文字、身ぶりなどを使って伝える。"], "ans": [3, 4, 5], "exp": ["急かさない", "理解できることも多い（タイプによる）", "短くゆっくり", "答えやすい質問", "視覚的な手がかり"], "point": "失語症＝短くゆっくり・はい/いいえ・絵や身ぶり・急かさない"}, {"id": "b167", "date": "新作", "field": "保健医療", "topic": "目の見えにくい人への支援について", "opts": ["食事の配置は、時計の文字盤にたとえて伝える（クロックポジション）。", "物の置き場所を勝手に変えない。", "目の見えにくい人には、後ろから急に手を引いて歩く。", "話しかけるときは、最初に名前を呼ぶなどして声をかける。", "説明するときは「あれ」「そこ」などの言葉を使う。"], "ans": [1, 2, 4], "exp": ["クロックポジション", "配置を変えない", "前に立って腕や肩につかまってもらう", "声をかける", "具体的に伝える"], "point": "声かけ・クロックポジション・物を動かさない・具体的に伝える"}, {"id": "b168", "date": "新作", "field": "保健医療", "topic": "構音障害について", "opts": ["筆談や文字盤を使うと、伝えやすくなることがある。", "構音障害では、言葉の理解は保たれていることが多い。", "構音障害は、口や舌などの動きが悪く、発音がうまくできない状態である。", "構音障害は、言葉の意味がわからなくなる障害である。", "構音障害の人には、子どもに話すように話しかけるとよい。"], "ans": [1, 2, 3], "exp": ["代わりの手段", "理解は保たれる", "発音の障害", "意味がわからなくなるのは失語症", "大人として尊重して接する"], "point": "構音障害＝発音の障害（理解は保たれる）／失語症＝言葉そのものの障害"}, {"id": "b169", "date": "新作", "field": "保健医療", "topic": "リハビリテーション専門職の役割について", "opts": ["言語聴覚士は、歩行訓練だけを専門に行う。", "理学療法士（PT）は、起き上がりや歩行などの基本的な動作の訓練を主に行う。", "作業療法士（OT）は、食事や家事などの応用的な動作や作業の訓練を主に行う。", "言語聴覚士（ST）は、言葉や飲み込みの訓練を主に行う。", "作業療法士は、薬の処方を行う。"], "ans": [2, 3, 4], "exp": ["言葉と嚥下", "PT＝基本動作", "OT＝応用動作・作業", "ST＝言語・嚥下", "処方は医師"], "point": "PT＝基本動作・OT＝応用動作・ST＝言語と嚥下"}, {"id": "b170", "date": "新作", "field": "保健医療", "topic": "高齢者の痛みについて", "opts": ["痛みの強さを0〜10の数字で表してもらう方法（NRS）がある。", "慢性的な痛みは、生活の質には影響しない。", "認知症の人は、表情や行動の変化で痛みを表すことがある。", "痛みは本人にしかわからないので、本人の訴えを大切にする。", "高齢者は痛みを感じにくいので、痛みの訴えは無視してよい。"], "ans": [1, 3, 4], "exp": ["NRSなどの評価", "活動量や気分に影響する", "非言語のサイン", "本人の訴え", "訴えを受け止める"], "point": "痛みは本人の訴えが基本・NRS・認知症の人は表情や行動で"}, {"id": "b171", "date": "新作", "field": "保健医療", "topic": "高齢者のめまいについて", "opts": ["めまいのときは、すぐに立ち上がって歩くとよい。", "めまいの原因には、耳の病気、脳の病気、起立性低血圧、薬の副作用などがある。", "めまいは、どんな場合も耳の病気である。", "急なめまいに、ろれつが回らない・手足のまひなどを伴うときは、脳の病気を疑い救急要請する。", "めまいがあるときは、転倒に注意する。"], "ans": [2, 4, 5], "exp": ["安静にして転倒を防ぐ", "原因はさまざま", "原因はさまざま", "脳卒中の可能性", "転倒予防"], "point": "めまい＝原因はさまざま。まひ・ろれつ障害を伴えば救急"}, {"id": "b172", "date": "新作", "field": "保健医療", "topic": "たんを出しやすくする工夫について", "opts": ["たんが多いときは、水分を控えたほうがよい。", "部屋の加湿も、たんを出しやすくするのに役立つ。", "水分を十分にとると、たんがやわらかくなり出しやすくなる。", "たんがたまっている場所が上になる姿勢をとる方法（体位ドレナージ）がある。", "たんは、飲み込ませるのがいちばんよい。"], "ans": [2, 3, 4], "exp": ["水分は大切（心不全などの制限がある場合は医師に確認）", "加湿", "水分", "体位ドレナージ", "出せるよう支援する"], "point": "水分・加湿・体位ドレナージ"}, {"id": "b173", "date": "新作", "field": "保健医療", "topic": "尿路感染症について", "opts": ["高齢の女性は、尿路感染症を起こしやすい。", "膀胱留置カテーテルを使っている人は、尿路感染症を起こしやすい。", "尿路感染症では、熱が出ることはない。", "水分を十分にとることは、予防に役立つ。", "陰部は、後ろから前へふくのがよい。"], "ans": [1, 2, 4], "exp": ["尿道が短いため", "カテーテル", "腎盂腎炎では高熱が出る", "水分補給", "前から後ろへふく"], "point": "尿路感染症＝女性・留置カテーテル→水分・陰部は前から後ろへ"}, {"id": "b174", "date": "新作", "field": "保健医療", "topic": "レジオネラ症について", "opts": ["浴槽や加湿器の定期的な清掃・消毒が予防になる。", "菌を含んだ細かい水しぶきを吸い込むことで感染する。", "レジオネラ菌は、循環式の浴槽や加湿器の水の中で増えることがある。", "レジオネラ症は、人から人へ空気感染する。", "レジオネラ菌は、お湯の中では増えない。"], "ans": [1, 2, 3], "exp": ["清掃・消毒", "エアロゾルの吸入", "循環式浴槽・加湿器", "人から人へはうつらない", "温かい水の中で増えやすい"], "point": "レジオネラ＝循環式浴槽・加湿器→清掃・消毒。人から人へはうつらない"}, {"id": "b175", "date": "新作", "field": "保健医療", "topic": "手指衛生のタイミングについて", "opts": ["血液や体液にふれた可能性があるときは、手指衛生を行う。", "利用者に触れる前に、手指衛生を行う。", "手袋をしていたときは、外したあとの手指衛生はいらない。", "利用者に触れたあとに、手指衛生を行う。", "手が見た目にきれいなら、ケアの間の手指衛生はいらない。"], "ans": [1, 2, 4], "exp": ["体液に触れたあと", "触れる前", "手袋を外したあとも行う", "触れたあと", "見た目に関係なく行う"], "point": "触れる前・清潔な処置の前・体液に触れたあと・触れたあと・周辺に触れたあと"}, {"id": "b176", "date": "新作", "field": "保健医療", "topic": "浣腸について", "opts": ["市販の使い捨てグリセリン浣腸器を用いた浣腸は、一定の条件のもとで医行為ではないとされている。", "浣腸液は、人肌程度（約40℃）に温めて使う。", "浣腸をするときは、左側を下にして横に寝てもらう。", "浣腸液は、冷たいまま入れるのがよい。", "浣腸は、立ったままの姿勢で行うのが安全である。"], "ans": [1, 2, 3], "exp": ["条件付きで医行為ではない", "温めて使う", "左側臥位", "冷たいと腸を刺激しすぎる", "立位は腸を傷つける危険がある"], "point": "浣腸＝左側臥位・人肌に温める・立位で行わない"}, {"id": "b177", "date": "新作", "field": "保健医療", "topic": "見当識障害について", "opts": ["一般に、時間の見当識から障害されやすい。", "カレンダーや時計をわかりやすい場所に置くことは、支援の一つになる。", "見当識障害では、最初に家族の顔がわからなくなる。", "見当識障害は、認知症の周辺症状（BPSD）である。", "見当識障害とは、時間・場所・人などがわからなくなることである。"], "ans": [1, 2, 5], "exp": ["時間→場所→人の順", "環境の工夫", "人の見当識は比較的あとまで保たれやすい", "中核症状", "時間・場所・人"], "point": "見当識障害＝中核症状・時間→場所→人の順に障害されやすい"}, {"id": "b178", "date": "新作", "field": "保健医療", "topic": "実行機能障害について", "opts": ["実行機能障害とは、計画を立てて順序よく物事を進めることが難しくなる状態である。", "実行機能障害は、認知症の行動・心理症状（BPSD）である。", "実行機能障害のある人には、家事はすべてやめてもらう。", "工程を一つずつ区切って伝えると、できることがある。", "料理の手順がわからなくなるなど、家事に影響が出やすい。"], "ans": [1, 4, 5], "exp": ["段取りの障害", "中核症状", "できる部分は続けてもらう", "工程を区切る", "家事への影響"], "point": "実行機能障害＝段取りが難しい（中核症状）→工程を区切って支援"}, {"id": "b179", "date": "新作", "field": "保健医療", "topic": "認知症の人が過ごしやすい環境づくりについて", "opts": ["生活の場所や担当者は、できるだけ頻繁に変えたほうがよい。", "目印になる物は、すべて片づけたほうがよい。", "騒音や強すぎる照明など、刺激が強すぎる環境を避ける。", "トイレなどの場所を、わかりやすい表示で示す。", "本人になじみのある家具や物を置く。"], "ans": [3, 4, 5], "exp": ["環境の変化は混乱を招きやすい", "目印は手がかりになる", "刺激の調整", "わかりやすい表示", "なじみの物"], "point": "なじみの物・わかりやすい表示・刺激の調整・変化を少なく"}, {"id": "b180", "date": "新作", "field": "保健医療", "topic": "レビー小体型認知症の人への支援について", "opts": ["レビー小体型認知症では、症状の変動はない。", "薬に敏感で、副作用が出やすいことがある。", "幻視は、強く否定すれば消える。", "パーキンソン症状があるので、転倒に注意する。", "幻視の訴えは、頭ごなしに否定せず受け止める。"], "ans": [2, 4, 5], "exp": ["日や時間によって変動しやすい", "薬剤過敏", "否定は混乱や不安を強める", "転倒予防", "否定しない"], "point": "レビー＝幻視は否定しない・転倒注意・薬に敏感・症状が変動"}, {"id": "b181", "date": "新作", "field": "保健医療", "topic": "睡眠時無呼吸症候群について", "opts": ["マスクで空気を送る治療（CPAP）が行われることがある。", "睡眠時無呼吸症候群は、高血圧や心臓病とは関係がない。", "眠っている間に呼吸が止まったり浅くなったりする。", "睡眠時無呼吸症候群には、睡眠薬がいちばんよく効く。", "大きないびきや、日中の強い眠気がみられる。"], "ans": [1, 3, 5], "exp": ["CPAP", "高血圧・心臓病の危険を高める", "睡眠中の無呼吸", "睡眠薬は呼吸を弱めることがある", "いびき・日中の眠気"], "point": "睡眠時無呼吸＝いびき・日中の眠気・CPAP・高血圧などのリスク"}, {"id": "b182", "date": "新作", "field": "保健医療", "topic": "口の乾燥（口腔乾燥）について", "opts": ["口が乾くと、飲み込みにくさやむし歯の原因になる。", "高齢になると、唾液が少なくなりやすい。", "口の乾燥は、誤嚥とは関係がない。", "薬の副作用で、口が乾くことがある。", "唾液が減ると、口の中の細菌は減る。"], "ans": [1, 2, 4], "exp": ["嚥下・むし歯", "唾液の減少", "飲み込みにくくなり誤嚥にもつながる", "副作用", "自浄作用が落ち、細菌が増えやすい"], "point": "口腔乾燥＝薬の副作用にも注意→嚥下障害・むし歯・口臭"}, {"id": "b183", "date": "新作", "field": "保健医療", "topic": "高齢者の味覚障害について", "opts": ["味覚障害があれば、塩をたくさん使って味を濃くするのがいちばんよい。", "薬の副作用で、味がわかりにくくなることがある。", "味覚障害があると、食欲が落ちて低栄養につながることがある。", "味覚障害は、口の中の状態とは関係がない。", "亜鉛の不足は、味覚障害の原因の一つである。"], "ans": [2, 3, 5], "exp": ["塩分のとりすぎに注意。だしや香りの工夫", "薬の影響", "低栄養", "舌苔や口の乾燥も関係する", "亜鉛不足"], "point": "味覚障害＝亜鉛不足・薬・口の状態→低栄養に注意"}, {"id": "b184", "date": "新作", "field": "保健医療", "topic": "スキン-テア（皮膚裂傷）について", "opts": ["テープを貼ったあとは、勢いよくはがすとよい。", "スキン-テアとは、摩擦やずれで皮膚が裂ける傷のことである。", "スキン-テアは、若い人に多い。", "腕や足を保護するカバーや、やさしい介助で予防する。", "高齢者は皮膚が薄く、着替えや移乗のときに起こりやすい。"], "ans": [2, 4, 5], "exp": ["ゆっくり、皮膚を押さえながらはがす", "摩擦・ずれによる裂傷", "高齢者に多い", "保護と丁寧な介助", "高齢者に多い"], "point": "スキン-テア＝薄い皮膚の裂傷→保護・保湿・丁寧な介助"}, {"id": "b185", "date": "新作", "field": "保健医療", "topic": "自立を支えるかかわりについて", "opts": ["本人ができることは、時間がかかってもできるだけ本人にしてもらう。", "できない部分だけを手伝うようにする。", "本人のペースは考えず、介助者の都合で進める。", "安全のため、身の回りのことはすべて介助者が行う。", "手を出しすぎる介護は、できる力を失わせることがある。"], "ans": [1, 2, 5], "exp": ["できることは本人に", "部分的な介助", "本人のペースを大切に", "すべて行うと自立が妨げられる", "過剰な介護は廃用につながる"], "point": "できることは本人に・手を出しすぎない・できない部分だけ手伝う"}, {"id": "b186", "date": "新作", "field": "保健医療", "topic": "亡くなったあとのケアについて", "opts": ["死亡の確認（死亡診断）は医師が行う。", "亡くなったあとの身体を整えるケア（エンゼルケア）は、家族の希望を聞いて一緒に行うこともある。", "死亡の確認は、介護職員が行ってよい。", "家族がお別れの時間をもてるよう配慮する。", "亡くなったあとは、家族の気持ちに配慮する必要はない。"], "ans": [1, 2, 4], "exp": ["医師", "家族と一緒に", "医師が行う", "お別れの時間", "グリーフケアの始まり"], "point": "死亡確認は医師・エンゼルケアは家族の意向を大切に"}, {"id": "b187", "date": "新作", "field": "保健医療", "topic": "高齢者の運動について", "opts": ["体調が悪いときは、無理をせず休む。", "ウォーキングなどの有酸素運動と、筋力トレーニングを組み合わせるとよい。", "高齢者は、運動をするとかえって体が弱くなる。", "運動は、痛みをがまんしてでも毎日長時間行うべきである。", "バランス能力を高める運動は、転倒予防に役立つ。"], "ans": [1, 2, 5], "exp": ["体調に合わせる", "有酸素＋筋トレ", "運動は心身の機能を保つ", "無理のない範囲で続ける", "バランス運動"], "point": "有酸素運動＋筋トレ＋バランス運動を無理なく続ける"}, {"id": "b188", "date": "新作", "field": "保健医療", "topic": "喫煙の影響について", "opts": ["禁煙は、何歳から始めても健康にとって意味がある。", "在宅酸素療法を受けている人でも、喫煙は安全である。", "高齢者は、今さら禁煙しても効果はない。", "喫煙は、脳卒中や心筋梗塞の危険を高める。", "喫煙は、COPDや肺がんの大きな原因である。"], "ans": [1, 4, 5], "exp": ["いつでも効果あり", "火災の危険があり厳禁", "効果がある", "動脈硬化", "COPD・肺がん"], "point": "喫煙＝COPD・がん・脳卒中・心筋梗塞。禁煙はいつでも効果あり"}, {"id": "b189", "date": "新作", "field": "保健医療", "topic": "骨の健康と栄養について", "opts": ["骨の健康には、運動は関係がない。", "日光に当たると、体の中でビタミンDがつくられる。", "ビタミンDは、カルシウムの吸収を助ける。", "骨を丈夫にするには、外に出ないほうがよい。", "カルシウムは、骨をつくるのに大切な栄養素である。"], "ans": [2, 3, 5], "exp": ["運動で骨に刺激を与えることも大切", "日光", "ビタミンD", "適度な日光浴がよい", "カルシウム"], "point": "カルシウム＋ビタミンD（日光）＋運動"}, {"id": "b190", "date": "新作", "field": "保健医療", "topic": "加齢黄斑変性について", "opts": ["早めに眼科で治療を受けることが大切である。", "ものがゆがんで見えることがある。", "加齢黄斑変性は、子どもに多い。", "加齢黄斑変性では、見ようとする中心部分が見えにくくなる。", "加齢黄斑変性は、視野の外側から見えなくなる病気である。"], "ans": [1, 2, 4], "exp": ["早期治療", "ゆがみ", "高齢者に多い", "中心が見えにくい", "外側から欠けるのは緑内障に多い"], "point": "加齢黄斑変性＝中心が見えない・ゆがむ（緑内障は視野の欠け）"}, {"id": "b191", "date": "新作", "field": "保健医療", "topic": "糖尿病の運動療法について", "opts": ["糖尿病の人は、運動をしてはいけない。", "インスリンや血糖を下げる薬を使っている人は、運動中や運動後の低血糖に注意する。", "運動は、血糖をコントロールするのに役立つ。", "運動は、医師と相談して無理のない範囲で行う。", "低血糖が心配なときは、空腹のまま激しい運動をするとよい。"], "ans": [2, 3, 4], "exp": ["適切な運動はすすめられる", "低血糖", "血糖のコントロール", "医師に相談", "空腹時の激しい運動は低血糖の危険"], "point": "糖尿病の運動＝医師と相談・低血糖に注意"}, {"id": "b192", "date": "新作", "field": "保健医療", "topic": "薬と食べ物の飲み合わせについて", "opts": ["一部の降圧薬は、グレープフルーツジュースで効き目が強くなりすぎることがある。", "ワルファリン（血液をかたまりにくくする薬）を飲んでいる人は、納豆を避けるよう指示されることが多い。", "薬は、どんな飲み物と一緒に飲んでも効き目は変わらない。", "薬と食べ物の飲み合わせは、薬剤師に確認するとよい。", "ワルファリンを飲んでいる人は、納豆をたくさん食べたほうがよい。"], "ans": [1, 2, 4], "exp": ["カルシウム拮抗薬など", "ビタミンKが効き目を弱める", "飲み物で変わることがある", "薬剤師に相談", "効き目が弱くなる"], "point": "グレープフルーツ×一部の降圧薬・納豆×ワルファリン"}, {"id": "b193", "date": "新作", "field": "保健医療", "topic": "睡眠薬を使うときの注意について", "opts": ["薬の効果が翌朝まで残り、ふらつくことがある。", "夜中にトイレに起きるときの転倒に注意する。", "睡眠薬は、急にやめても何も問題はない。", "お酒と一緒に飲むと、効き目が強くなりすぎて危険である。", "効かないときは、自分の判断で量を増やしてよい。"], "ans": [1, 2, 4], "exp": ["持ち越し", "夜間の転倒", "急にやめると不眠が強くなることがある。医師に相談", "アルコールとの併用は危険", "医師に相談する"], "point": "睡眠薬＝持ち越し・夜間の転倒・お酒と併用しない・自己判断で増減しない"}, {"id": "b194", "date": "新作", "field": "保健医療", "topic": "介護するときの体の使い方（ボディメカニクス）について", "opts": ["利用者から離れて、腕の力だけで持ち上げる。", "足を開いて、支える面（支持基底面）を広くとる。", "腰だけをひねって持ち上げる。", "ひざを曲げて重心を低くする。", "利用者に近づいて介助する。"], "ans": [2, 4, 5], "exp": ["近づいて体全体で", "支持基底面を広く", "体全体の向きを変える。ひねらない", "重心を低く", "重心を近づける"], "point": "支持基底面を広く・重心を低く・近づく・ひねらない"}, {"id": "b195", "date": "新作", "field": "保健医療", "topic": "かかりつけ医とかかりつけ薬局について", "opts": ["かかりつけ医は、日ごろの健康相談や、専門医への紹介などを行う。", "かかりつけ医は、緊急時には頼れない。", "病院ごとにお薬手帳を分けたほうが安全である。", "お薬手帳は、1冊にまとめるとよい。", "かかりつけ薬局を決めると、ほかの病院の薬も含めて薬をまとめて確認してもらえる。"], "ans": [1, 4, 5], "exp": ["日常の健康管理", "緊急時の相談先にもなる", "分けると全体がわからない", "1冊にまとめる", "重複や飲み合わせの確認"], "point": "かかりつけ医・かかりつけ薬局・お薬手帳は1冊"}, {"id": "b196", "date": "新作", "field": "保健医療", "topic": "嚥下体操について", "opts": ["深呼吸やせきの練習も、誤嚥予防に役立つ。", "食事の前に、首・肩・口のまわりを動かす体操をすると、飲み込みの準備になる。", "嚥下体操は、飲み込みにはまったく効果がない。", "「パ」「タ」「カ」「ラ」と発音する練習は、口や舌の動きを鍛える。", "嚥下体操は、食事のあとに行うのが基本である。"], "ans": [1, 2, 4], "exp": ["呼吸とせき", "準備体操", "誤嚥予防に役立つ", "パタカラ", "食前に行う"], "point": "食前の嚥下体操・パタカラ・深呼吸とせき"}, {"id": "b197", "date": "新作", "field": "保健医療", "topic": "認知症の予防につながる取組みについて", "opts": ["認知症は、どんな取組みをしても予防や進行を遅らせることはできない。", "運動の習慣は、認知症の予防に役立つとされる。", "聞こえにくさは、認知症とはまったく関係がない。", "人との交流や社会参加は、認知症の予防に役立つとされる。", "高血圧や糖尿病などの生活習慣病の管理も大切である。"], "ans": [2, 4, 5], "exp": ["発症を遅らせたり進行をゆるやかにしたりできるとされる", "運動", "難聴は認知症の危険因子の一つとされる", "社会参加", "生活習慣病"], "point": "運動・社会参加・生活習慣病の管理・難聴への対応"}, {"id": "b198", "date": "新作", "field": "保健医療", "topic": "胃ろうをつくるかどうかの意思決定について", "opts": ["胃ろうは、本人の意思に関係なく医師が一人で決める。", "医療・ケアチームが、本人や家族と十分に話し合って決める。", "本人の意思を確認できるときは、本人の意思を尊重する。", "いったん胃ろうをつくることに決めたら、話し合いは二度としない。", "本人の意思が確認できないときは、家族などと本人の意思を推定して話し合う。"], "ans": [2, 3, 5], "exp": ["本人中心に話し合って決める", "チームで話し合う", "本人の意思", "状況に応じて話し合いを続ける", "推定意思"], "point": "本人の意思→推定意思→チームで話し合い（くり返し）"}, {"id": "b199", "date": "新作", "field": "介護保険制度", "topic": "利用者が入院したときの連携について", "opts": ["入院中も、ケアプランどおりに訪問介護などの居宅サービスを保険で利用できる。", "利用者が入院したときは、入院先の病院に、利用者の心身の状況や生活環境などの情報を提供する。", "入院したことは、介護支援専門員が気にかける必要はない。", "入院中も病院と連絡をとり、退院に向けた準備を進める。", "利用者が入院すると、居宅介護支援の契約は自動的に終わる。"], "ans": [2, 4], "exp": ["入院中は居宅サービスは保険給付されない", "入院時の情報提供", "入院時からの連携が大切", "退院に備えた連携", "入院しただけで契約は終わらない"], "point": "入院時は病院へ情報提供・入院中も連携して退院に備える"}, {"id": "b200", "date": "新作", "field": "保健医療", "topic": "便失禁について", "opts": ["決まった時間にトイレに誘うことが、改善に役立つことがある。", "便失禁は、本人の努力不足が原因である。", "便失禁があるときは、おしりの皮膚を清潔に保ち、ただれを防ぐ。", "便秘の人に、便失禁が起こることはない。", "下痢だけでなく、便秘で便がつまってその横から便がもれることも、便失禁の原因になる。"], "ans": [1, 3, 5], "exp": ["排便習慣を整える", "病気や機能の低下による", "皮膚のケア", "便秘でももれることがある", "下痢・便秘（嵌入便）"], "point": "便失禁＝下痢も便秘も原因・皮膚ケア・排便習慣"}], "glossary": {"第1号被保険者": "65歳以上で、市町村に住所がある人。原因を問わず、要介護・要支援になれば介護保険を使える。", "第2号被保険者": "40〜64歳で医療保険に入っている人。特定疾病が原因のときだけ介護保険を使える。", "特定疾病": "第2号被保険者が介護保険を使える16の病気（末期がん・関節リウマチ・パーキンソン病関連疾患・脳血管疾患など）。", "特別徴収": "年金から保険料を天引きする方法。年額18万円以上の年金を受けている第1号被保険者が対象。", "普通徴収": "納付書や口座振替で、市町村に直接保険料を払う方法。世帯主と配偶者にも連帯して払う義務がある。", "要介護認定": "介護が必要かどうか・どのくらい必要かを市町村が決めるしくみ。認定調査と主治医意見書をもとに介護認定審査会が判定する。", "介護認定審査会": "要介護度を判定する市町村の審査会。保健・医療・福祉の学識経験者から市町村長が委員を任命する。", "介護保険審査会": "要介護認定や保険料などの市町村の処分に不服があるとき、審査請求をする先。都道府県に置かれる。", "審査請求": "行政の処分に不服があるとき、取消しなどを求めて申し立てること。介護保険では介護保険審査会に行う。", "区分支給限度基準額": "居宅サービスを1か月に保険で使える上限。要介護度ごとに厚生労働大臣が決める。", "住所地特例": "施設に入るために住所を移した人は、もとの市町村が保険者のままになるしくみ。施設のある市町村の負担が偏らないようにする。", "保険者": "介護保険を運営する市町村（特別区を含む）。保険料を集め、給付を行う。", "財政安定化基金": "市町村の介護保険財政が赤字になりそうなとき、貸付や交付をする基金。都道府県に置かれる。", "調整交付金": "市町村ごとの高齢者の割合や所得の差をならすため、国が交付するお金。国の負担25%のうち5%分。", "社会保険診療報酬支払基金": "医療保険者から第2号被保険者の保険料を集めて、市町村に交付する機関。", "地域包括支援センター": "高齢者の総合相談・権利擁護・介護予防ケアマネジメントなどを行う機関。保健師・社会福祉士・主任介護支援専門員を置く。", "包括的支援事業": "地域支援事業のひとつ。総合相談・権利擁護・介護予防ケアマネジメント・包括的継続的ケアマネジメント支援など。", "地域支援事業": "市町村が行う事業。総合事業・包括的支援事業・任意事業の3つがある。", "総合事業": "介護予防・日常生活支援総合事業のこと。市町村が行い、介護予防・生活支援サービス事業と一般介護予防事業がある。", "基本チェックリスト": "生活機能が落ちていないかを確かめる25項目の質問票。該当すると総合事業の「事業対象者」になる。", "介護予防ケアマネジメント": "総合事業のサービスを使う人のためのケアマネジメント。地域包括支援センターが行う。", "居宅サービス計画": "ケアプランのこと。在宅で使うサービスの計画で、介護支援専門員が作る。", "ケアプラン": "居宅サービス計画や施設サービス計画のこと。利用者の目標と、使うサービスをまとめた計画。", "サービス担当者会議": "ケアプランについて、利用者・家族とサービス担当者が集まって話し合う会議。介護支援専門員が開く。", "モニタリング": "ケアプランどおりにサービスが行われ、目標に近づいているかを確かめること。", "介護支援専門員": "ケアマネジャーのこと。都道府県知事の登録を受け、介護支援専門員証（有効期間5年）の交付を受ける。", "主任介護支援専門員": "経験を積んだ介護支援専門員が研修を受けてなる。地域包括支援センターの必置職種。", "サービス提供責任者": "訪問介護事業所に置く職種。訪問介護計画を作り、ヘルパーへの指示や調整を行う。", "計画作成責任者": "定期巡回・随時対応型訪問介護看護などで、そのサービスの計画を作る人。看護師・介護福祉士などから選ぶ。", "法定代理受領": "事業者が利用者の代わりに保険給付を受け取るしくみ。利用者は自己負担分だけ払えばよい（現物給付）。", "償還払い": "利用者がいったん全額を払い、あとで保険給付分が払い戻される方法。住宅改修費・福祉用具購入費が代表例。", "現物給付": "お金ではなく、サービスそのものを給付すること。", "高額介護サービス費": "1か月の自己負担が上限を超えたとき、超えた分が払い戻されるしくみ。", "高額医療合算介護サービス費": "1年間の医療と介護の自己負担を合計して、上限を超えた分が払い戻されるしくみ。", "補足給付": "特定入所者介護サービス費のこと。所得が低い人の施設・短期入所での食費・居住費を軽くする。", "市町村特別給付": "市町村が条例で独自に行う給付（配食・移送など）。財源は第1号被保険者の保険料。", "予防給付": "要支援1・2の人への保険給付。施設サービスは含まれない。", "介護給付": "要介護1〜5の人への保険給付。", "地域密着型サービス": "住み慣れた地域で暮らし続けるためのサービス。原則その市町村の住民だけが使え、市町村長が指定する。", "介護保険事業計画": "市町村が作る3年1期の計画。サービスの見込み量や保険料の基礎になる。都道府県は介護保険事業支援計画を作る。", "定期巡回・随時対応型訪問介護看護": "日中・夜間を通じて、定期的な巡回と通報による随時対応で、訪問介護と訪問看護を一体的に行う地域密着型サービス。", "夜間対応型訪問介護": "夜間に定期巡回と通報による随時訪問を行う地域密着型サービス。要介護者が対象。", "小規模多機能型居宅介護": "「通い」を中心に「訪問」「泊まり」を組み合わせる地域密着型サービス。登録定員29人以下。", "認知症対応型共同生活介護": "グループホームのこと。認知症の人が5〜9人のユニットで共同生活する地域密着型サービス。要支援2から使える。", "短期入所生活介護": "ショートステイのこと。特養などに短期間泊まって介護を受ける。連続30日まで。", "通所介護": "デイサービスのこと。利用定員19人以上。18人以下は地域密着型通所介護。", "訪問入浴介護": "浴槽を持ち込んで自宅で入浴させるサービス。原則、看護職員1人と介護職員2人で行う。", "介護老人福祉施設": "特別養護老人ホーム（特養）のこと。新規入所は原則要介護3以上。", "介護老人保健施設": "老健のこと。在宅復帰をめざしてリハビリなどを行う施設。開設には都道府県知事の許可がいる。", "介護医療院": "長期の療養が必要な人に、医療と生活の場を一体で提供する施設。開設には都道府県知事の許可がいる。", "特定施設": "有料老人ホーム・軽費老人ホーム（ケアハウス）・養護老人ホームのうち、介護サービスを提供する指定を受けたもの。", "共生型サービス": "介護保険と障害福祉の両方のサービスを、同じ事業所で提供しやすくするしくみ。", "障害支援区分": "障害福祉サービスを使うときの、支援の必要度を示す区分（区分1〜6）。", "成年後見制度": "判断能力が不十分な人を、後見人などが財産管理や契約で支える制度。法定後見（後見・保佐・補助）と任意後見がある。", "高齢者虐待防止法": "高齢者（65歳以上）への虐待を防ぐ法律。虐待は身体的・心理的・性的・経済的・介護等放棄の5種類。", "生活保護": "生活に困っている人に、最低限度の生活を保障する制度。扶助は8種類で、介護扶助もその一つ。", "介護扶助": "生活保護の扶助のひとつ。介護サービスを現物給付で受けられる。", "褥瘡": "床ずれのこと。圧迫が続いて皮膚や組織が傷つく。仰向けでは仙骨部・かかとにできやすい。", "誤嚥性肺炎": "食べ物や唾液が気管に入って起こる肺炎。寝ている間の気づかない誤嚥（不顕性誤嚥）でも起こる。", "不顕性誤嚥": "むせなどがないまま、気づかないうちに唾液などが気管に入ること。睡眠中に起こりやすい。", "パーキンソン病": "手足のふるえ（安静時振戦）・筋固縮・無動・姿勢反射障害が主な症状の病気。", "ウェアリング・オフ現象": "パーキンソン病の薬を長く飲むうちに、薬の効く時間が短くなる現象。", "BPSD": "認知症の行動・心理症状（周辺症状）。徘徊・妄想・暴言など。記憶障害などの中核症状とは別。", "中核症状": "認知症で脳の障害から直接起こる症状。記憶障害・見当識障害・判断力の低下など。", "レビー小体型認知症": "幻視やパーキンソン症状が特徴の認知症。", "仮性認知症": "うつ病などで、認知症のように見える状態。治療で良くなることがある。", "CO2ナルコーシス": "体に二酸化炭素がたまり、意識がもうろうとする状態。酸素を急に多く吸うと起こることがある。", "COPD": "慢性閉塞性肺疾患。たばこが主な原因で、息切れが続く肺の病気。在宅酸素療法の主な対象。", "半側空間無視": "脳の障害で、片側（多くは左側）にあるものに気づかなくなる症状。右半球の障害で起こりやすい。", "失語症": "脳の障害で、話す・聞く・読む・書くことが難しくなる症状。多くは左半球の障害で起こる。", "バイタルサイン": "体温・脈拍・血圧・呼吸などの生命の基本的なサイン。", "フレイル": "加齢で心身の活力が落ち、要介護になる危険が高まった状態。適切な対応で健康な状態に戻ることがある。", "サルコペニア": "加齢などで筋肉量が減り、筋力や身体機能が落ちた状態。たんぱく質と運動で予防する。", "廃用症候群": "安静や活動の低下が続いて起こる心身の機能低下。筋力低下・関節拘縮・起立性低血圧・褥瘡・抑うつなど。", "老年症候群": "高齢者に多く、医療と介護の両方が必要になる症状のまとまり。認知機能低下・転倒・尿失禁・低栄養など。", "せん妄": "急に起こる意識の混乱。1日の中で変動し、夜に悪化しやすい。薬・脱水・感染などが原因になる。", "軽度認知障害": "MCI。認知機能は低下しているが日常生活はほぼ自立している状態。一部は認知症に移行し、戻る人もいる。", "MCI": "軽度認知障害。認知症の手前の状態。", "HDS-R": "改訂長谷川式簡易知能評価スケール。30点満点で、20点以下だと認知症の疑いとされる。", "MMSE": "ミニメンタルステート検査。30点満点の認知機能検査。", "ICF": "国際生活機能分類。心身機能・活動・参加と、環境因子・個人因子が影響しあうと考える。", "ADL": "日常生活動作。食事・排泄・入浴・移動・更衣など身の回りの動作。", "IADL": "手段的日常生活動作。買い物・調理・金銭管理・服薬管理・電話など。", "ACP": "アドバンス・ケア・プランニング（人生会議）。これからの医療やケアについて、本人が家族や医療・ケアチームとくり返し話し合うこと。", "グリーフケア": "大切な人を亡くした家族などの悲しみに寄りそう支援。", "間欠性跛行": "歩くと足のしびれや痛みが出て、休むとまた歩けるようになる症状。脊柱管狭窄症などでみられる。", "起立性低血圧": "立ち上がったときに血圧が下がり、ふらつきや立ちくらみが起こる状態。", "心房細動": "脈が不規則になる不整脈。心臓にできた血栓が脳に飛んで脳梗塞を起こすことがある。", "HbA1c": "過去1〜2か月の血糖の状態を表す検査値。糖尿病の管理に使う。", "CRP": "体の中の炎症の強さを表す検査値。感染症などで上がる。", "eGFR": "腎臓の働きを表す値。低いほど腎機能が落ちている。", "高次脳機能障害": "脳の損傷による失語・失行・失認・注意障害・記憶障害など。外見ではわかりにくい。", "標準予防策": "スタンダード・プリコーション。すべての人の血液・体液・排泄物などを感染のおそれがあるものとして扱う感染対策。", "疥癬": "ヒゼンダニによる皮膚の感染症。角化型疥癬は感染力が非常に強い。", "帯状疱疹": "水ぼうそうのウイルスが再び活動して起こる病気。体の片側に水ぶくれと痛みが出る。", "ポリファーマシー": "多くの薬を飲んでいて、副作用や飲みまちがいなどの問題が起きている状態。", "脱健着患": "衣服は健側から脱ぎ、患側から着るという着替えの基本。", "喀痰吸引": "たんを吸引器で吸い取ること。研修を受けた介護職員などは、医師の指示のもとで決められた範囲を行える。", "胃ろう": "おなかに小さな穴をあけ、チューブで胃に直接栄養を入れる方法。", "ストーマ": "手術でおなかにつくった便や尿の出口（人工肛門・人工膀胱）。", "中心静脈栄養": "心臓に近い太い静脈にカテーテルを入れて、高カロリーの栄養を入れる方法。", "NPPV": "マスクを使って行う人工呼吸（非侵襲的陽圧換気）。", "パルスオキシメーター": "指先などで血液中の酸素飽和度（SpO2）を測る機器。", "SpO2": "経皮的動脈血酸素飽和度。健康な人はおおむね96〜99%。", "セルフ・ネグレクト": "自己放任。自分の健康や生活に必要なことをしなくなり、心身が危険な状態になること。", "アウトリーチ": "相談に来ない人のところへ、援助者から出向いて支援すること。", "エンパワメント": "利用者が本来もっている力を発揮できるよう支援すること。", "ストレングス": "利用者の強み。できること・意欲・好み・人とのつながりなど。", "バイスティックの7原則": "援助関係の基本となる7つの原則。個別化・意図的な感情表出・統制された情緒的関与・受容・非審判的態度・自己決定・秘密保持。", "スーパービジョン": "経験のある人が援助者を指導・支援すること。教育的・支持的・管理的な機能がある。", "自己覚知": "援助者が自分の価値観や感情のくせに気づくこと。", "ヤングケアラー": "本来大人が担うような家事や家族の世話を日常的に行っている子どもや若者。", "8050問題": "80代の親と、ひきこもりなどの50代の子が同居し、生活に困っている世帯の問題。", "重層的支援体制整備事業": "高齢・障害・子ども・生活困窮など分野をこえて、相談を丸ごと受け止め支援する市町村の事業。", "レスパイトケア": "介護する家族が一時的に休めるようにする支援。ショートステイなど。", "日常生活自立支援事業": "社会福祉協議会が行う、福祉サービスの利用援助や日常的な金銭管理の支援。契約できる判断能力が必要。", "任意後見": "判断能力があるうちに、将来の後見人と内容を公正証書で決めておく制度。任意後見監督人の選任で効力が生じる。", "保佐": "判断能力が著しく不十分な人の成年後見制度の類型。保佐人は重要な法律行為に同意権をもつ。", "補助": "判断能力が不十分な人の成年後見制度の類型。開始には本人の同意が必要。", "措置": "行政が必要と判断してサービスや施設入所を決めるしくみ。虐待などやむを得ない事由のときに市町村が行う。", "養護老人ホーム": "環境上・経済的な理由で自宅で暮らすのが難しい高齢者が、市町村の措置で入所する施設。", "軽費老人ホーム": "無料または低額で入居できる高齢者の施設（ケアハウスなど）。契約で入居する。", "有料老人ホーム": "高齢者が入居し、食事や介護などのサービスを受けられる住まい。都道府県知事への届出制。", "サービス付き高齢者向け住宅": "安否確認と生活相談がついた高齢者向けの賃貸住宅。都道府県知事などに登録する。", "後期高齢者医療制度": "75歳以上（一定の障害がある65〜74歳を含む）の医療保険。運営は都道府県ごとの広域連合。", "生活困窮者自立支援制度": "生活保護に至る前の生活に困っている人を支える制度。自立相談支援と住居確保給付金が必須事業。", "福祉事務所": "生活保護などを行う行政機関。都道府県と市は必ず置き、町村は任意で置く。", "民生委員": "厚生労働大臣から委嘱される地域の相談役。児童委員を兼ね、無報酬で守秘義務がある。", "社会福祉協議会": "地域福祉の推進を目的とする民間の団体。ボランティアセンターや日常生活自立支援事業などを行う。", "避難行動要支援者名簿": "災害時に自力で避難するのが難しい人の名簿。市町村に作成の義務がある。", "福祉避難所": "高齢者や障害者など特別な配慮が必要な人のための避難所。", "業務継続計画": "BCP。感染症や災害が起きてもサービスを続けるための計画。2024年度からすべての介護事業者に義務づけられた。", "BCP": "業務継続計画。感染症や災害のときもサービスを続けるための計画。", "地域共生社会": "支える側・支えられる側をこえて、地域の人がつながり支えあう社会。", "認知症サポーター": "養成講座を受けて認知症を正しく理解し、認知症の人や家族を見守る応援者。", "チームオレンジ": "認知症サポーターなどがチームをつくり、認知症の人や家族の困りごとを支えるしくみ。", "認知症基本法": "共生社会の実現を推進するための認知症基本法。2024年1月施行。", "認知症初期集中支援チーム": "認知症が疑われる人や家族を訪問し、初期の支援を集中的に行う専門職のチーム。", "認知症地域支援推進員": "医療・介護・地域の支援をつなぐ役割をもつ人。市町村に置かれる。", "基準該当サービス": "指定の基準を一部満たさないが、市町村が認めて保険給付の対象にするサービス。", "特例居宅介護サービス費": "認定前の緊急のサービスや基準該当サービスなどに対して支給される保険給付。", "介護報酬": "介護サービスの対価として事業者に支払われる費用。単位数は厚生労働大臣が定める。", "運営推進会議": "地域密着型サービスの事業所が、利用者・家族・地域の人などと運営について話し合う会議。", "身体拘束": "ひもで縛る・ベッドを柵で囲むなど、本人の行動を制限すること。緊急やむを得ない場合を除き禁止。", "看護小規模多機能型居宅介護": "小規模多機能型居宅介護と訪問看護を組み合わせた地域密着型サービス。要介護者が対象。", "地域ケア会議": "個別のケースの検討を通して、地域の課題の発見や解決につなげる会議。市町村が置くよう努める。", "地域包括ケアシステム": "住まい・医療・介護・予防・生活支援が一体的に提供されるしくみ。", "一般介護予防事業": "すべての第1号被保険者などを対象にした介護予防の事業。通いの場づくりなど。", "国民健康保険団体連合会": "国保連。介護給付費の審査・支払や、苦情の受付・指導助言を行う。", "負担割合証": "介護サービスの利用者負担が何割かを示す証。市町村が交付する。", "ユニット型": "少人数のグループ（ユニット）ごとに、個室と共同生活室で生活する施設の形。", "介護休業": "家族を介護するために取れる休み。対象家族1人につき通算93日まで、3回まで分けて取れる。", "福祉有償運送": "NPO法人などが、ひとりで公共交通機関を使えない人を自家用車で有償で運ぶしくみ。登録制。", "シルバー人材センター": "高齢者に臨時的・短期的な仕事などを提供する団体。", "特定入所者介護サービス費": "補足給付。所得の低い人の施設・ショートステイの食費と居住費を軽くする給付。", "JCS": "ジャパン・コーマ・スケール。意識障害の程 /* ---------- utils ---------- */

const RANK_URL='https://script.google.com/macros/s/AKfycbyOiDY8s2rXLenmLfPuwcHpbUg1aoaMwRSiKRr0U41k8MIxrNOJn8Op7H4r1KfxpAHZ/exec';
function rkGet(k){try{return localStorage.getItem(LS+'-'+k)}catch(e){return null}}

function myId(){let id=rkGet('uid');if(!id){id='';const c='abcdefghijklmnopqrstuvwxyz0123456789';const a=new Uint32Array(24);(crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*1e9));a.forEach(n=>id+=c[n%36]);rkSet('uid',id)}return id}
function weekKey(d){d=d?new Date(d+'T00:00:00'):new Date();const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function myScore(){const t=totals();const wk=weekKey();let wn=0,wc=0;for(const k in S.days){if(weekKey(k)===wk){wn+=S.days[k].n;wc+=S.days[k].c}}const st=streakInfo();return{correct:t.c,total:t.n,wk,wc,wn,streak:st.cur,ld:st.today?today():dayStr(new Date(Date.now()-864e5)),bc:earnedIds().length}}

  rkTimer=setTimeout(go,2500); return Promise.resolve();

/* ---------- 連続日数 ---------- */
const dayStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function streakInfo(){
  const set=new Set(Object.keys(S.days).filter(k=>S.days[k].n>0));
  const d=new Date(); const doneToday=set.has(dayStr(d)); if(!doneToday) d.setDate(d.getDate()-1);
  let cur=0; while(set.has(dayStr(d))){cur++;d.setDate(d.getDate()-1)}
  let best=0,run=0,prev=null;
  [...set].sort().forEach(k=>{const t=new Date(k+'T00:00:00');run=(prev&&Math.round((t-prev)/864e5)===1)?run+1:1;if(run>best)best=run;prev=t});
  return {cur,best:Math.max(best,cur),today:doneToday};
}

/* ---------- 模試 ---------- */
const MOCK_TYPES={
  full:{label:'本番模試',n:[25,20,15],min:120,desc:'本番と同じ60問・120分'},
  mini:{label:'ミニ模試',n:[8,7,5],min:40,desc:'20問・40分（すき間時間に）'}
};
const PASS=0.7;
let mock=null, mockTick=null, mockQuit=false;
try{const t=localStorage.getItem(LS+'-mock');if(t)mock=JSON.parse(t)}catch(e){}
function saveMock(){try{mock?localStorage.setItem(LS+'-mock',JSON.stringify(mock)):localStorage.removeItem(LS+'-mock')}catch(e){}}
function startMock(kind){
  const T=MOCK_TYPES[kind];
  const pick=(f,n)=>shuffle(Q.filter(q=>q.field===f)).slice(0,n).map(q=>q.id);
  const items=pick('介護保険制度',T.n[0]).concat(pick('保健医療',T.n[1]),pick('福祉サービス',T.n[2]));
  mock={kind,items,sel:{},pos:0,start:Date.now(),limit:T.min*60000,result:null};
  mockQuit=false; saveMock(); go('mock');
}
function mockLeft(){return mock?Math.max(0,mock.start+mock.limit-Date.now()):0}
const fmtMs=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+pad(s%60)};
function gradeMock(){
  if(!mock||mock.result) return;
  const sec=[[0,0],[0,0]], marks=[];
  mock.items.forEach((id,i)=>{
    const q=QBY[id]; const you=(mock.sel[i]||[]).map(x=>x+1).sort((a,b)=>a-b);
    const ok=you.join()===q.ans.slice().sort((a,b)=>a-b).join();
    const k=q.field==='介護保険制度'?0:1; sec[k][1]++; if(ok) sec[k][0]++;
    marks.push(ok?1:0);
    if(!you.length) return;
    const r=S.mcq[id]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok; r.at=today(); S.mcq[id]=r;
    const d=S.days[today()]||{n:0,c:0}; d.n++; if(ok) d.c++; S.days[today()]=d;
  });
  const pass=sec[0][0]>=Math.ceil(sec[0][1]*PASS)&&sec[1][0]>=Math.ceil(sec[1][1]*PASS);
  const mins=Math.min(Math.ceil((Date.now()-mock.start)/60000),mock.limit/60000);
  mock.result={s1:sec[0],s2:sec[1],pass,mins,marks};
  S.mocks=(S.mocks||[]).concat([{at:today(),kind:mock.kind,s1:sec[0],s2:sec[1],pass,mins}]);
  saveMock(); persist(); updateBadge(); sendScore(); checkBadges();
}
function lsLoad(){try{const t=localStorage.getItem(LS);return t?JSON.parse(t):null}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function importHistory(){
  if(S.imported) return;
  for(const k in HISTORY){
    const id='k'+k, ok=!!HISTORY[k]; if(!QBY[id]) continue;
    const [m,d]=k.split('-'); const date='2026-'+pad(m)+'-'+pad(d);
    const r=S.mcq[id]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok; r.at=date; S.mcq[id]=r;
    const day=S.days[date]||{n:0,c:0}; day.n++; if(ok) day.c++; S.days[date]=day;
  }
  S.imported=true;
}
async function persist(){
  lsSave();
  if(!store) return;
  if(saving){dirty=true;return}
  saving=true;
  try{do{dirty=false;await store.set(JSON.parse(JSON.stringify(S)))}while(dirty);setSync('保存済み')}
  catch(e){setSync('この端末にだけ保存中')}
  saving=false;
}
function setSync(t){document.getElementById('sync').textContent=t}
function record(kind,id,ok){
  const map=kind==='mcq'?S.mcq:S.ox;
  const r=map[id]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok; r.at=today(); map[id]=r;
  const d=S.days[today()]||{n:0,c:0}; d.n++; if(ok) d.c++; S.days[today()]=d;
  persist(); updateBadge(); sendScore(); checkBadges();
}
function totals(){
  let n=0,c=0; for(const k in S.days){n+=S.days[k].n;c+=S.days[k].c} return {n,c};
}
function kindTotals(map){let n=0,c=0;for(const k in map){n+=map[k].n;c+=map[k].c}return{n,c}}
function missList(){
  const out=[];
  for(const id in S.mcq) if(S.mcq[id].last===false && QBY[id]) out.push({kind:'mcq',id,at:S.mcq[id].at});
  for(const id in S.ox) if(S.ox[id].last===false){const [qid,i]=id.split('#'); if(QBY[qid]) out.push({kind:'ox',id,qid,i:+i,at:S.ox[id].at})}
  return out.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
}

function buildItems(onlyMiss){

  else{
    const qs=Q.filter(q=>cfg.field==='all'||q.field===cfg.field);
    if(cfg.mode==='mcq') items=qs.map(q=>({kind:'mcq',id:q.id}));
    else qs.forEach(q=>q.opts.forEach((_,i)=>items.push({kind:'ox',id:q.id+'#'+i,qid:q.id,i})));
  }
  if(cfg.order==='random') items=shuffle(items);

function renderQuiz(){
  if(!sess){view.innerHTML='<div class="panel empty fade">ホームで方式と分野を選んで「はじめる」を押してね。<br><br><button class="btn" id="h">ホームへ</button></div>';view.querySelector('#h').addEventListener('click',()=>go('home'));return}
  if(sess.pos>=sess.items.length){return renderDone()}
  const it=sess.items[sess.pos];
  const q=QBY[it.kind==='mcq'?it.id:it.qid];
  const head=`<div class="qhead"><span>${sess.label?esc(sess.label)+' ・ ':''}${sess.pos+1} / ${sess.items.length}</span><span><span class="chip">${esc(q.field)}</span> ${OWNER&&q.date!=='新作'?'<span class="chip date">一日一問 '+esc(q.date)+'</span>':''}</span></div>
   <div class="progress"><i style="width:${sess.pos/sess.items.length*100}%"></i></div>`;

function renderMcq(q,head){
  const need=q.ans.length;
  if(!sess.answered){
    view.innerHTML=`<div class="stack fade">${head}
     <p class="stem">${hl(q.topic.replace(/について$/,''))}について、<b>正しいものを${need}つ</b>選べ。</p>
     <ul class="opts">${q.opts.map((o,i)=>`<li><div class="opt" role="button" tabindex="0" data-i="${i}" aria-pressed="${sess.sel.includes(i)}"><span class="n">${i+1}</span><span>${esc(o)}</span></div></li>`).join('')}</ul>
     <button class="btn" id="check" ${sess.sel.length===need?'':'disabled'}>答え合わせ（${sess.sel.length}/${need}つ選択中）</button>
    </div>`;
    view.querySelectorAll('.opt').forEach(b=>{
      const tog=e=>{if(e.target.closest('.term'))return;const i=+b.dataset.i;const k=sess.sel.indexOf(i);if(k>=0)sess.sel.splice(k,1);else{if(sess.sel.length>=need)sess.sel.shift();sess.sel.push(i)}renderQuiz()};
      b.addEventListener('click',tog);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog(e)}});
    });
    view.querySelector('#check').addEventListener('click',()=>{
      const you=sess.sel.map(i=>i+1).sort();const ok=you.join()===q.ans.slice().sort().join();
      sess.answered=true;sess.lastOk=ok;if(ok)sess.score++;record('mcq',q.id,ok);renderQuiz();window.scrollTo(0,0);

  const you=sess.sel.map(i=>i+1).sort((a,b)=>a-b);

   <p class="stem" style="margin:0">${hl(q.topic.replace(/について$/,''))}について、正しいものを${need}つ選べ。</p>
   <div class="stack" style="gap:8px">${q.opts.map((o,i)=>{const right=q.ans.includes(i+1);const picked=you.includes(i+1);

   ${q.point?'<div class="point"><b>覚えるポイント</b><br>'+hl(q.point)+'</div>':''}
   <p class="note" style="margin:0">黄色いマーカーの言葉をタップすると解説が出ます。</p>
   ${nextBtns()}</div>`;
  bindNext();
}

  view.innerHTML=`<div class="stack fade">
   <h2>間違えた問題</h2>
   <p class="note" style="margin:0">タップするとその問題にすぐ飛びます。正解するとリストから消えます。</p>

    ${mcq.length?'<ul class="list">'+mcq.map(row).join('')+'</ul>':'<div class="empty">ありません</div>'}</section>
   <section class="stack" style="gap:8px"><div class="row" style="align-items:center"><h3 style="font-size:1rem">一問一答（${ox.length}）</h3><button class="btn ghost" style="flex:none;width:auto;padding:6px 12px;font-size:.85rem" data-all="ox" ${ox.length?'':'disabled'}>まとめて解く</button></div>
    ${ox.length?'<ul class="list">'+ox.map(row).join('')+'</ul>':'<div class="empty">ありません</div>'}</section>
  </div>`;
  view.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>{
    const kind=b.dataset.kind,id=b.dataset.id;
    if(kind==='mcq') start([{kind:'mcq',id}],'解き直し');
    else{const [qid,i]=id.split('#');start([{kind:'ox',id,qid,i:+i}],'解き直し')}

  view.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.all;start(missList().filter(m=>m.kind===k).map(m=>m.kind==='mcq'?{kind:'mcq',id:m.id}:{kind:'ox',id:m.id,qid:m.qid,i:m.i}),'間違えた問題');
  }));
}

function chartSvg(days){
  const W=360,H=200,L=34,R=6,T=20,B=26; const n=days.length; const bw=(W-L-R)/Math.max(n,1);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="日ごとの正答率">`;
  [0,50,100].forEach(v=>{const y=T+(H-T-B)*(1-v/100);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-4}" y="${y+3}" text-anchor="end">${v}%</text>`});
  days.forEach((d,i)=>{const p=pct(d.c,d.n);const h=(H-T-B)*p/100;const x=L+i*bw+bw*.18;const w=bw*.64;const y=T+(H-T-B)-h;
    s+=`<rect class="b" x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" rx="3"/>`;
    if(n<=10) s+=`<text class="lbl" x="${x+w/2}" y="${y-4}" text-anchor="middle">${p}</text>`;
    if(n<=7||i%2===(n-1)%2) s+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle">${esc(d.k.slice(5).replace('-','/').replace(/^0/,''))}</text>`});
  return s+'</svg>';
}

  view.innerHTML=`<div class="stack fade">

   ${(S.mocks||[]).length?`<section class="panel stack" style="gap:8px"><h2>模試の記録</h2><div class="tw"><table><thead><tr><th>日付</th><th>種類</th><th>介護支援</th><th>保健医療福祉</th><th>結果</th></tr></thead><tbody>
    ${S.mocks.slice().reverse().map(m=>`<tr><td>${esc(m.at.slice(5).replace('-','/'))}</td><td>${MOCK_TYPES[m.kind]?MOCK_TYPES[m.kind].label:''}</td><td>${m.s1[0]}/${m.s1[1]}</td><td>${m.s2[0]}/${m.s2[1]}</td><td>${m.pass?'⭕ 合格':'❌'}</td></tr>`).join('')}

   <section class="panel stack" style="gap:8px"><h2>日ごとの正答率</h2><p class="note" style="margin:0">直近${recent.length}日分（棒の上の数字は%）</p>${recent.length?chartSvg(recent):'<div class="empty">まだ記録がありません</div>'}</section>
   <section class="panel stack" style="gap:8px"><h2>分野別</h2>
    <div class="tw"><table><thead><tr><th>分野</th><th>正解/解いた</th><th>正答率</th></tr></thead><tbody>
    ${fs.map(x=>`<tr><td>${x.f}</td><td>${x.c} / ${x.n}</td><td>${x.n?pct(x.c,x.n)+'%':'—'}<span class="bar" style="width:${pct(x.c,x.n)*0.6}px"></span></td></tr>`).join('')}
    </tbody></table></div></section>
   <section class="panel stack" style="gap:8px"><h2>解いた日の記録</h2>
    <div class="tw"><table><thead><tr><th>日付</th><th>解いた</th><th>正解</th><th>正答率</th></tr></thead><tbody>
    ${days.slice().reverse().map(d=>`<tr><td>${esc(d.k.replace(/-/g,'/'))}</td><td>${d.n}</td><td>${d.c}</td><td>${pct(d.c,d.n)}%</td></tr>`).join('')||'<tr><td colspan="4">まだ記録がありません</td></tr>'}

let rkMode='all', rkData=null, rkErr=false;
function effStreak(r){if(!r.ld||!r.streak)return 0;const y=dayStr(new Date(Date.now()-864e5));return (r.ld===today()||r.ld===y)?r.streak:0}
function rankRows(){
  if(!rkData) return [];
  let rows=rkData.slice();
  if(rkMode==='week'){const wk=weekKey();rows=rows.filter(r=>r.wk===wk&&r.wc>0).sort((a,b)=>b.wc-a.wc||b.wn-a.wn)}
  else if(rkMode==='streak'){rows=rows.map(r=>Object.assign({},r,{es:effStreak(r)})).filter(r=>r.es>0).sort((a,b)=>b.es-a.es||b.correct-a.correct)}
  else rows=rows.filter(r=>r.correct>0).sort((a,b)=>b.correct-a.correct||a.total-b.total);
  let rank=0,prev=null; return rows.map((r,i)=>{const v=rkMode==='week'?r.wc:rkMode==='streak'?r.es:r.correct;if(v!==prev){rank=i+1;prev=v}return Object.assign({rank},r)});
}
async function loadRank(){
  if(!RANK_URL) return;
  rkErr=false;
  try{await sendScore(true);const res=await fetch(RANK_URL+'?me='+encodeURIComponent(myId())+'&t='+Date.now());const j=await res.json();rkData=j.rows||[]}
  catch(e){rkErr=true}
  if(tab==='rank') renderRank();
}

  const list=rows.slice(0,50);
  const sc=myScore();
  view.innerHTML=`<div class="stack fade">
   <h2>ランキング</h2>
   <section class="panel stack" style="gap:8px">
    <p class="field-label" style="margin:0">ニックネーム（ランキングに表示されます）</p>

    <p class="note" style="margin:0">${nick?'正解するたびに自動でランキングに反映されます。':'ニックネームを決めると、正解数でみんなと競争できます。本名は入れないでね。'}</p>
   </section>
   <div class="seg">${[['all','累計正解'],['week','今週'],['streak','🔥連続日数']].map(([v,l])=>'<button data-rm="'+v+'" aria-pressed="'+(rkMode===v)+'">'+l+'</button>').join('')}</div>
   ${nick?`<div class="stat main"><div class="lab">あなた（${esc(nick)}）</div><div class="num">${me?me.rank+'<small> 位　</small>':''}${rkMode==='week'?sc.wc:rkMode==='streak'?sc.streak:sc.correct}<small>${rkMode==='streak'?' 日連続':' 問正解'}</small></div></div>`:''}
   ${rkErr?'<div class="panel empty">ランキングを読み込めませんでした。電波のよいところで「更新」を押してください。</div>':
     !rkData?'<div class="panel empty">読み込み中…</div>':
     list.length?'<ul class="rk">'+list.map(r=>{const v=rkMode==='week'?r.wc:rkMode==='streak'?r.es:r.correct,n=rkMode==='week'?r.wn:r.total;
       return `<li class="${r.me?'me':''}"><span class="no ${r.rank<=3?'g'+r.rank:''}">${r.rank}</span><span class="nm">${esc(r.name)}${r.me?'（あなた）':''}<small>${effStreak(r)?'🔥'+effStreak(r)+'日連続　':''}${r.bc?'🏅'+r.bc:''}</small></span><span class="sc"><b>${v}</b> ${rkMode==='streak'?'日':'問'}${rkMode==='streak'?'':'<span>正答率 '+pct(v,n)+'%</span>'}</span></li>`}).join('')+'</ul>'
     :'<div class="panel empty">まだだれもいません。一番乗りしよう！</div>'}
   <button class="btn ghost" id="rkReload">更新</button>
   ${nick?'<button class="btn ghost" id="rkLeave" style="font-size:.85rem">ランキングから外れる</button>':''}
   <p class="note" style="margin:0">今週は月曜日から日曜日までの集計です。</p>
  </div>`;
  view.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{rkMode=b.dataset.rm;renderRank()}));
  view.querySelector('#rkReload').addEventListener('click',()=>{rkData=null;renderRank();loadRank()});
  view.querySelector('#nickSave').addEventListener('click',()=>{
    const v=view.querySelector('#nick').value.replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,12);
    if(!v){view.querySelector('#nick').focus();return}
    rkSet('nick',v); rkData=null; renderRank(); loadRank();
  });
  const lv=view.querySelector('#rkLeave');
  if(lv) lv.addEventListener('click',async()=>{
    rkSet('nick',null); rkData=null; renderRank();

function renderMock(){
  if(!mock){view.innerHTML='<div class="panel empty fade">ホームの「模試モード」から始めてね。<br><br><button class="btn" id="h">ホームへ</button></div>';view.querySelector('#h').addEventListener('click',()=>go('home'));return}
  if(!mock.result&&mockLeft()<=0){gradeMock()}
  if(mock.result) return renderMockResult();
  const T=MOCK_TYPES[mock.kind], N=mock.items.length, i=mock.pos, q=QBY[mock.items[i]], need=q.ans.length, sel=mock.sel[i]||[];
  const answered=Object.keys(mock.sel).filter(k=>(mock.sel[k]||[]).length===QBY[mock.items[k]].ans.length).length;
  view.innerHTML=`<div class="stack fade">
   <div class="mockbar"><span>${T.label}　${i+1} / ${N}（${q.field==='介護保険制度'?'介護支援分野':'保健医療福祉サービス分野'}）</span><span>残り <span class="tm" id="tm">${fmtMs(mockLeft())}</span></span></div>
   <div class="progress"><i style="width:${answered/N*100}%"></i></div>
   <p class="stem">${esc(q.topic.replace(/について$/,''))}について、<b>正しいものを${need}つ</b>選べ。</p>
   <ul class="opts">${q.opts.map((o,j)=>`<li><div class="opt" role="button" tabindex="0" data-j="${j}" aria-pressed="${sel.includes(j)}"><span class="n">${j+1}</span><span>${esc(o)}</span></div></li>`).join('')}</ul>
   <div class="row"><button class="btn ghost" id="mPrev" ${i?'':'disabled'}>前へ</button>${i+1<N?'<button class="btn" id="mNext">次へ</button>':'<button class="btn" id="mGrade">採点する</button>'}</div>
   <details class="rv"><summary>問題一覧（解答済み ${answered} / ${N}）</summary>
    <div class="qgrid">${mock.items.map((id,k)=>`<button data-k="${k}" class="${(mock.sel[k]||[]).length===QBY[id].ans.length?'done':''} ${k===i?'cur':''}">${k+1}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="mGrade2">ここで採点する</button></div></details>
   <button class="btn ghost" id="mQuit" style="font-size:.85rem">${mockQuit?'もう一度押すと終了（この模試は記録されません）':'模試をやめる'}</button>
  </div>`;
  view.querySelectorAll('.opt').forEach(b=>{
    const tog=()=>{const j=+b.dataset.j;const a=(mock.sel[i]||[]).slice();const k=a.indexOf(j);if(k>=0)a.splice(k,1);else{if(a.length>=need)a.shift();a.push(j)}mock.sel[i]=a;saveMock();renderMock()};
    b.addEventListener('click',tog);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}});
  });
  const mv=d=>{mock.pos=Math.max(0,Math.min(N-1,mock.pos+d));mockQuit=false;saveMock();renderMock();window.scrollTo(0,0)};
  view.querySelector('#mPrev').addEventListener('click',()=>mv(-1));
  const nx=view.querySelector('#mNext'); if(nx) nx.addEventListener('click',()=>mv(1));
  view.querySelectorAll('.qgrid button').forEach(b=>b.addEventListener('click',()=>{mock.pos=+b.dataset.k;saveMock();renderMock();window.scrollTo(0,0)}));
  const gr=()=>{gradeMock();renderMock();window.scrollTo(0,0)};
  const g1=view.querySelector('#mGrade'); if(g1) g1.addEventListener('click',gr);
  view.querySelector('#mGrade2').addEventListener('click',gr);
  view.querySelector('#mQuit').addEventListener('click',()=>{if(!mockQuit){mockQuit=true;renderMock();return}mock=null;mockQuit=false;saveMock();go('home')});
  if(!mockTick) mockTick=setInterval(()=>{
    if(!mock||mock.result){clearInterval(mockTick);mockTick=null;return}
    const left=mockLeft(); const el=document.getElementById('tm');
    if(left<=0){clearInterval(mockTick);mockTick=null;gradeMock();if(tab==='mock'){renderMock();window.scrollTo(0,0)};toast('⏰ 時間になりました。採点しました');return}
    if(el){el.textContent=fmtMs(left);el.classList.toggle('low',left<5*60000)}
  },1000);
}
function renderMockResult(){
  const r=mock.result, T=MOCK_TYPES[mock.kind];
  const line=n=>Math.ceil(n*PASS);
  const secRow=(lab,s)=>`<tr><td>${lab}</td><td>${s[0]} / ${s[1]}</td><td>${line(s[1])}点〜</td><td>${s[0]>=line(s[1])?'⭕':'❌'}</td></tr>`;
  view.innerHTML=`<div class="stack fade">
   <h2>${T.label}の結果</h2>
   <div class="panel stack" style="gap:6px">
    <div class="pass ${r.pass?'ok':'ng'}">${r.pass?'🎉 合格ライン突破！':'あと少し！'}</div>

     ${secRow('介護支援分野',r.s1)}${secRow('保健医療福祉サービス分野',r.s2)}</tbody></table></div>
    <p class="note" style="margin:0">合格ラインは各分野7割の目安です（本番は毎年少し変わります）。</p>
   </div>
   <h3 style="font-size:1rem">答え合わせ（タップで解説）</h3>
   <div class="stack" style="gap:6px">${mock.items.map((id,k)=>{const q=QBY[id],ok=r.marks[k],you=(mock.sel[k]||[]).map(x=>x+1).sort((a,b)=>a-b);
     return `<details class="rv"><summary>${ok?'⭕':'❌'} ${k+1}. ${esc(q.topic)}</summary>
      <div class="stack" style="gap:6px"><p class="note" style="margin:0">あなた：${you.length?you.join('と'):'未回答'}　正解：${q.ans.join('と')}</p>
      ${q.opts.map((o,j)=>{const right=q.ans.includes(j+1);return `<div class="res ${right?'ok':'ng'}"><div class="line"><span>${right?'🟢':'🔴'}</span><span>${j+1}. ${hl(o)}</span>${you.includes(j+1)?'<span class="you">あなたが選択</span>':''}</div><div class="fix">${right?'→ このままで正しい'+(q.exp[j]?'（'+hl(q.exp[j])+'）':''):'→ <b>'+hl(q.exp[j]||'誤り')+'</b>'}</div></div>`}).join('')}
      ${q.point?'<div class="point"><b>覚えるポイント</b><br>'+hl(q.point)+'</div>':''}</div></details>`}).join('')}</div>
   <p class="note" style="margin:0">間違えた問題は「間違えた」タブにも入っています。</p>
   <div class="row"><button class="btn ghost" id="mMiss">間違えた問題へ</button><button class="btn" id="mHome">ホームへ</button></div>
  </div>`;
  const end=t=>{mock=null;saveMock();go(t)};
  view.querySelector('#mMiss').addEventListener('click',()=>end('miss'));
  view.querySelector('#mHome').addEventListener('click',()=>end('home'));
}
